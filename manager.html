/* ——— Ядро · время ———
   Даты строкой YYYY-MM-DD, время дня HH:MM — местные: это день человека, а не момент на сервере.
   Моменты записи (метки) — ISO через stamp(), сравниваются как моменты, дата метки — местная.
   Часы подменяемые: T.setNow(new Date(...)) — для проверок и примеров.
   Ни одного знания о DOM и о ролях: файл проверяется в Node (core/test-core.cjs).
   Источник: клиентский domain.js v2 (ARCH-AUDIT К8) — перенесено без изменений поведения. */

const T=(()=>{
 const WD=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
 const MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
 const MON_SHORT=['янв.','февр.','мар.','апр.','мая','июня','июля','авг.','сент.','окт.','нояб.','дек.'];

 const pad=n=>String(n).padStart(2,'0');
 const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
 const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
 let clock=null;
 const setNow=d=>{clock=d};
 const now=()=>clock?new Date(clock):new Date();
 const today=()=>iso(now());
 const hm=(d=now())=>pad(d.getHours())+':'+pad(d.getMinutes());
 const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
 const weekday=s=>(parse(s).getDay()+6)%7;
 const weekStart=s=>addDays(s,-weekday(s));
 const week=s=>{const a=weekStart(s);return [0,1,2,3,4,5,6].map(i=>addDays(a,i))};
 const daysBetween=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
 const isDate=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&iso(parse(s))===s;
 const isTime=s=>typeof s==='string'&&/^([01]\d|2[0-3]):[0-5]\d$/.test(s);
 const fmtDate=s=>{const d=parse(s);return `${d.getDate()} ${MON[d.getMonth()]}`};
 const fmtShort=s=>{const d=parse(s);return `${d.getDate()} ${MON_SHORT[d.getMonth()]}`};
 const fmtDay=(s,{lower=false}={})=>{const t=today();const o=s===t?'Сегодня':s===addDays(t,1)?'Завтра':s===addDays(t,-1)?'Вчера':`${WD[weekday(s)]}, ${fmtShort(s)}`;return lower?o.toLowerCase():o};
 // Время дня: «HH:MM» ± минуты, в пределах суток.
 const addMinutes=(t,n)=>{const [h,m]=t.split(':').map(Number),x=Math.min(23*60+59,Math.max(0,h*60+m+n));return pad(Math.floor(x/60))+':'+pad(x%60)};
 /* Метки времени записи: пишутся в одном месте и одним форматом (ISO, UTC).
    Сравниваются только как моменты, а дата метки — местная. Старые записи без пояса читаются так же. */
 const stamp=()=>now().toISOString();
 const stampAt=(date,time)=>{const [y,m,d]=date.split('-').map(Number),[h,mi]=time.split(':').map(Number);return new Date(y,m-1,d,h,mi).toISOString()};
 const msOf=x=>x?new Date(x).getTime():0;
 const dateOf=x=>iso(new Date(x));
 const latest=list=>list.filter(Boolean).reduce((a,b)=>msOf(b)>msOf(a)?b:a,null);
 let seq=0;const uid=p=>p+Date.now().toString(36)+(seq++).toString(36)+Math.random().toString(36).slice(2,5);
 const round=(n,k=100)=>Math.round(n*k)/k;

 return {WD,MON,MON_SHORT,pad,iso,parse,setNow,now,today,hm,addDays,weekday,weekStart,week,daysBetween,isDate,isTime,
  fmtDate,fmtShort,fmtDay,addMinutes,stamp,stampAt,msOf,dateOf,latest,uid,round};
})();
if(typeof module!=='undefined')module.exports={T};

/* ——— Ядро · закон ———
   То, что одинаково у любой роли и не зависит от того, что она записывает.

   1. Версии правил (И-2). Всё, что меняется со временем (привычка, план, сетка, маршрут смены),
      хранит историю версий: {from, to?}. День оценивается версией, действовавшей в тот день.
   2. Миграция со ступенями (Я-4). Форма меняется — поднимается версия и появляется ступень
      «было → стало». Старые ступени не удаляются: любая старая копия доходит до текущей.
   3. Единый вход в операции (Я-2) + заморозка периода (И-4). Роль шлёт имя операции и аргументы.
      Если операция объявила дату, которую трогает, и эта дата внутри закрытого периода роли,
      ядро отказывает — одним правилом для всех операций, а не проверкой в каждой.
   4. Срез будущего (И-2). Чтение на дату t обязано дать тот же ответ по базе, из которой
      убраны все факты позже t. Роль описывает, как срезать свою базу; ядро сравнивает.

   Источник: тренерский домен (migrate STEPS, apply, frozen, закон среза из COACH-AUDIT-2 §6).
   Зависит только от T (core/time.js). Проверяется в Node (core/test-core.cjs). */

const L=(()=>{
 const J=x=>JSON.stringify(x);
 const clone=o=>JSON.parse(J(o));

 /* 1. Версия правила на дату. Список идёт в порядке from; побеждает последняя подходящая.
    Версия без to действует бессрочно — так читаются правила ролей, у которых to ещё нет. */
 function ruleOn(list,date){let r=null;for(const x of list||[])if(x.from<=date&&(!x.to||date<=x.to))r=x;return r}
 /* Новая версия с даты from: у предыдущей бессрочной версии появляется конец (накануне),
    версия с той же датой и более поздние заменяются. Прошлое не переписывается: список копируется. */
 function addVersion(list,rule,from=T.today()){
  const out=list.filter(x=>x.from<from).map(x=>({...x}));
  const prev=out[out.length-1];if(prev&&(!prev.to||prev.to>=from))prev.to=T.addDays(from,-1);
  out.push({...rule,from,to:null});return out}
 /* Версии не пересекаются и идут по возрастанию from. Ошибки — человеческими словами. */
 function checkVersions(list,what='правила'){const e=[];
  for(let i=1;i<(list||[]).length;i++){const a=list[i-1],b=list[i];
   if(!(a.from<b.from))e.push(`Версии ${what} должны идти по возрастанию даты`);
   else if(a.to&&a.to>=b.from)e.push(`Версии ${what} пересекаются`)}
  return e}

 /* 2. Миграция: s.version (или поле ver) растёт ступенями до VERSION. */
 function migrate(s,VERSION,STEPS,{field='version',from=1}={}){
  if(!s||typeof s!=='object')return s;
  if(typeof s[field]!=='number')s[field]=from;
  while(s[field]<VERSION&&STEPS[s[field]])s=STEPS[s[field]](s);
  return s}

 /* 3. Домен роли: ops + validate + (по желанию) закрытые периоды.
    dates[name](s,...args) → дата, которую трогает операция (или null — не датирована).
    frozen(s,date) → закрыт ли период роли, куда попадает дата.
    why(s,date) → объяснение отказа человеческими словами. */
 function domain({ops,validate,by,stamp=T.stamp,frozen=null,dates={},why=null}){
  const guard=(s,name,args)=>{
   if(!frozen||!dates[name])return null;
   const d=dates[name](s,...args);
   return d&&frozen(s,d)?(why?why(s,d):`Период закрыт: ${T.fmtDate(d)} уже не меняется`):null};
  function apply(s,name,args=[],ctx={}){const op=ops[name];if(!op)return {ok:false,error:`Нет операции ${name}`};
   const g=guard(s,name,args);if(g)return {ok:false,error:g,frozen:true};
   const result=op(s,...args);const err=validate(s);
   return err.length?{ok:false,error:err[0]}:{ok:true,result,by:ctx.by||by,at:stamp()}}
  /* Операции, обёрнутые заморозкой: тот же вызов, что ops[name](s,…), но внутри закрытого
     периода возвращает false («не сделано») и ничего не пишет. Экран зовёт их так же, как раньше ops. */
  const guarded=Object.fromEntries(Object.entries(ops).map(([name,op])=>[name,(s,...args)=>guard(s,name,args)?false:op(s,...args)]));
  return {apply,guard,ops:guarded}}

 /* 4. Закон среза: read(s,t) по полной базе = read по базе без будущего.
    cut(s,t) правит копию на месте — удаляет всё, что случилось позже t. */
 function sliceHolds(read,s,t,cut){const a=J(read(s,t));const c=clone(s);cut(c,t);return a===J(read(c,t))}

 return {ruleOn,addVersion,checkVersions,migrate,domain,sliceHolds,clone};
})();
if(typeof module!=='undefined')module.exports={L};

/* ——— Ядро · люди ———
   Один человек — один номер на всю систему (словарь сущностей CLUB-CORE §6).
   Клиент, которого завёл администратор, дневник, который ведёт сам клиент, и клиент
   в потоке тренера — это один человек, если у них один номер. Имя — не связь (И-1, §3):
   совпадение имени и даты начала — только повод спросить, а не решение.

   Номер: «p-» + строчные латинские буквы и цифры.
   - Новый человек получает случайный номер там, где его завели впервые (newId).
   - Дневник, заведённый до номеров, получает номер при миграции из того, что в нём
     записано навсегда: имя, дата и время начала (derive). Поэтому у клиента и у тренера,
     который держит копию того же дневника, номер выйдет одинаковым без сети и без договорённостей.
   Зависит только от T (core/time.js). Проверяется в Node (core/test-core.cjs). */

const P=(()=>{
 // FNV-1a, два прохода с разным зерном: коротко, стабильно, без зависимостей.
 const fnv=(s,seed)=>{let h=seed>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return h.toString(36)};
 const norm=s=>String(s??'').replace(/ё/g,'е').toLowerCase().replace(/\s+/g,' ').trim();
 let seq=0;
 const newId=()=>'p-'+T.now().getTime().toString(36)+(seq++).toString(36)+Math.random().toString(36).slice(2,8);
 const derive=parts=>{const s=parts.map(norm).join('|');return 'p-'+fnv(s,2166136261)+fnv(s,5381)};
 const isId=x=>typeof x==='string'&&/^p-[a-z0-9]{6,40}$/.test(x);
 // Один ли это человек. Только по номеру; без номера у одной из сторон — неизвестно (null).
 const same=(a,b)=>isId(a)&&isId(b)?a===b:null;
 // Повод спросить «это он?»: то же имя (и та же дата начала, если она есть у обоих).
 const looksLike=(a,b)=>!!norm(a.name)&&norm(a.name)===norm(b.name)&&(!a.started||!b.started||a.started===b.started);
 return {newId,derive,isId,same,looksLike,norm};
})();
if(typeof module!=='undefined')module.exports={P};

/* ——— Ядро · обмен ———
   Как база одной роли принимает данные из файла (или, позже, из сети), не теряя своего.
   Источник: передача смены администратора (buildPack / planMerge / applyMerge).

   Закон приёма:
   1. Чужое, чего у меня нет, — добавляется.
   2. Совпадающее — пропускается.
   3. Спорное (одинаковый id, разное содержимое) — решает человек по каждой записи:
      «моё» или «их». Молча ничего не перезаписывается.
   4. Запертое у меня (например, факт внутри закрытого периода) — не меняется никогда:
      остаётся своё и считается как «своих оставлено» (И-4).
   5. Журнал передач склеивается без повторов и по времени.
   Описание данных роль передаёт сама: lists — списки сущностей с id, maps — карты фактов по ключу.
   Зависит только от JSON. Проверяется в Node (core/test-core.cjs). */

const X=(()=>{
 const J=x=>JSON.stringify(x),copy=x=>JSON.parse(J(x));
 const same=(a,b)=>J(a)===J(b);
 // Что произойдёт при приёме — до того, как что-то изменилось.
 function plan(mine,theirs,{lists=[],maps=[],title=(item)=>item.name||item.title||item.id,locked=()=>false}={}){
  const out={added:{},updated:{},equal:{},locked:{},conflicts:[]};
  const look=(key,label,id,own,item)=>{
   if(!own)return 'added';if(same(own,item))return 'equal';if(locked(key,own)||locked(key,item))return 'locked';
   out.conflicts.push({group:key,label,id,title:title(item,key),ours:own,them:item});return 'updated'};
  const count=(key,kinds)=>{for(const k of ['added','updated','equal','locked'])out[k][key]=kinds.filter(x=>x===k).length};
  for(const [key,label] of lists){const byId=new Map((mine[key]||[]).map(x=>[x.id,x]));
   count(key,(theirs[key]||[]).map(item=>look(key,label,item.id,byId.get(item.id),item)))}
  for(const [key,label] of maps)count(key,Object.entries(theirs[key]||{}).map(([id,item])=>look(key,label,id,(mine[key]||{})[id],item)));
  const ids=new Set((mine.log||[]).map(e=>e.id));
  out.logNew=(theirs.log||[]).filter(e=>!ids.has(e.id)).length;
  const sum=k=>Object.values(out[k]).reduce((a,b)=>a+b,0);
  out.totalAdded=sum('added');out.totalEqual=sum('equal');out.totalLocked=sum('locked');
  return out}
 // Применить приём к базе s на месте. choices['группа:id'] = 'mine' | 'theirs'.
 function merge(s,theirs,choices={},{lists=[],maps=[],locked=()=>false}={}){let added=0,updated=0,kept=0;
  const decide=(key,id,own,item)=>{if(same(own,item))return false;
   if(locked(key,own)||locked(key,item)||choices[key+':'+id]==='mine'){kept++;return false}updated++;return true};
  for(const [key] of lists){const byId=new Map(s[key].map(x=>[x.id,x]));
   for(const item of theirs[key]||[]){const own=byId.get(item.id);
    if(!own){if(locked(key,item)){kept++;continue}s[key].push(copy(item));added++;continue}
    if(decide(key,item.id,own,item))Object.assign(own,copy(item))}}
  for(const [key] of maps)for(const [id,item] of Object.entries(theirs[key]||{})){const own=s[key][id];
   if(!own){if(locked(key,item)){kept++;continue}s[key][id]=copy(item);added++;continue}
   if(decide(key,id,own,item))s[key][id]=copy(item)}
  s.log=joinLog(s.log,theirs.log);
  return {added,updated,kept}}
 function joinLog(mine=[],theirs=[]){const ids=new Set((mine||[]).map(e=>e.id));
  return [...(mine||[]),...(theirs||[]).filter(e=>!ids.has(e.id))].sort((a,b)=>String(a.at).localeCompare(String(b.at)))}
 return {plan,merge,joinLog,same};
})();
if(typeof module!=='undefined')module.exports={X};

/* ============================================================================
   Клуб · панель администратора — слой данных
   ----------------------------------------------------------------------------
   Здесь нет ни одной строки разметки и ни одного обращения к DOM. Только
   структура базы, расчёты и проверка. Файл подключается первым и отдаёт
   наружу один объект D (см. конец файла).

   Что где:
     empty() / demo()   — пустая и демонстрационная база
     occurrences()      — раскладка шаблонов сетки по датам + наложенные факты
     tasks()            — то же для маршрута смены

     validate()         — единственная проверка базы; через неё проходит всё,
                          что записывается и всё, что приходит файлом
     counts()           — короткая сводка для пакета передачи

   Главный инвариант: шаблон (rules / tasks) описывает повторение, факт
   (facts / shiftFacts / sessions) описывает то, что случилось. Изменение
   шаблона не переписывает прошлые факты — поэтому у шаблонов есть версии
   с датой начала (from) и окончания (to), связанные общим seriesId.
   ============================================================================ */
/* ——— Роль «администратор» на ядре (CLUB-CORE §9, шаг 5) ———
   Время — из ядра (T): часы подменяемые, как у клиента и тренера.
   Все правки базы — операции ops ниже: экран их только зовёт (А-1).
   Период роли — день смены: закрытая смена заморожена законом ядра (И-4, А-3).
   Схема 2: у базы появились закрытые смены (closed). Старые базы и файлы смены
   доходят до неё ступенью миграции (Я-4). */
const D=(()=>{
 const SCHEMA=3; // 2: закрытые смены; 3: у клиента номер человека (person) — общий для всей системы
 const iso=d=>{const x=new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`},today=()=>T.today(),add=(d,n)=>T.addDays(d,n),uid=()=>globalThis.crypto?.randomUUID?.()||'id'+Date.now()+Math.random().toString(36).slice(2),wd=d=>new Date(d+'T12:00:00').getDay()||7;
 const stamp=()=>T.stamp(),fmt=d=>T.fmtDate(d);
 function empty(){return{schema:SCHEMA,demo:false,admin:'',trainers:[],clients:[],rules:[],facts:{},sessions:[],tasks:[],shiftFacts:{},closed:{},log:[]}}
 const ROLES=['group','personal'];
 const can=(t,role)=>!t?false:!t.roles?true:!!t.roles[role];
 const roster=(s,role)=>s.trainers.filter(t=>can(t,role));
 function demo(){
  let s=empty();s.demo=true;const t=today(),start=add(t,-60);
  s.trainers=[['Анна Волкова','#00A06A',true,{group:true,personal:true}],['Михаил Соколов','#2F6BED',true,{group:true,personal:false}],
   ['Елена Миронова','#E0533D',true,{group:false,personal:true}],['Дмитрий Орлов','#7B61FF',true,{group:true,personal:false}],
   ['Ирина Ковалёва','#0FA3B1',true,{group:true,personal:true}],['Павел Дементьев','#5B6B7B',false,{group:false,personal:true}]]
   .map(([name,color,active,roles],i)=>({id:'t'+i,name,color,active,roles,note:''}));
  s.clients=['Мария Белова','Алексей Иванов','Ольга Павлова','Иван Смирнов','Наталья Гусева','Сергей Зайцев','Екатерина Лапина','Артём Кузнецов','Юлия Ефимова','Денис Морозов','Вера Соловьёва','Тимур Ахметов','Лариса Жукова','Роман Пантелеев']
   .map((name,i)=>({id:'c'+i,person:P.derive(['demo-client',name]),name,trainerId:i%6<5?'t'+(i%6):'',active:i!==13,note:''}));
  const catalog=[
   ['08:00','Мягкое утро','#00A06A',0,12,60,'Групповой зал',[1,2,3,4,5,6,7]],
   ['10:30','Система силы','#2F6BED',1,10,60,'Зал силы',[1,2,3,4,5,6]],
   ['12:00','Мобильность','#0FA3B1',4,14,45,'Малый зал',[1,3,5,6]],
   ['13:00','Здоровая спина','#7B61FF',2,14,60,'Групповой зал',[1,2,3,4,5]],
   ['17:30','Кардио-микс','#E0533D',3,16,50,'Групповой зал',[1,2,3,4,5]],
   ['18:00','Full body','#1B1B1B',3,12,60,'Зал силы',[2,4,6]],

   Читает чужие факты через домен-источник: занятия и людей — из домена администратора (D),
   недели и ответы тренеров — из пакетов, которые тренер отдаёт наверх. Запись — только своя.

   Законы, которые живут здесь (roles/manager/contract.md §«Законы роли»):
   М-1 менеджер не вводит чужих фактов: люди, занятия и посещения только считаются;
   М-2 одно посещение в день у человека, сколько бы ролей его ни отметили;
   М-3 сигнал с причиной и порогом, у сигнала есть ответ-факт;
   М-4 месяц закрывается ответом по каждому тренеру и каждому сигналу; закрытый заморожен;
   М-5 чтение на дату видит только прошлое этой даты;
   М-6 личные заметки тренера и строки дневника менеджеру не показываются — только числа.

   Денег в продукте нет: ни оплат, ни абонементов, ни продаж — операционка своего слоя.

  if(!club(s))return {ok:false,why:'Нет базы клуба — примите её от администратора'};
  const rows=crew(s,m,t),row=monthRow(s,m);
  if(!rows.length)return {ok:false,why:'В этом месяце нечего закрывать'};
  const noVerdict=rows.filter(x=>!row?.reviews?.[x.id]).length;
  if(noVerdict)return {ok:false,why:`Сначала разберите тренеров: без ответа ${noVerdict}`};
  const open=signals(s,m,t).filter(g=>!g.answer).length;
  if(open)return {ok:false,why:`Сначала ответьте по сигналам: без ответа ${open}`};
  return {ok:true,why:''}}

 function monthReview(s,m,t=T.today()){const rows=crew(s,m,t),pp=people(s,m,t),f=fill(s,m,t),row=monthRow(s,m);
  return {month:m,norm:normOn(s,mStart(m)),trainers:rows,fill:f,people:{total:pp.total,active:pp.active,
   retention:pp.retention,returned:pp.returned,base:pp.base,fresh:pp.fresh,freshOk:pp.freshOk,risk:pp.risk.length,noCoach:pp.noCoach.length},
   signals:signals(s,m,t),goal:row?.goal||null,
   verdicts:Object.fromEntries(rows.map(x=>[x.id,row?.reviews?.[x.id]||null]))}}

 /* Сводка наверх (владельцу): загрузка, удержание, что сделано по риску. Без единого имени
    клиента в строках дневника — только числа и решения по людям, которых ведёт клуб. */
 function reviewText(s,m,t=T.today()){const r=monthReview(s,m,t);
  const done=r.signals.filter(g=>g.answer);
  return [`Итог месяца · ${mLabel(m)}`,
   `Загрузка: норма ${r.norm.minutes} мин · в норме ${r.trainers.filter(x=>x.state==='norm').length} из ${r.trainers.length}`+
    (r.trainers.filter(x=>x.state==='over').length?` · перегружены ${r.trainers.filter(x=>x.state==='over').length}`:'')+
    (r.trainers.filter(x=>x.state==='under').length?` · пусто у ${r.trainers.filter(x=>x.state==='under').length}`:''),
   `Заполняемость: ${r.fill.rate===null?'нет проведённых групп':r.fill.rate+' % при норме '+r.norm.fill+' %'}`,
   `Удержание: ${r.people.retention===null?'не с чем сравнивать':r.people.retention+' % ('+r.people.returned+' из '+r.people.base+')'} · ходили ${r.people.active} из ${r.people.total}`,
   `Новички до привычки: ${r.people.freshOk} из ${r.people.fresh}`,
   `Риск ухода: ${r.people.risk} · без тренера: ${r.people.noCoach}`,
   `По тренерам: ${r.trainers.map(x=>`${x.name} — ${(VERDICT[r.verdicts[x.id]?.verdict]||'без ответа').toLowerCase()}`).join('; ')}`,
   `Сигналов: ${r.signals.length}, отвечено ${done.length}`,
   ...done.map(g=>`— ${g.title}: ${(REPLY[g.answer.kind]||'').toLowerCase()}${g.answer.note?', '+g.answer.note:''}${g.answer.until?`, ждём до ${T.fmtShort(g.answer.until)}`:''}`)].join('\n')}

 const closing=(s,m,by,t=T.today())=>{const r=monthReview(s,m,t);
  return {at:T.stamp(),by:by||'',snap:{trainers:r.trainers.length,norm:r.trainers.filter(x=>x.state==='norm').length,
   fill:r.fill.rate,retention:r.people.retention,risk:r.people.risk,signals:r.signals.length},report:reviewText(s,m,t)}};

 /* ——— ход месяца: маршрут роли ———
    У администратора маршрут — правила смены с фактом по каждому пункту. У управляющего
    период — месяц, и его обязательные пункты не выдумываются: это ровно то, без чего месяц
    не закрывается (М-4). Поэтому маршрут здесь — чтение, а не хранимый список: он считается
    из тех же фактов и не может разойтись с закрытием. Будущее не спрашивают: пункт «закрыть»
    ждёт последнего дня месяца и до него не долг (И-4). */
 function route(s,m,t=T.today()){
  const row=monthRow(s,m),rows=crew(s,m,t),list=signals(s,m,t);
  const done=rows.filter(x=>row?.reviews?.[x.id]).length,answered=list.filter(g=>g.answer).length;
  const last=t>=mEnd(m);
  return [
   {key:'goal',title:'Поставить цель месяца',what:'заполняемость и удержание, с которыми сверяемся',
    state:row?.goal?'done':'open',go:'goal'},
   {key:'review',title:'Разобрать тренеров',what:'норма, разговор или помощь — по каждому, кто работал',
    count:`${done} из ${rows.length}`,state:!rows.length?'none':done===rows.length?'done':'open',go:'trainers'},
   {key:'reply',title:'Ответить на сигналы',what:'у каждого сигнала есть причина, порог и ответ',
    count:`${answered} из ${list.length}`,state:!list.length?'done':answered===list.length?'done':'open',go:'signals'},
   {key:'close',title:'Закрыть месяц',what:last?'сводка уйдёт наверх в том виде, в каком она сейчас':`с последнего дня — с ${T.fmtDate(mEnd(m))}`,
    state:row?.closedAt?'done':last?'open':'wait',go:'close'},
  ]}

 /* Поздние факты после закрытия (И-4): сводка не пересчитывается — разница показывается рядом.
    Числа считаются на последний день месяца, как и при закрытии, поэтому расходятся только
    из-за того, что пришло позже: новый пакет смены, поздний пакет тренера. */
 function afterClose(s,m){const row=monthRow(s,m);if(!row?.closedAt||!row.snap||!club(s))return [];
  const t=mEnd(m),r=monthReview(s,m,t),out=[],was=row.snap;
  const now={trainers:r.trainers.length,norm:r.trainers.filter(x=>x.state==='norm').length,
   fill:r.fill.rate,retention:r.people.retention,risk:r.people.risk,signals:r.signals.length};
  const say=(label,a,b,unit='')=>{if(a===b||a===null&&b===null)return;
   out.push(`${label}: сейчас ${b===null?'нет':b+unit}, в сводке было ${a===null?'нет':a+unit}`)};
  say('Тренеров в норме',was.norm,now.norm);say('Тренеров считалось',was.trainers,now.trainers);
  say('Заполняемость',was.fill,now.fill,' %');say('Удержание',was.retention,now.retention,' %');
  say('В риске',was.risk,now.risk);say('Сигналов',was.signals,now.signals);
  return out}

 /* Хвосты роли: то, что ждёт ответа прямо сейчас (И-3). */
 function tails(s,t=T.today()){const m=monthOf(t);
  return signals(s,m,t).filter(g=>!g.answer)}

 /* ——— приём чужого (И-1) ———
    Менеджер не заводит людей и занятия: он принимает копию базы администратора и пакеты тренеров.
    Пакет тренера обрезается до чисел: заметки, дневник и план в базу менеджера не попадают (М-6). */
 const COACH_KEEP=['id','name','club','at','weeks','clients'];
 function intakeCoach(pack){
  const src=pack&&pack.role==='coach'&&pack.data?pack.data:pack;
  if(!src||!Array.isArray(src.clients)||!Array.isArray(src.weeks))throw Error('Это не пакет тренера');
  const id=String(pack.id||src.profile?.person||P.derive(['coach',src.profile?.name||'',src.profile?.started||'']));
  return {id,name:String(src.profile?.name||'Тренер').slice(0,80),club:String(src.profile?.club||'').slice(0,80),at:T.stamp(),
   weeks:src.weeks.filter(w=>T.isDate(w.week)).map(w=>({week:w.week,closedAt:w.closedAt||null,
    snap:w.snap?{done:Number(w.snap.done)||0,missed:Number(w.snap.missed)||0,risk:Number(w.snap.risk)||0,clients:(w.snap.clients||[]).length}:null})),
   clients:src.clients.filter(c=>P.isId(c.person)).map(c=>({person:c.person,name:String(c.name||'').slice(0,80),
    since:T.isDate(c.since)?c.since:null,
    visits:[...new Set((c.sessions||[]).filter(x=>x.mark==='held'&&T.isDate(x.date)).map(x=>x.date))].sort(),
    reaches:(c.reaches||[]).filter(r=>T.isDate(r.date)).map(r=>({date:r.date,kind:String(r.kind||''),until:T.isDate(r.until)?r.until:null}))}))}}
 /* Копия базы клуба: проходит миграцию и проверку домена-источника — чужое остаётся чужим. */
 function intakeClub(raw){const base=D.migrate(clone(raw&&raw.data&&raw.data.schema?raw.data:raw));D.validate(base);return base}
 /* Что произойдёт при приёме — до того, как что-то изменилось (core/exchange.js).
    Запертое у менеджера — числа внутри закрытого месяца: на них стоит сводка, которая ушла наверх (И-4). */
 const lockedHere=s=>(key,item)=>!!item&&!!item.date&&closedMonth(s,monthOf(item.date));
 function clubPlan(s,raw){const base=intakeClub(raw);
  return {base,plan:club(s)?X.plan(club(s),base,{...D.EXCHANGE,locked:lockedHere(s)}):null}}

 const ops={
  setName(s,name){s.profile.name=String(name||'').trim().slice(0,80);return true},
  setClub(s,name){s.profile.club=String(name||'').trim().slice(0,80);return true},
  setThreshold(s,key,value){if(!(key in TH))throw Error('Нет такого порога');
   const n=Number(value);if(!Number.isFinite(n)||n<0||n>3650)throw Error('Порог — целое число от 0');
   s.profile.thresholds={...s.profile.thresholds,[key]:Math.round(n)};return true},
  resetThresholds(s){s.profile.thresholds={...TH};return true},
  // Норма — версия с даты: прошлые месяцы считаются своей нормой (И-2).
  setNorm(s,{minutes,fill},from=T.today()){
   const mi=Number(minutes),fi=Number(fill);
   if(!Number.isFinite(mi)||mi<0||mi>100000)throw Error('Норма минут — число от 0');
   if(!Number.isFinite(fi)||fi<0||fi>100)throw Error('Заполняемость — от 0 до 100 %');
   if(!T.isDate(from))throw Error('Нужна дата, с которой действует норма');
   s.norms=L.addVersion(s.norms,{minutes:Math.round(mi),fill:Math.round(fi)},from);return true},
  setGoal(s,m,goal){if(!isMonth(m))throw Error('Нет такого месяца');const r=ensure(s,m);
   const fi=goal.fill===''||goal.fill===null?null:Number(goal.fill),re=goal.retention===''||goal.retention===null?null:Number(goal.retention);
   if(fi!==null&&(!Number.isFinite(fi)||fi<0||fi>100))throw Error('Цель по заполняемости — от 0 до 100 %');
   if(re!==null&&(!Number.isFinite(re)||re<0||re>100))throw Error('Цель по удержанию — от 0 до 100 %');
   r.goal={fill:fi===null?null:Math.round(fi),retention:re===null?null:Math.round(re),note:String(goal.note||'').slice(0,400)};return true},
  // Разбор месяца по тренеру: норма / разговор / помощь.
  review(s,m,trainerId,verdict,note=''){if(!isMonth(m))throw Error('Нет такого месяца');
   if(!(verdict in VERDICT))throw Error('Нет такого ответа');
   if(!trainers(s).some(x=>x.id===trainerId))throw Error('Нет такого тренера');
   const r=ensure(s,m);r.reviews={...r.reviews,[trainerId]:{verdict,note:String(note||'').slice(0,400),on:T.today(),at:T.stamp()}};return true},
  // Ответ на сигнал (И-9): сигнал закрывается фактом, а не исчезновением.
  reply(s,m,key,kind,note='',until=null){if(!isMonth(m))throw Error('Нет такого месяца');
   if(!(kind in REPLY))throw Error('Нет такого ответа');
   if(typeof key!=='string'||!key)throw Error('Нет сигнала');
   if(until){if(!T.isDate(until))throw Error('«Ждём до» — дата');
    if(until<=T.today())throw Error('«Ждём до» — не раньше завтра')}
   const r=ensure(s,m);r.answers={...r.answers,[key]:{kind,note:String(note||'').slice(0,400),until:until||null,on:T.today(),at:T.stamp()}};return true},
  unreply(s,m,key){const r=monthRow(s,m);if(!r||!r.answers[key])return false;
   const a={...r.answers};delete a[key];r.answers=a;return true},
  closeMonth(s,m,by,t=T.today()){const st=closeState(s,m,t);if(!st.ok)throw Error(st.why);
   const r=ensure(s,m),c=closing(s,m,by||s.profile.name,t);
   r.closedAt=c.at;r.report=c.report;r.snap=c.snap;r.by=c.by;return true},
  /* Приём базы клуба — слиянием по правилам ядра (core/exchange.js), а не заменой:
     пакет смены приходит периодом, и второй пакет не должен стирать первый.
     Источник чисел — администратор, поэтому спорное остаётся за ним; не меняется только
     то, что заперто закрытым месяцем: на этих числах уже стоит ушедшая наверх сводка (И-4). */
  takeClub(s,raw){const base=intakeClub(raw);
   if(!club(s)){s.club=base;return {added:null,updated:null,kept:0,first:true}}
   const r=X.merge(s.club,base,{},{...D.EXCHANGE,locked:lockedHere(s)});
   for(const [date,c] of Object.entries(base.closed||{}))if(!s.club.closed[date]&&!closedMonth(s,monthOf(date)))s.club.closed[date]=clone(c);
   s.club.schema=base.schema;s.club.demo=s.club.demo&&base.demo;
   D.validate(s.club);return {...r,first:false}},
  takeCoach(s,pack){const item=intakeCoach(pack);
   s.coaches=[...(s.coaches||[]).filter(c=>c.id!==item.id),item];return item.name},
  forgetCoach(s,id){const was=(s.coaches||[]).length;s.coaches=(s.coaches||[]).filter(c=>c.id!==id);return s.coaches.length<was},
 };

 /* Единый вход (Я-2) и заморозка закрытого месяца (И-4) — закон ядра.
    Операция, которая трогает месяц, объявляет его дату; закрытый месяц не принимает правок. */
 const DATES={setGoal:(s,m)=>mStart(m),review:(s,m)=>mStart(m),reply:(s,m)=>mStart(m),unreply:(s,m)=>mStart(m)};
 const law=L.domain({ops,by:'manager',stamp:T.stamp,frozen,dates:DATES,validate:s=>validate(s),
  why:(s,d)=>`Месяц ${mLabel(monthOf(d))} закрыт — он уже не меняется`});

 const STEPS={};
 const migrate=s=>L.migrate(s,VERSION,STEPS,{field:'version'});

 function validate(s){const err=[],need=(c,m)=>{if(!c)err.push(m)};
  if(!s||typeof s!=='object')return ['База пустая'];
  need(s.version===VERSION,'Копия от другой версии дашборда');
  need(s.profile&&typeof s.profile.name==='string','Профиль управляющего');
  need(s.profile&&s.profile.thresholds&&typeof s.profile.thresholds==='object','Пороги роли');
  for(const k of ['norms','months','coaches'])need(Array.isArray(s[k]),`Нет списка ${k}`);
  if(err.length)return err;
  for(const [k,v] of Object.entries(s.profile.thresholds))need(k in TH&&Number.isFinite(v)&&v>=0,'Порог записан неверно: '+k);
  need(!L.checkVersions(s.norms,'нормы').length,L.checkVersions(s.norms,'нормы')[0]||'');
  for(const n of s.norms)need(T.isDate(n.from)&&Number.isFinite(n.minutes)&&Number.isFinite(n.fill),'Норма записана неверно');
  const seen=new Set();
  for(const r of s.months){
   need(isMonth(r.month),'Месяц: неверная метка');need(!seen.has(r.month),'Повтор месяца');seen.add(r.month);
   need(r.reviews&&typeof r.reviews==='object','Месяц: разборы');need(r.answers&&typeof r.answers==='object','Месяц: ответы');
   for(const v of Object.values(r.reviews||{}))need(v&&v.verdict in VERDICT,'Разбор: неизвестный ответ');
   for(const a of Object.values(r.answers||{})){need(a&&a.kind in REPLY,'Ответ на сигнал: неизвестный вид');
    need(!a.until||T.isDate(a.until),'Ответ на сигнал: «ждём до» — дата')}
   need(!r.closedAt||(typeof r.report==='string'&&r.snap&&typeof r.snap==='object'),'Закрытый месяц без зафиксированной сводки');
  }
  for(const c of s.coaches||[]){
   need(typeof c.id==='string'&&c.id,'Пакет тренера без номера');
   need(Array.isArray(c.weeks)&&Array.isArray(c.clients),'Пакет тренера: недели и клиенты');
   for(const cl of c.clients||[]){
    need(P.isId(cl.person),'Пакет тренера: номер человека');
    need(Array.isArray(cl.visits),'Пакет тренера: посещения');
    // М-6: личного в базе менеджера нет — ни заметок, ни дневника, ни плана.
    for(const k of ['notes','record','plan','planLog'])need(!(k in cl),'Личное тренера в базе управляющего: '+k);
   }}
  if(s.club!==null&&s.club!==undefined){const e=(()=>{try{D.validate(s.club);return null}catch(x){return x.message}})();
   need(!e,'База клуба: '+e)}
  return err}

 /* Закон среза (М-5): чтение на дату t не зависит от того, что случилось позже t.
    cut правит копию на месте — убирает будущее из всех источников, своих и чужих. */
 function cut(s,t){
  if(s.club){const c=s.club;
   for(const k of Object.keys(c.facts))if(c.facts[k].date>t)delete c.facts[k];
   for(const k of Object.keys(c.shiftFacts))if(c.shiftFacts[k].date>t)delete c.shiftFacts[k];
   for(const k of Object.keys(c.closed))if(k>t)delete c.closed[k];
   c.sessions=c.sessions.filter(p=>p.date<=t);
   c.rules=c.rules.filter(r=>r.from<=t);
   c.tasks=c.tasks.filter(q=>q.from<=t);}
  s.coaches=(s.coaches||[]).map(co=>({...co,
   weeks:co.weeks.filter(w=>w.week<=t).map(w=>({...w,closedAt:w.closedAt&&T.dateOf(w.closedAt)>t?null:w.closedAt})),
   clients:co.clients.map(cl=>({...cl,visits:cl.visits.filter(d=>d<=t),reaches:cl.reaches.filter(r=>r.date<=t)}))}));
  s.months=s.months.filter(r=>mStart(r.month)<=t).map(r=>({...r,
   reviews:Object.fromEntries(Object.entries(r.reviews).filter(([,v])=>!v.on||v.on<=t)),
   answers:Object.fromEntries(Object.entries(r.answers).filter(([,v])=>!v.on||v.on<=t))}));
  s.norms=s.norms.filter(n=>n.from<=t);
  return s}
 // Одно чтение роли целиком — им и проверяется закон среза.
 const read=(s,t)=>({load:load(s,monthOf(t),t),people:(({rows,risk,noCoach,...rest})=>rest)(people(s,monthOf(t),t)),
  fill:fill(s,monthOf(t),t),signals:signals(s,monthOf(t),t).map(g=>({key:g.key,why:g.why,answered:!!g.answer}))});

 /* Демонстрационная база: клуб — из демо администратора, пакет тренера — собран из тех же
    фактов, чтобы пример был согласован сам с собой. Своих фактов о людях менеджер не заводит. */
 function demo(){const s=empty();
  s.profile.name='Управляющий';s.profile.club='Клуб';
  s.club=D.demo();
  const t=T.today();
  const pick=s.club.trainers.filter(x=>x.active).slice(0,3);
  let k=0;const gone=new Map();
  s.coaches=pick.map((tr,i)=>({id:'co'+i,name:tr.name,club:'Клуб',at:T.stamp(),
   weeks:[0,1,2,3].map(w=>{const week=T.weekStart(T.addDays(t,-7*(w+1)));
    return {week,closedAt:w===0&&i===1?null:T.stampAt(T.addDays(week,7+w),'10:00'),snap:{done:6+w,missed:w,risk:w%2,clients:5}}}),
   /* Отметки тренера «состоялось» — его собственные факты: по ним менеджер и считает
      посещения человека. Здесь они разложены так, чтобы в примере были и новички,
      и вернувшиеся, и те, кто пропал. */
   clients:s.club.clients.filter(c=>c.trainerId===tr.id&&c.active).map(c=>{
    const kind=k++%6;                                  // шесть судеб: давний, давний, ходит, новичок, новичок, ушёл
    const age=[420,260,150,64,38,210][kind],step=[7,7,5,10,14,7][kind],stop=kind===5?45:0;
    const since=T.addDays(t,-age),visits=[];
    for(let d=0;d<=age-stop;d+=step)visits.push(T.addDays(since,d));
    if(kind===4)visits.length=Math.min(visits.length,3); // новичок, который не дошёл до привычки
    if(stop)gone.set(c.person,visits[visits.length-1]||since);
    return {person:c.person,name:c.name,since,visits,
     reaches:stop&&kind===5?[{date:T.addDays(t,-stop+2),kind:'called',until:null}]:[]}})}));
  /* Кто перестал ходить — перестал везде: персональные у администратора после последнего
     занятия у таких людей в примере не появляются, иначе пример спорил бы сам с собой. */
  s.club.sessions=s.club.sessions.filter(p=>{const last=gone.get(personOf(s,p.clientId));return !last||p.date<=last});

const $=(s,p=document)=>p.querySelector(s),$$=(s,p=document)=>[...p.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

/* ——— Ядро · отмена по действию (З-06, INVARIANT §4.5) ———
   Для каждого действия запоминается разница по сущностям, которые оно затронуло:
   что добавилось, что удалилось, какими были изменённые. «Отменить» применяет обратное
   только к ним: поздние правки других сущностей и других полей остаются.

   Роль объявляет в своём 01-core.js, что считать сущностями:
     LISTS — списки сущностей с id (или week у недель тренера);
     OBJS  — одиночные объекты базы (профиль и т. п.).
   Источник: тренерская версия (ключ id|week, защита поздней правки поля) — она строже клиентской. */

const J=x=>JSON.stringify(x);
// Ключ сущности: номер у списков с id, неделя у тренера, месяц у управляющего.
const keyOf=x=>x.id||x.week||x.month;
const isList=v=>Array.isArray(v)&&v.every(x=>x&&typeof x==='object'&&('id' in x||'week' in x||'month' in x));
function diff(a,b){const p={};
 for(const k of LISTS){const A=new Map(a[k].map((x,i)=>[keyOf(x),[x,i]])),Bm=new Map(b[k].map(x=>[keyOf(x),x]));
  const c={added:[],removed:[],changed:[]};
  for(const [id] of Bm)if(!A.has(id))c.added.push(id);
  for(const [id,[x,i]] of A){const y=Bm.get(id);if(!y)c.removed.push([x,i]);else if(J(x)!==J(y))c.changed.push([x,y])}
  if(c.added.length||c.removed.length||c.changed.length)p[k]=c}
 for(const k of OBJS)if(J(a[k])!==J(b[k]))p[k]={before:a[k],after:b[k]};
 return p}
/* Откат трёхсторонний: возвращаем только те поля и вложенные списки, которые поменяло
   само это действие (было → стало). Поле, поменянное уже после действия, — поздняя правка. */
function revert(cur,before,after){
 if(isList(before)&&isList(after)&&isList(cur)){const A=new Map(after.map(x=>[keyOf(x),x])),Bf=new Map(before.map((x,i)=>[keyOf(x),[x,i]]));
  let out=cur.filter(x=>Bf.has(keyOf(x))||!A.has(keyOf(x)));
  out=out.map(x=>{const b=Bf.get(keyOf(x)),a=A.get(keyOf(x));return b&&a&&J(b[0])!==J(a)?revert(x,b[0],a):x});
  for(const [id,[x,i]] of [...Bf].sort((p,q)=>p[1][1]-q[1][1]))if(!A.has(id)&&!out.some(y=>keyOf(y)===id))out.splice(Math.min(i,out.length),0,clone(x));
  return out}
 if(before&&after&&cur&&typeof before==='object'&&typeof after==='object'&&typeof cur==='object'&&!Array.isArray(before)){const n={...cur};
  for(const f of new Set([...Object.keys(before),...Object.keys(after)])){if(J(before[f])===J(after[f]))continue;
   const objs=f in cur&&typeof before[f]==='object'&&before[f]!==null&&typeof cur[f]==='object'&&cur[f]!==null;
   if(!objs&&f in cur&&J(cur[f])!==J(after[f]))continue;
   if(!(f in before))delete n[f];else n[f]=objs?revert(cur[f],before[f],after[f]):clone(before[f])}
  return n}
 return clone(before)}
function applyUndo(s,p){const n=clone(s);
 for(const k of LISTS){const c=p[k];if(!c)continue;
  n[k]=n[k].filter(x=>!c.added.includes(keyOf(x)));
  for(const [x,y] of c.changed){const i=n[k].findIndex(z=>keyOf(z)===keyOf(x));if(i>=0)n[k][i]=revert(n[k][i],x,y)}
  for(const [x,i] of [...c.removed].sort((a,b)=>a[1]-b[1]))n[k].splice(Math.min(i,n[k].length),0,clone(x))}
 for(const k of OBJS)if(p[k])n[k]=revert(n[k],p[k].before,p[k].after);
 return n}

/* ——— голос роли: словарь роли, механика ядра (core/voice.js) ———

   и VOICE_SAMPLE (две реплики для образца в настройках). */
// Тона роли: по умолчанию два, но роль может объявить свои (VOICE_TONES) — например, один.
const voiceTones=()=>typeof VOICE_TONES==='undefined'?['calm','shift']:VOICE_TONES;
const voiceNow=()=>voiceTones().includes(prefs.voice)?prefs.voice:voiceTones()[0];
let voiceM=null;
const voiceOf=()=>voiceM||(voiceM=V.make({dict:VOICE,tones:voiceTones(),get:()=>({voice:voiceNow(),custom:prefs.custom||{}})}));
function say(key,...args){return voiceOf().say(key,...args)}
function shadowText(key){return voiceOf().text(key,1)}
const customCount=()=>Object.keys(prefs.custom||{}).length;

/* Свой теневой язык: сначала разделы, потом один раздел целиком. Пустая строка — исходная реплика. */
function voiceGroups(){const g={};for(const [key,[where,what]] of Object.entries(VOICE_WHERE)){if(!VOICE[key])continue;(g[where]=g[where]||[]).push([key,what])}return g}
function voiceEditor(){openSheet({title:'Свой теневой язык',view:()=>{const groups=voiceGroups(),own=customCount();
 return `<p class="lead">${own?'Своих реплик: '+own:'Пока всё исходное'}. Это тексты голоса «После смены»; спокойный голос отсюда не меняется.</p>
 <div class="rows">${Object.entries(groups).map(([where,list])=>{const mine=list.filter(([k])=>(prefs.custom||{})[k]).length;
  return `<button type="button" class="row plain" data-action="voice-group" data-id="${esc(where)}" data-key="vg${esc(where)}"><div class="rbody"><span class="rt">${esc(where)}</span><span class="rm">${mine?`своих: ${mine} из ${list.length}`:`реплик: ${list.length} · всё исходное`}</span></div>${I('chev',18)}</button>`}).join('')}</div>
 ${own?`<div class="btnrow">${B('Сбросить всё','voice-reset-all','','small danger')}</div>`:''}`}})}
function voiceGroupSheet(where){const list=voiceGroups()[where]||[];
 openSheet({title:esc(where),body:`<p class="caption">Пустая строка вернёт исходную реплику, {n} — место для числа.</p>`+list.map(([key,what])=>{const val=(prefs.custom||{})[key]||'';
  return `<label class="field vline"><span class="label">${esc(what)}</span><input name="v_${key}" value="${esc(val||shadowText(key))}" maxlength="160" autocomplete="off"><span class="caption">Исходная: ${esc(shadowText(key))}</span></label>`}).join(''),

'use strict';
/* ——— Графики (CLUB-CORE §14) ———
   Одна семья графиков на все роли: линия, столбики, искра. Монохром — цвет ряда
   это --mark (чернила), второстепенное — --mark-soft; статусные тона не трогаем.
   Правила (dataviz):
   · одна ось; сетка и оси тише данных; линия 2px, концы столбиков скруглены 4px и стоят на базовой линии;
   · подписи — выборочно: последняя точка, «сейчас», максимум; остальное — в подсказке по наведению;
   · подсказка без скриптов: колонка-цель шире метки, :hover и :focus показывают перекрестье и значение;
   · текст — чернилами текста, не цветом ряда; пустой ряд — словами, а не плоской полосой.
   Разметка — HTML поверх SVG: точки и подписи не растягиваются вместе с рисунком. */

const CHART=(()=>{
 let uid=0;
 const num=v=>(Math.round(v*10)/10).toLocaleString('ru-RU');
 const esc2=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const pct=x=>(Math.round(x*100)/100)+'%';

 // «Круглые» деления оси: 3–5 штук, шаг 1·2·2,5·5 × 10ⁿ.
 function ticks(min,max){if(min===max){const d=Math.abs(min)*.05||1;min-=d;max+=d}
  const raw=(max-min)/3,mag=10**Math.floor(Math.log10(raw)),step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=raw);
  const lo=Math.floor(min/step)*step,hi=Math.ceil(max/step)*step,out=[];
  for(let v=lo;v<=hi+step/2;v+=step)out.push(Math.round(v*1000)/1000);
  return out}
 // Где подсказке встать, чтобы не выйти за край: слева прижата, справа прижата, по центру.
 const side=f=>f<.2?' l':f>.8?' r':'';

 /* Линия со шкалой. pts: [{v, x:'подпись оси', tip:'текст подсказки'}] — уже без пустых. */
 function line(pts,{unit='',h=168,label=''}={}){
  if(!pts.length)return '';
  if(pts.length===1)pts=[pts[0],pts[0]];
  const vs=pts.map(p=>p.v),v0=Math.min(...vs),v1=Math.max(...vs),t=ticks(v0-(v1-v0)*.12,v1+(v1-v0)*.04),lo=t[0],hi=t[t.length-1],n=pts.length-1;
  const X=i=>i/n*100,Y=v=>100-(v-lo)/(hi-lo)*100;
  const d=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(2)+' '+Y(p.v).toFixed(2)).join(' ');
  const id='cg'+(++uid),step=100/n,dots=pts.length<=16,last=pts[pts.length-1];
  const grid=t.map((v,i)=>`<span class="ch-cgl${i?'':' base'}" style="top:${pct(Y(v))}"><em>${num(v)}</em></span>`).join('');
  const cols=pts.map((p,i)=>{const l=Math.max(0,X(i)-step/2),r=Math.min(100,X(i)+step/2),c=(X(i)-l)/(r-l)*100;
   return `<span class="ch-ccol${side(i/n)}" tabindex="0" style="left:${pct(l)};width:${pct(r-l)};--cx:${pct(c)}"><i class="ch-cdot${dots?'':' is-hid'}${i===n?' is-last':''}" style="left:${pct(c)};top:${pct(Y(p.v))}"></i><span class="ch-ctip"><b>${num(p.v)}${unit?' '+esc2(unit):''}</b>${p.tip?esc2(p.tip):esc2(p.x)}</span></span>`}).join('');
  const xs=[0,Math.round(n/2),n].filter((v,i,a)=>a.indexOf(v)===i&&(n>=2||v!==Math.round(n/2)));
  return `<figure class="chart ch-cline" role="img" aria-label="${esc2(label||'График')}: последнее ${num(last.v)} ${esc2(unit)}">
 <div class="ch-cplot" style="--h:${h}px"><div class="ch-cin">${grid}
  <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="currentColor" stop-opacity=".16"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></linearGradient></defs>
  <path class="ch-carea" d="${d} L100 100 L0 100 Z" fill="url(#${id})"/><path class="ch-cln" d="${d}"/></svg>
  <span class="ch-clast" style="top:${pct(Y(last.v))}">${num(last.v)}</span>${cols}</div></div>
 <div class="ch-caxis">${xs.map(i=>`<span style="left:${pct(X(i))}"${i===0?' class="l"':i===n?' class="r"':''}>${esc2(pts[i].x)}</span>`).join('')}</div></figure>`}

 /* Столбики от нуля. items: [{v, x:'подпись', tip, now, cls}]; goal — цель пунктиром. */
 function bars(items,{h=120,goal=null,goalLabel='',unit='',label='',values='auto',empty='Пока пусто'}={}){
  const n=items.length;if(!n)return '';
  const max=Math.max(goal||0,...items.map(i=>i.v||0)),top=max>0?ticks(0,max).pop():1;
  const all=values==='all'||(values==='auto'&&n<=12),mi=items.reduce((a,x,i)=>(x.v||0)>(items[a].v||0)?i:a,0);
  const zero=items.every(i=>!i.v);
  const cols=items.map((it,i)=>{const v=it.v||0,show=!zero&&values!=='none'&&(all||it.now||(i===mi&&v>0));
   return `<span class="ch-cbar${it.now?' is-now':''}${v?'':' is-zero'}${it.cls?' '+it.cls:''}${side(n>1?i/(n-1):.5)}" tabindex="0">${show?`<b class="ch-cv">${num(v)}</b>`:''}<i style="height:${pct(v/top*100)}"></i><span class="ch-ctip"><b>${num(v)}${unit?' '+esc2(unit):''}</b>${esc2(it.tip||it.x)}</span></span>`}).join('');
  const g=goal?`<span class="ch-cgoal" style="bottom:${pct(goal/top*100)}"><em>${esc2(goalLabel||num(goal))}</em></span>`:'';
  return `<figure class="chart ch-cbars${n>16?' dense':''}" role="img" aria-label="${esc2(label||'Столбики')}">
 <div class="ch-cplot" style="--h:${h}px"><div class="ch-cin">${g}<div class="ch-ccols">${cols}</div>${zero?`<span class="ch-cempty caption">${esc2(empty)}</span>`:''}</div></div>
 ${n>16?`<div class="ch-caxis">${items.map((it,i)=>it.x?`<span style="left:${pct((i+.5)/n*100)}" class="${i<n*.1?'l':i>n*.9?'r':''}${it.now?' is-now':''}">${esc2(it.x)}</span>`:'').join('')}</div>`:`<div class="ch-cxl">${items.map(it=>`<span class="${it.now?'is-now':''}">${esc2(it.x||'')}</span>`).join('')}</div>`}</figure>`}

 /* Искра для карточки-числа: без осей и подсказок (карточка — сама кнопка, подробности в шторке). */
 function spark(vals,{h=40}={}){const pts=vals.map((v,i)=>[i,v]).filter(p=>p[1]);
  if(pts.length<2)return '<span class="ch-cspark is-empty" aria-hidden="true"></span>';
  const a=pts[0][0],n=(pts[pts.length-1][0]-a)||1,ys=pts.map(p=>p[1]),lo=Math.min(...ys),hi=Math.max(...ys),flat=hi===lo;
  const X=i=>(i-a)/n*100,Y=v=>flat?50:88-(v-lo)/(hi-lo)*76;
  const d=pts.map(([i,v],k)=>(k?'L':'M')+X(i).toFixed(2)+' '+Y(v).toFixed(2)).join(' '),id='cs'+(++uid),l=pts[pts.length-1];
  return `<span class="ch-cspark" style="--h:${h}px" aria-hidden="true"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="currentColor" stop-opacity=".14"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></linearGradient></defs>${flat?'':`<path class="ch-carea" d="${d} L100 100 L0 100 Z" fill="url(#${id})"/>`}<path class="ch-cln" d="${d}"/></svg><i class="ch-cdot is-last" style="left:${pct(X(l[0]))};top:${pct(Y(l[1]))}"></i></span>`}

 return {line,bars,spark,ticks};
})();

/* ——— Ядро панели управляющего ———
   Та же архитектура экрана, что у клиента, тренера и администратора:
   1. Правила, меняющие данные, живут в домене (MD.ops); экран их только зовёт (М-1).
   2. Данные записываются только через store: проверка → счётчик версии → запись.
   3. Экран — функция состояния, накладывается через morph (core/ui/kit.js).
   4. Разметка не вешает обработчиков: data-action → ACTIONS (10-boot.js).
   5. «Отменить» откатывает ровно своё действие (core/ui/undo.js).
   Чужие факты сюда не пишутся: клуб и пакеты тренеров только принимаются целиком. */

const KEY='xeptra.manager.v1',REV='xeptra.manager.rev',PREFS_KEY='xeptra.manager.prefs';
// База администратора в этом же браузере: менеджер её только читает и берёт копию по кнопке.
const CLUB_KEY='xeptra.console.v1';
// $, $$, esc, clone, readJSON, writeJSON — core/ui/util.js; diff, revert, applyUndo — core/ui/undo.js.

const problems=s=>MD.validate(s);

/* Загрузка: своя база любой прежней схемы доходит до текущей; не прочиталась — исходная
   запись не трогается, панель открывается только для выгрузки этой записи (loadError). */
let state,loadError='',persistedRaw=null;
{let raw=null;try{raw=localStorage.getItem(KEY)}catch(e){}persistedRaw=raw;
 try{state=raw?MD.migrate(JSON.parse(raw)):MD.demo();const err=problems(state);if(err.length)throw Error(err[0])}
 catch(e){state=MD.empty();loadError='Не удалось прочитать сохранённую базу. Исходная запись не изменена. '+e.message}}

/* Рабочее место человека — не данные клуба (Я-5): тема и свои реплики. */
let prefs=Object.assign({theme:null,voice:'calm',custom:{}},readJSON(PREFS_KEY)||{});
if(!prefs.custom||typeof prefs.custom!=='object')prefs.custom={};
function savePrefs(){writeJSON(PREFS_KEY,prefs)}

// Набор интерфейса ядра знает про пример и репетицию клиента; у панели их нет.
let example=null,rehearsal=false;
const view=()=>state;
function learnSoon(){}

/* ui — всё, что знает интерфейс. В данные ничего из этого не попадает. */
let ui={
 route:'month',                 // раздел: month · trainers · people · signals
 month:MD.monthOf(MD.today()),  // выбранный месяц
 pv:'risk',                     // «Люди»: какая группа раскрыта
 only:false,                    // «Сигналы»: только без ответа
 q:'',                          // «Люди»: поиск по имени
 keep:new Set(),unsaved:false,
};
function onRoute(){ui.keep.clear();ui.q=''}

/* ——— шлюз записи ———
   Проверка домена, счётчик версии (чужая вкладка не затирается), запись. */
const revOf=()=>{try{return Number(localStorage.getItem(REV)||0)}catch(e){return 0}};let rev=revOf();
function saveRaw(next){const raw=JSON.stringify(next);
 try{localStorage.setItem(KEY,raw)}catch(e){
  if(e&&(e.name==='QuotaExceededError'||e.name==='NS_ERROR_DOM_QUOTA_REACHED'||e.code===22||e.code===1014))
   return 'В браузере кончилось место для записей. Изменение не сохранено, прежняя база цела. Выгрузите копию базы, а потом освободите место в браузере.';
  return 'Браузер не дал сохранить базу: '+(e&&e.message||'неизвестная причина')+'. Изменение не записано, прежняя база цела.'}
 persistedRaw=raw;return null}
function store(next,{checked=false}={}){
 if(!checked){const err=problems(next);if(err.length)return err}
 if(revOf()>rev){adoptStored();return ['База изменилась в другой вкладке — взяли её версию']}
 const fail=saveRaw(next);if(fail){ui.unsaved=true;return [fail]}
 state=next;rev=revOf()+1;writeJSON(REV,rev);ui.unsaved=false;return null}
function adoptStored(){let raw=null;try{raw=localStorage.getItem(KEY)}catch(e){}
 try{const s=MD.migrate(JSON.parse(raw));if(problems(s).length)return false;state=s;persistedRaw=raw;rev=revOf();ui.keep.clear();return true}catch(e){return false}}

/* ——— отмена по действию ———
   Сущности со своим ключом — месяцы (ключ — сам месяц) и пакеты тренеров: «Отменить»
   возвращает ровно тот месяц, который правило действие, а поздние правки других месяцев
   остаются. Норма, профиль и принятая копия клуба — слои, они откатываются целиком. */
const LISTS=['coaches','months'],OBJS=['profile','norms','club'];
const undos=new Map();let undoSeq=0;

/* commit: копия → операция домена → проверка → запись. Операция, которая отказала
   (бросила ошибку или вернула false/null), ничего не пишет и объясняет почему. */
function commit(fn,{quiet=false,toast:msg=null,fail='Не записано: так нельзя по правилам панели'}={}){
 if(loadError){toast('База не прочиталась — сначала выгрузите исходную запись в Настройках');return false}
 const draft=clone(state);let r;
 try{r=fn(draft)}catch(e){toast(e.message);return false}
 if(r===false||r===null){toast(fail);return false}
 const err=problems(draft);if(err.length){toast(err[0]);return false}
 const patch=diff(state,draft),err2=store(draft,{checked:true});
 if(err2){toast(err2[0]);render();return false}
 // toast может быть функцией от того, что вернула операция: приём словами рассказывает, что пришло
 if(msg!==false){const id='u'+(++undoSeq);undos.set(id,patch);if(undos.size>20)undos.delete(undos.keys().next().value);
  toast(typeof msg==='function'?msg(r):(msg||say('saved')),{undo:id})}
 if(!quiet)render();
 return r===undefined?true:r}
function op(fn,opts){let out=null;commit(s=>(out=fn(s)),opts);return out}
function undo(id){const p=undos.get(id);if(!p)return;undos.delete(id);
 const n=p.base?p.base:applyUndo(state,p);
 if(problems(n).length){toast('Отменить уже нельзя');return}
 const err=store(n,{checked:true});if(err){toast(err[0]);return}
 loadError='';render();toast(say('undone'))}
/* Замена базы целиком (пример, пустая, загрузка файлом) — одно действие над всей базой. */
function replaceBase(next,message){const err=problems(next);if(err.length){toast(err[0]);return false}
 const prev=loadError?null:state;const fail=saveRaw(next);if(fail){toast(fail);return false}
 state=next;rev=revOf()+1;writeJSON(REV,rev);loadError='';ui.unsaved=false;
 const id='u'+(++undoSeq);if(prev)undos.set(id,{base:prev});
 location.hash='#/month';render();toast(message,prev?{undo:id}:{});return true}

// ——— место в браузере ———
let STORAGE_LIMIT=5*1024*1024;
function storageUsed(){let n=0;try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);n+=(k.length+(localStorage.getItem(k)||'').length)*2}}catch(e){}return n}
const storageShare=()=>Math.min(1,storageUsed()/(STORAGE_LIMIT>0?STORAGE_LIMIT:5*1024*1024));
const mb=n=>(n/1048576).toFixed(1).replace('.',',')+' МБ';

// ——— слова и числа ———
const monthLabel=m=>MD.mLabel(m);
const hours=min=>(Math.round(min/60*10)/10).toLocaleString('ru-RU');
const pctText=v=>v===null||v===undefined?'—':v+' %';
const shareText=v=>v===null?'—':v+' %';
const person=id=>MD.clients(state).find(c=>c.person===id)?.name||'Человек';
// Месяц — период роли: закрытый заморожен законом ядра, экран это только показывает.
const closed=(m=ui.month)=>MD.closedMonth(state,m);
const monthRow=(m=ui.month)=>MD.monthRow(state,m);
const hasClub=()=>!!MD.club(state);

/* ——— Ядро · голос ———
   Одни и те же смыслы — разными тонами. Источник: голос администратора
   («Спокойная» / «После смены» и свой теневой язык).

   Закон голоса:
   1. Словарь роли: ключ → [тон 0, тон 1, …]. Реплика — строка или функция от чисел.
   2. Тон 0 — рабочий язык по умолчанию. У роли может быть один тон — тогда голос не выбирается.
   3. Свои реплики человек пишет только для не первого тона; {n} — место для числа;
      пустая своя реплика = исходная.
   4. Безопасные зоны — названия разделов, статусы, проверки форм и всё, где можно потерять
      данные, — в словарь голоса не попадают вовсе: они обязаны звучать одинаково в любом тоне.
      Если роль всё же кладёт такой ключ в словарь, она перечисляет его в safe, и ядро
      проверяет, что во всех тонах он одинаков (V.check) и что своей реплики у него нет.
   Настройки голоса (тон, свои реплики) — это рабочее место человека, а не данные (Я-5). */

const V=(()=>{
 const fill=(t,n)=>String(t).replace(/\{n\}/g,n===undefined?'':n);
 function make({dict,tones=['calm'],safe=[],get=()=>({})}){
  const idx=()=>{const t=get().voice;const i=tones.indexOf(t);return i<0?0:i};
  function say(key,...args){const row=dict[key];if(!row)return '';const i=idx();
   if(i>0&&!safe.includes(key)){const own=(get().custom||{})[key];if(typeof own==='string'&&own.trim())return fill(own,args[0])}
   const v=row[Math.min(i,row.length-1)];return typeof v==='function'?v(...args):v}
  // Исходная реплика тона i как текст с {n} на месте числа — для конструктора.
  function text(key,i=1){const v=dict[key]&&dict[key][i];if(v===undefined)return '';return typeof v==='function'?String(v('{n}')):v}
  return {say,text,tones,dict,safe}}
 // Ошибки словаря человеческими словами: безопасный ключ звучит по-разному в разных тонах.
 function check({dict,safe=[]}){const e=[];
  for(const k of safe){const row=dict[k]||[];const s=row.map(v=>typeof v==='function'?String(v(1)):v);if(new Set(s).size>1)e.push(`Безопасная реплика «${k}» звучит по-разному`)}
  return e}
 return {make,check};
})();
if(typeof module!=='undefined')module.exports={V};

/* ——— Набор элементов ———
   Свои выпадающие (календарь, время), поля формы и шторка.
   Ни одного знания о предметной области: только форма и поведение.
   Перенесено из первой версии: точечное обновление экрана, выпадающие с законом
   раскрытия, шторка. Поля — с подписью над полем и заливкой (VISUAL §5.2). */

/* ——— Точечное обновление экрана ———
   Экран по-прежнему функция от состояния (правило 2), но новая разметка не
   заменяет старую целиком, а накладывается на неё: совпавшие узлы остаются
   теми же самыми, меняются только атрибуты и текст. Поэтому стекло не
   пересоздаётся (размытие не «моргает»), фокус и прокрутка списков остаются
   на месте, а нажатие ничего не дёргает. */
function morph(root,html){const tpl=document.createElement('template');tpl.innerHTML=html;patchChildren(root,tpl.content)}
function sameNode(a,b){return a.nodeType===b.nodeType&&(a.nodeType!==1||(a.tagName===b.tagName&&(a.getAttribute('data-key')||'')===(b.getAttribute('data-key')||'')))}
function patchChildren(a,b){
 const an=[...a.childNodes],bn=[...b.childNodes];
 bn.forEach((y,i)=>{const x=an[i];if(!x)a.appendChild(y);else if(!sameNode(x,y))a.replaceChild(y,x);else patchNode(x,y)});
 for(let i=bn.length;i<an.length;i++)an[i].remove();
}
function patchNode(x,y){
 if(x.nodeType!==1){if(x.nodeValue!==y.nodeValue)x.nodeValue=y.nodeValue;return}
 for(const {name} of [...x.attributes])if(!y.hasAttribute(name))x.removeAttribute(name);
 for(const {name,value} of [...y.attributes])if(x.getAttribute(name)!==value)x.setAttribute(name,value);
 // Поле, в котором человек сейчас печатает, не трогаем.
 if(x.tagName==='INPUT'){if(x!==document.activeElement&&x.value!==(y.getAttribute('value')??''))x.value=y.getAttribute('value')??'';return}
 if(x.tagName==='TEXTAREA'){if(x!==document.activeElement&&x.value!==y.value)x.value=y.value;return}
 patchChildren(x,y);
}
