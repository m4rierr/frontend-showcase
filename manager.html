let popEl=null,popOwner=null;

// Раскрыто или нет — знает только aria-expanded на кнопке-источнике.
function closePop(){if(!popEl)return;popOwner?.setAttribute('aria-expanded','false');popEl.remove();popEl=null;popOwner=null;
 document.removeEventListener('keydown',popKey,true);document.removeEventListener('scroll',popScroll,true);removeEventListener('resize',popFollow)}
function popKey(e){if(e.key==='Escape'){e.preventDefault();e.stopPropagation();closePop()}}
/* Прокрутка или смена размера экрана (на телефоне — это клавиатура уехала вниз)
   не закрывают выпадающее: оно следует за полем. Закрываем, только если само
   поле ушло за край экрана. */
function popFollow(){if(!popEl||!popOwner)return;const r=popOwner.getBoundingClientRect();
 if(r.bottom<0||r.top>innerHeight||!popOwner.isConnected){closePop();return}placePop(popOwner)}
function popScroll(e){if(popEl&&!popEl.contains(e.target))popFollow()}
function openPop(owner,html,cls){
 closePop();popOwner=owner;owner.setAttribute('aria-expanded','true');
 popEl=document.createElement('div');popEl.className='pop '+cls;popEl.innerHTML=html;
 (owner.closest('dialog')||document.body).appendChild(popEl);placePop(owner);
 const on=popEl.querySelector('.is-on');
 if(on&&popEl.scrollHeight>popEl.clientHeight)popEl.scrollTop=Math.max(0,on.offsetTop-popEl.clientHeight/2+on.offsetHeight/2);
 document.addEventListener('keydown',popKey,true);document.addEventListener('scroll',popScroll,true);addEventListener('resize',popFollow);
 learnSoon();
}
/* Куда раскрывается: по левому краю поля; не помещается справа — по правому;
   вниз, а если внизу тесно — туда, где просторнее. Список получает высоту
   по месту и прокручивается внутри; календарь не сжимается. Начало отсчёта
   меряем, а не угадываем: у шторки есть трансформ, и fixed считается от неё. */
const POP_GAP=6,POP_EDGE=8,POP_MIN=140;
function placePop(anchor){
 const a=anchor.getBoundingClientRect();
 popEl.style.maxHeight='';popEl.style.left='0px';popEl.style.top='0px';
 const base=popEl.getBoundingClientRect(),ox=base.left,oy=base.top;
 const w=Math.min(Math.max(base.width,a.width),innerWidth-POP_EDGE*2);popEl.style.minWidth=Math.min(a.width,w)+'px';
 const below=innerHeight-a.bottom-POP_GAP-POP_EDGE,above=a.top-POP_GAP-POP_EDGE;
 const scrolls=getComputedStyle(popEl).overflowY!=='visible',down=base.height<=below||below>=above;
 let h=base.height;if(scrolls){h=Math.max(POP_MIN,Math.min(h,down?below:above));popEl.style.maxHeight=h+'px'}
 let left=a.left;if(left+w>innerWidth-POP_EDGE)left=a.right-w;
 left=Math.min(Math.max(POP_EDGE,left),Math.max(POP_EDGE,innerWidth-w-POP_EDGE));
 let top=down?a.bottom+POP_GAP:a.top-POP_GAP-h;top=Math.min(Math.max(POP_EDGE,top),Math.max(POP_EDGE,innerHeight-h-POP_EDGE));
 popEl.style.left=(left-ox)+'px';popEl.style.top=(top-oy)+'px';popEl.dataset.side=down?'down':'up';
}
function calHtml(month,selected,allowEmpty){
 const [y,m]=month.split('-').map(Number),first=new Date(y,m-1,1),lead=(first.getDay()||7)-1,days=new Date(y,m,0).getDate();
 const iso=d=>`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
 const prev=m===1?`${y-1}-12`:`${y}-${String(m-1).padStart(2,'0')}`,next=m===12?`${y+1}-01`:`${y}-${String(m+1).padStart(2,'0')}`;
 let cells='';for(let i=0;i<lead;i++)cells+='<span></span>';
 for(let d=1;d<=days;d++){const v=iso(d);cells+=`<button type="button" class="calday${v===selected?' is-on':''}${v===D.today()?' is-today':''}" data-action="cal-set" data-id="${v}">${d}</button>`}
 return `<div class="calhead">${B(I('back',18),'cal-nav',prev,'icon small ghost','aria-label="Прошлый месяц"')}<b>${MONTHS[m-1]} ${y}</b>${B(I('chev',18),'cal-nav',next,'icon small ghost','aria-label="Следующий месяц"')}</div>
 <div class="calwd">${D.WD.map(w=>`<span>${w}</span>`).join('')}</div><div class="calgrid">${cells}</div>
 <div class="calfoot">${B('Сегодня','cal-set',D.today(),'small')}${allowEmpty?B('Без даты','cal-set','none','small ghost'):''}</div>`;
}
function timeHtml(selected){let out='';for(let t=5*60;t<24*60;t+=15){const v=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');out+=`<button type="button" class="popitem${v===selected?' is-on':''}" data-action="time-set" data-id="${v}">${v}</button>`}return out}

// ——— поля формы ———
function field(label,name,value='',{type='text',ph='',extra=''}={}){return `<label class="field"><span class="label">${label}</span><input name="${name}" type="${type}" value="${esc(value)}" placeholder="${esc(ph)}" ${extra}></label>`}
function area(label,name,value='',ph=''){return `<label class="field"><span class="label">${label}</span><textarea name="${name}" placeholder="${esc(ph)}">${esc(value)}</textarea></label>`}
// Дата и время: скрытое поле держит значение, видимая кнопка — подпись.
function dateField(label,name,value,{allowEmpty=false}={}){return `<div class="field"><span class="label">${label}</span><div class="pick"><input type="hidden" name="${name}" value="${esc(value||'')}"><button type="button" class="pickbtn" data-action="cal" data-empty="${allowEmpty?1:0}" aria-haspopup="dialog" aria-expanded="false">${I('cal',18)}<span>${value?D.fmtDay(value):'Без даты'}</span></button></div></div>`}
function timeField(label,name,value){return `<div class="field"><span class="label">${label}</span><div class="pick"><input type="hidden" name="${name}" value="${esc(value)}"><button type="button" class="pickbtn" data-action="time" aria-haspopup="listbox" aria-expanded="false">${I('clock',18)}<span class="num">${esc(value)}</span></button></div></div>`}
// Сегмент в форме: значение лежит в скрытом поле, кнопки его переключают.
function segField(label,name,items,value,cls=''){return `<div class="field"><span class="label">${label}</span><input type="hidden" name="${name}" value="${esc(value)}"><div class="seg ${cls}" role="radiogroup">${Object.entries(items).map(([k,v])=>`<button type="button" role="radio" aria-checked="${k===value}" class="${k===value?'is-on':''}" data-action="seg" data-id="${esc(k)}">${esc(v)}</button>`).join('')}</div></div>`}
function daysField(label,name,days){return `<div class="field"><span class="label">${label}</span><input type="hidden" name="${name}" value="${days.join(',')}"><div class="chips days">${D.WD.map((w,i)=>`<button type="button" class="chip${days.includes(i)?' is-on':''}" aria-pressed="${days.includes(i)}" data-action="day-toggle" data-id="${i}">${w}</button>`).join('')}</div></div>`}
function formData(form){const o={};for(const el of form.elements)if(el.name)o[el.name]=typeof el.value==='string'?el.value.trim():el.value;return o}

// ——— шторка ———
// На телефоне — снизу во всю ширину, на компьютере — окно по центру.
// Сохранение отдаёт форму функции save; вернула false — шторка остаётся открытой.
/* Две породы шторок (ARCH-AUDIT К11):
   просмотр (view) — функция от состояния, как экран: render накладывает её тело через morph;
   форма (save) — черновик до «Сохранить»: рисуется один раз, введённое не перезаписывается. */
let sheetSave=null,sheetAfter=null,sheetView=null;
function openSheet({title,body,save=null,saveLabel='Сохранить',extra='',wide=false,cancel=true,view=null}){if(view)body=view();
 // Пример только для просмотра: форму, которую нельзя сохранить, не открываем вовсе.
 if(example&&!rehearsal&&save){toast('Это пример — он только для просмотра',{action:{label:'Начать свой',act:'example-exit'}});return}
 closePop();const dlg=$('#sheet');sheetSave=save;sheetView=view;
 // В зале шторка тоже тёмная — без вспышки светлого.
 dlg.className='sheet'+(wide?' sheet--wide':'')+(ui.route==='gym'?' gym':'');
 dlg.innerHTML=`<form class="sheetform" method="dialog" novalidate>
  <header class="sheethead"><i class="grab" aria-hidden="true"></i><h2>${title}</h2>${B(I('close',20),'sheet-close','','icon ghost','aria-label="Закрыть"')}</header>
  <div class="sheetbody">${body}</div>
  ${save||extra?`<footer class="sheetfoot">${extra}<span class="spacer"></span>${cancel?B('Отмена','sheet-close','','ghost'):''}${save?`<button type="submit" class="primary">${saveLabel}</button>`:''}</footer>`:''}
 </form>`;
 if(!dlg.open)dlg.showModal();
 const first=dlg.querySelector('.sheetbody input:not([type=hidden]),.sheetbody textarea');
 // Шторка-просмотр (настройки и т.п.) открывается сверху: фокус на поле ввода утащил бы её вниз.
 if(first&&save&&matchMedia('(hover:hover)').matches)first.focus();else dlg.querySelector('.sheethead button')?.focus({preventScroll:true});
 learnSoon();setTimeout(learnSoon,380); // и ещё раз, когда шторка доехала: во время въезда она сдвинута
}
// Шторка-просмотр следует за данными; пустой просмотр (null) — шторка закрывается сама.
function sheetRender(){const dlg=$('#sheet');if(!dlg.open||!sheetView)return;const html=sheetView();if(html===null){closeSheet();return}const b=dlg.querySelector('.sheetbody');if(b)morph(b,html)}
function closeSheet(){closePop();const dlg=$('#sheet');sheetView=null;if(!dlg.open)return;dlg.classList.add('is-closing');
 setTimeout(()=>{dlg.classList.remove('is-closing');dlg.close();dlg.innerHTML='';sheetSave=null;learnSoon();if(sheetAfter){const f=sheetAfter;sheetAfter=null;f()}},200)}
function confirmSheet(title,text,label,run){
 openSheet({title,body:`<p class="confirm">${text}</p>`,save:()=>{run();return true},saveLabel:label});
 $('#sheet button[type=submit]')?.classList.add('danger');
}
// Поля, которые нужны только при определённом выборе: data-show="имя=значение".
function syncShow(){$$('#sheet [data-show]').forEach(el=>{const [n,v]=el.dataset.show.split('=');el.hidden=$(`#sheet [name="${n}"]`)?.value!==v})}
// Число с кнопками «−/+» (в формах и в «В зале»): data-step — шаг, data-min — нижняя граница.
function stepField(label,name,value,step,{unit='',min=0,big=false}={}){
 return `<div class="field stepfield${big?' big':''}"><span class="label">${label}</span><div class="stepper">${B(I('minus',big?26:20),'step',name,'icon lone',`data-d="${-step}" data-min="${min}" aria-label="Минус ${step}"`)}
  <label class="stepval"><input name="${name}" inputmode="decimal" value="${esc(numText(value))}" aria-label="${esc(label)}">${unit?`<span>${esc(unit)}</span>`:''}</label>
  ${B(I('plus',big?26:20),'step',name,'icon lone',`data-d="${step}" data-min="${min}" aria-label="Плюс ${step}"`)}</div></div>`}


/* ——— Раздел «Месяц» — главный экран роли ———
   Один вопрос управляющего: где дыра в загрузке и удержании. Поэтому наверху — сигналы
   (причина и порог у каждого), под ними — четыре числа месяца, цель, тренеры и закрытие.
   Ни одного факта о людях и занятиях здесь не вводится: всё это считается (М-1). */

function monthScene(){
 const m=ui.month,t=asOf(m);
 if(!hasClub())return `<div class="scene">${sceneHead('Месяц',monthLabel(m),'Где дыра в загрузке и удержании?')}
  ${empty('storage',say('noClub'),say('noClubSub'),`<div class="btnrow">${B('Взять из этого браузера','club-take','','primary')}${B('Принять файл','club-open','','ghost')}</div>`)}</div>`;
 const r=MD.monthReview(state,m,t),open=r.signals.filter(g=>!g.answer);
 const norm=r.trainers.filter(x=>x.state==='norm').length;
 const goal=r.goal;
 return `<div class="scene">
 ${sceneHead('Месяц',monthLabel(m),closed(m)?'Месяц закрыт — он уже не меняется':'Где дыра в загрузке и удержании?',monthNav())}
 ${learnCard()}
 ${signalsPanel(open,m)}
 ${routePanel(m,t)}
 ${tiles([
  ['Загрузка',`${norm} из ${r.trainers.length}`,'в норме ± '+MD.th(state,'band')+' %',norm===r.trainers.length?'':'warn'],
  ['Заполняемость',pctText(r.fill.rate),`норма ${r.norm.fill} %`+(goal&&goal.fill!==null?` · цель ${goal.fill} %`:''),r.fill.rate!==null&&r.fill.rate<r.norm.fill?'warn':''],
  ['Удержание',pctText(r.people.retention),r.people.base?`${r.people.returned} из ${r.people.base} вернулись`:'не с чем сравнивать',
   goal&&goal.retention!==null&&r.people.retention!==null&&r.people.retention<goal.retention?'warn':''],
  ['Риск ухода',String(r.people.risk),`пауза ${MD.th(state,'gap')}+ ${MD.plural(MD.th(state,'gap'),'день','дня','дней')}`,r.people.risk?'warn':''],
 ])}
 ${goalPanel(goal,m)}
 ${loadPanel(r,m)}
 ${peoplePanel(r,m)}
 ${closePanel(m,t)}
 </div>`}

/* Сигналы наверху: у каждого — причина и порог (М-3). Ответ — в одно касание. */
function signalsPanel(open,m){
 if(!open.length)return panel('Сигналы',`<p class="lead">${esc(say('noSignals'))}</p>`,{tag:'0',key:'sig'});
 const show=open.slice(0,4);
 return panel('Сигналы',`<div class="rows">${show.map(signalRow).join('')}</div>`,
  {tag:String(open.length),key:'sig',act:open.length>show.length?B(`Все ${open.length}`,'go','signals','small ghost'):''})}

// short — строка внутри панели своего вида: вид уже написан в её заголовке.
function signalRow(g,short=false){const frozenNow=closed(ui.month);
 return `<div class="row mrow" data-key="sg${esc(g.key)}"><span class="qico">${I(SIG_ICON[g.kind]||'flag',18)}</span>
 <div class="rbody"><span class="rt">${esc(g.title)}</span><span class="rm">${short?'':esc(MD.KIND[g.kind]||'')+' · '}${esc(g.why)}</span></div>
 ${g.was?mark('срок вышел','is-warn'):''}
 ${g.answer?mark(MD.REPLY[g.answer.kind]+(g.answer.until?' · до '+MD.fmtShort(g.answer.until):''),'is-ok'):frozenNow?mark('без ответа','is-off'):B(g.was?'Ответить снова':'Ответить','reply',g.key,'small primary')}</div>`}
const SIG_ICON={load:'progress',gone:'user',nocoach:'coach',week:'cal',shift:'tasks',month:'flag'};

/* Ход месяца — маршрут роли: то, без чего месяц не закрывается, видно весь месяц,
   а не только в последний день. Считается, а не хранится: разойтись с закрытием не может. */
const ROUTE_TONE={done:'is-ok',open:'',wait:'is-off',none:'is-off'};
const ROUTE_WORD={done:'Сделано',open:'Ждёт',wait:'Позже',none:'Нечего'};
function routePanel(m,t){const list=MD.route(state,m,t),left=list.filter(x=>x.state==='open').length;
 return panel('Ход месяца',`<div class="rows">${list.map(x=>
  `<button type="button" class="row plain mrow" data-action="route" data-id="${esc(x.go)}" data-key="rt${x.key}"${x.state==='wait'||x.state==='none'?' disabled':''}>
   <span class="rtmark ${ROUTE_TONE[x.state]}">${x.state==='done'?I('check',14):''}</span>
   <div class="rbody"><span class="rt">${esc(x.title)}</span><span class="rm">${esc(x.count?x.count+' · '+x.what:x.what)}</span></div>
   ${mark(ROUTE_WORD[x.state],ROUTE_TONE[x.state])}${x.state==='wait'||x.state==='none'?'':chev()}</button>`).join('')}</div>`,
  {tag:left?`осталось: ${left}`:'всё сделано',key:'route'})}

/* Цель месяца — свой факт управляющего: её ставят заранее и сверяют в конце. */
function goalPanel(goal,m){
 const body=goal?`<div class="rows compact">
  <div class="row plain"><div class="rbody"><span class="rt">Заполняемость</span><span class="rm">${goal.fill===null?'без цели':goal.fill+' %'}</span></div></div>
  <div class="row plain"><div class="rbody"><span class="rt">Удержание</span><span class="rm">${goal.retention===null?'без цели':goal.retention+' %'}</span></div></div>
  ${goal.note?`<p class="meta">${esc(goal.note)}</p>`:''}</div>`
 :`<p class="lead">Цель месяца не поставлена. Без неё числа не с чем сравнить.</p>`;
 return panel('Цель месяца',body,{key:'goal',act:closed(m)?'':B(goal?'Изменить':'Поставить','goal','','small ghost')})}

/* Загрузка тренеров: минуты месяца к норме клуба. Минуты — чужой факт (администратора),
   норма — свой (управляющего). */
function loadPanel(r,m){
 if(!r.trainers.length)return panel('Тренеры',empty('coach',say('noTrainers'),say('noTrainersSub')),{key:'load'});
 return panel('Тренеры',`<div class="rows">${r.trainers.map(x=>{const v=r.verdicts[x.id];
  return `<button type="button" class="row plain mrow" data-action="trainer" data-id="${esc(x.id)}" data-key="tr${esc(x.id)}">
  <div class="rbody"><span class="rt">${esc(x.name)}</span><span class="rm">${hours(x.minutes)} ч из ${hours(x.norm)} · занятий ${x.groups+x.personal}${x.fill===null?'':' · заполняемость '+x.fill+' %'}</span></div>
  ${bar(x.share,x.state)}${v?mark(MD.VERDICT[v.verdict],v.verdict==='norm'?'is-ok':'is-warn'):mark(LOAD_WORD[x.state],LOAD_TONE[x.state])}${chev()}</button>`}).join('')}</div>`,
  {tag:`норма ${hours(r.norm.minutes)} ч`,key:'load',act:B('Все','go','trainers','small ghost')})}

/* Удержание — числами: строк дневника и заметок тренера тут нет и быть не может (М-6). */
function peoplePanel(r,m){
 const p=r.people;
 return panel('Люди',`<div class="rows compact">
  <div class="row plain"><div class="rbody"><span class="rt">Ходили в этом месяце</span><span class="rm">из ${p.total} в базе клуба</span></div><b class="num">${p.active}</b></div>
  <div class="row plain"><div class="rbody"><span class="rt">Новички до привычки</span><span class="rm">первые ${MD.th(state,'newDays')} дней и ${MD.th(state,'newMin')}+ визита в первый месяц</span></div><b class="num">${p.freshOk} из ${p.fresh}</b></div>
  <div class="row plain"><div class="rbody"><span class="rt">В риске ухода</span><span class="rm">пауза ${MD.th(state,'gap')}+ ${MD.plural(MD.th(state,'gap'),'день','дня','дней')}</span></div><b class="num">${p.risk}</b></div>
  <div class="row plain"><div class="rbody"><span class="rt">Без тренера</span><span class="rm">клиент клуба без закрепления</span></div><b class="num">${p.noCoach}</b></div>
 </div>`,{key:'ppl',act:B('Подробно','go','people','small ghost')})}

/* Закрытие месяца (М-4): ответ по каждому тренеру и каждому сигналу, только с последнего
   дня месяца. Закрытый месяц заморожен законом ядра, а его сводка — то, что ушло наверх. */
function closePanel(m,t){
 const row=monthRow(m);
 if(closed(m)){const late=MD.afterClose(state,m);
  return panel('Месяц закрыт',`<p class="meta">Закрыт ${esc(MD.fmtDate(MD.dateOf(row.closedAt)))}${row.by?' · '+esc(row.by):''}. Сводка ушла наверх в этом виде.</p>
  <pre class="review">${esc(row.report)}</pre>
  ${late.length?`<div class="rows compact" data-key="late"><p class="blocktitle warn">После закрытия пришли числа</p>${late.map(x=>
    `<div class="row plain"><div class="rbody"><span class="rm">${esc(x)}</span></div></div>`).join('')}
   <p class="sfoot">Сводка не пересчитывается: она — то, что ушло наверх. Разница показана рядом.${infoBtn('Числа после закрытия меняются, когда приходят поздние факты: новый пакет смены от администратора или пакет тренера за тот же месяц. Закрытый месяц их не принимает в свою сводку — он показывает разницу.')}</p></div>`:''}
  <div class="btnrow">${B(I('download',16)+'Выгрузить итог','month-export','','small ghost')}</div>`,{key:'close'})}
 const st=MD.closeState(state,m,t);
 return panel('Закрытие месяца',`${st.ok?`<pre class="review">${esc(MD.reviewText(state,m,t))}</pre>`:''}
  <div class="dfoot"><span class="meta grow">${st.ok
    ?`Ответы даны${infoBtn('После закрытия месяц не меняется, а его сводка уходит наверх в том виде, в каком она сейчас. Поздние числа не перепишут её — они будут показаны разницей рядом.')}`
    :esc(st.why)}</span>
   ${B(I('download',16)+'Выгрузить итог','month-export','','ghost')}${B('Закрыть месяц','month-close',m,'primary'+(st.ok?'':' is-off'))}</div>`,{key:'close'})}

/* ——— Раздел «Тренеры» ———
   Загрузка месяца по каждому тренеру и разбор: норма / нужен разговор / нужна помощь.
   Минуты, занятия и заполняемость — чужие факты (администратора), сюда они только читаются;
   разбор — свой факт управляющего, он и уходит в итог месяца. */

function trainersScene(){
 const m=ui.month,t=asOf(m);
 if(!hasClub())return `<div class="scene">${sceneHead('Тренеры',monthLabel(m))}
  ${empty('storage',say('noClub'),say('noClubSub'),`<div class="btnrow">${B('Взять из этого браузера','club-take','','primary')}</div>`)}</div>`;
 const rows=MD.load(state,m,t),crew=rows.filter(x=>x.active&&x.minutes>0),idle=rows.filter(x=>!crew.includes(x));
 const norm=MD.normOn(state,MD.mStart(m)),row=monthRow(m);
 const left=crew.filter(x=>!row?.reviews?.[x.id]).length;
 return `<div class="scene">
 ${sceneHead('Тренеры',monthLabel(m),`Норма месяца — ${hours(norm.minutes)} ч, отклонение ± ${MD.th(state,'band')} %`,monthNav())}
 ${crew.length?panel('Загрузка',`<div class="rows">${crew.map(x=>trainerRow(x,row)).join('')}</div>`,
   {tag:left?`без разбора: ${left}`:'разобраны все',key:'crew'})
  :panel('Загрузка',empty('coach',say('noTrainers'),say('noTrainersSub')),{key:'crew'})}
 ${idle.length?panel('Без занятий в этом месяце',`<div class="rows compact">${idle.map(x=>
   `<div class="row plain"><div class="rbody"><span class="rt">${esc(x.name)}</span><span class="rm">${x.active?'ни одного занятия':'в архиве'}</span></div></div>`).join('')}</div>`,
   {tag:String(idle.length),key:'idle'}):''}
 </div>`}

function trainerRow(x,row){const v=row?.reviews?.[x.id];
 return `<button type="button" class="row plain mrow" data-action="trainer" data-id="${esc(x.id)}" data-key="t${esc(x.id)}">
 <div class="rbody"><span class="rt">${esc(x.name)}</span>
  <span class="rm">${hours(x.minutes)} ч · ${x.share===null?'—':x.share+' % нормы'} · групповых ${x.groups} · персональных ${x.personal}${x.fill===null?'':' · заполняемость '+x.fill+' %'}</span></div>
 ${bar(x.share,x.state)}${v?mark(MD.VERDICT[v.verdict],v.verdict==='norm'?'is-ok':'is-warn'):mark(LOAD_WORD[x.state],LOAD_TONE[x.state])}${chev()}</button>`}

/* Карточка тренера: числа месяца, люди, которых он ведёт, и разбор.
   Личных заметок тренера о клиенте здесь нет — их менеджеру не показывают (М-6). */
function trainerSheet(id){
 const m=ui.month,t=asOf(m);
 openSheet({title:MD.trainerName(state,id),wide:true,view:()=>{
  const x=MD.load(state,m,t).find(y=>y.id===id);if(!x)return null;
  const row=monthRow(m),v=row?.reviews?.[id];
  const pp=MD.people(state,m,t),mine=pp.rows.filter(r=>r.trainerId===id);
  const risk=mine.filter(r=>r.last&&r.gap>=pp.gapTh);
  return `${tiles([
   ['Минуты',hours(x.minutes)+' ч',`норма ${hours(x.norm)} ч`,x.state==='norm'?'':'warn'],
   ['Доля нормы',x.share===null?'—':x.share+' %',LOAD_WORD[x.state]],
   ['Занятий',String(x.groups+x.personal),`групповых ${x.groups} · персональных ${x.personal}`],
   ['Заполняемость',pctText(x.fill),x.seats?`пришло ${x.visits} из ${x.seats}`:'групп не было'],
  ])}
  ${panel('Его люди',mine.length?`<div class="rows compact">${mine.map(r=>
    `<div class="row plain"><div class="rbody"><span class="rt">${esc(r.name)}</span><span class="rm">${r.visits?`посещений за месяц: ${r.visits}`:'в этом месяце не был'}${r.gap===null?'':' · последнее '+r.gap+' '+MD.plural(r.gap,'день','дня','дней')+' назад'}</span></div>
    ${r.last&&r.gap>=pp.gapTh?mark('риск','is-warn'):r.fresh?mark('новичок'):''}</div>`).join('')}</div>`
   :`<p class="lead">За этим тренером людей не закреплено.</p>`,{tag:String(mine.length),key:'his'})}
  ${panel('Разбор месяца',v?`<div class="rows compact"><div class="row plain"><div class="rbody">
    <span class="rt">${esc(MD.VERDICT[v.verdict])}</span><span class="rm">${esc(v.note||'без пояснения')} · ${esc(MD.fmtDate(v.on))}</span></div></div></div>`
   :`<p class="lead">Ответа по тренеру пока нет. Без него месяц не закрыть.</p>`,
   {key:'verdict',act:closed(m)?mark('месяц закрыт','is-off'):B(v?'Изменить':'Разобрать','review',id,'small primary')})}
  ${risk.length?`<p class="sfoot">В риске у него: ${risk.length}. Ответить по ним можно в «Сигналах».</p>`:''}`}})}

/* ——— Раздел «Люди» ———
   Удержание месяца: кто ходил, кто вернулся, кто новичок, кто в риске, кто без тренера.
   Всё это — чтения по номеру человека (core/people.js): менеджер не заводит людей и
   не отмечает посещения. Одно посещение в день, сколько бы ролей его ни отметили (М-2).
   Ни строки дневника, ни заметки тренера — только числа и решения (М-6). */

const PEOPLE_VIEWS=[['risk','В риске'],['fresh','Новички'],['back','Вернулись'],['nocoach','Без тренера'],['all','Все']];

function peopleScene(){
 const m=ui.month,t=asOf(m);
 if(!hasClub())return `<div class="scene">${sceneHead('Люди',monthLabel(m))}
  ${empty('storage',say('noClub'),say('noClubSub'),`<div class="btnrow">${B('Взять из этого браузера','club-take','','primary')}</div>`)}</div>`;
 const p=MD.people(state,m,t);
 if(!p.total)return `<div class="scene">${sceneHead('Люди',monthLabel(m),'',monthNav())}${empty('coach',say('noPeople'),say('noPeopleSub'))}</div>`;
 const q=P.norm(ui.q);
 const list=peopleList(p,ui.pv).filter(r=>!q||P.norm(r.name).includes(q));
 return `<div class="scene">
 ${sceneHead('Люди',monthLabel(m),'Кто ходит, кто вернулся и кто выпадает',monthNav())}
 ${tiles([
  ['Ходили',String(p.active),`из ${p.total} в базе`],
  ['Возврат',pctText(p.retention),p.base?`${p.returned} из ${p.base}, кто был в прошлом месяце`:'не с чем сравнивать'],
  ['Новички',`${p.freshOk} из ${p.fresh}`,`дошли до ${p.newMin} визитов в первый месяц`,p.fresh&&p.freshOk<p.fresh?'warn':''],
  ['В риске',String(p.risk.length),`пауза ${p.gapTh}+ ${MD.plural(p.gapTh,'день','дня','дней')}`,p.risk.length?'warn':''],
 ])}
 <div class="toolbar"><label class="searchbox fieldbox">${I('search',18)}<input id="psearch" type="search" placeholder="Поиск" value="${esc(ui.q)}" aria-label="Поиск по людям" autocomplete="off"></label>${seg('pv',PEOPLE_VIEWS.map(([k,v])=>[k,v]),ui.pv,'dseg','Группа людей')}</div>
 ${panel(PEOPLE_VIEWS.find(([k])=>k===ui.pv)[1],list.length?`<div class="rows">${list.map(r=>personRow(r,p)).join('')}</div>`
  :`<p class="lead">${esc(q?'Никого с таким именем в этой группе нет.':PEOPLE_EMPTY[ui.pv])}</p>`,{tag:String(list.length),key:'pl'+ui.pv})}
 <p class="sfoot">Посещение человека складывается из персональных занятий и отметок тренера «состоялось» — один день у человека считается один раз.${infoBtn('Групповые занятия администратор отмечает числом, а не людьми, поэтому в посещения человека они не входят. Чтобы входили, нужен новый факт администратора «кто пришёл» — вводить его заново управляющий не станет.')}</p>
 </div>`}

const PEOPLE_EMPTY={risk:'Никто не выпадает: пауз длиннее порога нет.',fresh:'Новичков в окне наблюдения нет.',
 back:'Возвращаться некому: в прошлом месяце никто не ходил.',nocoach:'Все клиенты закреплены за тренерами.',all:'Людей в базе клуба нет.'};

function peopleList(p,kind){
 if(kind==='risk')return p.risk;
 if(kind==='fresh')return p.rows.filter(r=>r.fresh).sort((a,b)=>b.firstMonth-a.firstMonth);
 if(kind==='back')return p.rows.filter(r=>r.wasPrev&&r.visits>0).sort((a,b)=>b.visits-a.visits);
 if(kind==='nocoach')return p.noCoach;
 return [...p.rows].sort((a,b)=>b.visits-a.visits||a.name.localeCompare(b.name))}

function personRow(r,p){
 const risky=r.last&&r.gap>=p.gapTh;
 const sub=[r.trainerId?MD.trainerName(state,r.trainerId):'без тренера',
  r.visits?`за месяц ${r.visits}`:'в этом месяце не был',
  r.last?`последнее ${MD.fmtShort(r.last)}`:'посещений не отмечено'].join(' · ');
 return `<div class="row mrow" data-key="p${esc(r.person)}"><span class="avatar">${esc(initials(r.name))}</span>
 <div class="rbody"><span class="rt">${esc(r.name)}</span><span class="rm">${esc(sub)}</span></div>
 ${r.fresh?mark(`новичок · ${r.firstMonth} из ${p.newMin}`,r.firstMonth>=p.newMin?'is-ok':''):''}
 ${risky?mark(`пауза ${r.gap} ${MD.plural(r.gap,'день','дня','дней')}`,'is-warn'):''}
 ${risky&&!closed(ui.month)?B('Ответить','reply','gone:'+r.person,'small ghost'):''}
 ${!r.trainerId&&!closed(ui.month)?B('Ответить','reply','nocoach:'+r.id,'small ghost'):''}</div>`}

/* ——— Раздел «Сигналы» ———
   Сигнал приходит раньше факта и всегда с причиной и порогом, по которому он сработал (М-3).
   У каждого сигнала есть ответ-факт в одно касание: сигнал закрывается ответом, а не исчезает.
   Ответы месяца — это и есть «что сделано по риску» в сводке наверх. */

function signalsScene(){
 const m=ui.month,t=asOf(m);
 if(!hasClub())return `<div class="scene">${sceneHead('Сигналы',monthLabel(m))}
  ${empty('storage',say('noClub'),say('noClubSub'),`<div class="btnrow">${B('Взять из этого браузера','club-take','','primary')}</div>`)}</div>`;
 const all=MD.signals(state,m,t),open=all.filter(g=>!g.answer);
 const list=ui.only?open:all;
 const groups=Object.keys(MD.KIND).map(k=>[k,list.filter(g=>g.kind===k)]).filter(([,v])=>v.length);
 return `<div class="scene">
 ${sceneHead('Сигналы',monthLabel(m),all.length?`${open.length} без ответа из ${all.length}`:'',monthNav())}
 <div class="toolbar">${seg('only',[['all','Все'],['open','Без ответа']],ui.only?'open':'all','dseg','Какие сигналы показать')}</div>
 ${groups.length?groups.map(([k,v])=>panel(MD.KIND[k],`<div class="rows">${v.map(g=>signalRow(g,true)).join('')}</div>`,{tag:String(v.length),key:'g'+k})).join('')
  :panel('Сигналы',`<p class="lead">${esc(ui.only&&all.length?'На все сигналы месяца есть ответ.':say('noSignals'))}</p>`,{key:'gnone'})}
 ${all.length?`<p class="sfoot">Пороги сигналов — настройка роли, а не вера: их видно и можно изменить в настройках.${infoBtn('Значения по умолчанию взяты из отраслевых ориентиров: пауза 14 дней, новичок — 90 дней и 4 визита в первый месяц, загрузка тренера — норма клуба ± 25 %.')}</p>`:''}
 </div>`}

/* Ответ на сигнал: вид ответа и одна строка пояснения. Ответ — факт с датой,
   он остаётся в месяце и уходит в сводку наверх. */
function replySheet(key){
 const m=ui.month,t=asOf(m);
 const g=MD.signals(state,m,t).find(x=>x.key===key);
 if(!g){toast('Такого сигнала уже нет');return}
 if(closed(m)){toast(`Месяц ${monthLabel(m)} закрыт — он уже не меняется`);return}
 const a=g.answer||g.was;
 openSheet({title:g.title,body:`
  <p class="lead">${esc(MD.KIND[g.kind])} · ${esc(g.why)}</p>
  ${g.was?`<p class="meta">Прошлый ответ: ${esc(MD.REPLY[g.was.kind].toLowerCase())}${g.was.note?', '+esc(g.was.note):''} · ждали до ${esc(MD.fmtShort(g.was.until))} — срок вышел.</p>`:''}
  ${segField('Что сделано','kind',MD.REPLY,a?.kind||'agreed','wrap')}
  ${area('Коротко','note',a?.note||'','Кому написали, о чём договорились, что проверить')}
  ${dateField('Ждём до','until',g.answer?.until||'',{allowEmpty:true})}
  <p class="caption">С датой сигнал молчит до неё и вернётся сам, если ничего не изменилось. Без даты — держит до конца месяца.</p>
  `,save:f=>{if(!commit(s=>MD.ops.reply(s,m,key,f.kind,f.note,f.until||null),{toast:'Ответ записан'}))return false;return true},
  saveLabel:'Ответить',
  extra:a?B('Убрать ответ','unreply',key,'small danger'):''})}

/* Разбор месяца по тренеру: норма / нужен разговор / нужна помощь — и одна строка почему. */
function reviewSheet(id){
 const m=ui.month;
 if(closed(m)){toast(`Месяц ${monthLabel(m)} закрыт — он уже не меняется`);return}
 const x=MD.load(state,m,asOf(m)).find(y=>y.id===id);if(!x){toast('Нет такого тренера');return}
 const v=monthRow(m)?.reviews?.[id];
 openSheet({title:'Разбор · '+x.name,body:`
  <p class="lead">${hours(x.minutes)} ч из ${hours(x.norm)} · ${x.share===null?'—':x.share+' % нормы'} · ${esc(LOAD_WORD[x.state].toLowerCase())}</p>
  ${segField('Ответ','verdict',MD.VERDICT,v?.verdict||(x.state==='norm'?'norm':'talk'),'wrap')}
  ${area('Коротко','note',v?.note||'','Что решили: оставить как есть, поговорить, чем помочь')}
  `,save:f=>commit(s=>MD.ops.review(s,m,id,f.verdict,f.note),{toast:'Разбор записан'}),saveLabel:'Записать'})}

/* ——— Обмен: откуда у управляющего чужие числа ———
   Менеджер не источник ни одного факта о людях и занятиях (М-1). Он принимает:
     · базу клуба — от администратора: файл смены или копия из этого же браузера;
     · базу тренера — от тренера: при приёме от неё остаются только числа (М-6);
   и отдаёт наверх одно — итог месяца.
   Приём всегда целиком и через домен: чужое проверяется правилами своей роли-источника. */

const PACK_KIND='club-handoff';

function importFile(f){
 if(!f)return;
 if(f.size>20*1024*1024){toast('Файл слишком большой');return}
 const r=new FileReader();
 r.onerror=()=>toast('Файл не прочитался');
 r.onload=()=>{let raw;try{raw=JSON.parse(String(r.result))}catch(e){toast('Это не файл данных: внутри не JSON');return}
  takeAny(raw)};
 r.readAsText(f)}

function takeAny(raw){
 if(!raw||typeof raw!=='object'){toast('Это не файл данных');return}
 // своя копия — заменяет базу целиком
 if(raw.version===MD.VERSION&&Array.isArray(raw.months)&&Array.isArray(raw.norms)){
  const next=MD.migrate(MD.clone(raw));replaceBase(next,'База управляющего заменена копией из файла');return}
 // пакет смены или база администратора: слияние, а не замена (core/exchange.js)
 if(raw.kind===PACK_KIND||typeof raw.schema==='number'){takeClub(raw,'из файла');return}
 // база тренера
 if(Array.isArray(raw.clients)&&Array.isArray(raw.weeks)){
  const name=op(s=>MD.ops.takeCoach(s,raw),{toast:'Пакет тренера принят'});
  if(name)toast(`Принято от тренера: ${name} — только числа`);return}
 toast('Не понимаю этот файл: он не от администратора, не от тренера и не копия этой панели')}

/* Копия базы клуба из этого же браузера: администратор и управляющий часто открыты рядом.
   Читаем чужой ключ и только читаем — писать в него менеджер не умеет. */
function takeClubHere(){
 let raw=null;try{raw=localStorage.getItem(CLUB_KEY)}catch(e){}
 if(!raw){toast('В этом браузере базы администратора нет — примите файл смены');return}
 let parsed;try{parsed=JSON.parse(raw)}catch(e){toast('База администратора не прочиталась');return}
 takeClub(parsed,'из этого браузера')}

/* Одно место, где принимается база клуба: слияние по правилам ядра, отчёт человеку словами.
   Запертое закрытым месяцем остаётся своим — это и есть «своих оставлено». */
function takeClub(raw,where){
 commit(s=>MD.ops.takeClub(s,raw),{toast:r=>r.first?`База клуба взята ${where}`
  :`Принято ${where}: новых ${r.added}, обновлено ${r.updated}`+(r.kept?`, своих оставлено ${r.kept}`:'')})}

/* Что принято и когда — одной панелью в настройках. */
function sourcesPart(){
 const c=MD.club(state),co=state.coaches||[];
 const clubLine=c?`тренеров ${c.trainers.length} · клиентов ${c.clients.length} · занятий в базе ${Object.keys(c.facts).length+c.sessions.length}`:'не принята';
 return sGroup(
  sItem('База клуба',clubLine,B(c?'Обновить':'Взять','club-take','','small '+(c?'ghost':'primary')),'storage')
  +sLink('Принять файл','club-open',{sub:'Файл смены администратора или база тренера',icon:'upload'})
  +co.map(x=>sLink(x.name,'coach-forget',{id:x.id,value:'убрать',sub:`тренер · недель ${x.weeks.length} · людей ${x.clients.length}`,icon:'coach',chev:false})).join(''),
  co.length?`Тренеров принято: ${co.length}`:'Пакетов тренеров пока нет',
  'От тренера в базу управляющего попадают только числа: посещения по номеру человека, ответы на сигналы и недели. Заметки о клиенте, план и дневник остаются у тренера.')}

/* Итог месяца наверх: тот же текст, что фиксируется при закрытии. */
function monthExport(){
 const m=ui.month,row=monthRow(m);
 const text=closed(m)?row.report:MD.reviewText(state,m,asOf(m));
 download(text,`Итог_месяца_${m}.txt`,'text/plain;charset=utf-8');
 toast('Итог месяца выгружен')}

/* История клуба: журнал передач приходит вместе с базой администратора и склеивается
   при каждом приёме (core/exchange.js). Своего журнала у управляющего нет — он читает чужой. */
function historySheet(){const log=[...(MD.club(state)?.log||[])].reverse();
 const kind={start:'Старт',export:'Передал',import:'Принял',reset:'Очистка',restore:'Восстановление',close:'Закрыл смену'};
 openSheet({title:'История клуба',body:log.length?`<p class="caption">Это журнал администратора: он приходит вместе с базой и склеивается при каждом приёме.</p>
  <div class="rows compact">${log.slice(0,200).map(e=>`<div class="row plain"><div class="rbody"><span class="rt">${esc(kind[e.kind]||e.kind)}${e.admin?' · '+esc(e.admin):''}</span>
   <span class="rm">${esc(new Date(e.at).toLocaleString('ru-RU',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}))}${e.note?' · '+esc(e.note):''}</span></div></div>`).join('')}</div>`
  :'<p class="confirm">Журнала в принятой базе нет.</p>'})}

function backup(){
 download(loadError&&persistedRaw!==null?persistedRaw:JSON.stringify(state,null,1),
  'Manager_backup_'+MD.today()+'.json','application/json');
 toast('Копия базы выгружена')}

/* Замена базы целиком: пример или пустая. Отменяется одним действием. */
function resetSheet(kind){
 const demo=kind==='demo';
 confirmSheet(demo?'Открыть пример':'Начать с чистого листа',
  demo?'Нынешняя база уйдёт, вместо неё встанет пример клуба. Это можно отменить сразу после.'
   :'Нынешняя база уйдёт: нормы, цели, разборы и ответы. Принятые базы клуба и тренеров тоже. Это можно отменить сразу после.',
  demo?'Открыть пример':'Очистить',
  ()=>replaceBase(demo?MD.demo():MD.empty(),demo?'Открыт пример клуба':'База очищена'))}

/* Цель месяца — свой факт: её ставят на месяц вперёд и сверяют в конце. */
function goalSheet(){
 const m=ui.month;
 if(closed(m)){toast(`Месяц ${monthLabel(m)} закрыт — он уже не меняется`);return}

 openSheet({title:'Цель на '+monthLabel(m),body:`
  <div class="fields two">
   ${field('Заполняемость, %','fill',g.fill===null?'':String(g.fill),{ph:'например, 75'})}
   ${field('Удержание, %','retention',g.retention===null?'':String(g.retention),{ph:'например, 85'})}
  </div>
  ${area('Коротко','note',g.note||'','Чего добиваемся в этом месяце')}
  <p class="caption">Пустое поле — без цели по этому числу.</p>`,
  save:f=>commit(s=>MD.ops.setGoal(s,m,{fill:f.fill,retention:f.retention,note:f.note}),{toast:'Цель записана'})})}

/* Норма клуба — версия с даты: прошлые месяцы считаются той нормой, что действовала тогда. */
function normSheet(){
 const n=MD.normOn(state,MD.today());
 openSheet({title:'Норма клуба',body:`
  <div class="fields two">
   ${field('Минут тренера в месяц','minutes',String(n.minutes),{ph:'2400'})}
   ${field('Заполняемость групп, %','fill',String(n.fill),{ph:'70'})}
  </div>
  ${dateField('Действует с','from',MD.today())}
  <p class="caption">Прошлое не переписывается: месяцы до этой даты считаются прежней нормой.</p>`,
  save:f=>commit(s=>MD.ops.setNorm(s,{minutes:f.minutes,fill:f.fill},f.from),{toast:'Норма записана'})})}

/* Пороги сигналов — настройка роли, а не вера (И-8). Своя шторка, как у тренера:
   шесть строк не мешают остальным настройкам, меняются на месте и сразу меняют сигналы.
   Закрыли — снова настройки. */
function thresholdSheet(){subSheet('Пороги сигналов',()=>
 sGroup(Object.entries(MD.TH_LABEL).map(([k,label])=>
   `<div class="srow throw" data-key="th${k}">${sText(label)}<div class="sctl">${B(I('minus',16),'th-step',k,'icon small ghost','data-d="-1" aria-label="Меньше"')}<b class="num">${MD.th(state,k)}</b>${B(I('plus',16),'th-step',k,'icon small ghost','data-d="1" aria-label="Больше"')}</div></div>`).join('')
  +(thresholdsChanged()?sLink('Вернуть значения по умолчанию','th-reset',{icon:'restore',chev:false}):''),
  'Меняют сигналы сразу','По умолчанию — отраслевые ориентиры (PAINS-AUDIT §6): пауза 14 дней, новичок 90 дней и 4 визита в первый месяц, загрузка тренера — норма клуба ± 25 %. Факты от порогов не меняются: меняется только то, о чём роль спрашивает.')
 ,settingsSheet)}
const thresholdsChanged=()=>Object.keys(MD.TH_LABEL).some(k=>MD.th(state,k)!==MD.TH[k]);

/* ——— Настройки: рабочее место, правила роли и данные ———
   Рабочее место (тема, свои реплики) — настройки человека, не данные клуба (Я-5).
   Правила роли — норма клуба версиями с даты и пороги сигналов.
   Данные — что принято от администратора и тренеров, копия базы, пример и чистый лист.
   Разделы и их порядок — общие для всех ролей (core/ui/frame.js); здесь только своё содержание. */

function settingsSheet(){openSheet({title:'Настройки',view:settingsView})}
function settingsView(){const share=storageShare(),n=MD.normOn(state,MD.today());
 return settingsFrame({
  view:viewPart(),
  profile:sGroup(sInput(field('Имя управляющего','name',state.profile.name||'',{ph:'Кем подписан итог месяца',extra:'data-set="name"'})),'Подпись итогов месяца'),
  work:sGroup(
   sLink('Норма клуба','norm',{icon:'target',value:`${hours(n.minutes)} ч · ${n.fill} %`})
   +sLink('Пороги сигналов','thresholds',{icon:'flag',value:`пауза ${MD.th(state,'gap')} дн.`}),
   'Действуют с даты','Норма — версия с даты: прошлые месяцы считаются той нормой, что действовала тогда. Пороги меняются целиком и действуют на чтения сразу.'),
  data:`${sourcesPart()}
   ${sGroup(sLink('Выгрузить итог месяца','month-export',{icon:'download',value:monthLabel(ui.month)})
    +sLink('Копия базы','backup',{icon:'file'})
    +(MD.club(state)?sLink('История клуба','history',{icon:'list',value:String((MD.club(state).log||[]).length)}):''),
    'Наверх уходит только итог','Наверх уходит текст итога месяца: загрузка, удержание и что сделано по риску. Людей построчно в нём нет.')}
   ${sGroup(sItem('Место',`${esc(mb(storageUsed()))} из ${esc(mb(STORAGE_LIMIT))}`,`<div class="aprog gauge${share>=0.7?' hot':''}"><i style="width:${Math.round(share*100)}%"></i></div>`,'storage'),
    share>=0.7?'Место кончается':'',share>=0.7?'Выгрузите копию базы и очистите лишнее: копия клуба занимает больше всего.':'')}`,
  learn:learnPart(LEARN.filter(g=>g.check(state)).length,LEARN.length,!!prefs.learnOff),
  start:sGroup(sLink('Открыть пример','reset',{id:'demo',icon:'layers'})+sLink('Начать с чистого листа','reset',{id:'empty',danger:true,icon:'trash'}))})}

/* ——— знакомство ———
   Восемь шагов механикой ядра: каждый засчитывается сам, когда в базе появляется то,
   о чём он говорит. Ни один шаг не ведёт туда, чего у роли нет (И-7). */
const LEARN=[
 {id:'club',title:'Взять базу клуба',text:'От администратора: файл смены или копия из этого браузера.',done:'База клуба принята.',
  how:'Настройки → «База клуба» → «Взять». Если администратор работает в этом же браузере, копия возьмётся сама.',
  check:s=>!!MD.club(s),when:()=>true},
 {id:'month',title:'Посмотреть месяц',text:'Главный экран: сигналы наверху, ход месяца и четыре числа.',done:'Месяц открывали.',
  how:'Это и есть текущий экран: сигналы, ход месяца, загрузка, удержание.',
  check:()=>!!prefs.seenMonth,when:s=>!!MD.club(s)},
 {id:'norm',title:'Поставить норму клуба',text:'Минуты тренера в месяц и заполняемость групп — от них считается загрузка.',done:'Норма поставлена.',
  how:'Настройки → «Норма клуба». Норма действует с даты: прошлые месяцы останутся при своей.',
  check:s=>s.norms.length>1,when:s=>!!MD.club(s)},
 {id:'goal',title:'Поставить цель месяца',text:'Без цели числа не с чем сравнить.',done:'Цель поставлена.',
  how:'На экране «Месяц» — панель «Цель месяца», кнопка «Поставить».',
  check:s=>s.months.some(r=>r.goal),when:s=>!!MD.club(s)},
 {id:'reply',title:'Ответить на сигнал',text:'У сигнала есть причина, порог и ответ в одно касание.',done:'Ответ на сигнал есть.',
  how:'Любой сигнал наверху экрана → «Ответить». Ответ — факт: он останется в месяце и уйдёт в сводку.',
  check:s=>s.months.some(r=>Object.keys(r.answers||{}).length),when:s=>MD.tails(s).length>0},
 {id:'coach',title:'Принять пакет тренера',text:'От тренера приходят только числа: посещения, ответы и недели.',done:'Пакет тренера принят.',
  how:'Настройки → «Принять файл» и выберите копию базы тренера. Заметки и дневник в базу не попадут.',
  check:s=>(s.coaches||[]).length>0,when:s=>!!MD.club(s)},
 {id:'review',title:'Разобрать тренера',text:'Норма, нужен разговор или нужна помощь — и строка почему.',done:'Разбор есть.',
  how:'Раздел «Тренеры» → любая строка → «Разобрать».',
  check:s=>s.months.some(r=>Object.keys(r.reviews||{}).length),when:s=>MD.crew(s,ui.month,asOf()).length>0},
 {id:'close',title:'Закрыть месяц',text:'Ответ по каждому тренеру и каждому сигналу — и сводка уходит наверх.',done:'Месяц закрывали.',
  how:'Экран «Месяц» → панель «Закрытие месяца». Пока есть неотвеченное, кнопка не нажимается и написано, чего не хватает.',
  check:s=>s.months.some(r=>r.closedAt),when:(s,m)=>MD.closeState(s,m,asOf(m)).ok||s.months.some(r=>r.closedAt)},
];

/* Карточка знакомства на главном экране: один шаг, в свой момент, с «Как» и «Позже».
   Живёт в настройках устройства, а не в данных (Я-5): её состояние не уезжает с базой. */
function learnStep(){
 if(prefs.learnOff||prefs.learnLater===MD.today())return null;
 return LEARN.find(g=>!g.check(state)&&g.when(state,ui.month))||null}
function learnCard(){const g=learnStep();if(!g)return '';
 const i=LEARN.indexOf(g)+1;
 return `<section class="panel learncard" data-key="learn"><div class="phead"><h2>Знакомство</h2><span class="ptag">${i} из ${LEARN.length}</span></div>
 <p class="lead">${esc(g.title)}</p><p class="meta">${esc(g.text)}</p>
 <div class="btnrow">${B('Как','guide-how',g.id,'small primary')}${B('Позже','learn-later','','small ghost')}${B('Скрыть подсказки','learn-toggle','','small ghost')}</div></section>`}
function guideHow(id){const g=LEARN.find(x=>x.id===id);if(!g)return;
 openSheet({title:g.title,body:`<p class="lead">${esc(g.text)}</p><p class="meta">${esc(g.how)}</p>
  <p class="sfoot">Шаг засчитается сам, когда в базе появится то, о чём он говорит.</p>`})}
function learnPath(){const done=LEARN.filter(g=>g.check(state)).length;
 openSheet({title:`Знакомство · ${done} из ${LEARN.length}`,body:`<p class="meta">Каждый шаг засчитывается сам, когда в базе появляется то, о чём он рассказывает.</p>
 <div class="rows">${LEARN.map((g,i)=>{const ok=g.check(state);
  return `<div class="lstep${ok?' is-done':''}" data-key="gp${g.id}"><span class="lmark">${ok?I('check',14):''}</span>
  <div class="grow"><span class="rt">${i+1}. ${esc(g.title)}</span><span class="rm">${esc(ok?g.done:g.text)}</span></div></div>`}).join('')}</div>`})}

/* Переключатели рабочего места применяются сразу: это не данные, отмены не нужно. */
function applyLive(kind,value){liveCommon(kind,value);render()}

/* ——— Каркас, адреса, действия, запуск ———
   Каркас — тот же, что у клиента, тренера и администратора: боковая навигация на компьютере,
   вкладки внизу на телефоне, сцена посередине, шторки и тост ядра. Все нажатия ловит один
   слушатель: что делает кнопка — ищите её data-action в ACTIONS.
   Адреса: #/month · #/trainers · #/people · #/signals */

const ROUTES={month:['Месяц','cal'],trainers:['Тренеры','coach'],people:['Люди','user'],signals:['Сигналы','flag']};
const SCENES={month:monthScene,trainers:trainersScene,people:peopleScene,signals:signalsScene};

function go(route){const h='#/'+route;if(location.hash===h)render();else location.hash=h}
function readHash(){const r=(location.hash||'').split('/')[1];const route=ROUTES[r]?r:'month';
 if(route!==ui.route)onRoute();ui.route=route}

function shell(){
 const open=hasClub()?MD.tails(state).length:0;
 return frameShell({brand:{icon:'progress',role:'Управляющий',caption:'месяц · загрузка · удержание'},
  routes:Object.entries(ROUTES).map(([k,[label,icon]])=>({key:k,label,icon,on:ui.route===k})),
  me:{name:state.profile.name||'Управляющий',caption:MD.club(state)?.demo?'пример клуба':'база на этом устройстве'},
  top:ui.unsaved||loadError?unsavedBanner(loadError?'База':'Панель',B(I('download',16)+'Выгрузить копию','backup','','small primary')):'',
  scene:(SCENES[ui.route]||monthScene)()})}

function render(){const app=$('#app'),first=!app.firstChild,html=shell();
 if(first)app.innerHTML=html;else morph(app,html);
 sheetRender();
 document.title=`${ROUTES[ui.route]?.[0]||'Месяц'} · Клуб`;
 quietView([ui.route,ui.month,ui.pv,ui.only].join('|'))}

const ACTIONS={
 ...FRAME_ACTIONS,
 go:id=>go(id),
 pv:id=>{ui.pv=id;render()},
 history:()=>historySheet(),
 only:id=>{ui.only=id==='open';render()},
 'month-shift':id=>{const n=Number(id);if(n>0&&!canNext())return;ui.month=MD.mShift(ui.month,n);render()},
 'month-now':()=>{ui.month=MD.monthOf(MD.today());render()},
 // ——— свои факты ———
 // маршрут ведёт туда, где пункт закрывается: цель — шторкой, остальное — своим разделом
 route:id=>{if(id==='goal')return goalSheet();if(id==='close'){const el=$('[data-key="close"]');
   if(el)el.scrollIntoView({behavior:'smooth',block:'center'});return}go(id)},
 goal:()=>goalSheet(),
 trainer:id=>trainerSheet(id),
 review:id=>reviewSheet(id),
 reply:id=>replySheet(id),
 unreply:id=>{if(commit(s=>MD.ops.unreply(s,ui.month,id),{toast:'Ответ убран'}))closeSheet()},
 'month-close':id=>{const st=MD.closeState(state,id,asOf(id));if(!st.ok){toast(st.why);return}
  confirmSheet('Закрыть месяц',`Месяц ${monthLabel(id)} закроется и больше меняться не будет. Сводка зафиксируется в том виде, в каком она сейчас.`,'Закрыть месяц',
   ()=>commit(s=>MD.ops.closeMonth(s,id,state.profile.name,asOf(id)),{toast:`Месяц ${monthLabel(id)} закрыт`}))},
 // ——— обмен ———
 'club-take':()=>takeClubHere(),
 'club-open':()=>$('#import').click(),
 'coach-forget':id=>{const c=(state.coaches||[]).find(x=>x.id===id);if(!c)return;
  confirmSheet('Убрать пакет тренера',`Числа от «${c.name}» уйдут из базы: посещения, ответы и недели. Файл можно принять снова.`,'Убрать',
   ()=>{if(commit(s=>MD.ops.forgetCoach(s,id),{toast:'Пакет тренера убран'}))sheetAfter=()=>settingsSheet()})},
 'month-export':()=>monthExport(),
 backup:()=>backup(),
 // ——— настройки ———
 settings:()=>settingsSheet(),
 norm:()=>{normSheet();sheetAfter=()=>settingsSheet()},
 thresholds:()=>thresholdSheet(),
 'th-step':(id,el)=>commit(s=>MD.ops.setThreshold(s,id,MD.th(s,id)+Number(el.dataset.d)),{fail:'Порог не бывает меньше нуля'}),
 'th-reset':()=>commit(s=>MD.ops.resetThresholds(s),{toast:'Пороги — снова отраслевые'}),
 reset:id=>resetSheet(id),
 'learn-path':()=>learnPath(),
 'learn-later':()=>{prefs.learnLater=MD.today();savePrefs();render()},
 'guide-how':id=>guideHow(id),
 'learn-toggle':()=>{prefs.learnOff=!prefs.learnOff;prefs.learnLater=null;savePrefs();render();
  if(prefs.learnOff)toast('Подсказки скрыты — вернуть можно в настройках')},
 undo:id=>undo(id),
 'sheet-close':()=>closeSheet(),
 // ——— элементы форм ядра ———
 cal:(id,el)=>{if(popOwner===el){closePop();return}const v=el.parentElement.querySelector('input').value||MD.today();
  openPop(el,calHtml(v.slice(0,7),v,el.dataset.empty==='1'),'pop--cal')},
 'cal-nav':id=>{const own=popOwner,v=own.parentElement.querySelector('input').value;popEl.innerHTML=calHtml(id,v,own.dataset.empty==='1')},
 'cal-set':id=>{const own=popOwner,inp=own.parentElement.querySelector('input');inp.value=id==='none'?'':id;inp.setAttribute('value',inp.value);
  own.querySelector('span').textContent=id==='none'?'Без даты':MD.fmtDay(id);closePop();own.focus()},
 seg:(id,el)=>{const f=el.closest('.field');const inp=f.querySelector('input[type=hidden]');inp.value=id;inp.setAttribute('value',id);
  f.querySelectorAll('.seg button').forEach(b=>{const on=b===el;b.classList.toggle('is-on',on);if(b.hasAttribute('role'))b.setAttribute('aria-checked',on)});
  if(inp.dataset.live){applyLive(inp.dataset.live,id);return}
  syncShow()},
 step:(id,el)=>{const i=$(`#sheet [name="${id}"]`);if(!i)return;
  i.value=numText(Math.max(Number(el.dataset.min)||0,MD.round((toNum(i.value)||0)+Number(el.dataset.d))))},
};

document.addEventListener('click',e=>{
 const el=e.target.closest('[data-action]');
 if(popEl&&!e.target.closest('.pop')&&el!==popOwner)closePop();
 if(!el||el.disabled)return;const fn=ACTIONS[el.dataset.action];
 if(fn){e.preventDefault();try{fn(el.dataset.id,el)}catch(err){toast(err.message)}}
 if(el.closest('#toast')&&el.dataset.action!=='undo')$('#toast').hidden=true;
});
/* Поиск по людям печатается прямо в списке: строка живёт в ui, morph не трогает активное поле. */
document.addEventListener('input',e=>{if(e.target.id==='psearch'){ui.q=e.target.value;render()}});
// Имя управляющего пишется, когда человек покинул поле — как в остальных ролях.
document.addEventListener('change',e=>{if(e.target.dataset?.set==='name'&&e.target.value.trim()!==(state.profile.name||''))
 commit(s=>MD.ops.setName(s,e.target.value),{toast:'Имя сохранено'})});
document.addEventListener('submit',e=>{e.preventDefault();const form=e.target;
 if(form.classList.contains('sheetform')&&sheetSave){let ok;try{ok=sheetSave(formData(form))}catch(err){toast(err.message);return}if(ok!==false)closeSheet()}});
document.addEventListener('keydown',e=>{
 if(e.key==='Tab'&&$('#sheet').open&&!popEl){const f=$$('#sheet button:not([disabled]),#sheet input:not([type=hidden]),#sheet textarea').filter(x=>x.offsetParent);
  if(f.length){const i=f.indexOf(document.activeElement);
   if(e.shiftKey&&i<=0){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&(i===f.length-1||i<0)){e.preventDefault();f[0].focus()}}}});
const typing=e=>e.target.matches?.('input:not([type=hidden]),textarea');
let typingOff=null;
document.addEventListener('focusin',e=>{if(typing(e)){clearTimeout(typingOff);document.body.classList.add('is-typing')}});
document.addEventListener('focusout',e=>{if(typing(e)){clearTimeout(typingOff);typingOff=setTimeout(()=>{if(!document.activeElement?.matches('input:not([type=hidden]),textarea'))document.body.classList.remove('is-typing')},350)}});

function bindSheet(){const dlg=$('#sheet');
 dlg.addEventListener('cancel',e=>{e.preventDefault();if(popEl)closePop();else closeSheet()});
 dlg.addEventListener('click',e=>{if(e.target===dlg)closeSheet()});
 let y0=null,dy=0;
 dlg.addEventListener('touchstart',e=>{if(e.target.closest('.sheethead')&&!e.target.closest('button')){y0=e.touches[0].clientY;dy=0;dlg.style.transition='none'}},{passive:true});
 dlg.addEventListener('touchmove',e=>{if(y0===null)return;dy=Math.max(0,e.touches[0].clientY-y0);dlg.style.transform=`translateY(${dy}px)`},{passive:true});
 dlg.addEventListener('touchend',()=>{if(y0===null)return;y0=null;dlg.style.transition='transform var(--d-move) var(--ease-out)';dlg.style.transform='';
  if(dy>90){dlg.style.transition='';closeSheet()}else setTimeout(()=>{dlg.style.transition=''},300)});
 $('#import').addEventListener('change',e=>{const f=e.target.files[0];if(f)importFile(f);e.target.value=''});
}

// Открыли в новом месяце — показываем текущий: месяц и есть период роли.
function landMonth(){const m=MD.monthOf(MD.today());
 if(prefs.seen&&prefs.seen!==m)ui.month=m;
 if(prefs.seen!==m){prefs.seen=m;savePrefs()}
 if(!prefs.seenMonth){prefs.seenMonth=MD.today();savePrefs()}}

function boot(){
 applyTheme();landMonth();readHash();render();bindSheet();
 addEventListener('hashchange',()=>{closeSheet();readHash();render();scrollTo({top:0})});
 addEventListener('storage',e=>{if(e.key!==KEY&&e.key!==REV)return;if(adoptStored()){render();toast('Обновлено из другой вкладки')}});
 matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(!prefs.theme){applyTheme();render()}});
 let day=MD.today();
 setInterval(()=>{if(MD.today()!==day){day=MD.today();landMonth()}
  if(!$('#sheet').open&&!document.activeElement?.matches('input,textarea'))render()},60000);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!$('#sheet').open){landMonth();render()}});
}
if(typeof window!=='undefined'&&window.document&&document.getElementById('app'))boot();
</script></body></html>
