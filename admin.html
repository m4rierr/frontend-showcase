'use strict';
/* ——— Показ по роли и ступени (CLUB-CORE §12) ———
   Кто что видит, решает запечатанный контракт Ассамблеи (core/contract.js, выгружается из
   Xeptra 4.0). Здесь — один вопрос: показать ли участок экрана роли на её ступени.

   Закон показа (протокол LEVEL контракта):
   1. Ступени вложены: что видно на ступени, видно и выше.
   2. «Всегда на экране» (floor) не прячется никогда.
   3. Свои факты, которых больше нигде не видно, показываются на любой ступени (own).
   4. Показ ≠ закон: спрятанный участок не отменяет операций домена; записать можно то же самое.
   5. Нет контракта, неизвестный участок или ступень — показываем (лучше лишнее, чем пропавшее);
      неизвестный участок запоминается в CAST.unknown — это ловят проверки. */

const CAST=(()=>{
 const C=typeof CLUB_CONTRACT==='object'&&CLUB_CONTRACT?CLUB_CONTRACT:null;
 const unknown=new Set(),asked=new Set();// asked — какие участки экран спрашивал (обход проверяет, что спрошены все)
 const role=key=>C&&C.roles[key]||null;
 const levels=key=>(role(key)?.levels||[]).map(l=>({id:l.id,name:l.name}));
 const top=key=>{const l=levels(key);return l.length?l[l.length-1].id:null};
 const bottom=key=>levels(key)[0]?.id||null;
 function levelOf(key,id){const r=role(key);if(!r)return null;return r.levels.find(l=>l.id===id)||r.levels[r.levels.length-1]}
 // Ступень, с которой участок виден (для подписи «откроется на …»).
 function opensAt(slot){const s=C?.slots[slot];if(!s)return null;if(s.floor)return null;return role(s.role)?.levels.find(l=>l.slots.includes(slot))||null}

 /* make(role, {level: () => id ступени, own: {участок: () => есть ли свои факты}}) */
 function make(key,{level,own={}}={}){
  const cur=()=>levelOf(key,level?level():null);
  function shows(slot){
   asked.add(slot);
   if(!C)return true;
   const s=C.slots[slot];
   if(!s||s.role!==key){unknown.add(slot);return true}
   if(s.floor)return true;
   const l=cur();if(!l||l.slots.includes(slot))return true;
   const o=own[slot];return !!(o&&o());
  }
  const hidden=()=>C?Object.keys(C.slots).filter(id=>C.slots[id].role===key&&!shows(id)):[];
  // Что откроется на следующей ступени — чтобы человек видел, что его ждёт, а не гадал, куда что делось.
  function next(){const r=role(key),l=cur();if(!r||!l)return null;const i=r.levels.indexOf(l),n=r.levels[i+1];
   return n?{id:n.id,name:n.name,slots:n.slots.filter(x=>!l.slots.includes(x)).map(x=>C.slots[x].name)}:null}
  return {role:key,shows,hidden,next,level:()=>cur()?.id||null,levelName:()=>cur()?.name||'',levels:()=>levels(key),basis:()=>role(key)?.basis||''};
 }
 /* Поле «Ступень» для настроек сотрудника (ответственность назначается): сегмент ступеней
    и сноска, что на этой ступени не показано. Нужны sGroup, sSegIcons (frame.js). */
 function levelField(c,label='Ступень'){const ls=c.levels();if(ls.length<2)return '';
  const hid=c.hidden().map(id=>C.slots[id].name);
  return sGroup(sSegIcons(label,'level',ls.map((l,i)=>[l.id,i?'layers':'user',l.name]),c.level()),
   hid.length?`Скрыто: ${hid.length}`:'Видно всё',
   `${hid.length?'На этой ступени не показано: '+hid.join(', ')+'. ':''}Запись и проверки от ступени не зависят.`)}
 return {contract:C,make,levels,top,bottom,opensAt,unknown,asked,levelField,
  artifact:()=>C?C.artifact:null,
  slotsOf:key=>C?Object.keys(C.slots).filter(id=>C.slots[id].role===key):[]};
})();

/* ——— Ядро · помощники экрана ———
   Одинаковы у всех ролей: выборка узлов, экранирование, копия, чтение и запись хранилища.
   Хранилище не доверенное и может отказать (приватный режим, переполнение) —
   поэтому чтение и запись никогда не бросают, а отвечают null / false. */

const $=(s,p=document)=>p.querySelector(s),$$=(s,p=document)=>[...p.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const clone=o=>JSON.parse(JSON.stringify(o));
function readJSON(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
function writeJSON(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}

/* ——— Ядро · отмена по действию (З-06, INVARIANT §4.5) ———
   Для каждого действия запоминается разница по сущностям, которые оно затронуло:
   что добавилось, что удалилось, какими были изменённые. «Отменить» применяет обратное
   только к ним: поздние правки других сущностей и других полей остаются.

   Роль объявляет в своём 01-core.js, что считать сущностями:
     LISTS — списки сущностей с id (или week у недель тренера);
     OBJS  — одиночные объекты базы (профиль и т. п.).
   Источник: тренерская версия (ключ id|week, защита поздней правки поля) — она строже клиентской. */

const J=x=>JSON.stringify(x);
const keyOf=x=>x.id||x.week;
const isList=v=>Array.isArray(v)&&v.every(x=>x&&typeof x==='object'&&('id' in x||'week' in x));
function diff(a,b){const p={};
 for(const k of LISTS){const A=new Map(a[k].map((x,i)=>[keyOf(x),[x,i]])),Bm=new Map(b[k].map(x=>[keyOf(x),x]));
  const c={added:[],removed:[],changed:[]};
  for(const [id] of Bm)if(!A.has(id))c.added.push(id);
  for(const [id,[x,i]] of A){const y=Bm.get(id);if(!y)c.removed.push([x,i]);else if(J(x)!==J(y))c.changed.push([x,y])}
  if(c.added.length||c.removed.length||c.changed.length)p[k]=c}
 for(const k of OBJS)if(J(a[k])!==J(b[k]))p[k]={before:a[k],after:b[k]};
 return p}
/* Откат трёхсторонний: возвращаем только те поля и вложенные списки, которые поменяло
   само это действие (было → стало). Поле, поменянное уже после действия, — поздняя правка. */
function revert(cur,before,after){
 if(isList(before)&&isList(after)&&isList(cur)){const A=new Map(after.map(x=>[keyOf(x),x])),Bf=new Map(before.map((x,i)=>[keyOf(x),[x,i]]));
  let out=cur.filter(x=>Bf.has(keyOf(x))||!A.has(keyOf(x)));
  out=out.map(x=>{const b=Bf.get(keyOf(x)),a=A.get(keyOf(x));return b&&a&&J(b[0])!==J(a)?revert(x,b[0],a):x});
  for(const [id,[x,i]] of [...Bf].sort((p,q)=>p[1][1]-q[1][1]))if(!A.has(id)&&!out.some(y=>keyOf(y)===id))out.splice(Math.min(i,out.length),0,clone(x));
  return out}
 if(before&&after&&cur&&typeof before==='object'&&typeof after==='object'&&typeof cur==='object'&&!Array.isArray(before)){const n={...cur};
  for(const f of new Set([...Object.keys(before),...Object.keys(after)])){if(J(before[f])===J(after[f]))continue;
   const objs=f in cur&&typeof before[f]==='object'&&before[f]!==null&&typeof cur[f]==='object'&&cur[f]!==null;
   if(!objs&&f in cur&&J(cur[f])!==J(after[f]))continue;
   if(!(f in before))delete n[f];else n[f]=objs?revert(cur[f],before[f],after[f]):clone(before[f])}
  return n}
 return clone(before)}
function applyUndo(s,p){const n=clone(s);
 for(const k of LISTS){const c=p[k];if(!c)continue;
  n[k]=n[k].filter(x=>!c.added.includes(keyOf(x)));
  for(const [x,y] of c.changed){const i=n[k].findIndex(z=>keyOf(z)===keyOf(x));if(i>=0)n[k][i]=revert(n[k][i],x,y)}
  for(const [x,i] of [...c.removed].sort((a,b)=>a[1]-b[1]))n[k].splice(Math.min(i,n[k].length),0,clone(x))}
 for(const k of OBJS)if(p[k])n[k]=revert(n[k],p[k].before,p[k].after);
 return n}

'use strict';
/* ——— Ядро · рамка роли: один интерфейс на три роли (CLUB-CORE §13) ———
   Всё, что человек видит одинаково в любой роли, живёт здесь, а не в роли:
   · кирпичики разметки: кнопка, пустое место, шапка сцены, кольцо, числа и слова;
   · тост с «Отменить»;
   · тема (Как в системе · Светлая · Тёмная);
   · каркас: боковая колонка, стеклянная шапка, вкладки, «+» — frameShell;
   · настройки: одни разделы в одном порядке — settingsFrame, и общие поля «Вид»,
     «Знакомство», свой теневой язык.
   Роль передаёт сюда только своё содержание: разделы, людей, свои строки настроек.
   Нужны: esc, $ (util.js), I (icons.js), segField, openSheet (kit.js) — во время вызова. */

// ——— кирпичики разметки ———
function B(label,action,id='',cls='',extra=''){return `<button type="button" class="${cls}" data-action="${action}"${id!==''?` data-id="${esc(id)}"`:''} ${extra}>${label}</button>`}
function empty(icon,title,text,action=''){return `<div class="empty"><div class="eico">${I(icon,22)}</div><h3>${title}</h3>${text?`<p>${text}</p>`:''}${action}</div>`}
function sceneHead(kicker,title,sub='',actions=''){
 return `<header class="shead"><div class="grow"><div class="kicker">${kicker}</div><h1>${title}</h1>${sub?`<p class="sub">${sub}</p>`:''}</div>${actions?`<div class="actions">${actions}</div>`:''}</header>`}
function ring(r,size=36,label=''){const rad=(size-5)/2,c=2*Math.PI*rad;
 return `<span class="ringbox${r>=1?' is-done':''}" style="width:${size}px;height:${size}px"><svg class="ring" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle class="bg" cx="${size/2}" cy="${size/2}" r="${rad}"/><circle class="fg" cx="${size/2}" cy="${size/2}" r="${rad}" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${(c*(1-Math.min(1,r))).toFixed(2)}"/></svg>${label}</span>`}

// ——— числа и слова ———
const plural=(n,a,b,c)=>{if(Array.isArray(a))[a,b,c]=a;const x=Math.abs(n)%100,y=x%10;return x>10&&x<20?c:y>1&&y<5?b:y===1?a:c};
const initials=n=>String(n||'').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()||'·';
const greet=()=>{const h=D.now().getHours();return h<5?'Доброй ночи':h<12?'Доброе утро':h<18?'Добрый день':'Добрый вечер'};
function toNum(v){if(v===null||v===undefined)return null;v=String(v).trim().replace(',','.');if(v==='')return null;const n=Number(v);return isFinite(n)&&n>=0?Math.round(n*100)/100:NaN}

// ——— смена вида без мигания ———
// Роль зовёт после отрисовки с подписью вида (раздел, фильтры, дата). Подпись сменилась — анимации,
// и переходы цвета, которые запустились у заново созданных или переиспользованных строк (заливка
// галочки, рекорд, толчок числа, смена кнопки с одной на другую), сразу доводятся до конца:
// это не их момент. Шторка, тост и выпадающее живут своей жизнью.
let viewSig=null;

  if(t&&t.closest&&!t.closest('#sheet,#toast,.pop,.guide,.guidering,.pulse'))try{a.finish()}catch(e){}}}

// ——— тост: одна строка и «Отменить» ———
// about — пока верно, тост про это действие; toastChanged — если роль хочет знать, что тост появился или ушёл.
let toastTimer=null,toastAbout=null;
const toastPing=()=>{if(typeof toastChanged==='function')toastChanged()};
function toastCheck(){if(toastAbout&&!toastAbout()){toastAbout=null;const el=$('#toast');if(el)el.hidden=true}}
function toast(text,{undo:u=null,action=null,about=null}={}){
 const el=$('#toast');if(!el)return;toastAbout=about;
 el.innerHTML=`<span>${esc(text)}</span>${u?B('Отменить','undo',u,'small ghost'):''}${action?B(action.label,action.act,action.id||'','small ghost',action.extra||''):''}`;
 el.hidden=false;el.classList.remove('is-out');clearTimeout(toastTimer);toastPing();
 toastTimer=setTimeout(()=>{el.classList.add('is-out');toastTimer=setTimeout(()=>{el.hidden=true;toastPing()},250)},action?9000:u?8000:2800)}

/* ——— уведомления системы: одни правила во всех ролях ———
   Напоминание звучит внутри страницы всегда (подсветка, тост, у администратора — звук).
   Системное уведомление — дополнительно и только когда человек не смотрит на страницу
   (вкладка свёрнута или окно не в фокусе): иначе это дубль.
   Честные пределы: работает, пока страница открыта во вкладке; фоновая вкладка проверяет
   время не чаще раза в минуту; на телефоне из файла системные уведомления не приходят —
   браузер требует служебный воркер, а у файла его нет (тогда show вернёт false). */
const NOTIFY={
 state(){try{return typeof Notification==='undefined'?'none':Notification.permission}catch(e){return 'none'}},
 ask(){try{const r=Notification.requestPermission(()=>{});Promise.resolve(r).then(()=>render(),()=>render())}catch(e){render()}},
 show(title,body,tag){const away=document.hidden||(typeof document.hasFocus==='function'&&!document.hasFocus());if(!away||NOTIFY.state()!=='granted')return false;
  try{const n=new Notification(title,{body,tag,lang:'ru'});n.onclick=()=>{try{window.focus()}catch(e){}n.close()};return true}catch(e){return false}},
};
// Строка «Уведомления» в разделе «Работа»: что сейчас разрешено и что с этим можно сделать.
function notifyRow(){const st=NOTIFY.state();
 const text={granted:'Включены',denied:'Запрещены в браузере',default:'Не разрешены',none:'Браузер не показывает'}[st]||'';
 return sItem('Уведомления системы',text,st==='default'?B('Разрешить','notify-ask','','small primary'):'',st==='granted'?'bell':'bell')}
const NOTIFY_FOOT='Пока страница открыта';
const NOTIFY_MORE='Напоминания работают, пока страница открыта во вкладке: закрыли — напомнить некому. Системное уведомление приходит, когда страница свёрнута. На телефоне из файла системные уведомления не приходят — только внутри открытой страницы.';

// ——— тема: одна на все роли ———
const THEMES={system:'Как в системе',light:'Светлая',dark:'Тёмная'};
const themeValue=()=>prefs.theme==='light'||prefs.theme==='dark'?prefs.theme:'system';
const systemDark=()=>{try{return !!matchMedia('(prefers-color-scheme: dark)').matches}catch(e){return false}};

/* ——— каркас ———
   brand {icon, role, caption} · routes [{key,label,icon,on}] · me {name, caption}
   top — полосы над сценой (запись не проходит и т.п.) · scene — разметка сцены
   fab [action, id, label, icon] или null · head — лишние кнопки шапки телефона · live — плавающая полоса */
function frameShell({brand,routes,me,top='',scene,fab=null,head='',live='',cls=''}){
 const dark=themeNow()==='dark',tt=dark?'Светлая тема':'Тёмная тема';
 const links=tab=>routes.map(r=>`<a href="#/${r.key}" class="${r.on?'is-on':''}"${r.on?' aria-current="page"':''}>${I(r.icon,tab?22:20)}<span>${r.label}</span></a>`).join('');
 return `<div class="shell${cls?' '+cls:''}">
 <aside class="side"><div class="brand"><span class="mark">${I(brand.icon,20)}</span><div><b>Клуб</b><span class="caption">${esc(brand.role)} · ${esc(brand.caption)}</span></div></div>
  <nav class="nav" aria-label="Разделы">${links(false)}</nav>
  <div class="sidefoot"><div class="me"><span class="avatar">${esc(initials(me.name))}</span><div class="grow"><b>${esc(me.name||'Без имени')}</b><span class="caption">${esc(me.caption||'')}</span></div></div>
  <div class="btnrow">${B(I(dark?'sun':'moon',18),'theme-toggle','','icon ghost',`aria-label="${tt}"`)}${B(I('settings',18)+'<span>Настройки</span>','settings','','ghost')}</div></div></aside>
 <main class="main" id="main">
  <header class="mhead glass"><span class="mark">${I(brand.icon,18)}</span><b>${esc(brand.role)}</b>
   ${head}${B(I(dark?'sun':'moon',20),'theme-toggle','','icon ghost',`aria-label="${tt}"`)}${B(I('settings',20),'settings','','icon ghost','aria-label="Настройки"')}</header>
  ${top}${scene}
 </main>
 ${live}
 <nav class="tabbar glass" aria-label="Разделы">${links(true)}</nav>
 ${fab?B(I(fab[3]||'plus',24),fab[0],fab[1],'fab primary lone',`aria-label="${esc(fab[2])}"`):''}
 </div>`}
// Полоса «запись не проходит» — одна на все роли.
function unsavedBanner(what,act=''){return `<div class="banner card unsaved" data-key="unsaved"><span class="qico">${I('flag',18)}</span><div class="grow"><b>${esc(what)} не сохраняется</b><span class="meta">Память браузера заполнена или запись запрещена. Сделанное сейчас живёт только до закрытия страницы — сохраните копию.</span></div>${act}</div>`}

/* ——— настройки: одни разделы в одном порядке, один вид строк ———
   Раздел — подпись и группы. Группа — карточка со строками через тонкую линию и короткой
   сноской под ней. Строк четыре вида, других в настройках нет:
     sItem  — подпись слева, значение или кнопка справа;
     sLink  — вся строка — кнопка со стрелкой (открыть, выгрузить, путь);
     sSeg   — подпись и переключатель во всю ширину, применяется сразу (data-live);
     sInput — поле ввода в группе (профиль).
   Роль отдаёт только содержание разделов; раздела нет — он не рисуется, порядок не меняется. */
const SETTINGS=[['view','Вид'],['profile','Профиль'],['work','Работа'],['data','Данные'],['learn','Знакомство'],['trash','Удалённое'],['start','Пример и начало']];
function settingsFrame(parts){return `<div class="settings">${SETTINGS.filter(([k])=>parts[k]).map(([k,t])=>`<section class="setsec" data-key="set-${k}"><h3 class="stitle">${t}</h3>${parts[k]}</section>`).join('')}</div>`}
/* Подробности — не абзацем, а значком ⓘ: коснулся — короткое пояснение всплыло и ушло.
   Экран остаётся коротким, объяснение — на расстоянии одного касания. */
const infoBtn=(text,label='Подробнее')=>`<button type="button" class="infobtn icon ghost" data-action="info" data-text="${esc(text)}" aria-label="${label}" aria-haspopup="dialog" aria-expanded="false">${I('info',16)}</button>`;
// Группа: строки, под ней — одна короткая строка сноски и ⓘ с подробностями.
// ⓘ без слов рядом не бывает: подробность — к короткой сноске, а не вместо неё.
const sGroup=(rows,foot='',more='')=>`<div class="sgroup">${rows}</div>${foot?`<p class="sfoot">${foot}${more?infoBtn(more):''}</p>`:''}`;
// Подпись с ⓘ рядом — для шторок и панелей вместо поясняющего абзаца.
const withInfo=(html,more)=>`<span class="withinfo">${html}${infoBtn(more)}</span>`;
const sText=(title,sub='')=>`<div class="stext"><b>${title}</b>${sub?`<span>${sub}</span>`:''}</div>`;
const sItem=(title,sub='',control='',icon='')=>`<div class="srow">${icon?`<span class="sico">${I(icon,18)}</span>`:''}${sText(title,sub)}${control?`<div class="sctl">${control}</div>`:''}</div>`;
// Ступени лесенкой: пройденные, текущая, впереди — видно без чтения.
function levelSteps(levels,cur){const i=levels.findIndex(l=>l.id===cur);
 return `<div class="srow"><div class="lvsteps">${levels.map((l,k)=>`<span class="lvstep${k<i?' is-past':k===i?' is-on':''}"><i></i>${esc(l.name)}</span>`).join('')}</div></div>`}
// Подраздел настроек отдельной шторкой: закрыли — вернулись в настройки.
function subSheet(title,view,back){openSheet({title,view});sheetAfter=back}
// chev:false — строка-действие на месте (переключить), а не переход дальше.
const sLink=(title,action,{id='',value='',sub='',danger=false,icon='',chev=true}={})=>`<button type="button" class="srow slink${danger?' danger':''}" data-action="${action}"${id!==''?` data-id="${esc(id)}"`:''}>${icon?`<span class="sico">${I(icon,18)}</span>`:''}${sText(title,sub)}${value!==''?`<span class="sval">${value}</span>`:''}${chev?I('chev',16):''}</button>`;
const sSeg=(label,name,items,cur,cls='')=>`<div class="srow sseg">${liveSeg(label,name,items,cur,cls)}</div>`;
const sInput=html=>`<div class="srow sinput">${html}</div>`;
// Переключатель со значками: [[ключ, значок, подпись]] — подпись короткая, значок узнаётся сразу.
function sSegIcons(label,name,items,cur){return `<div class="srow sseg"><div class="field"><span class="label">${label}</span><input type="hidden" name="${name}" value="${esc(cur)}" data-live="${name}"><div class="seg iseg" role="radiogroup">${items.map(([k,ic,t])=>`<button type="button" role="radio" aria-checked="${k===cur}" class="${k===cur?'is-on':''}" data-action="seg" data-id="${esc(k)}">${I(ic,16)}<span>${esc(t)}</span></button>`).join('')}</div></div></div>`}
// Переключатель, который применяется сразу (без «Сохранить»): data-live.
const liveSeg=(label,name,items,cur,cls='')=>segField(label,name,items,cur,cls).replace(`name="${name}"`,`name="${name}" data-live="${name}"`);

/* «Вид»: тема; голос с образцом и своим теневым языком; ступень — одинаково у всех ролей.
   show — группа ступени роли (CAST.levelField или своя). */
const TONES_LABEL={calm:'Спокойная',shift:'После смены'};
function viewPart(show=''){const own=customCount(),[t,s]=VOICE_SAMPLE;
 return `${sGroup(sSegIcons('Тема','theme',[['system','auto','Авто'],['light','sun','Светлая'],['dark','moon','Тёмная']],themeValue()))}
 ${sGroup(sSegIcons('Голос','voice',[['calm','voice','Спокойная'],['shift','moonset','После смены']],voiceNow())
  +`<div class="srow ssample"><span class="sico">${I('note',16)}</span>${sText(esc(say(t)),esc(say(s)))}</div>`
  +sLink('Свой теневой язык','voice-editor',{value:own?`своих: ${own}`:'',icon:'edit'}),
  'Меняет только подписи','Голос меняет подписи и комментарии. Статусы, проверки и всё, где можно потерять данные, звучат одинаково в обоих голосах.')}
 ${show}`}
// «Знакомство»: весь путь и подсказки.
function learnPart(done,total,off){return sGroup(
 sLink('Весь путь','learn-path',{value:done>=total?'пройден':`${done} из ${total}`,icon:'list'})
 +sLink(off?'Вернуть подсказки':'Скрыть подсказки','learn-toggle',{icon:off?'bell':'close',chev:false}),
 'Засчитывается само','Каждое действие показывается один раз, в свой момент. Сделанное самим засчитывается само.')}

/* Общие переключатели «Вида»: применяются сразу — это рабочее место, не данные (Я-5). */
function liveCommon(kind,value){
 if(kind==='theme'){prefs.theme=value;savePrefs();applyTheme();return true}
 if(kind==='voice'){prefs.voice=value;savePrefs();return true}
 if(kind==='level'){prefs.level=value;savePrefs();return true}
 if(kind==='cast'){prefs.cast=value;savePrefs();return true}
 return false}

/* ——— голос роли: словарь роли, механика ядра (core/voice.js) ———
   Роль объявляет VOICE (ключ → [спокойная, после смены]), VOICE_WHERE (ключ → [раздел, что это])
   и VOICE_SAMPLE (две реплики для образца в настройках). */
const voiceNow=()=>prefs.voice==='shift'?'shift':'calm';
let voiceM=null;
const voiceOf=()=>voiceM||(voiceM=V.make({dict:VOICE,tones:['calm','shift'],get:()=>({voice:voiceNow(),custom:prefs.custom||{}})}));
function say(key,...args){return voiceOf().say(key,...args)}
function shadowText(key){return voiceOf().text(key,1)}
const customCount=()=>Object.keys(prefs.custom||{}).length;

/* Свой теневой язык: сначала разделы, потом один раздел целиком. Пустая строка — исходная реплика. */
function voiceGroups(){const g={};for(const [key,[where,what]] of Object.entries(VOICE_WHERE)){if(!VOICE[key])continue;(g[where]=g[where]||[]).push([key,what])}return g}
function voiceEditor(){openSheet({title:'Свой теневой язык',view:()=>{const groups=voiceGroups(),own=customCount();
 return `<p class="lead">${own?'Своих реплик: '+own:'Пока всё исходное'}. Это тексты голоса «После смены»; спокойный голос отсюда не меняется.</p>
 <div class="rows">${Object.entries(groups).map(([where,list])=>{const mine=list.filter(([k])=>(prefs.custom||{})[k]).length;
  return `<button type="button" class="row plain" data-action="voice-group" data-id="${esc(where)}" data-key="vg${esc(where)}"><div class="rbody"><span class="rt">${esc(where)}</span><span class="rm">${mine?`своих: ${mine} из ${list.length}`:`реплик: ${list.length} · всё исходное`}</span></div>${I('chev',18)}</button>`}).join('')}</div>
 ${own?`<div class="btnrow">${B('Сбросить всё','voice-reset-all','','small danger')}</div>`:''}`}})}
function voiceGroupSheet(where){const list=voiceGroups()[where]||[];
 openSheet({title:esc(where),body:`<p class="caption">Пустая строка вернёт исходную реплику, {n} — место для числа.</p>`+list.map(([key,what])=>{const val=(prefs.custom||{})[key]||'';
  return `<label class="field vline"><span class="label">${esc(what)}</span><input name="v_${key}" value="${esc(val||shadowText(key))}" maxlength="160" autocomplete="off"><span class="caption">Исходная: ${esc(shadowText(key))}</span></label>`}).join(''),
  save:f=>{const c={...(prefs.custom||{})};for(const [key] of list){const v=String(f['v_'+key]||'').trim();if(!v||v===shadowText(key))delete c[key];else c[key]=v}
   prefs.custom=c;savePrefs();sheetAfter=()=>voiceEditor();render();toast('Реплики сохранены');return true}})}
// Действия голоса — одинаковые у всех ролей; роль подмешивает их в свой ACTIONS.
const FRAME_ACTIONS={
 'notify-ask':()=>NOTIFY.ask(),
 'info':(id,el)=>{if(popOwner===el){closePop();return}openPop(el,`<p>${esc(el.dataset.text||'')}</p>`,'pop--info')},
 'theme-toggle':()=>{prefs.theme=themeNow()==='dark'?'light':'dark';savePrefs();applyTheme();render()},
 'voice-editor':()=>voiceEditor(),
 'voice-group':id=>voiceGroupSheet(id),
 'voice-reset-all':()=>{prefs.custom={};savePrefs();render();toast('Все реплики — снова исходные')},
};

'use strict';
/* ——— Графики (CLUB-CORE §14) ———
   Одна семья графиков на все роли: линия, столбики, искра. Монохром — цвет ряда
   это --mark (чернила), второстепенное — --mark-soft; статусные тона не трогаем.
   Правила (dataviz):
   · одна ось; сетка и оси тише данных; линия 2px, концы столбиков скруглены 4px и стоят на базовой линии;
   · подписи — выборочно: последняя точка, «сейчас», максимум; остальное — в подсказке по наведению;
   · подсказка без скриптов: колонка-цель шире метки, :hover и :focus показывают перекрестье и значение;
   · текст — чернилами текста, не цветом ряда; пустой ряд — словами, а не плоской полосой.
   Разметка — HTML поверх SVG: точки и подписи не растягиваются вместе с рисунком. */

const CHART=(()=>{
 let uid=0;
 const num=v=>(Math.round(v*10)/10).toLocaleString('ru-RU');
 const esc2=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const pct=x=>(Math.round(x*100)/100)+'%';

 // «Круглые» деления оси: 3–5 штук, шаг 1·2·2,5·5 × 10ⁿ.
 function ticks(min,max){if(min===max){const d=Math.abs(min)*.05||1;min-=d;max+=d}
  const raw=(max-min)/3,mag=10**Math.floor(Math.log10(raw)),step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=raw);
  const lo=Math.floor(min/step)*step,hi=Math.ceil(max/step)*step,out=[];
  for(let v=lo;v<=hi+step/2;v+=step)out.push(Math.round(v*1000)/1000);
  return out}
 // Где подсказке встать, чтобы не выйти за край: слева прижата, справа прижата, по центру.
 const side=f=>f<.2?' l':f>.8?' r':'';

 /* Линия со шкалой. pts: [{v, x:'подпись оси', tip:'текст подсказки'}] — уже без пустых. */
 function line(pts,{unit='',h=168,label=''}={}){
  if(!pts.length)return '';
  if(pts.length===1)pts=[pts[0],pts[0]];
  const vs=pts.map(p=>p.v),v0=Math.min(...vs),v1=Math.max(...vs),t=ticks(v0-(v1-v0)*.12,v1+(v1-v0)*.04),lo=t[0],hi=t[t.length-1],n=pts.length-1;
  const X=i=>i/n*100,Y=v=>100-(v-lo)/(hi-lo)*100;
  const d=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(2)+' '+Y(p.v).toFixed(2)).join(' ');
  const id='cg'+(++uid),step=100/n,dots=pts.length<=16,last=pts[pts.length-1];
  const grid=t.map((v,i)=>`<span class="ch-cgl${i?'':' base'}" style="top:${pct(Y(v))}"><em>${num(v)}</em></span>`).join('');
  const cols=pts.map((p,i)=>{const l=Math.max(0,X(i)-step/2),r=Math.min(100,X(i)+step/2),c=(X(i)-l)/(r-l)*100;
   return `<span class="ch-ccol${side(i/n)}" tabindex="0" style="left:${pct(l)};width:${pct(r-l)};--cx:${pct(c)}"><i class="ch-cdot${dots?'':' is-hid'}${i===n?' is-last':''}" style="left:${pct(c)};top:${pct(Y(p.v))}"></i><span class="ch-ctip"><b>${num(p.v)}${unit?' '+esc2(unit):''}</b>${p.tip?esc2(p.tip):esc2(p.x)}</span></span>`}).join('');
  const xs=[0,Math.round(n/2),n].filter((v,i,a)=>a.indexOf(v)===i&&(n>=2||v!==Math.round(n/2)));
  return `<figure class="chart ch-cline" role="img" aria-label="${esc2(label||'График')}: последнее ${num(last.v)} ${esc2(unit)}">
 <div class="ch-cplot" style="--h:${h}px"><div class="ch-cin">${grid}
  <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="currentColor" stop-opacity=".16"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></linearGradient></defs>
  <path class="ch-carea" d="${d} L100 100 L0 100 Z" fill="url(#${id})"/><path class="ch-cln" d="${d}"/></svg>
  <span class="ch-clast" style="top:${pct(Y(last.v))}">${num(last.v)}</span>${cols}</div></div>
 <div class="ch-caxis">${xs.map(i=>`<span style="left:${pct(X(i))}"${i===0?' class="l"':i===n?' class="r"':''}>${esc2(pts[i].x)}</span>`).join('')}</div></figure>`}

 /* Столбики от нуля. items: [{v, x:'подпись', tip, now, cls}]; goal — цель пунктиром. */
 function bars(items,{h=120,goal=null,goalLabel='',unit='',label='',values='auto',empty='Пока пусто'}={}){
  const n=items.length;if(!n)return '';
  const max=Math.max(goal||0,...items.map(i=>i.v||0)),top=max>0?ticks(0,max).pop():1;
  const all=values==='all'||(values==='auto'&&n<=12),mi=items.reduce((a,x,i)=>(x.v||0)>(items[a].v||0)?i:a,0);
  const zero=items.every(i=>!i.v);
  const cols=items.map((it,i)=>{const v=it.v||0,show=!zero&&values!=='none'&&(all||it.now||(i===mi&&v>0));
   return `<span class="ch-cbar${it.now?' is-now':''}${v?'':' is-zero'}${it.cls?' '+it.cls:''}${side(n>1?i/(n-1):.5)}" tabindex="0">${show?`<b class="ch-cv">${num(v)}</b>`:''}<i style="height:${pct(v/top*100)}"></i><span class="ch-ctip"><b>${num(v)}${unit?' '+esc2(unit):''}</b>${esc2(it.tip||it.x)}</span></span>`}).join('');
  const g=goal?`<span class="ch-cgoal" style="bottom:${pct(goal/top*100)}"><em>${esc2(goalLabel||num(goal))}</em></span>`:'';
  return `<figure class="chart ch-cbars${n>16?' dense':''}" role="img" aria-label="${esc2(label||'Столбики')}">
 <div class="ch-cplot" style="--h:${h}px"><div class="ch-cin">${g}<div class="ch-ccols">${cols}</div>${zero?`<span class="ch-cempty caption">${esc2(empty)}</span>`:''}</div></div>
 ${n>16?`<div class="ch-caxis">${items.map((it,i)=>it.x?`<span style="left:${pct((i+.5)/n*100)}" class="${i<n*.1?'l':i>n*.9?'r':''}${it.now?' is-now':''}">${esc2(it.x)}</span>`:'').join('')}</div>`:`<div class="ch-cxl">${items.map(it=>`<span class="${it.now?'is-now':''}">${esc2(it.x||'')}</span>`).join('')}</div>`}</figure>`}

 /* Искра для карточки-числа: без осей и подсказок (карточка — сама кнопка, подробности в шторке). */
 function spark(vals,{h=40}={}){const pts=vals.map((v,i)=>[i,v]).filter(p=>p[1]);
  if(pts.length<2)return '<span class="ch-cspark is-empty" aria-hidden="true"></span>';
  const a=pts[0][0],n=(pts[pts.length-1][0]-a)||1,ys=pts.map(p=>p[1]),lo=Math.min(...ys),hi=Math.max(...ys),flat=hi===lo;
  const X=i=>(i-a)/n*100,Y=v=>flat?50:88-(v-lo)/(hi-lo)*76;
  const d=pts.map(([i,v],k)=>(k?'L':'M')+X(i).toFixed(2)+' '+Y(v).toFixed(2)).join(' '),id='cs'+(++uid),l=pts[pts.length-1];
  return `<span class="ch-cspark" style="--h:${h}px" aria-hidden="true"><svg viewBox="0 0 100 100" preserveAspectRatio="none"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="currentColor" stop-opacity=".14"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></linearGradient></defs>${flat?'':`<path class="ch-carea" d="${d} L100 100 L0 100 Z" fill="url(#${id})"/>`}<path class="ch-cln" d="${d}"/></svg><i class="ch-cdot is-last" style="left:${pct(X(l[0]))};top:${pct(Y(l[1]))}"></i></span>`}

 return {line,bars,spark,ticks};
})();

/* ——— Ядро панели администратора ———
   Та же архитектура экрана, что у клиента и тренера:
   1. Правила, меняющие данные, живут в домене (D.ops); экран их только вызывает (А-1).
   2. Данные записываются только через store: проверка → счётчик версии → запись.
   3. Экран — функция состояния, накладывается через morph (core/ui/kit.js).
   4. Разметка не вешает обработчиков: data-action → ACTIONS (14-boot.js).
   5. «Отменить» откатывает ровно своё действие (core/ui/undo.js, А-8).
   Ключ хранилища прежний — у тех, кто уже работает, база на месте. */

const KEY='xeptra.console.v1',REV='xeptra.console.rev',PREFS_KEY='xeptra.prefs',THEME_KEY='xeptra.theme';
// $, $$, esc, clone, readJSON, writeJSON — core/ui/util.js; diff, revert, applyUndo — core/ui/undo.js.

/* Домен администратора сообщает об ошибке исключением; экрану удобнее список, как у клиента. */

let state,loadError='',persistedRaw=null;
{let raw=null;try{raw=localStorage.getItem(KEY)}catch(e){}persistedRaw=raw;

/* ——— шлюз записи ———
   Проверка домена, счётчик версии (чужая вкладка не затирается), запись.
   Кончилось место — своими словами: что случилось, что цело и что делать. */
const revOf=()=>{try{return Number(localStorage.getItem(REV)||0)}catch(e){return 0}};let rev=revOf();
function saveRaw(next){const raw=JSON.stringify(next);
 try{localStorage.setItem(KEY,raw)}catch(e){
  if(e&&(e.name==='QuotaExceededError'||e.name==='NS_ERROR_DOM_QUOTA_REACHED'||e.code===22||e.code===1014))
   return 'В браузере кончилось место для записей. Изменение не сохранено, прежняя база цела. Выгрузите файл смены, а потом очистите базу или освободите место в браузере.';
  return 'Браузер не дал сохранить базу: '+(e&&e.message||'неизвестная причина')+'. Изменение не записано, прежняя база цела.'}
 persistedRaw=raw;return null}
function store(next,{checked=false}={}){
 if(!checked){const err=problems(next);if(err.length)return err}
 if(revOf()>rev){adoptStored();return ['База изменилась в другой вкладке — взяли её версию']}
 const fail=saveRaw(next);if(fail){ui.unsaved=true;return [fail]}
 state=next;rev=revOf()+1;writeJSON(REV,rev);ui.unsaved=false;return null}
function adoptStored(){let raw=null;try{raw=localStorage.getItem(KEY)}catch(e){}
 try{const s=D.migrate(JSON.parse(raw));if(problems(s).length)return false;state=s;persistedRaw=raw;rev=revOf();ui.keep.clear();return true}catch(e){return false}}

/* ——— отмена по действию (А-8) ——— */
const LISTS=['trainers','clients','rules','sessions','tasks','log'],OBJS=['facts','shiftFacts','closed','admin','demo','schema'];
const undos=new Map();let undoSeq=0;

/* commit: копия → операция домена → проверка → запись. Операция, которая отказала
   (бросила ошибку или вернула false/null), ничего не пишет и объясняет почему. */
function commit(fn,{quiet=false,toast:msg=null,fail='Не записано: так нельзя по правилам панели'}={}){
 if(loadError){toast('База не прочиталась — сначала выгрузите исходную запись в Настройках');return false}
 const draft=clone(state);let r;
 try{r=fn(draft)}catch(e){toast(e.message);return false}
 if(r===false||r===null){toast(fail);return false}
 const err=problems(draft);if(err.length){toast(err[0]);return false}
 const patch=diff(state,draft),err2=store(draft,{checked:true});
 if(err2){toast(err2[0]);render();return false}
 if(msg!==false){const id='u'+(++undoSeq);undos.set(id,patch);if(undos.size>20)undos.delete(undos.keys().next().value);toast(msg||say('saved'),{undo:id})}
 if(!quiet)render();
 return r===undefined?true:r}
function op(fn,opts){let out=null;commit(s=>(out=fn(s)),opts);return out}
function undo(id){const p=undos.get(id);if(!p)return;undos.delete(id);
 const n=p.base?p.base:applyUndo(state,p);
 if(problems(n).length){toast('Отменить уже нельзя');return}
 const err=store(n,{checked:true});if(err){toast(err[0]);return}
 loadError='';render();toast(say('undone'))}
/* Замена базы целиком (сброс, демо, загрузка файлом) — одно действие над всей базой:
   её «Отменить» возвращает прежнюю базу целиком. */
function replaceBase(next,message){const err=problems(next);if(err.length){toast(err[0]);return false}
 const prev=loadError?null:state;const fail=saveRaw(next);if(fail){toast(fail);return false}
 state=next;rev=revOf()+1;writeJSON(REV,rev);loadError='';ui.unsaved=false;
 const id='u'+(++undoSeq);if(prev)undos.set(id,{base:prev});
 location.hash='#/console';render();toast(message,prev?{undo:id}:{});return true}

// ——— место в браузере ———
// Не закон, а ориентир: браузеры дают сайту около 5 МБ. Переменная — проверки её подменяют.
let STORAGE_LIMIT=5*1024*1024;
function storageUsed(){let n=0;try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);n+=(k.length+(localStorage.getItem(k)||'').length)*2}}catch(e){}return n}
const storageShare=()=>Math.min(1,storageUsed()/(STORAGE_LIMIT>0?STORAGE_LIMIT:5*1024*1024));
const mb=n=>(n/1048576).toFixed(1).replace('.',',')+' МБ';

// ——— цвет сущности: это данные, а не оформление ———
// Палитра подсказок; выбрать можно любой цвет. Подмешивается к поверхности через --rc.
const PALETTE=['#2F6BED','#00A06A','#7B61FF','#E0533D','#F0A202','#0FA3B1','#C2447E','#8BC220','#5B6B7B','#6E4FF6','#FF7A5C','#1B1B1B'];
const hashColor=key=>{let h=0;for(let i=0;i<String(key).length;i++)h=(h*31+String(key).charCodeAt(i))>>>0;return PALETTE[h%PALETTE.length]};
const classColor=r=>r.color||state.rules.find(x=>x.seriesId===r.seriesId)?.color||hashColor(r.title||r.seriesId||r.id);
const trainerColor=id=>state.trainers.find(t=>t.id===id)?.color||hashColor(id||'—');
const occColor=r=>r.kind==='personal'?trainerColor(r.trainerId):classColor(r);
function nextColor(kind){const used=new Set(state[kind].map(x=>x.color));return PALETTE.find(c=>!used.has(c))||PALETTE[state[kind].length%PALETTE.length]}
/* Цвет — данные: его выбирает человек, и тёмный цвет пропадает на тёмной теме. Поэтому у каждого цвета
   есть «тёмная» пара: тот же тон, поднятый до контраста ≥ 3 к тёмной панели. Какую взять — решает CSS (--rcv). */
function liftDark(c){const m=/^#?([0-9a-f]{6})$/i.exec(String(c||''));if(!m)return c;
 const rgb=[0,2,4].map(i=>parseInt(m[1].slice(i,i+2),16)),lum=a=>{const l=a.map(v=>v/255).map(v=>v<=.03928?v/12.92:((v+.055)/1.055)**2.4);return .2126*l[0]+.7152*l[1]+.0722*l[2]};
 const bg=lum([23,25,28]);let t=0,out=rgb;while(t<=1){out=rgb.map(v=>Math.round(v+(255-v)*t));if((lum(out)+.05)/(bg+.05)>=3)break;t+=.05}
 return '#'+out.map(v=>v.toString(16).padStart(2,'0')).join('')}
const rc=c=>` style="--rc:${esc(c)};--rc-dk:${esc(liftDark(c))}"`;
const dot=c=>`<i class="cdot"${rc(c)}></i>`;

/* Что требует внимания (И-3): занятия без отметки за 7 дней, просроченные обязательные
   пункты смены и прошлые дни, где всё отмечено, но смену не закрыли. У каждого — ответ. */
function attention(){const now=D.now(),today=D.today(),hm=D.hm();
 const occ=D.occurrences(state,D.add(today,-7),today).filter(r=>r.kind==='group'&&r.status==='planned'&&(r.date<today||new Date(r.date+'T'+r.time).getTime()+r.duration*60000<now.getTime()))
  .map(r=>({id:r.id,source:'occ',time:r.date+r.time,title:r.title,detail:`${dateLabel(r.date)} · ${r.time} · ${name(r.trainerId)}`}));
 const tasks=D.tasks(state,today).filter(q=>q.status==='open'&&q.required&&q.time<hm).map(q=>({id:q.key,source:'task',time:today+q.time,title:q.title,detail:'Смена · '+q.time}));

 return [...occ,...tasks,...close].sort((a,b)=>a.time.localeCompare(b.time))}

/* ——— Ядро · голос ———
   Одни и те же смыслы — разными тонами. Источник: голос администратора
   («Спокойная» / «После смены» и свой теневой язык).

   Закон голоса:
   1. Словарь роли: ключ → [тон 0, тон 1, …]. Реплика — строка или функция от чисел.
   2. Тон 0 — рабочий язык по умолчанию. У роли может быть один тон — тогда голос не выбирается.
   3. Свои реплики человек пишет только для не первого тона; {n} — место для числа;
      пустая своя реплика = исходная.
   4. Безопасные зоны — названия разделов, статусы, проверки форм и всё, где можно потерять
      данные, — в словарь голоса не попадают вовсе: они обязаны звучать одинаково в любом тоне.
      Если роль всё же кладёт такой ключ в словарь, она перечисляет его в safe, и ядро
      проверяет, что во всех тонах он одинаков (V.check) и что своей реплики у него нет.
   Настройки голоса (тон, свои реплики) — это рабочее место человека, а не данные (Я-5). */

const V=(()=>{
 const fill=(t,n)=>String(t).replace(/\{n\}/g,n===undefined?'':n);
 function make({dict,tones=['calm'],safe=[],get=()=>({})}){
  const idx=()=>{const t=get().voice;const i=tones.indexOf(t);return i<0?0:i};
  function say(key,...args){const row=dict[key];if(!row)return '';const i=idx();
   if(i>0&&!safe.includes(key)){const own=(get().custom||{})[key];if(typeof own==='string'&&own.trim())return fill(own,args[0])}
   const v=row[Math.min(i,row.length-1)];return typeof v==='function'?v(...args):v}
  // Исходная реплика тона i как текст с {n} на месте числа — для конструктора.
  function text(key,i=1){const v=dict[key]&&dict[key][i];if(v===undefined)return '';return typeof v==='function'?String(v('{n}')):v}
  return {say,text,tones,dict,safe}}
 // Ошибки словаря человеческими словами: безопасный ключ звучит по-разному в разных тонах.
 function check({dict,safe=[]}){const e=[];
  for(const k of safe){const row=dict[k]||[];const s=row.map(v=>typeof v==='function'?String(v(1)):v);if(new Set(s).size>1)e.push(`Безопасная реплика «${k}» звучит по-разному`)}
  return e}
 return {make,check};
})();
if(typeof module!=='undefined')module.exports={V};

/* ——— Звук напоминаний ———
   Сигнал синтезируется на месте: ни файла, ни сети. Настройка — рабочее место человека, в файл смены не уезжает. */
const SOUND_KEY='xeptra.sound';
// Звук синтезируется на месте: ни файла, ни сети. Браузер разрешает звук только
// после первого касания страницы, поэтому контекст создаём на первом же нажатии.
// Пресеты — это форма волны, интервалы нот в полутонах и длина затухания.

// ——— Звук ———
const TONES=[
 ['soft','Мягкий','две ноты, тихо и округло',{wave:'sine',notes:[0,4],gap:.13,dur:.34}],
 ['bell','Колокольчик','через октаву, с длинным хвостом',{wave:'triangle',notes:[0,12],gap:.10,dur:.70}],
 ['wood','Деревянный','короткий сухой стук',{wave:'triangle',notes:[0,7],gap:.07,dur:.16}],
 ['ping','Пинг','одна нота, самое незаметное',{wave:'sine',notes:[7],gap:0,dur:.22}],
 ['chord','Аккорд','три ноты вместе, слышно из коридора',{wave:'sine',notes:[0,4,7],gap:.05,dur:.50}],
];
const VOLUMES=[[20,'Тихо'],[40,'Негромко'],[60,'Средне'],[80,'Заметно'],[100,'Громко']];
const toneDef=id=>(TONES.find(t=>t[0]===id)||TONES[0])[3];
let soundCfg={on:true,tone:'soft',vol:60},audio=null;
try{const raw=localStorage.getItem(SOUND_KEY);
 if(raw==='off')soundCfg.on=false;
 else if(raw&&raw!=='on'){const x=JSON.parse(raw);
  soundCfg={on:x.on!==false,tone:TONES.some(t=>t[0]===x.tone)?x.tone:'soft',
   vol:VOLUMES.some(v=>v[0]===Number(x.vol))?Number(x.vol):60};}
}catch(e){}
function soundSave(){try{localStorage.setItem(SOUND_KEY,JSON.stringify(soundCfg))}catch(e){}}
function audioReady(){
 if(audio||typeof AudioContext==='undefined')return audio;
 try{audio=new AudioContext()}catch(e){audio=null}
 return audio;
}
function chime(kind,force){
 if(!soundCfg.on&&!force)return;
 const ctx=audioReady();if(!ctx)return;
 if(ctx.state==='suspended')ctx.resume?.();
 const p=toneDef(soundCfg.tone),base=kind==='task'?784:622,
  peak=Math.max(.008,soundCfg.vol/100*.14),t0=ctx.currentTime+.01;
 p.notes.forEach((n,i)=>{
  const at=t0+i*p.gap,osc=ctx.createOscillator(),gain=ctx.createGain();
  osc.type=p.wave;osc.frequency.setValueAtTime(base*Math.pow(2,n/12),at);
  gain.gain.setValueAtTime(.0001,at);
  gain.gain.exponentialRampToValueAtTime(peak,at+.02);
  gain.gain.exponentialRampToValueAtTime(.0001,at+p.dur);
  osc.connect(gain);gain.connect(ctx.destination);osc.start(at);osc.stop(at+p.dur+.02);
 });
}

   Экран по-прежнему функция от состояния (правило 2), но новая разметка не
   заменяет старую целиком, а накладывается на неё: совпавшие узлы остаются
   теми же самыми, меняются только атрибуты и текст. Поэтому стекло не
   пересоздаётся (размытие не «моргает»), фокус и прокрутка списков остаются
   на месте, а нажатие ничего не дёргает. */
function morph(root,html){const tpl=document.createElement('template');tpl.innerHTML=html;patchChildren(root,tpl.content)}
function sameNode(a,b){return a.nodeType===b.nodeType&&(a.nodeType!==1||(a.tagName===b.tagName&&(a.getAttribute('data-key')||'')===(b.getAttribute('data-key')||'')))}
function patchChildren(a,b){
 const an=[...a.childNodes],bn=[...b.childNodes];
 bn.forEach((y,i)=>{const x=an[i];if(!x)a.appendChild(y);else if(!sameNode(x,y))a.replaceChild(y,x);else patchNode(x,y)});
 for(let i=bn.length;i<an.length;i++)an[i].remove();
}
function patchNode(x,y){
 if(x.nodeType!==1){if(x.nodeValue!==y.nodeValue)x.nodeValue=y.nodeValue;return}
 for(const {name} of [...x.attributes])if(!y.hasAttribute(name))x.removeAttribute(name);
 for(const {name,value} of [...y.attributes])if(x.getAttribute(name)!==value)x.setAttribute(name,value);
 // Поле, в котором человек сейчас печатает, не трогаем.
 if(x.tagName==='INPUT'){if(x!==document.activeElement&&x.value!==(y.getAttribute('value')??''))x.value=y.getAttribute('value')??'';return}
 if(x.tagName==='TEXTAREA'){if(x!==document.activeElement&&x.value!==y.value)x.value=y.value;return}
 patchChildren(x,y);
}

const MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
let popEl=null,popOwner=null;

// Раскрыто или нет — знает только aria-expanded на кнопке-источнике.
function closePop(){if(!popEl)return;popOwner?.setAttribute('aria-expanded','false');popEl.remove();popEl=null;popOwner=null;
 document.removeEventListener('keydown',popKey,true);document.removeEventListener('scroll',popScroll,true);removeEventListener('resize',popFollow)}
function popKey(e){if(e.key==='Escape'){e.preventDefault();e.stopPropagation();closePop()}}
/* Прокрутка или смена размера экрана (на телефоне — это клавиатура уехала вниз)
   не закрывают выпадающее: оно следует за полем. Закрываем, только если само
   поле ушло за край экрана. */
function popFollow(){if(!popEl||!popOwner)return;const r=popOwner.getBoundingClientRect();
 if(r.bottom<0||r.top>innerHeight||!popOwner.isConnected){closePop();return}placePop(popOwner)}
function popScroll(e){if(popEl&&!popEl.contains(e.target))popFollow()}
function openPop(owner,html,cls){
 closePop();popOwner=owner;owner.setAttribute('aria-expanded','true');
 popEl=document.createElement('div');popEl.className='pop '+cls;popEl.innerHTML=html;
 (owner.closest('dialog')||document.body).appendChild(popEl);placePop(owner);
 const on=popEl.querySelector('.is-on');
 if(on&&popEl.scrollHeight>popEl.clientHeight)popEl.scrollTop=Math.max(0,on.offsetTop-popEl.clientHeight/2+on.offsetHeight/2);
 document.addEventListener('keydown',popKey,true);document.addEventListener('scroll',popScroll,true);addEventListener('resize',popFollow);
 learnSoon();
}
/* Куда раскрывается: по левому краю поля; не помещается справа — по правому;
   вниз, а если внизу тесно — туда, где просторнее. Список получает высоту
   по месту и прокручивается внутри; календарь не сжимается. Начало отсчёта
   меряем, а не угадываем: у шторки есть трансформ, и fixed считается от неё. */
const POP_GAP=6,POP_EDGE=8,POP_MIN=140;
function placePop(anchor){
 const a=anchor.getBoundingClientRect();
 popEl.style.maxHeight='';popEl.style.left='0px';popEl.style.top='0px';
 const base=popEl.getBoundingClientRect(),ox=base.left,oy=base.top;
 const w=Math.min(Math.max(base.width,a.width),innerWidth-POP_EDGE*2);popEl.style.minWidth=Math.min(a.width,w)+'px';
 const below=innerHeight-a.bottom-POP_GAP-POP_EDGE,above=a.top-POP_GAP-POP_EDGE;
 const scrolls=getComputedStyle(popEl).overflowY!=='visible',down=base.height<=below||below>=above;
 let h=base.height;if(scrolls){h=Math.max(POP_MIN,Math.min(h,down?below:above));popEl.style.maxHeight=h+'px'}
 let left=a.left;if(left+w>innerWidth-POP_EDGE)left=a.right-w;
 left=Math.min(Math.max(POP_EDGE,left),Math.max(POP_EDGE,innerWidth-w-POP_EDGE));
 let top=down?a.bottom+POP_GAP:a.top-POP_GAP-h;top=Math.min(Math.max(POP_EDGE,top),Math.max(POP_EDGE,innerHeight-h-POP_EDGE));
 popEl.style.left=(left-ox)+'px';popEl.style.top=(top-oy)+'px';popEl.dataset.side=down?'down':'up';
}
function calHtml(month,selected,allowEmpty){
 const [y,m]=month.split('-').map(Number),first=new Date(y,m-1,1),lead=(first.getDay()||7)-1,days=new Date(y,m,0).getDate();
 const iso=d=>`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
 const prev=m===1?`${y-1}-12`:`${y}-${String(m-1).padStart(2,'0')}`,next=m===12?`${y+1}-01`:`${y}-${String(m+1).padStart(2,'0')}`;
 let cells='';for(let i=0;i<lead;i++)cells+='<span></span>';
 for(let d=1;d<=days;d++){const v=iso(d);cells+=`<button type="button" class="calday${v===selected?' is-on':''}${v===D.today()?' is-today':''}" data-action="cal-set" data-id="${v}">${d}</button>`}
 return `<div class="calhead">${B(I('back',18),'cal-nav',prev,'icon small ghost','aria-label="Прошлый месяц"')}<b>${MONTHS[m-1]} ${y}</b>${B(I('chev',18),'cal-nav',next,'icon small ghost','aria-label="Следующий месяц"')}</div>
 <div class="calwd">${D.WD.map(w=>`<span>${w}</span>`).join('')}</div><div class="calgrid">${cells}</div>
 <div class="calfoot">${B('Сегодня','cal-set',D.today(),'small')}${allowEmpty?B('Без даты','cal-set','none','small ghost'):''}</div>`;
}
function timeHtml(selected){let out='';for(let t=5*60;t<24*60;t+=15){const v=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');out+=`<button type="button" class="popitem${v===selected?' is-on':''}" data-action="time-set" data-id="${v}">${v}</button>`}return out}

function field(label,name,value='',{type='text',ph='',extra=''}={}){return `<label class="field"><span class="label">${label}</span><input name="${name}" type="${type}" value="${esc(value)}" placeholder="${esc(ph)}" ${extra}></label>`}
function area(label,name,value='',ph=''){return `<label class="field"><span class="label">${label}</span><textarea name="${name}" placeholder="${esc(ph)}">${esc(value)}</textarea></label>`}
// Дата и время: скрытое поле держит значение, видимая кнопка — подпись.
function dateField(label,name,value,{allowEmpty=false}={}){return `<div class="field"><span class="label">${label}</span><div class="pick"><input type="hidden" name="${name}" value="${esc(value||'')}"><button type="button" class="pickbtn" data-action="cal" data-empty="${allowEmpty?1:0}" aria-haspopup="dialog" aria-expanded="false">${I('cal',18)}<span>${value?D.fmtDay(value):'Без даты'}</span></button></div></div>`}
function timeField(label,name,value){return `<div class="field"><span class="label">${label}</span><div class="pick"><input type="hidden" name="${name}" value="${esc(value)}"><button type="button" class="pickbtn" data-action="time" aria-haspopup="listbox" aria-expanded="false">${I('clock',18)}<span class="num">${esc(value)}</span></button></div></div>`}
// Сегмент в форме: значение лежит в скрытом поле, кнопки его переключают.
function segField(label,name,items,value,cls=''){return `<div class="field"><span class="label">${label}</span><input type="hidden" name="${name}" value="${esc(value)}"><div class="seg ${cls}" role="radiogroup">${Object.entries(items).map(([k,v])=>`<button type="button" role="radio" aria-checked="${k===value}" class="${k===value?'is-on':''}" data-action="seg" data-id="${esc(k)}">${esc(v)}</button>`).join('')}</div></div>`}
function daysField(label,name,days){return `<div class="field"><span class="label">${label}</span><input type="hidden" name="${name}" value="${days.join(',')}"><div class="chips days">${D.WD.map((w,i)=>`<button type="button" class="chip${days.includes(i)?' is-on':''}" aria-pressed="${days.includes(i)}" data-action="day-toggle" data-id="${i}">${w}</button>`).join('')}</div></div>`}
function formData(form){const o={};for(const el of form.elements)if(el.name)o[el.name]=typeof el.value==='string'?el.value.trim():el.value;return o}

// ——— шторка ———
// На телефоне — снизу во всю ширину, на компьютере — окно по центру.
// Сохранение отдаёт форму функции save; вернула false — шторка остаётся открытой.
/* Две породы шторок (ARCH-AUDIT К11):
   просмотр (view) — функция от состояния, как экран: render накладывает её тело через morph;
   форма (save) — черновик до «Сохранить»: рисуется один раз, введённое не перезаписывается. */
let sheetSave=null,sheetAfter=null,sheetView=null;
function openSheet({title,body,save=null,saveLabel='Сохранить',extra='',wide=false,cancel=true,view=null}){if(view)body=view();
 // Пример только для просмотра: форму, которую нельзя сохранить, не открываем вовсе.
 if(example&&!rehearsal&&save){toast('Это пример — он только для просмотра',{action:{label:'Начать свой',act:'example-exit'}});return}
 closePop();const dlg=$('#sheet');sheetSave=save;sheetView=view;
 // В зале шторка тоже тёмная — без вспышки светлого.
 dlg.className='sheet'+(wide?' sheet--wide':'')+(ui.route==='gym'?' gym':'');
 dlg.innerHTML=`<form class="sheetform" method="dialog" novalidate>
  <header class="sheethead"><i class="grab" aria-hidden="true"></i><h2>${title}</h2>${B(I('close',20),'sheet-close','','icon ghost','aria-label="Закрыть"')}</header>
  <div class="sheetbody">${body}</div>
  ${save||extra?`<footer class="sheetfoot">${extra}<span class="spacer"></span>${cancel?B('Отмена','sheet-close','','ghost'):''}${save?`<button type="submit" class="primary">${saveLabel}</button>`:''}</footer>`:''}
 </form>`;
 if(!dlg.open)dlg.showModal();
 const first=dlg.querySelector('.sheetbody input:not([type=hidden]),.sheetbody textarea');
 // Шторка-просмотр (настройки и т.п.) открывается сверху: фокус на поле ввода утащил бы её вниз.
 if(first&&save&&matchMedia('(hover:hover)').matches)first.focus();else dlg.querySelector('.sheethead button')?.focus({preventScroll:true});
 learnSoon();setTimeout(learnSoon,380); // и ещё раз, когда шторка доехала: во время въезда она сдвинута
}
// Шторка-просмотр следует за данными; пустой просмотр (null) — шторка закрывается сама.
function sheetRender(){const dlg=$('#sheet');if(!dlg.open||!sheetView)return;const html=sheetView();if(html===null){closeSheet();return}const b=dlg.querySelector('.sheetbody');if(b)morph(b,html)}
function closeSheet(){closePop();const dlg=$('#sheet');sheetView=null;if(!dlg.open)return;dlg.classList.add('is-closing');
 setTimeout(()=>{dlg.classList.remove('is-closing');dlg.close();dlg.innerHTML='';sheetSave=null;learnSoon();if(sheetAfter){const f=sheetAfter;sheetAfter=null;f()}},200)}
function confirmSheet(title,text,label,run){
 openSheet({title,body:`<p class="confirm">${text}</p>`,save:()=>{run();return true},saveLabel:label});
 $('#sheet button[type=submit]')?.classList.add('danger');
}
// Поля, которые нужны только при определённом выборе: data-show="имя=значение".
function syncShow(){$$('#sheet [data-show]').forEach(el=>{const [n,v]=el.dataset.show.split('=');el.hidden=$(`#sheet [name="${n}"]`)?.value!==v})}
// Число с кнопками «−/+» (в формах и в «В зале»): data-step — шаг, data-min — нижняя граница.
function stepField(label,name,value,step,{unit='',min=0,big=false}={}){
 return `<div class="field stepfield${big?' big':''}"><span class="label">${label}</span><div class="stepper">${B(I('minus',big?26:20),'step',name,'icon lone',`data-d="${-step}" data-min="${min}" aria-label="Минус ${step}"`)}
  <label class="stepval"><input name="${name}" inputmode="decimal" value="${esc(numText(value))}" aria-label="${esc(label)}">${unit?`<span>${esc(unit)}</span>`:''}</label>
  ${B(I('plus',big?26:20),'step',name,'icon lone',`data-d="${step}" data-min="${min}" aria-label="Плюс ${step}"`)}</div></div>`}


/* ——— «Пульт»: главный экран администратора ———
   Один вопрос роли: кто сейчас в клубе и что не отмечено (И-6).
   Сверху — напоминание (одно, по очереди) и подсказка знакомства; ниже — числа дня,
   то, что требует внимания (у каждого пункта — ответ, И-3), ритм дня и своя смена. */

function consoleScene(){const s=state,t=D.today(),hm=D.hm(),mins=D.now().getHours()*60+D.now().getMinutes();
 const all=D.occurrences(s,t,t),groups=all.filter(r=>r.kind==='group'),personal=all.length-groups.length;
 const live=groups.filter(r=>{const [h,m]=r.time.split(':').map(Number);return r.status!=='cancelled'&&h*60+m<=mins&&h*60+m+r.duration>mins});
 const next=groups.find(r=>r.time>hm&&r.status==='planned'),q=D.tasks(s,t),done=q.filter(x=>x.status!=='open').length,a=attention();
 const kicker=D.now().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
 const sub=[groups.length?`${groups.length} ${plural(groups.length,'групповое','групповых','групповых')}`:'Групповых нет',
  personal?`${personal} ${plural(personal,'персональная','персональные','персональных')}`:'',a.length?`требует внимания: ${a.length}`:''].filter(Boolean).join(' · ');
 const acts=shows('admin.paste')?B(I('plus',18)+'<span>Посещаемость</span>','paste','group','ghost')+B(I('plus',18)+'<span>Персональные</span>','paste','personal','primary'):B(I('plus',18)+'<span>Тренировка</span>','personal-new','','primary');
 return `<section class="scene">${sceneHead(kicker,greet(),sub,acts)}
 ${banners()}${remindCard()}${guideCard()}
 ${tiles([
  ['Идёт сейчас',live.length?`${live.length} ${plural(live.length,'занятие','занятия','занятий')}`:say('pause'),live[0]?.title||say('pauseSub')],
  ['Требует внимания',a.length,a.length?say(a.length===1?'attentionOne':a.length<5?'attentionFew':'attentionMany'):say('attentionSub'),a.length?'warn':''],
  ['Следующее',next?.time||'—',next?.title||say('nextNone')],
  ['Смена',`${done} / ${q.length}`,groups.length&&groups.every(r=>r.status!=='planned')?say('dayAllMarked'):say('shiftSub')]])}
 <div class="cols"><div class="stack">${attentionPanel(a)}${rhythmPanel(groups)}</div>
 <div class="stack">${myShiftPanel(q)}${tomorrowPanel()}</div></div></section>`}

 if(loadError)out.push(`<div class="banner card warn" data-key="loaderr"><span class="qico">${I('flag',18)}</span><div class="grow"><b>База не прочиталась</b><span class="meta">${esc(loadError)}</span></div>${B('Выгрузить исходную','backup','','small primary')}</div>`);

 if(state.demo&&!loadError&&ui.route==='console')out.push(`<div class="banner card" data-key="demo"><div class="grow"><b>Демонстрационная база</b><span class="meta">Данные для знакомства: тренеры, сетка и месяц отметок.</span></div>${B('Начать работу','reset','empty','small primary')}</div>`);

// Пункт смены: галочка — выполнено; «Не вышло» — с причиной.
function taskRow(q){const when=q.recordedAt?new Date(q.recordedAt).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}):'';
 const locked=D.frozen(state,q.date);
 const state_=q.status==='done'?`Выполнено${when?' · '+when:''}`:q.status==='skipped'?`Не вышло${q.reason?' · '+esc(q.reason):''}`:`${q.required?'Обязательный':'Плановый'}`;
 return `<div class="row trow is-${q.status}" data-key="q${q.key}"><button type="button" class="tick${q.status==='done'?' is-on':''}" data-action="task-done" data-id="${esc(q.key)}" aria-pressed="${q.status==='done'}" aria-label="${q.status==='done'?'Вернуть в открытые':'Выполнено'}: ${esc(q.title)}"${locked?' disabled':''}>${q.status==='done'?I('check',16):q.status==='skipped'?I('minus',16):''}</button>
 <div class="rbody"><span class="rt">${esc(q.title)}</span><span class="rm${q.status==='skipped'?' warn':''}"><b class="num">${esc(q.time)}</b> · ${state_}</span></div>
 ${locked?'':B(I(q.status==='open'?'skip':'edit',18),'task',q.key,'icon ghost small',`aria-label="${q.status==='open'?'Не вышло':'Изменить'}" title="${q.status==='open'?'Не вышло':'Изменить'}"`)}</div>`}

 const just=q.find(x=>x.key===lastTask&&x.status!=='open'),open=q.filter(x=>x.status==='open').slice(0,just?2:3);
 const closed=q.filter(x=>x.status!=='open'&&x.key!==lastTask).sort((a,b)=>String(b.recordedAt||'').localeCompare(String(a.recordedAt||'')));
 const list=(just?[just,...open]:open);const shown=list.concat(closed.slice(0,Math.max(0,3-list.length)));
 return panel('Моя смена',q.length?`<div class="progline"><b class="num">${done}<span> / ${q.length}</span></b><div class="aprog"><i style="width:${Math.round(done/q.length*100)}%"></i></div><span class="meta">${q.length-done?`${q.length-done} ${plural(q.length-done,'пункт','пункта','пунктов')} осталось`:say('shiftAllRequired')}</span></div><div class="rows">${shown.map(taskRow).join('')}</div>`
  :empty('tasks','Маршрута на сегодня нет','Опишите маршрут смены в справочнике — панель будет напоминать и считать итоги.',B('Маршрут','go-dir','tasks','small ghost')),{act:B('Вся смена','go','shift','small ghost'),key:'myshift'})}

/* ——— Напоминания ———
   Очередь: обязательный пункт маршрута, чьё время прошло, и групповое занятие без отметки
   через 10 минут после конца. Строго по одному, со звуком; «Позже» — на 10 минут. */
const REMIND_GRACE=10*60000;
let snoozed={};
/* Сигнал напоминания не зависит от того, какой раздел открыт и открыта ли шторка:
   раз в 20 секунд проверяем очередь; первое новое — звук, системное уведомление (если вкладка
   свёрнута) и тост со входом на Пульт, если человек не на нём. Уже прозвучавшее помним до конца
   дня в браузере — вторая вкладка не звенит второй раз. «Позже» — новое звучание через 10 минут. */
const FIRED_KEY='xeptra.console.fired';
function remindTick(){if(loadError)return;const x=pendingReminders()[0];if(!x)return;
 const t=D.today();let f=readJSON(FIRED_KEY);if(!f||f.date!==t)f={date:t,ids:[]};
 const k=x.key+(snoozed[x.key]?'@'+snoozed[x.key]:'');if(f.ids.includes(k))return;
 f.ids.push(k);writeJSON(FIRED_KEY,f);
 const title=x.kind==='task'?`${x.q.time} · ${x.q.title}`:`${x.r.time} · ${x.r.title}: сколько пришло?`;
 chime(x.kind);NOTIFY.show(title,x.kind==='task'?'Пункт маршрута смены':'Занятие прошло — отметьте посещаемость',k);
 if(ui.route==='console')render();
 else toast(title,{action:{label:'На Пульт',act:'go',id:'console'}})}
function pendingReminders(){if(loadError)return [];
 const now=D.now().getTime(),today=D.today(),hm=D.hm(),out=[];
 D.tasks(state,today).filter(x=>x.required&&x.status==='open'&&x.time<=hm).forEach(q=>out.push({key:'task:'+q.key,at:q.time,kind:'task',q}));
 D.occurrences(state,today,today).filter(r=>r.kind==='group'&&r.status==='planned'&&new Date(r.date+'T'+r.time).getTime()+(Number(r.duration)||60)*60000+REMIND_GRACE<=now)
  .forEach(r=>out.push({key:'occ:'+r.id,at:r.time,kind:'occ',r}));
 return out.sort((a,b)=>a.at.localeCompare(b.at)).filter(x=>!(snoozed[x.key]>now))}
function taskMood(q){const n=D.now(),late=n.getHours()*60+n.getMinutes()-(+q.time.slice(0,2)*60+ +q.time.slice(3));
 return say(late>180?'remindTaskAbsurd':late>60?'remindTaskOld':'remindTaskFresh')}
function remindCard(){const list=pendingReminders();if(!list.length)return '';const x=list[0],left=list.length-1;
 const tail=left?`<span class="meta">${esc(say('remindQueue',left))}</span>`:'';
 if(x.kind==='task'){const q=x.q;
  return `<div class="qcard card remind" data-key="rm${x.key}"><span class="qico">${I('bell',18)}</span><p class="grow"><b>${esc(q.time)} · ${esc(q.title)}</b> <span class="meta">${esc(taskMood(q))}</span>${tail}</p>
  <div class="btnrow">${B(I('clock',18),'remind-later',x.key,'icon ghost small','aria-label="Позже" title="Позже"')}${B(I('skip',18),'task',q.key,'icon ghost small','aria-label="Не вышло" title="Не вышло"')}${B('Выполнено','task-done',q.key,'small primary')}</div></div>`}
 const r=x.r;
 return `<div class="qcard card remind" data-key="rm${x.key}"${rc(classColor(r))}><span class="qico">${I('bell',18)}</span><p class="grow"><b>${esc(r.time)} · ${esc(r.title)} прошло — сколько человек?</b> <span class="meta">${esc(say('remindOcc'))}</span>${tail}</p>
 <div class="btnrow">${B(I('clock',18),'remind-later',x.key,'icon ghost small','aria-label="Позже" title="Позже"')}${B('Отменено','remind-cancel',r.id,'small ghost')}${B('Отметить','occ',r.id,'small primary')}</div></div>`}
