// Таблица на всю карточку (CLUB-CORE §16): слева — кто (текстовые колонки), справа — сколько (числовые).
// Ширина делится по весу: текст 2 части, число 1 часть — колонки ровно заполняют карточку, чисел не жмёт в середину.
// Числовая колонка (td.num в первой строке) и её заголовок выровнены вправо. В узкой карточке строка
// таблицы становится карточкой-строкой: имя, под ним текст, числа с подписью колонки (data-l).
function table(head,rows,emptyText){const cells=r=>[...r.matchAll(/<td[^>]*>[\s\S]*?<\/td>/g)].map(m=>m[0]);
 const first=cells(rows[0]||''),nums=head.map((_,i)=>/^<td[^>]*class="[^"]*\bnum\b/.test(first[i]||''));
 const order=[...head.keys()].filter(i=>!nums[i]).concat([...head.keys()].filter(i=>nums[i]));
 const wt=order.map(i=>nums[i]?1:2),sum=wt.reduce((a,b)=>a+b,0);
 const lab=i=>esc(String(head[i]).replace(/<[^>]*>/g,''));
 const body=rows.map(r=>{const c=cells(r);return c.length===head.length?r.replace(/<td[\s\S]*<\/td>/,order.map(i=>c[i].replace(/^<td/,`<td data-l="${lab(i)}"`).replace(/^(<td[^>]*?)((?: class="[^"]*")?)>\s*—\s*<\/td>$/,(m,t,cl)=>cl?m.replace(/class="/,'class="nil '):`${t} class="nil">—</td>`)).join('')):r});
 return `<div class="tscroll"><table class="atable" style="--cols:${head.length}"><colgroup>${order.map((i,k)=>`<col style="width:${Math.round(wt[k]/sum*1000)/10}%">`).join('')}</colgroup><thead><tr>${order.map(i=>`<th${nums[i]?' class="num"':''}>${head[i]}</th>`).join('')}</tr></thead><tbody>${rows.length?body.join(''):`<tr><td colspan="${head.length}" class="meta">${emptyText}</td></tr>`}</tbody></table></div>`}

function totalsPanels(rows,a,b){const days=[];for(let d=a;d<=b;d=D.add(d,1))days.push(d);
 if(!rows.length)return panel(ui.kind==='personal'?'Персональные за месяц':'Итоги за месяц',empty('progress',ui.kind==='personal'?'За этот месяц персональных записей нет':say('jNoMarks'),'Выберите другой месяц стрелками или снимите фильтр по тренеру.'),{key:'jtot'});
 if(ui.kind==='personal'){
  const byT=state.trainers.map(t=>{const mine=rows.filter(x=>x.trainerId===t.id),ok=mine.filter(x=>x.status==='completed');
   return mine.length?`<tr><td>${esc(t.name)}</td><td class="num">${mine.length}</td><td class="num">${hours(ok.reduce((x,r)=>x+r.duration,0))}</td><td class="num">${new Set(ok.map(x=>x.clientId)).size}</td></tr>`:''}).filter(Boolean);
  const byC=state.clients.map(c=>{const mine=rows.filter(x=>x.clientId===c.id),ok=mine.filter(x=>x.status==='completed');
   return mine.length?`<tr><td>${esc(c.name)}</td><td class="num">${mine.length}</td><td class="num">${hours(ok.reduce((x,r)=>x+r.duration,0))}</td><td>${c.trainerId?esc(name(c.trainerId)):'—'}</td></tr>`:''}).filter(Boolean);
  return panel('Проведено по дням',monthBars(days,days.map(d=>rows.filter(x=>x.date===d&&x.status==='completed').length),'Проведено по дням'),{key:'jbars'})
   +panel('По тренерам',table(['Тренер','Тренировок','Часы','Клиентов'],byT,'Персональных в периоде нет'),{key:'jbyt'})
   +panel('По клиентам',table(['Клиент','Тренировок','Часы','Тренер'],byC,'Персональных в периоде нет'),{key:'jbyc'})}
 const byT=state.trainers.map(t=>{const s=D.stats(rows.filter(x=>x.trainerId===t.id));return s.total?`<tr><td>${esc(t.name)}</td><td class="num">${s.done}</td><td class="num">${hours(s.minutes)}</td><td class="num">${s.visits}</td><td class="num">${s.rate===null?'—':s.rate+'%'}</td></tr>`:''}).filter(Boolean);
 return panel('Посещения по дням',monthBars(days,days.map(d=>D.stats(rows.filter(x=>x.date===d)).visits),'Посещения по дням'),{key:'jbars'})
  +panel('По тренерам',table(['Тренер','Проведено','Часы','Посещения','Заполняемость'],byT,'Тренеров в справочнике нет'),{key:'jbyt'})}

/* ——— «Смена»: маршрут дня и его закрытие ———
   Период роли — день смены (А-3). Закрывают наступивший день, когда в нём не осталось
   вопросов; закрытый день заморожен законом ядра и показывает свою сводку — ту, что ушла дальше. */

const SV=()=>[['day','День'],['totals','Итоги']].filter(([k])=>shows('admin.shift.'+k));
function shiftScene(){const q=D.tasks(state,ui.date);
 const acts=ui.sv==='totals'&&shows('admin.export')?B(I('download',18)+'<span>Таблица</span>','export','','ghost'):'';
 return `<section class="scene">${sceneHead('Маршрут администратора','Смена','',acts)}
 ${banners()}
 <div class="toolbar">${SV().length>1?seg('sv',SV(),ui.sv,'','Вид'):''}${ui.sv==='day'?B(ui.onlyOpen?'Показать все':'Только открытые','only-open','','chip'+(ui.onlyOpen?' is-on':''),`aria-pressed="${ui.onlyOpen}"`):''}</div>
 ${dateNav()}
 ${ui.sv==='totals'?shiftTotals():shiftDay(q)}</section>`}

function shiftDay(q){const done=q.filter(x=>x.status==='done').length,skipped=q.filter(x=>x.status==='skipped').length,important=q.filter(t=>t.required&&t.status==='open').length;
 const blocks=[['open','Открытие клуба'],['day','В течение дня'],['close','Закрытие клуба']].map(([k,label])=>{const items=q.filter(t=>t.block===k&&(!ui.onlyOpen||t.status==='open'));
  return panel(label,items.length?`<div class="rows">${items.map(taskRow).join('')}</div>`:empty('tasks',ui.onlyOpen?say('shiftEmpty'):'Пунктов на эту дату нет',ui.onlyOpen?say('shiftEmptySub'):''),{tag:items.length||'',key:'b'+k})}).join('');
 return tiles([['Закрыто пунктов',`${done+skipped} / ${q.length}`,q.length&&done+skipped===q.length?say('shiftAllRequired'):q.length-done-skipped===1?say('shiftOne'):'на выбранную дату'],
  ['Выполнено',done,say('sDoneSub')],['Важных открыто',important,say('sImportantSub',important),important?'warn':''],['Не вышло',skipped,'с указанной причиной']])
  +`<div class="cols"><div class="stack">${blocks}</div><div class="stack">${closePanel(ui.date)}</div></div>`}

/* Закрытие смены: что осталось без ответа — или кнопка; закрытая — её сводка. */
function closePanel(date){const c=state.closed&&state.closed[date];
 if(c)return panel('Смена закрыта',`<p class="meta">${I('check',14)} ${esc(dateLabel(date))} · ${esc(new Date(c.at).toTimeString().slice(0,5))}${c.by?' · '+esc(c.by):''}</p><pre class="review">${esc(c.report)}</pre>
  <p class="caption footnote">Закрытый день не меняется: сводка — та, что ушла следующему администратору.</p>`,{tag:'закрыта',key:'close'});
 const st=D.closeState(state,date);
 if(date>D.today())return panel('Закрыть смену',`<p class="meta">Этот день ещё не наступил — будущую смену не закрывают.</p>`,{tag:'впереди',key:'close'});
 const r=D.dayReview(state,date);
 const body=`<div class="tiles"><div class="tile"><span class="kicker">Групповые</span><b class="num">${r.groups.done+r.groups.cancelled}<span> / ${r.groups.total}</span></b><span class="meta">отмечено</span></div>
  <div class="tile"><span class="kicker">Маршрут</span><b class="num">${r.tasks.done+r.tasks.skipped}<span> / ${r.tasks.total}</span></b><span class="meta">с ответом</span></div></div>
  <div class="dfoot"><span class="meta grow">${st.ok?`Всё отмечено${infoBtn('После закрытия день не меняется, а его сводка уходит следующему администратору.')}`:esc(st.why)}</span>${B('Закрыть смену','shift-close',date,'primary'+(st.ok?'':' is-off'))}</div>`;
 return panel('Закрыть смену',body,{tag:'открыта',key:'close'})}

function shiftTotals(){const [a,b]=range('totals'),facts=Object.values(state.shiftFacts).filter(f=>f.date>=a&&f.date<=b&&f.status!=='open'),dates=[...new Set(facts.map(f=>f.date))].sort();
 const done=facts.filter(f=>f.status==='done').length,closedDays=Object.keys(state.closed||{}).filter(d=>d>=a&&d<=b).length;
 const rows=dates.map(d=>{const fs=facts.filter(f=>f.date===d);return `<tr><td>${esc(dateLabel(d))}${state.closed?.[d]?` <span class="astatus is-ok">закрыта</span>`:''}</td><td class="num">${fs.filter(f=>f.status==='done').length}</td><td class="num">${fs.filter(f=>f.status==='skipped').length}</td><td>${esc(fs.filter(f=>f.reason).map(f=>f.reason).join('; '))||'—'}</td></tr>`});
 return tiles([['Выполнено',done,'за месяц'],['Дней с отметками',dates.length,'смены'],['Смен закрыто',closedDays,'за месяц'],['Не вышло',facts.length-done,'с указанной причиной']])
  +panel('Итоги смен за месяц',dates.length?table(['Дата','Выполнено','Не вышло','Причины'],rows,''):empty('tasks','За этот месяц отметок смены нет','Пункты маршрута отмечаются на виде «День».'),{key:'stot'})}

/* ——— «Справочник»: люди и структура ———
   Тренеры, клиенты, сетка, персональные, маршрут. Люди правятся на месте, шаблоны
   (сетка, маршрут) — версиями с даты: прошлое не переписывается (А-2). */

const DIR={trainers:['Тренеры','Тренер'],clients:['Клиенты','Клиент'],rules:['Сетка','Занятие'],personal:['Персональные','Тренировка'],tasks:['Маршрут','Пункт']};
// Разделы справочника — участки контракта показа: сетку и маршрут правит старшая ступень.
const DIR_SLOT={trainers:'admin.dir.people',clients:'admin.dir.people',rules:'admin.dir.grid',personal:'admin.dir.personal',tasks:'admin.dir.route'};
const dirKeys=()=>Object.keys(DIR).filter(k=>shows(DIR_SLOT[k]));
const WEEKDAYS=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
// Ищем по тому, что человек видит в строке, а не только по названию.
function haystack(kind,r){const parts=[r.name||r.title||''];
 if(kind==='clients'&&r.trainerId)parts.push(name(r.trainerId));
 if(kind==='rules')parts.push(name(r.trainerId),r.room||'');
 if(kind==='tasks')parts.push(r.role||'');
 if(kind==='trainers')parts.push(roleLabel(r));
 if(kind==='personal')parts.push(name(r.clientId,'clients'),name(r.trainerId));
 return P.norm(parts.join(' '))}

function directoryScene(){const k=ui.dv;
 const add=k==='personal'?B(I('plus',18)+'<span>Тренировка</span>','personal-new','','primary'):B(I('plus',18)+`<span>${DIR[k][1]}</span>`,'entity-new',k,'primary');
 const filters=k==='trainers'?seg('role',[['','Все'],['group','Групповые'],['personal','Персональные']],ui.role,'mini','Что ведёт')
  :k==='clients'?ownerFilter():k==='personal'&&shows('admin.paste')?B(I('plus',16)+'Из мессенджера','paste','personal','small ghost'):'';
 return `<section class="scene">${sceneHead('Люди и структура','Справочник','',add)}
 ${banners()}
 <div class="toolbar">${seg('dv',dirKeys().map(key=>[key,DIR[key][0]]),k,'dseg','Раздел справочника')}</div>
 <div class="toolbar"><label class="searchbox fieldbox">${I('search',18)}<input id="dsearch" type="search" placeholder="Поиск" value="${esc(ui.q)}" aria-label="Поиск по справочнику" autocomplete="off"></label>${filters}</div>
 ${k==='personal'?personalList():k==='rules'?gridList():k==='tasks'?routeList():peopleList(k)}</section>`}

function ownerFilter(){const used=new Map();state.clients.forEach(c=>{if(c.trainerId)used.set(c.trainerId,(used.get(c.trainerId)||0)+1)});
 const loose=state.clients.filter(c=>!c.trainerId).length;
 const items=[['','Все тренеры'],...state.trainers.filter(t=>used.has(t.id)).map(t=>[t.id,t.name+' · '+used.get(t.id)]),...(loose?[['none','Без закрепления · '+loose]]:[])];
 return filterBtn('owner',items,ui.owner)}

const match=(kind,r)=>!ui.q||haystack(kind,r).includes(P.norm(ui.q));
function peopleList(kind){let list=state[kind].filter(r=>match(kind,r));
 if(kind==='trainers'&&ui.role)list=list.filter(t=>D.can(t,ui.role));
 if(kind==='clients'&&ui.owner)list=list.filter(c=>ui.owner==='none'?!c.trainerId:c.trainerId===ui.owner);
 list=list.slice().sort((a,b)=>(a.active===false)-(b.active===false)||a.name.localeCompare(b.name,'ru'));
 const week=D.occurrences(state,D.today(),D.add(D.today(),6));
 const row=r=>{const color=kind==='trainers'?trainerColor(r.id):r.trainerId?trainerColor(r.trainerId):'';
  const meta=kind==='trainers'?(()=>{const n=week.filter(x=>x.trainerId===r.id).length;return `${roleLabel(r)} · ${n} ${plural(n,'занятие','занятия','занятий')} за 7 дней`})()
   :(r.trainerId?`${dot(trainerColor(r.trainerId))}${esc(name(r.trainerId))}`:'Без закрепления')+(r.note?' · '+esc(r.note):'');
  return `<div class="row drow${r.active===false?' is-archived':''}" data-key="${kind}${r.id}"${color?rc(color):''}><span class="avatar tint">${esc(initials(r.name))}</span>
  <button type="button" class="rbody" data-action="entity-edit" data-id="${esc(r.id)}" data-kind="${kind}"><span class="rt">${esc(r.name)}${r.active===false?' <span class="rtag">в архиве</span>':''}</span><span class="rm">${meta}</span></button>${chev()}</div>`};
 const none=state[kind].length?empty('coach','Никого не нашли','Измените поиск или фильтр.'):empty('coach',kind==='trainers'?'Тренеров пока нет':'Клиентов пока нет',kind==='trainers'?'Тренер — точка, к которой привязано всё остальное.':'Клиенты нужны для персональных тренировок.',B(I('plus',16)+DIR[kind][1],'entity-new',kind,'small primary'));
 return panel(DIR[kind][0],list.length?`<div class="rows">${list.map(row).join('')}</div>`:none,{tag:list.length||'',key:'dl'+kind})}

const current=list=>list.filter(r=>!r.to||r.to>=D.today());
function gridList(){const list=current(state.rules).filter(r=>match('rules',r));
 const out=WEEKDAYS.map((label,i)=>{const items=list.filter(r=>r.weekday===i+1).sort((a,b)=>a.time.localeCompare(b.time));
  return items.length?panel(label,`<div class="rows">${items.map(r=>`<div class="row arow" data-key="r${r.id}"${rc(classColor(r))}><span class="tslot num">${esc(r.time)}</span><i class="abar"></i>
  <button type="button" class="rbody" data-action="entity-edit" data-id="${esc(r.id)}" data-kind="rules"><span class="rt">${esc(r.title)}${r.from>D.today()?' <span class="rtag">будущая версия</span>':''}</span>
  <span class="rm">${dot(trainerColor(r.trainerId))}${esc(name(r.trainerId))} · ${r.capacity} мест · ${r.duration} мин · ${esc(r.room)} · с ${esc(D.fmtShort(r.from))}</span></button>${chev()}</div>`).join('')}</div>`,{tag:items.length,key:'g'+i}):''}).join('');
 return out||panel('Групповая сетка',empty('cal','Занятий в сетке нет','Одна строка — один день недели. Добавьте занятие кнопкой вверху.'),{key:'gnone'})}

function routeList(){const list=current(state.tasks).filter(r=>match('tasks',r)),short=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
 const out=[['open','Открытие клуба'],['day','В течение дня'],['close','Закрытие клуба']].map(([k,label])=>{const items=list.filter(r=>r.block===k).sort((a,b)=>a.time.localeCompare(b.time));
  return items.length?panel(label,`<div class="rows">${items.map(r=>`<div class="row" data-key="t${r.id}"><span class="tslot num">${esc(r.time)}</span>
  <button type="button" class="rbody" data-action="entity-edit" data-id="${esc(r.id)}" data-kind="tasks"><span class="rt">${esc(r.title)}${r.from>D.today()?' <span class="rtag">будущая версия</span>':''}</span>
  <span class="rm">${esc(r.role)} · ${r.required?'обязательный':'плановый'} · ${r.weekdays.length===7?'ежедневно':r.weekdays.slice().sort().map(d=>short[d-1]).join(', ')} · с ${esc(D.fmtShort(r.from))}</span></button>${chev()}</div>`).join('')}</div>`,{tag:items.length,key:'rb'+k}):''}).join('');
 return out||panel('Маршрут смены',empty('tasks','Маршрут пуст','Добавьте первый пункт кнопкой вверху.'),{key:'rnone'})}

function personalList(){const t=D.today(),all=state.sessions.filter(p=>match('personal',p)),week=D.add(t,-6),month=t.slice(0,7);
 const inWeek=all.filter(p=>p.date>=week&&p.date<=t),inMonth=all.filter(p=>p.date.slice(0,7)===month),todays=all.filter(p=>p.date===t);
 const sorted=all.slice().sort((a,b)=>b.date.localeCompare(a.date)||a.time.localeCompare(b.time)),earlier=sorted.filter(p=>p.date<t).slice(0,40);
 const withDays=arr=>{let day='',out='';for(const p of arr){if(p.date!==day){day=p.date;out+=`<div class="daysep" data-key="ds${day}"><b>${esc(D.fmtDay(day))}</b></div>`}out+=occRow({...p,kind:'personal'})}return out};
 return tiles([['Сегодня',todays.length,plural(todays.length,'тренировка','тренировки','тренировок')],['За 7 дней',inWeek.length,'тренировок'],['За месяц',inMonth.length,hours(inMonth.reduce((a,p)=>a+p.duration,0))+' ч'],['Клиентов',new Set(inMonth.map(p=>p.clientId)).size,'за месяц']])
  +panel('Сегодня',todays.length?`<div class="rows">${todays.map(p=>occRow({...p,kind:'personal'})).join('')}</div>`:empty('clock',say('personalEmptyToday'),say('personalEmptySub')),{tag:todays.length||'',key:'ptoday'})
  +(earlier.length?panel('Раньше',`<div class="rows">${withDays(earlier)}</div>`,{act:B('Журнал','journal-personal','','small ghost'),key:'pearly'}):'')}

/* ——— Формы: шторки ядра ———
   Занятие, персональная запись, пункт смены, справочник. Шторка — черновик до «Сохранить»;
   сохранение — одна операция домена через commit (А-1). Отказ домена остаётся в шторке
   и объясняется словами домена; шторка не закрывается. */

// Выбор из списка: скрытое поле держит значение, кнопка раскрывает список ядра.
function chooseField(label,name,items,value,{hint=''}={}){const it=items.find(([k])=>k===value)||items[0]||['',''];
 return `<div class="field"><span class="label">${label}</span><div class="pick"><input type="hidden" name="${name}" value="${esc(it[0])}"><button type="button" class="pickbtn" data-action="pick" data-items="${esc(JSON.stringify(items))}" aria-haspopup="listbox" aria-expanded="false">${I('down',16)}<span>${esc(it[1])}</span></button></div>${hint?`<span class="caption">${hint}</span>`:''}</div>`}
function pickList(items,cur){return items.map(([k,v])=>`<button type="button" class="popitem${k===cur?' is-on':''}" data-action="pick-set" data-id="${esc(k)}">${esc(v)}</button>`).join('')}
// Цвет сущности — из палитры подсказок. Это данные: подмешивается к строкам тренера и занятия.
function colorField(label,name,value){return `<div class="field"><span class="label">${label}</span><input type="hidden" name="${name}" value="${esc(value)}">
 <div class="swatches">${PALETTE.map(c=>`<button type="button" class="swatch${c.toLowerCase()===String(value).toLowerCase()?' is-on':''}" data-action="swatch" data-id="${c}" aria-pressed="${c.toLowerCase()===String(value).toLowerCase()}" aria-label="Цвет ${c}"${rc(c)}></button>`).join('')}</div></div>`}
// Сохранение с доменом: ошибка — тостом, шторка остаётся открытой.
const saveWith=(fn,opts)=>commit(fn,opts)!==false;

/* ——— занятие: групповое или персональное ——— */
function occSheet(id){const r0=findOcc(id);if(!r0)return;const r={...r0,kind:r0.kind||'personal'},locked=D.frozen(state,r.date);
 const head=`<p class="meta">${esc(D.fmtDay(r.date))} · ${esc(r.time)} · ${esc(r.room)}${locked?' · смена закрыта — день не меняется':''}</p>`;
 if(r.kind==='group'){
  const status=r.status==='planned'?'completed':r.status;
  openSheet({title:esc(r.title),body:head+segField('Статус','status',{completed:'Проведено',cancelled:'Отменено',planned:'Не отмечено'},status)
   +`<div data-show="status=completed">${stepField('Пришло участников','attendance',r.attendance??'',1,{unit:`из ${r.capacity}`})}<p class="caption">0 — занятие было, никто не пришёл. Пусто — ещё не отмечено.</p></div>`
   +chooseField('Фактический тренер','trainerId',trainersFor('group',r.trainerId),r.trainerId)+field('Комментарий','note',r.note||'',{ph:'Замена, перенос зала…'}),
   save:f=>saveWith(s=>D.ops.saveOcc(s,r,{status:f.status,attendance:f.status==='completed'?String(f.attendance??''):'',trainerId:f.trainerId,note:f.note}),{toast:f.status==='completed'?`${r.title}: пришло ${f.attendance||0}`:f.status==='cancelled'?`${r.title}: отменено`:'Отметка снята'})});
  syncShow();return}
 openSheet({title:esc(name(r.clientId,'clients')),body:head+segField('Как прошло','status',{completed:'Проведено',no_show:'Неявка',cancelled:'Отменено'},r.status||'completed')
  +`<div class="fields two">${dateField('Дата','date',r.date)}${timeField('Время','time',r.time)}</div>`
  +chooseField('Клиент','clientId',state.clients.filter(c=>c.active||c.id===r.clientId).map(c=>[c.id,c.name]),r.clientId)
  +chooseField('Тренер','trainerId',trainersFor('personal',r.trainerId),r.trainerId)
  +`<div class="fields two">${stepField('Длительность','duration',r.duration,15,{unit:'мин',min:15})}${field('Зал','room',r.room)}</div>`+field('Комментарий','note',r.note||''),
  save:f=>{if(f.date>D.today()){toast('Персональные записывают по факту — дата не позже сегодня');return false}
   return saveWith(s=>D.ops.saveOcc(s,r,{...f,duration:String(toNum(f.duration)||60)}),{toast:'Запись изменена'})}})}

/* ——— персональная тренировка: учёт по факту ——— */
function personalSheet(){const hasT=state.trainers.some(t=>t.active&&D.can(t,'personal')),hasC=state.clients.some(c=>c.active);
 if(!hasT||!hasC){openSheet({title:hasC?'Сначала нужен тренер персональных':'Нужны тренер и клиент',
  body:`<p class="confirm">${hasC?'Персональная тренировка записывается на тренера, который ведёт персональные. В карточке тренера это поле «Что ведёт».':'Сначала добавьте в справочник тренера персональных и клиента.'}</p>`,
  save:()=>{ui.dv=hasC?'trainers':'clients';go('directory');return true},saveLabel:hasC?'Открыть тренеров':'Открыть справочник'});return}
 const date=ui.route==='journal'&&ui.date<=D.today()?ui.date:D.today();
 const clients=state.clients.filter(c=>c.active).map(c=>[c.id,c.name]),first=state.clients.find(c=>c.active);
 openSheet({title:'Записать тренировку',body:chooseField('Клиент','clientId',clients,first?.id)
  +chooseField('Тренер','trainerId',trainersFor('personal'),first?.trainerId&&D.can(state.trainers.find(t=>t.id===first.trainerId)||{},'personal')?first.trainerId:trainersFor('personal')[0]?.[0])
  +`<div class="fields two">${dateField('Дата','date',date)}${timeField('Время','time','12:00')}</div>`
  +`<div class="fields two">${stepField('Длительность','duration',60,15,{unit:'мин',min:15})}${field('Зал','room','Тренажёрный зал')}</div>`+field('Комментарий','note',''),
  save:f=>{if(f.date>D.today()){toast('Персональные записывают по факту — дата не позже сегодня');return false}
   return saveWith(s=>D.ops.addPersonal(s,{date:f.date,time:f.time,clientId:f.clientId,trainerId:f.trainerId,duration:String(toNum(f.duration)||60),room:f.room||'Тренажёрный зал',note:f.note||''}),{toast:`${name(f.clientId,'clients')} — тренировка записана`})}})}

/* ——— пункт смены: выполнено / не вышло с причиной / снова открыт ——— */
function taskSheet(key){const date=key.slice(0,10),q=D.tasks(state,date).find(x=>x.key===key);if(!q)return;lastTask=key;
 openSheet({title:esc(q.title),body:`<p class="meta">${esc(D.fmtDay(q.date))} · ${esc(q.time)} · ${q.required?'обязательный':'плановый'}</p>`
  +segField('Состояние','status',{done:'Выполнено',skipped:'Не вышло',open:'Открыт'},q.status==='open'?'skipped':q.status)
  +`<div data-show="status=skipped">${field('Почему не вышло','reason',q.reason||'',{ph:'Коротко: что помешало'})}</div>`,
  save:f=>{if(f.status==='skipped'&&!String(f.reason||'').trim()){toast('Для «не вышло» нужна причина');return false}

/* ——— Вставка из мессенджера ———
   Тренеры присылают отчёт куском переписки: имена латиницей, время публикации, даты,
   строки записей и болтовня между ними. Разбор — чистые функции ниже (перенесены как есть);
   записывает только операция домена после проверки человеком (А-1): панель показывает,
   что поняла, до того как что-то записать. */
// ——— Парсер: текст из мессенджера ———
const TRANSLIT={а:'a',б:'b',в:'v',г:'g',д:'d',е:'e',ё:'e',ж:'zh',з:'z',и:'i',й:'i',к:'k',л:'l',м:'m',н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'h',ц:'c',ч:'ch',ш:'sh',щ:'sch',ъ:'',ы:'y',ь:'',э:'e',ю:'yu',я:'ya'};
const latin=x=>String(x).toLowerCase().replace(/[а-яё]/g,c=>TRANSLIT[c]??c).replace(/[^a-z0-9]/g,'');
const words=x=>String(x).toLowerCase().split(/[^a-zа-яё0-9]+/i).filter(Boolean);
const minutes=t=>{const [h,m]=String(t).split(':').map(Number);return h*60+m};
function lev(a,b){
 if(a===b)return 0;const m=a.length,n=b.length;if(!m||!n)return m||n;
 let prev=[...Array(n+1).keys()],cur=new Array(n+1);
 for(let i=1;i<=m;i++){cur[0]=i;for(let j=1;j<=n;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));[prev,cur]=[cur,prev]}
 return prev[n];
}
const near=(a,b,d=1)=>Math.min(a.length,b.length)>3&&lev(a,b)<=d;
function candidates(hit,limit=3){
 if(!hit)return[];
 return[hit.item,...hit.rest.filter(x=>x.score>=Math.max(3,hit.score-4)).map(x=>x.item)].slice(0,limit);
}
function pickBest(scored,floor,gap){
 scored.sort((a,b)=>b.score-a.score);
 const best=scored[0];
 if(!best||best.score<floor)return null;
 return{item:best.item,score:best.score,sure:!scored[1]||best.score-scored[1].score>=gap,rest:scored.slice(1)};
}
// Человек: «Белова Мария», «anna_volkova», «sokolov m» — порядок и регистр не важны.
function matchPerson(text,list){
 const t=words(text).map(latin).filter(x=>x.length>1);
 if(!t.length||!list.length)return null;
 const whole=t.join('');
 return pickBest(list.map(p=>{
  const pt=words(p.name).map(latin),pw=pt.join('');let score=0;
  for(const a of t)for(const b of pt){
   if(a===b)score+=4;
   else if(a.length>3&&b.startsWith(a))score+=3;
   else if(b.length>3&&a.startsWith(b))score+=3;
   else if(near(a,b))score+=3;
  }
  if(whole===pw)score+=6;
  else if(whole.length>5&&pw.includes(whole))score+=4;
  else if(pw.length>5&&whole.includes(pw))score+=4;
  return{item:p,score};
 }),4,3);
}
// Занятие: по названию и времени внутри одного дня.
function matchClass(row,list){
 if(!list.length)return null;
 return pickBest(list.map(o=>{
  let score=0;
  if(row.time){
   if(o.time===row.time)score+=6;
   else if(Math.abs(minutes(o.time)-minutes(row.time))<=15)score+=3;
   else score-=2;
  }
  if(row.title){
   const a=latin(row.title),b=latin(o.title);let hit=0;
   if(a===b)hit=7;
   else if(a.length>3&&(b.includes(a)||a.includes(b)))hit=5;
   else if(near(a,b,2))hit=5;
   else{
    const at=words(row.title).map(latin),bt=words(o.title).map(latin);
    for(const x of at)for(const y of bt)if(x===y||near(x,y))hit+=3;
   }
   score+=hit||-3;
  }
  return{item:o,score};
 }),6,3);
}
function parseDate(line){
 let day,mon,year=null;
 const m=line.match(/^(\d{1,2})\s*[.\/-]\s*(\d{1,2})(?:\s*[.\/-]\s*(\d{2,4}))?\.?$/);
 if(m){day=+m[1];mon=+m[2];if(m[3])year=+m[3]<100?2000+ +m[3]:+m[3]}
 else{
  const r=line.match(/^(\d{1,2})\s+(январ|феврал|март|апрел|ма[йя]|июн|июл|август|сентябр|октябр|ноябр|декабр)/i);
  if(!r)return null;
  day=+r[1];mon=['январ','феврал','март','апрел','ма','июн','июл','август','сентябр','октябр','ноябр','декабр'].findIndex(x=>r[2].toLowerCase().startsWith(x))+1;
 }
 if(!(day>=1&&day<=31&&mon>=1&&mon<=12))return null;
 const today=D.today(),make=y=>`${y}-${String(mon).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
 let iso=make(year||+today.slice(0,4));
 if(!D.validDate(iso))return null;
 if(!year&&iso>today){const back=make(+today.slice(0,4)-1);if(D.validDate(back))iso=back}
 return iso;
}
// Чистим строку от времени публикации, ссылок, эмодзи и служебных скобок.
function cleanLine(raw){
 return String(raw).replace(/ /g,' ')
  .replace(/,?\s*\[[^\]]*\]/g,' ')
  .replace(/\b\d{1,2}:\d{2}(:\d{2})?\s*(AM|PM|am|pm|ДП|ПП)\b/g,' ')
  .replace(/\b\d{1,2}:\d{2}:\d{2}\b/g,' ')
  .replace(/https?:\/\/\S+/g,' ')
  .replace(/[✅✔☑👍🔥•·>»]+/g,' ')
  .replace(/\s{2,}/g,' ').trim();
}
const NOISE=/^[\s\-–—_=.,:;]+$/;
const isGarbage=line=>/\d{5,}/.test(line)||line.length>70;
// Общий проход: даёт строки с датой, тренером и «телом» записи.
function walk(text,onEntry,role){
 const skipped=[];let trainer=null,trainerRaw='',trainerTop=[],date=null;
 const pool=state.trainers.filter(t=>t.active&&(!role||D.can(t,role)));
 for(const raw of String(text).split(/\r?\n/)){
  const line=cleanLine(raw);
  if(!line||NOISE.test(line))continue;
  const iso=parseDate(line);
  if(iso){date=iso;continue}
  const ctx={date,trainer,trainerRaw,trainerTop,skipped};
  if(onEntry(line,ctx))continue;
  if(isGarbage(line)){skipped.push({line,why:'не похоже на запись'});continue}
  const hit=matchPerson(line,pool);
  if(hit&&hit.sure){trainer=hit.item;trainerRaw=line;trainerTop=[];continue}
  if(hit){trainer=null;trainerRaw=line;trainerTop=candidates(hit).map(x=>x.id);
   skipped.push({line,why:'тренер опознан неточно — выберите из вариантов'});continue}
  if(/^[a-z][a-z0-9_.\s-]*$/i.test(line)&&words(line).length<=3){
   trainer=null;trainerRaw=line;trainerTop=[];skipped.push({line,why:'ник не найден в справочнике — выберите тренера'});continue;
  }
  skipped.push({line,why:'мусор'});
 }
 return skipped;
}
const TIME_RE=/(?:^|\s)([0-2]?\d)[:.]([0-5]\d)(?!\d)/;
// «Anna Volkova 23:58» — это шапка отчёта, а не запись.
function looksLikeTrainer(line){
 const bare=line.replace(TIME_RE,' ').replace(/\d/g,' ').trim();
 if(!bare||words(bare).length>3)return false;
 const hit=matchPerson(bare,state.trainers.filter(t=>t.active));
 return !!(hit&&hit.sure);
}
function takeTime(text){
 const m=text.match(TIME_RE);
 if(!m)return{time:null,rest:text};
 const h=+m[1],mi=+m[2];
 if(h>23)return{time:null,rest:text};
 return{time:String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0'),rest:text.replace(m[0],' ')};
}
const trim=x=>x.replace(/[()]/g,' ').replace(/^[\s\-–—:;,.]+|[\s\-–—:;,.]+$/g,'').replace(/\s{2,}/g,' ');

function parsePersonal(text){
 const rows=[],clients=state.clients.filter(c=>c.active);
 const push=(ctx,time,rest,duration,status,line)=>{
  const hit=matchPerson(rest,clients);
  rows.push({date:ctx.date||D.today(),noDate:!ctx.date,time,noTime:!time,raw:rest,duration,status,line,
   clientId:hit&&hit.sure?hit.item.id:'',clientTop:candidates(hit).map(x=>x.id),
   trainerId:ctx.trainer?ctx.trainer.id:'',trainerTop:ctx.trainerTop,trainerRaw:ctx.trainerRaw});
 };
 const skipped=walk(text,(line,ctx)=>{
  if(looksLikeTrainer(line))return false;
  const t=takeTime(line);
  if(!t.time||!/^\s*[0-2]?\d[:.][0-5]\d/.test(line)){
   // строка без времени: если похоже на клиента — не выбрасываем, а спросим время
   if(t.time||/\d/.test(line)||words(line).length>3)return false;
   const guess=matchPerson(line,clients);
   if(!guess)return false;
   push(ctx,'',trim(line),60,'completed',line);
   return true;
  }
  let rest=t.rest;
  rest=rest.replace(/(не\s*приш[а-яё]*|неявка\w*|н\/я|no\s*show)/ig,' ');
  let duration=60;
  const dm=rest.match(/(\d{2,3})\s*(?:мин\.?|минут\w*|min|м)(?![а-яёa-z])/i);
  if(dm){duration=+dm[1];rest=rest.replace(dm[0],' ')}
  rest=trim(rest);
  if(!rest||!words(rest).length){ctx.skipped.push({line,why:'нет имени клиента'});return true}
  push(ctx,t.time,rest,duration,'completed',line);
  return true;
 },'personal');
 return{rows,skipped};
}

function parseGroups(text){
 const rows=[],dayCache={};
 const dayList=d=>dayCache[d]??=D.occurrences(state,d,d).filter(r=>r.kind==='group');
 const skipped=walk(text,(line,ctx)=>{
  const date0=ctx.date||D.today();
  if(looksLikeTrainer(line))return false;
  if(!/\d/.test(line)){
   const guess=matchClass({time:null,title:line},dayList(date0));
   if(guess){rows.push({date:date0,noDate:!ctx.date,time:null,title:line,count:null,noCount:true,raw:trim(line),
    occId:guess.sure?guess.item.id:'',occTop:candidates(guess).map(x=>x.id),
    trainerId:ctx.trainer?ctx.trainer.id:'',trainerTop:ctx.trainerTop,trainerRaw:ctx.trainerRaw});return true}
   return false;
  }
  if(/^\s*\d{1,2}[:.]\d{2}/.test(line)&&!takeTime(line).time){ctx.skipped.push({line,why:'непонятное время'});return true}
  const t=takeTime(line);
  let rest=t.rest;
  // «12 чел», «12 человек», «(12)», «— 12»
  let count=null;
  const cm=rest.match(/(\d{1,3})\s*(?:чел\w*|человек\w*|people|pax)/i)
   ||rest.match(/(?:чел\w*|человек\w*)\s*[-–—:]?\s*(\d{1,3})/i)
   ||rest.match(/\((\d{1,3})\)/)
   ||rest.match(/[-–—:]\s*(\d{1,3})\s*$/)
   ||rest.match(/(?:^|\s)(\d{1,3})\s*$/);
  if(cm){count=+cm[1];rest=rest.replace(cm[0],' ')}
  const title=trim(rest.replace(/(никто\s+не\s+приш[а-яё]*|отмен\w*)/ig,' '));
  if(!t.time&&!title)return false;
  let wild=false;if(count!==null&&count>500){wild=true;count=null}  // не выбрасываем строку, а просим уточнить
  const date=ctx.date||D.today(),list=dayList(date);
  if(!list.length){ctx.skipped.push({line,why:'на '+dateLabel(date)+' в сетке нет групповых занятий'});return true}
  const hit=matchClass({time:t.time,title},list);
  if(count===null&&!hit){ctx.skipped.push({line,why:'не нашли ни занятия, ни количества'});return true}
  rows.push({date,noDate:!ctx.date,time:t.time,title,count,noCount:count===null,wild,raw:trim(line),
   occId:hit&&hit.sure?hit.item.id:'',occTop:candidates(hit).map(x=>x.id),
   trainerId:ctx.trainer?ctx.trainer.id:'',trainerTop:ctx.trainerTop,trainerRaw:ctx.trainerRaw});
  return true;
 },'group');
 return{rows,skipped};
}

/* ——— Передача смены ———
   База ходит между администраторами файлом. Каждый выгружает свой кусок или всё, следующий
   принимает слиянием по закону ядра (core/exchange.js): новое добавляется, спорное — по выбору,
   закрытые у себя смены не меняются (А-5). Журнал передач склеивается. Это же протокол обмена,
   если однажды появится сервер. */
const PACK_KIND='club-handoff',PACK_FORMAT=1,PACK_LIMIT=20*1024*1024;
// Что сливается — описывает домен (D.EXCHANGE), как сливается — ядро (core/exchange.js, X).
// Имя файла смены. Зовётся из 14-boot.js при выгрузке — объявление должно жить
// рядом с самим протоколом, иначе слой обмена собирается без него.
function packName(mode,from,to){
 const stamp=D.today();
 return mode==='full'?`Club_смена_вся-база_${stamp}.json`:`Club_смена_${from}_${to}.json`;
}
function buildPack(mode,from,to,admin,withPrefs=false){
 const inRange=d=>mode==='full'||(d>=from&&d<=to);
 const data=structuredClone({schema:D.SCHEMA,demo:false,admin,
  trainers:state.trainers,clients:state.clients,rules:state.rules,tasks:state.tasks,
  facts:Object.fromEntries(Object.entries(state.facts).filter(([,f])=>inRange(f.date))),
  shiftFacts:Object.fromEntries(Object.entries(state.shiftFacts).filter(([,f])=>inRange(f.date))),
  sessions:state.sessions.filter(p=>inRange(p.date)),
  closed:Object.fromEntries(Object.entries(state.closed||{}).filter(([d])=>inRange(d))),
  log:state.log||[]});
 return{kind:PACK_KIND,format:PACK_FORMAT,mode,from:mode==='full'?null:from,to:mode==='full'?null:to,
  admin,at:T.stamp(),counts:D.counts(data),...(withPrefs?{prefs:{...prefs}}:{}),data};
}
// Разбор входящего файла. Возвращает пакет либо список проблем с микрошагами.
function readPack(text,fileName){
 const trouble=(what,steps)=>({problems:[{what,steps}]});
 if(!String(text).trim())return trouble(say('fileEmpty'),
  ['Откройте папку, откуда брали файл.','Проверьте размер файла: если 0 КБ — он не сохранился.','Попросите прислать файл заново и выберите его ещё раз.']);
 let raw;
 try{raw=JSON.parse(text)}
 catch(e){return trouble(say('fileNotJson'),
  ['Проверьте, что файл называется ...json, а не ...json.txt и не ...zip.','Если файл пересылали в мессенджере — скачайте его заново, не «сохранить как текст», а именно файл.','Если открывали и правили в блокноте — возьмите исходный файл у того, кто его выгружал.','Подробность для того, кто разбирается: '+e.message])}
 if(!raw||typeof raw!=='object'||Array.isArray(raw))return trouble('Внутри файла не та структура.',
  ['Убедитесь, что выгружали именно кнопкой «Выгрузить» из этой панели.','Файлы из Excel, Word или переписки сюда не подходят.','Попросите выгрузить заново и пришлите этот же файл.']);
 let pack;
 if(raw.kind===PACK_KIND){
  if(raw.format>PACK_FORMAT)return trouble(say('fileFuture'),
   ['Откройте у себя свежую версию Admin_Dashboard.html — её присылает тот же администратор.','Если свежей нет — попросите выгрузить файл из старой версии.']);
  if(!raw.data)return trouble(say('fileShell'),
   ['Попросите выгрузить заново и дождаться, пока браузер скачает файл целиком.','Проверьте, что файл весит больше 1 КБ.']);
  pack=raw;
 }else if(raw.schema===1||raw.schema===D.SCHEMA){
  pack={kind:PACK_KIND,format:PACK_FORMAT,mode:'full',from:null,to:null,admin:raw.admin||'',at:T.stamp(),data:raw,counts:null};
 }else return trouble(say('fileWeird'),
  ['Нужен файл, выгруженный кнопкой «Выгрузить» из этой панели.','Проверьте, что не выбрали по ошибке другой файл из папки «Загрузки».','Имя нужного файла начинается со слова Club_.']);
 try{pack.data=D.migrate(pack.data);D.validate(pack.data)}
 catch(e){return trouble('Данные внутри файла не прошли проверку: '+e.message,
  ['Ничего не меняйте в этом файле руками.','Попросите того, кто его выгружал, открыть свою панель и выгрузить смену заново.','Если ошибка повторится — пусть пришлёт полную выгрузку («Вся база»), а не кусок.'])}
 if(!Array.isArray(pack.data.log))pack.data.log=[];
 pack.counts=pack.counts||D.counts(pack.data);
 pack.fileName=fileName||'';
 return{pack,problems:[]};
}
// Что произойдёт при приёме: что добавится, что совпадает, что спорно.
// Записи внутри своих закрытых смен не спорны — они не меняются (И-4).
function planMerge(pack){
 return X.plan(state,pack.data,{...D.EXCHANGE,locked:(key,item)=>D.frozen(state,item.date),
  title:(item,key)=>D.EXCHANGE.maps.some(([k])=>k===key)?(item.title||item.id)+' · '+dateLabel(item.date):item.name||item.title||item.id});
}
function describe(group,x){
 if(group==='facts')return x.status==='completed'?`${x.attendance} пришло`:x.status==='cancelled'?'отменено':'не отмечено';
 if(group==='shiftFacts')return x.status==='done'?'выполнено':x.status==='skipped'?'не вышло: '+(x.reason||''):'открыто';
 if(group==='sessions')return `${x.time} · ${name(x.clientId,'clients')} · ${name(x.trainerId)}`;
 return x.name||x.title||x.id;
}

/* ——— Таблица для Excel ———
   То, что с данными делают снаружи панели: считают, сверяют, сдают. Книга Excel собирается
   здесь целиком, без библиотек: zip пишется байтами, листы — XML (перенесено как есть).
   Это выгрузка наружу, не передача смены: обратно в панель таблица не загружается. */

// ——— Zip без сжатия ———
// Excel открывает хранение без сжатия так же, как обычный архив.
// Таблица смены за месяц — это десятки килобайт, экономить нечего.
const CRC_TABLE=(()=>{const t=new Int32Array(256);
 for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c}return t})();
function crc32(buf){let c=-1;for(let i=0;i<buf.length;i++)c=(c>>>8)^CRC_TABLE[(c^buf[i])&255];return(c^-1)>>>0}

function zipStore(files){
 const enc=new TextEncoder(),local=[],central=[];let offset=0,total=0;
 for(const f of files){
  const nameBytes=enc.encode(f.name),data=f.data,sum=crc32(data),size=data.length;
  const head=new Uint8Array(30+nameBytes.length),h=new DataView(head.buffer);
  h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);
  h.setUint32(14,sum,true);h.setUint32(18,size,true);h.setUint32(22,size,true);
  h.setUint16(26,nameBytes.length,true);head.set(nameBytes,30);
  local.push(head,data);total+=head.length+size;
  const dir=new Uint8Array(46+nameBytes.length),d=new DataView(dir.buffer);
  d.setUint32(0,0x02014b50,true);d.setUint16(4,20,true);d.setUint16(6,20,true);d.setUint16(8,0x0800,true);
  d.setUint32(16,sum,true);d.setUint32(20,size,true);d.setUint32(24,size,true);
  d.setUint16(28,nameBytes.length,true);d.setUint32(42,offset,true);dir.set(nameBytes,46);
  central.push(dir);offset+=head.length+size;
 }
 const dirSize=central.reduce((a,x)=>a+x.length,0);
 const end=new Uint8Array(22),e=new DataView(end.buffer);
 e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);
 e.setUint32(12,dirSize,true);e.setUint32(16,total,true);
 const out=new Uint8Array(total+dirSize+22);let at=0;
 for(const part of local.concat(central,[end])){out.set(part,at);at+=part.length}
 return out;
}

const xesc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]))
 .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');
// Excel считает дни от 30 декабря 1899 года.
const xlDate=iso=>Math.round((Date.UTC(+iso.slice(0,4),+iso.slice(5,7)-1,+iso.slice(8,10))-Date.UTC(1899,11,30))/86400000);
function colLetter(n){let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-m-1)/26}return s}

function xlCell(ref,value,type,bold){
 if(value===null||value===undefined||value==='')return '';
 if(type==='date')return `<c r="${ref}" s="2"><v>${xlDate(value)}</v></c>`;
 if(type==='num'||type==='pct'){const n=Number(value);if(!isFinite(n))return '';
  return `<c r="${ref}" s="${type==='pct'?(bold?5:3):bold?4:0}"><v>${n}</v></c>`}
 return `<c r="${ref}" t="inlineStr" s="${bold?4:0}"><is><t xml:space="preserve">${xesc(value)}</t></is></c>`;
}

function sheetXml(sheet){
 const cols=sheet.cols,body=sheet.rows,last=colLetter(cols.length-1);
 const lines=[`<row r="1" ht="20" customHeight="1">`+cols.map((c,i)=>
  `<c r="${colLetter(i)}1" t="inlineStr" s="1"><is><t>${xesc(c.h)}</t></is></c>`).join('')+`</row>`];
 body.forEach((r,n)=>{const bold=!!r.bold,cells=cols.map((c,i)=>xlCell(colLetter(i)+(n+2),r.cells[i],c.t,bold)).join('');
  lines.push(`<row r="${n+2}">${cells}</row>`)});
 return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<dimension ref="A1:${last}${body.length+1}"/>
<sheetViews><sheetView workbookViewId="0"${sheet.first?' tabSelected="1"':''}><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/><selection pane="bottomLeft" activeCell="A2" sqref="A2"/></sheetView></sheetViews>
<sheetFormatPr defaultRowHeight="15"/>
<cols>${cols.map((c,i)=>`<col min="${i+1}" max="${i+1}" width="${c.w||14}" customWidth="1"/>`).join('')}</cols>
<sheetData>${lines.join('')}</sheetData>
${body.length?`<autoFilter ref="A1:${last}${body.length+1}"/>`:''}
<pageMargins left="0.5" right="0.5" top="0.6" bottom="0.6" header="0.3" footer="0.3"/>
</worksheet>`;
}

// Имя листа в Excel: не длиннее 31 знака и без : \ / ? * [ ]
const sheetName=s=>String(s).replace(/[\\\/\?\*\[\]:]/g,' ').slice(0,31);

function xlsxBook(sheets){
 const enc=new TextEncoder(),file=(name,text)=>({name,data:enc.encode(text)});

  file('[Content_Types].xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>

${sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}

  file('xl/workbook.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>

<sheets>${sheets.map((s,i)=>`<sheet name="${xesc(sheetName(s.name))}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets>
</workbook>`),
  file('xl/_rels/workbook.xml.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
${sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}
<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>

  file('xl/styles.xml',XL_STYLES)
 ];
 sheets.forEach((s,i)=>parts.push(file(`xl/worksheets/sheet${i+1}.xml`,sheetXml({...s,first:i===0}))));

 clients:{label:'Клиенты',about:'справочник целиком — период на него не влияет',period:false,
  cols:[TXT('Имя',26),TXT('Тренер',22),TXT('Статус',14),TXT('Комментарий',40)],
  build(){return state.clients.map(c=>({cells:[c.name,c.trainerId?name(c.trainerId):'',c.active===false?'В архиве':'Активен',c.note||'']}))}},

 trainers:{label:'Тренеры',about:'справочник целиком — период на него не влияет',period:false,
  cols:[TXT('Имя',26),TXT('Что ведёт',26),TXT('Статус',14),TXT('Комментарий',40)],
  build(){return state.trainers.map(t=>({cells:[t.name,roleLabel(t),t.active===false?'В архиве':'Активен',t.note||'']}))}},

 cards:{label:'Карточки тренеров',about:'по листу на каждого: его клиенты и часы',period:true,
  cols:[TXT('Клиент',26),TXT('Закреплён',12),TXT('Статус',12),N('Персональных',13),N('Часы',9),DT('Первая',12),DT('Последняя',12),TXT('Комментарий',30)],
  // Один лист — один тренер. Имя листа = фамилия, потому что вкладок много и
  // «Анна Волкова» в них не помещается.
  sheets(a,b){
   const busy=new Set(),out=[];
   for(const t of state.trainers){
    const mine=state.sessions.filter(p=>p.trainerId===t.id&&p.date>=a&&p.date<=b);
    // Карточка — про персональную работу. Тренер, который её не ведёт, вкладку
    // не получает: панель его в персональном контексте тоже не показывает.
    if(!D.can(t,'personal')&&!mine.length)continue;
    const done=mine.filter(p=>p.status==='completed');
    const ids=new Set(mine.map(p=>p.clientId));
    state.clients.filter(c=>c.trainerId===t.id).forEach(c=>ids.add(c.id));
    const rows=[...ids].map(id=>{
     const c=state.clients.find(x=>x.id===id);if(!c)return null;
     // Часы и счёт — только по проведённым, как в D.stats и на листе «Итоги».
     const his=done.filter(p=>p.clientId===id),dates=his.map(p=>p.date).sort();
     const minutes=his.reduce((n,p)=>n+p.duration,0);
     // Ноль здесь настоящий: клиент закреплён, но в этом периоде не занимались.
     return {cells:[c.name,yesNo(c.trainerId===t.id),c.active===false?'В архиве':'Активен',
      his.length,Math.round(minutes/60*10)/10,dates[0]||'',dates[dates.length-1]||'',c.note||'']}})
     .filter(Boolean)
     .sort((x,y)=>y.cells[3]-x.cells[3]||String(x.cells[0]).localeCompare(String(y.cells[0]),'ru'));
    // Пустая вкладка никому не нужна: тренер без клиентов и без записей её не получает.
    if(!rows.length)continue;
    rows.push({bold:true,cells:['Всего: '+rows.length+' '+plural(rows.length,['клиент','клиента','клиентов']),'','',
     done.length,Math.round(done.reduce((n,p)=>n+p.duration,0)/60*10)/10,'','','']});
    out.push({key:'card-'+t.id,name:uniqueSurname(t.name,busy),cols:this.cols,rows});
   }
   return out;
  }},

 schedule:{label:'Сетка',about:'действующие шаблоны групповых занятий',period:false,
  cols:[TXT('День',8),TXT('Время',7),TXT('Занятие',26),TXT('Тренер',22),TXT('Зал',18),N('Мест',8),N('Минуты',9),DT('Действует с',13),DT('По',11)],
  build(){const t=D.today();
   return state.rules.filter(r=>!r.to||r.to>=t)
    .sort((a,b)=>(a.weekday-b.weekday)||a.time.localeCompare(b.time))
    .map(r=>({cells:[WD[r.weekday-1]||'',r.time,r.title,name(r.trainerId),r.room||'',r.capacity,r.duration,r.from,r.to||'']}))}}
};

// Фамилия для имени вкладки: берём последнее слово имени. Если у двух тренеров
// она совпала, добавляем инициал — иначе Excel не примет два одинаковых листа.
function uniqueSurname(full,busy){
 const parts=String(full||'').trim().split(/\s+/).filter(Boolean);
 let base=parts.length>1?parts[parts.length-1]:(parts[0]||'Тренер');
 if(busy.has(base)&&parts.length>1)base=parts[parts.length-1]+' '+parts[0][0]+'.';
 let name=base,n=2;while(busy.has(name))name=base+' '+n++;
 busy.add(name);return name;
}

let exportCfg=null;
function exportDefaults(){const [a,b]=ui.route==='shift'||ui.route==='journal'?range():[D.today().slice(0,7)+'-01',D.today()];
 return {pick:ui.route==='shift'?['shift']:ui.route==='directory'?['clients','trainers']:['lessons','totals'],from:a,to:b,format:'xlsx'}}
// Быстрые периоды. «Всё время» — от самой ранней записи в базе.
function exportRange(kind){const t=D.today();
 if(kind==='week')return [D.add(t,1-D.wd(t)),D.add(D.add(t,1-D.wd(t)),6)];
 if(kind==='month')return [t.slice(0,7)+'-01',D.add(D.iso(new Date(+t.slice(0,4),+t.slice(5,7),1)),-1)];
 const dates=[...Object.values(state.facts),...Object.values(state.shiftFacts),...state.sessions].map(x=>x.date).concat(state.rules.map(r=>r.from),state.tasks.map(q=>q.from)).filter(Boolean).sort();
 const last=dates[dates.length-1]||t;return [dates[0]||t,t>last?t:last]}
function exportRangeNow(){for(const k of ['week','month','all']){const [a,b]=exportRange(k);if(a===exportCfg.from&&b===exportCfg.to)return k}return ''}
function exportPlan(){const c=exportCfg,out=[];
 for(const key of c.pick){const part=EXPORT_PARTS[key];if(!part)continue;
  if(part.sheets){for(const sh of part.sheets(c.from,c.to))out.push({part:key,...sh});continue}
  out.push({key,part:key,name:part.label,cols:part.cols,rows:part.period?part.build(c.from,c.to):part.build()})}
 return out}
function exportSheet(){if(!exportCfg)exportCfg=exportDefaults();openSheet({title:'Таблица для Excel',wide:true,view:exportView,save:()=>exportApply(),saveLabel:'Скачать'})}
function exportView(){const c=exportCfg,plan=exportPlan(),total=plan.reduce((a,s)=>a+s.rows.length,0),now=exportRangeNow(),usesPeriod=c.pick.some(k=>EXPORT_PARTS[k]?.period);
 const sum=c.pick.map(key=>{const part=EXPORT_PARTS[key],mine=plan.filter(s=>s.part===key);if(!part||!mine.length)return '';const rows=mine.reduce((n,s)=>n+s.rows.length,0);
  return `<div class="row"><div class="rbody"><span class="rt">${esc(part.label)}</span><span class="rm">${!rows?'пусто за этот период':mine.length>1?`${mine.length} ${plural(mine.length,'лист','листа','листов')}: ${esc(mine.map(s=>s.name).join(', '))}`:`${rows} ${plural(rows,'строка','строки','строк')}`}</span></div></div>`}).join('');
 return `<p class="caption">Для расчётов снаружи${infoBtn(say('exportHint'))}</p>
 <div class="blocktitle">Что положить в файл</div><div class="chips">${Object.entries(EXPORT_PARTS).map(([k,p])=>B(esc(p.label),'export-pick',k,'chip'+(c.pick.includes(k)?' is-on':''),`aria-pressed="${c.pick.includes(k)}" title="${esc(p.about)}"`)).join('')}</div>
 <div class="blocktitle">За какой период</div>${seg('export-range',[['week','Эта неделя'],['month','Этот месяц'],['all','Всё время']],now,'wrap')}
 <div class="fields two">${dateField('С','from',c.from).replace('data-action="cal"','data-action="cal" data-export="from"')}${dateField('По','to',c.to).replace('data-action="cal"','data-action="cal" data-export="to"')}</div>
 <p class="caption">${usesPeriod?'Период режет занятия и смену. Справочники и сетка едут целиком — они и есть текущее состояние клуба.':'Выбранные листы не зависят от периода.'}</p>
 <div class="blocktitle">Чем открывать</div>${seg('export-format',[['xlsx','Excel · xlsx'],['csv','CSV']],c.format)}
 ${plan.length?`<div class="blocktitle">Получится</div><div class="rows compact">${sum}</div><p class="caption">${c.format==='xlsx'?`Один файл, ${plan.length} ${plural(plan.length,'лист','листа','листов')}`:`${plan.length} ${plural(plan.length,'файл','файла','файлов')}`} · ${total} ${plural(total,'строка','строки','строк')} всего.</p>`:`<p class="caption">Пока не отмечено ничего. Выберите хотя бы одно.</p>`}`}
function exportApply(){const c=exportCfg;
 if(!c.pick.length){toast('Отметьте хотя бы одно — иначе файл будет пустым');return false}
 if(c.from>c.to){toast('Начало периода позже конца — поменяйте местами');return false}
 const plan=exportPlan(),total=plan.reduce((a,s)=>a+s.rows.length,0);if(!total){toast('За выбранный период записей нет — возьмите период шире');return false}
 const stamp=plan.some(s=>EXPORT_PARTS[s.part]?.period)?c.from+'_'+c.to:D.today();
 if(c.format==='csv'){plan.forEach(s=>{if(!s.rows.length)return;
   // Клетка, начинающаяся с = + - @, для Excel — формула: впереди апостроф, и это снова текст.
   const cell=x=>{let t=String(x??'').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');if(/^[=+\-@\t\r]/.test(t))t="'"+t;return '"'+t.replace(/"/g,'""')+'"'};
   const body=[s.cols.map(x=>x.h)].concat(s.rows.map(r=>r.cells.map((v,i)=>s.cols[i].t==='pct'&&v!==null&&v!==''?Math.round(v*100)+'%':v))).map(r=>r.map(cell).join(';')).join('\r\n');
   download('﻿'+body,`Club_${s.key}_${stamp}.csv`,'text/csv;charset=utf-8')})}
 else download(xlsxBook(plan),`Club_${stamp}.xlsx`,'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
 toast(say('exportDone',total,c.format==='xlsx'?'книгу':'файлы'));return true}

 if(el.closest('#toast')&&el.dataset.action!=='undo')$('#toast').hidden=true;
});
/* Поиск по справочнику печатается в списке: строка живёт в ui, morph не трогает активное поле. */
document.addEventListener('input',e=>{if(e.target.id==='dsearch'){ui.q=e.target.value;render()}});
// Поле профиля в настройках пишется, когда человек его покинул — как у клиента и тренера.
document.addEventListener('change',e=>{if(e.target.dataset?.set==='admin'&&e.target.value.trim()!==(state.admin||''))commit(s=>D.ops.setAdmin(s,e.target.value),{toast:'Имя сохранено'})});
document.addEventListener('submit',e=>{e.preventDefault();const form=e.target;
 if(form.classList.contains('sheetform')&&sheetSave){let ok;try{ok=sheetSave(formData(form))}catch(err){toast(err.message);return}if(ok!==false)closeSheet()}});
document.addEventListener('keydown',e=>{
 if(e.key==='Tab'&&$('#sheet').open&&!popEl){const f=$$('#sheet button:not([disabled]),#sheet input:not([type=hidden]),#sheet textarea').filter(x=>x.offsetParent);
  if(f.length){const i=f.indexOf(document.activeElement);
   if(e.shiftKey&&i<=0){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&(i===f.length-1||i<0)){e.preventDefault();f[0].focus()}}}});
const typing=e=>e.target.matches?.('input:not([type=hidden]),textarea');
let typingOff=null;
document.addEventListener('focusin',e=>{if(typing(e)){clearTimeout(typingOff);document.body.classList.add('is-typing')}});
document.addEventListener('focusout',e=>{if(typing(e)){clearTimeout(typingOff);typingOff=setTimeout(()=>{if(!document.activeElement?.matches('input:not([type=hidden]),textarea'))document.body.classList.remove('is-typing')},350)}});
// Звук разрешён только после первого касания страницы — контекст создаём на нём.
document.addEventListener('pointerdown',()=>{const c=audioReady();if(c&&c.state==='suspended')c.resume?.()},true);

function bindSheet(){const dlg=$('#sheet');
 dlg.addEventListener('cancel',e=>{e.preventDefault();if(popEl)closePop();else closeSheet()});
 dlg.addEventListener('click',e=>{if(e.target===dlg)closeSheet()});
 let y0=null,dy=0;
 dlg.addEventListener('touchstart',e=>{if(e.target.closest('.sheethead')&&!e.target.closest('button')){y0=e.touches[0].clientY;dy=0;dlg.style.transition='none'}},{passive:true});
 dlg.addEventListener('touchmove',e=>{if(y0===null)return;dy=Math.max(0,e.touches[0].clientY-y0);dlg.style.transform=`translateY(${dy}px)`},{passive:true});
 dlg.addEventListener('touchend',()=>{if(y0===null)return;y0=null;dlg.style.transition='transform var(--d-move) var(--ease-out)';dlg.style.transform='';
  if(dy>90){dlg.style.transition='';closeSheet()}else setTimeout(()=>{dlg.style.transition=''},300)});
 $('#import').addEventListener('change',e=>{const f=e.target.files[0];if(f)importFile(f);e.target.value=''});
}

// Открыли в другой день — Пульт сегодняшнего дня.
function landToday(){const t=D.today();if(prefs.seen&&prefs.seen!==t){if(location.hash!=='#/console')history.replaceState(null,'','#/console');ui.date=t}
 if(prefs.seen!==t){prefs.seen=t;savePrefs()}}

function boot(){
 applyTheme();landToday();readHash();render();bindSheet();
 addEventListener('hashchange',()=>{closeSheet();readHash();render();scrollTo({top:0})});
 addEventListener('storage',e=>{if(e.key!==KEY&&e.key!==REV)return;if(adoptStored()){render();toast('Обновлено из другой вкладки')}});
 matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(!prefs.theme){applyTheme();render()}});
 remindTick();setInterval(remindTick,20000);
 let day=D.today();
 // Раз в минуту: живой Пульт и очередь напоминаний — не трогая открытую шторку и поле ввода.
 setInterval(()=>{if(D.today()!==day){if(ui.date===day)ui.date=D.today();day=D.today()}if(!$('#sheet').open&&!document.activeElement?.matches('input,textarea'))render()},60000);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!$('#sheet').open){if(prefs.seen!==D.today()){landToday();readHash()}render()}});
}
if(typeof window!=='undefined'&&window.document&&document.getElementById('app'))boot();
</script></body></html>
