   ['Откройте у себя свежую версию Admin_Dashboard.html — её присылает тот же администратор.','Если свежей нет — попросите выгрузить файл из старой версии.']);
  if(!raw.data)return trouble(say('fileShell'),
   ['Попросите выгрузить заново и дождаться, пока браузер скачает файл целиком.','Проверьте, что файл весит больше 1 КБ.']);
  pack=raw;
 }else if(raw.schema===1){
  pack={kind:PACK_KIND,format:PACK_FORMAT,mode:'full',from:null,to:null,admin:raw.admin||'',at:new Date().toISOString(),data:raw,counts:null};
 }else return trouble(say('fileWeird'),
  ['Нужен файл, выгруженный кнопкой «Выгрузить» из этой панели.','Проверьте, что не выбрали по ошибке другой файл из папки «Загрузки».','Имя нужного файла начинается со слова Club_.']);
 try{D.validate(pack.data)}
 catch(e){return trouble('Данные внутри файла не прошли проверку: '+e.message,
  ['Ничего не меняйте в этом файле руками.','Попросите того, кто его выгружал, открыть свою панель и выгрузить смену заново.','Если ошибка повторится — пусть пришлёт полную выгрузку («Вся база»), а не кусок.'])}
 if(!Array.isArray(pack.data.log))pack.data.log=[];
 pack.counts=pack.counts||D.counts(pack.data);
 pack.fileName=fileName||'';
 return{pack,problems:[]};
}
// Что произойдёт при приёме: что добавится, что совпадает, что спорно.
function planMerge(pack){
 const mine=state,theirs=pack.data,plan={added:{},updated:{},equal:{},conflicts:[]};
 const push=(group,label,id,title,ours,them)=>plan.conflicts.push({group,label,id,title,ours,them});
 for(const [key,label] of COLLECTIONS){
  let added=0,equal=0,diff=0;
  const byId=new Map(mine[key].map(x=>[x.id,x]));
  for(const item of theirs[key]||[]){
   const own=byId.get(item.id);
   if(!own){added++;continue}
   if(same(own,item)){equal++;continue}
   diff++;push(key,label,item.id,item.name||item.title||item.id,own,item);
  }
  plan.added[key]=added;plan.equal[key]=equal;plan.updated[key]=diff;
 }
 for(const [key,label] of MAPS){
  let added=0,equal=0,diff=0;
  for(const [id,item] of Object.entries(theirs[key]||{})){
   const own=mine[key][id];
   if(!own){added++;continue}
   if(same(own,item)){equal++;continue}
   diff++;push(key,label,id,(item.title||id)+' · '+dateLabel(item.date),own,item);
  }
  plan.added[key]=added;plan.equal[key]=equal;plan.updated[key]=diff;
 }
 const ids=new Set((mine.log||[]).map(e=>e.id));
 plan.logNew=(theirs.log||[]).filter(e=>!ids.has(e.id)).length;
 plan.totalAdded=Object.values(plan.added).reduce((a,b)=>a+b,0);
 plan.totalEqual=Object.values(plan.equal).reduce((a,b)=>a+b,0);
 return plan;
}
function applyMerge(s,pack,choices){
 const theirs=pack.data;let added=0,updated=0,kept=0;
 for(const [key] of COLLECTIONS){
  const byId=new Map(s[key].map(x=>[x.id,x]));
  for(const item of theirs[key]||[]){
   const own=byId.get(item.id);
   if(!own){s[key].push(structuredClone(item));added++;continue}
   if(same(own,item))continue;
   if(choices[key+':'+item.id]==='mine'){kept++;continue}
   Object.assign(own,structuredClone(item));updated++;
  }
 }
 for(const [key] of MAPS){
  for(const [id,item] of Object.entries(theirs[key]||{})){
   const own=s[key][id];
   if(!own){s[key][id]=structuredClone(item);added++;continue}
   if(same(own,item))continue;
   if(choices[key+':'+id]==='mine'){kept++;continue}
   s[key][id]=structuredClone(item);updated++;
  }
 }
 const ids=new Set((s.log||[]).map(e=>e.id));
 s.log=[...(s.log||[]),...(theirs.log||[]).filter(e=>!ids.has(e.id))].sort((a,b)=>a.at.localeCompare(b.at));
 return{added,updated,kept};
}
function logPush(s,kind,note,extra={}){
 s.log=[...(s.log||[]),{id:D.uid(),at:new Date().toISOString(),kind,admin:s.admin||'',note,counts:D.counts(s),...extra}];
}

function packPrefs(pack){

 if(!pr||typeof pr!=='object')return '';
 const own=pr.custom&&typeof pr.custom==='object'?Object.keys(pr.custom).length:0;
 const parts=[okMode('density',pr.density)||okMode('voice',pr.voice)?prefsLine(pr):'',
  own?'и '+own+' '+plural(own,['своя реплика','свои реплики','своих реплик'])+' теневого языка':''].filter(Boolean).join(' ');
 if(!parts)return '';
 return `<div class="section tight"><span class="fieldlabel">${MODESICO} Режимы коллеги</span>
  <p class="hint">В файле лежит ещё и его рабочее место: ${esc(parts)}. Сейчас принимаем только данные — про режимы спросим отдельно, следующим шагом.</p></div>`;
}
function describe(group,x){
 if(group==='facts')return x.status==='completed'?`${x.attendance} пришло`:x.status==='cancelled'?'отменено':'не отмечено';
 if(group==='shiftFacts')return x.status==='done'?'выполнено':x.status==='skipped'?'не вышло: '+(x.reason||''):'открыто';
 if(group==='sessions')return `${x.time} · ${name(x.clientId,'clients')} · ${name(x.trainerId)}`;
 return x.name||x.title||x.id;
}

/* ——— Выгрузка таблиц ———
   То, что с данными делают снаружи панели: считают, сверяют, сдают.
   Книга Excel собирается здесь целиком, без библиотек: zip пишется
   байтами, листы — XML. Ничего не скачивается из интернета.
   Часть панели администратора. Карта слоёв — в ARCHITECTURE.md. */

// ——— Zip без сжатия ———
// Excel открывает хранение без сжатия так же, как обычный архив.
// Таблица смены за месяц — это десятки килобайт, экономить нечего.
const CRC_TABLE=(()=>{const t=new Int32Array(256);
 for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c}return t})();
function crc32(buf){let c=-1;for(let i=0;i<buf.length;i++)c=(c>>>8)^CRC_TABLE[(c^buf[i])&255];return(c^-1)>>>0}

function zipStore(files){
 const enc=new TextEncoder(),local=[],central=[];let offset=0,total=0;
 for(const f of files){
  const nameBytes=enc.encode(f.name),data=f.data,sum=crc32(data),size=data.length;
  const head=new Uint8Array(30+nameBytes.length),h=new DataView(head.buffer);
  h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);
  h.setUint32(14,sum,true);h.setUint32(18,size,true);h.setUint32(22,size,true);
  h.setUint16(26,nameBytes.length,true);head.set(nameBytes,30);
  local.push(head,data);total+=head.length+size;
  const dir=new Uint8Array(46+nameBytes.length),d=new DataView(dir.buffer);
  d.setUint32(0,0x02014b50,true);d.setUint16(4,20,true);d.setUint16(6,20,true);d.setUint16(8,0x0800,true);
  d.setUint32(16,sum,true);d.setUint32(20,size,true);d.setUint32(24,size,true);
  d.setUint16(28,nameBytes.length,true);d.setUint32(42,offset,true);dir.set(nameBytes,46);
  central.push(dir);offset+=head.length+size;
 }
 const dirSize=central.reduce((a,x)=>a+x.length,0);
 const end=new Uint8Array(22),e=new DataView(end.buffer);
 e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);
 e.setUint32(12,dirSize,true);e.setUint32(16,total,true);
 const out=new Uint8Array(total+dirSize+22);let at=0;
 for(const part of local.concat(central,[end])){out.set(part,at);at+=part.length}
 return out;
}

const xesc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]))
 .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');
// Excel считает дни от 30 декабря 1899 года.
const xlDate=iso=>Math.round((Date.UTC(+iso.slice(0,4),+iso.slice(5,7)-1,+iso.slice(8,10))-Date.UTC(1899,11,30))/86400000);
function colLetter(n){let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-m-1)/26}return s}

function xlCell(ref,value,type,bold){
 if(value===null||value===undefined||value==='')return '';
 if(type==='date')return `<c r="${ref}" s="2"><v>${xlDate(value)}</v></c>`;
 if(type==='num'||type==='pct'){const n=Number(value);if(!isFinite(n))return '';
  return `<c r="${ref}" s="${type==='pct'?(bold?5:3):bold?4:0}"><v>${n}</v></c>`}
 return `<c r="${ref}" t="inlineStr" s="${bold?4:0}"><is><t xml:space="preserve">${xesc(value)}</t></is></c>`;
}

function sheetXml(sheet){
 const cols=sheet.cols,body=sheet.rows,last=colLetter(cols.length-1);
 const lines=[`<row r="1" ht="20" customHeight="1">`+cols.map((c,i)=>
  `<c r="${colLetter(i)}1" t="inlineStr" s="1"><is><t>${xesc(c.h)}</t></is></c>`).join('')+`</row>`];
 body.forEach((r,n)=>{const bold=!!r.bold,cells=cols.map((c,i)=>xlCell(colLetter(i)+(n+2),r.cells[i],c.t,bold)).join('');
  lines.push(`<row r="${n+2}">${cells}</row>`)});
 return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<dimension ref="A1:${last}${body.length+1}"/>
<sheetViews><sheetView workbookViewId="0"${sheet.first?' tabSelected="1"':''}><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/><selection pane="bottomLeft" activeCell="A2" sqref="A2"/></sheetView></sheetViews>
<sheetFormatPr defaultRowHeight="15"/>
<cols>${cols.map((c,i)=>`<col min="${i+1}" max="${i+1}" width="${c.w||14}" customWidth="1"/>`).join('')}</cols>
<sheetData>${lines.join('')}</sheetData>
${body.length?`<autoFilter ref="A1:${last}${body.length+1}"/>`:''}
<pageMargins left="0.5" right="0.5" top="0.6" bottom="0.6" header="0.3" footer="0.3"/>
</worksheet>`;
}

// Имя листа в Excel: не длиннее 31 знака и без : \ / ? * [ ]
const sheetName=s=>String(s).replace(/[\\\/\?\*\[\]:]/g,' ').slice(0,31);

function xlsxBook(sheets){
 const enc=new TextEncoder(),file=(name,text)=>({name,data:enc.encode(text)});
 const parts=[
  file('[Content_Types].xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>
${sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}
</Types>`),
  file('_rels/.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
</Relationships>`),
  file('xl/workbook.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<sheets>${sheets.map((s,i)=>`<sheet name="${xesc(sheetName(s.name))}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets>
</workbook>`),
  file('xl/_rels/workbook.xml.rels',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
${sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}
<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
</Relationships>`),
  file('xl/styles.xml',XL_STYLES)
 ];
 sheets.forEach((s,i)=>parts.push(file(`xl/worksheets/sheet${i+1}.xml`,sheetXml({...s,first:i===0}))));
 return zipStore(parts);
}

    const s=D.stats(mine);

     new Set(mine.filter(r=>r.status==='completed').map(r=>r.clientId)).size]})}
   if(prows.length){const s=D.stats(personal);
    prows.push({bold:true,cells:['Всего','',s.total,s.done,Math.round(s.minutes/60*10)/10,
     new Set(personal.filter(r=>r.status==='completed').map(r=>r.clientId)).size]})}
   out.push({key:'totals-personal',name:'Персональные по тренерам',cols:pcols,rows:prows});
   return out.filter(sh=>sh.rows.length);
  }},

 clients:{label:'Клиенты',about:'справочник целиком — период на него не влияет',period:false,
  cols:[T('Имя',26),T('Тренер',22),T('Статус',14),T('Комментарий',40)],
  build(){return state.clients.map(c=>({cells:[c.name,c.trainerId?name(c.trainerId):'',c.active===false?'В архиве':'Активен',c.note||'']}))}},

 trainers:{label:'Тренеры',about:'справочник целиком — период на него не влияет',period:false,
  cols:[T('Имя',26),T('Что ведёт',26),T('Статус',14),T('Комментарий',40)],
  build(){return state.trainers.map(t=>({cells:[t.name,roleLabel(t),t.active===false?'В архиве':'Активен',t.note||'']}))}},

 cards:{label:'Карточки тренеров',about:'по листу на каждого: его клиенты и часы',period:true,
  cols:[T('Клиент',26),T('Закреплён',12),T('Статус',12),N('Персональных',13),N('Часы',9),DT('Первая',12),DT('Последняя',12),T('Комментарий',30)],
  // Один лист — один тренер. Имя листа = фамилия, потому что вкладок много и
  // «Анна Волкова» в них не помещается.
  sheets(a,b){
   const busy=new Set(),out=[];
   for(const t of state.trainers){
    const mine=state.sessions.filter(p=>p.trainerId===t.id&&p.date>=a&&p.date<=b);
    // Карточка — про персональную работу. Тренер, который её не ведёт, вкладку
    // не получает: панель его в персональном контексте тоже не показывает.
    if(!D.can(t,'personal')&&!mine.length)continue;
    const done=mine.filter(p=>p.status==='completed');
    const ids=new Set(mine.map(p=>p.clientId));
    state.clients.filter(c=>c.trainerId===t.id).forEach(c=>ids.add(c.id));
    const rows=[...ids].map(id=>{
     const c=state.clients.find(x=>x.id===id);if(!c)return null;
     // Часы и счёт — только по проведённым, как в D.stats и на листе «Итоги».
     const his=done.filter(p=>p.clientId===id),dates=his.map(p=>p.date).sort();
     const minutes=his.reduce((n,p)=>n+p.duration,0);
     // Ноль здесь настоящий: клиент закреплён, но в этом периоде не занимались.
     return {cells:[c.name,yesNo(c.trainerId===t.id),c.active===false?'В архиве':'Активен',
      his.length,Math.round(minutes/60*10)/10,dates[0]||'',dates[dates.length-1]||'',c.note||'']}})
     .filter(Boolean)
     .sort((x,y)=>y.cells[3]-x.cells[3]||String(x.cells[0]).localeCompare(String(y.cells[0]),'ru'));
    // Пустая вкладка никому не нужна: тренер без клиентов и без записей её не получает.
    if(!rows.length)continue;
    rows.push({bold:true,cells:['Всего: '+rows.length+' '+plural(rows.length,['клиент','клиента','клиентов']),'','',
     done.length,Math.round(done.reduce((n,p)=>n+p.duration,0)/60*10)/10,'','','']});
    out.push({key:'card-'+t.id,name:uniqueSurname(t.name,busy),cols:this.cols,rows});
   }
   return out;
  }},

// Фамилия для имени вкладки: берём последнее слово имени. Если у двух тренеров
// она совпала, добавляем инициал — иначе Excel не примет два одинаковых листа.
function uniqueSurname(full,busy){
 const parts=String(full||'').trim().split(/\s+/).filter(Boolean);
 let base=parts.length>1?parts[parts.length-1]:(parts[0]||'Тренер');
 if(busy.has(base)&&parts.length>1)base=parts[parts.length-1]+' '+parts[0][0]+'.';
 let name=base,n=2;while(busy.has(name))name=base+' '+n++;
 busy.add(name);return name;
}

const EXPORT_ICONS={lessons:'journal',shift:'shift'};
const exportIcon=key=>EXPORT_ICONS[key]?SECTION_ICONS[EXPORT_ICONS[key]]
 :VIEW_ICONS[{totals:'totals',clients:'clients',trainers:'trainers',schedule:'rules',cards:'personal'}[key]]||'';

// ——— Состояние окна ———
let exportCfg=null;
function exportDefaults(){
 const [a,b]=range();
 const pick=ui.section==='shift'?['shift']:ui.section==='directory'?['clients','trainers']:['lessons','totals'];
 return {pick,from:a,to:b,format:'xlsx'};
}
// Быстрые периоды. «Всё время» берём от самой ранней записи в базе.
function exportRange(kind){
 const t=D.today();
 if(kind==='week')return[D.add(t,1-D.wd(t)),D.add(D.add(t,1-D.wd(t)),6)];
 if(kind==='month')return[t.slice(0,7)+'-01',D.add(D.iso(new Date(+t.slice(0,4),+t.slice(5,7),1)),-1)];
 const dates=[...Object.values(state.facts),...Object.values(state.shiftFacts),...state.sessions].map(x=>x.date)
  .concat(state.rules.map(r=>r.from),state.tasks.map(q=>q.from)).filter(Boolean).sort();
 const last=dates[dates.length-1]||t;
 return[dates[0]||t,t>last?t:last];
}
function exportRangeNow(){
 for(const kind of ['week','month','all']){const[a,b]=exportRange(kind);
  if(a===exportCfg.from&&b===exportCfg.to)return kind}
 return '';
}
function exportPlan(){
 const c=exportCfg,out=[];
 for(const key of c.pick){const part=EXPORT_PARTS[key];if(!part)continue;
  if(part.sheets){for(const sh of part.sheets(c.from,c.to))out.push({part:key,...sh});continue}
  const rows=part.period?part.build(c.from,c.to):part.build();
  out.push({key,part:key,name:part.label,cols:part.cols,rows})}
 return out;
}

// Сводка перед кнопкой: по строке на отметку, а не на лист. Иначе шесть тренеров
// растянут окно и в нём потеряется всё остальное.
function exportSummary(plan){
 const out=[];
 for(const key of exportCfg.pick){
  const part=EXPORT_PARTS[key],mine=plan.filter(s=>s.part===key);
  if(!part||!mine.length)continue;
  const rows=mine.reduce((n,s)=>n+s.rows.length,0);
  const note=!rows?'пусто за этот период'
   :mine.length>1?`${mine.length} ${plural(mine.length,['лист','листа','листов'])}: ${mine.map(s=>s.name).join(', ')}`
   :`${rows} ${plural(rows,['строка','строки','строк'])}`;
  out.push({label:part.label,note});
 }
 return out;
}

function exportApply(data){
 const c=exportCfg;
 if(!c.pick.length)throw Error('Отметьте хотя бы одно — иначе файл будет пустым');
 const from=String(data.from||''),to=String(data.to||'');
 if(!D.validDate(from)||!D.validDate(to))throw Error('Проверьте даты периода');
 if(from>to)throw Error('Начало периода позже конца — поменяйте местами');
 c.from=from;c.to=to;
 const plan=exportPlan(),total=plan.reduce((a,s)=>a+s.rows.length,0);
 if(!total)throw Error('За выбранный период записей нет — возьмите период шире');
 const stamp=plan.some(s=>EXPORT_PARTS[s.part]?.period)?from+'_'+to:D.today();
 if(c.format==='csv'){
  plan.forEach(s=>{if(!s.rows.length)return;
   // Клетка, начинающаяся с = + - @, для Excel не текст, а формула: имя клиента
   // из чужого файла смены может оказаться командой. Впереди ставим апостроф —
   // Excel его не показывает, но считает содержимое текстом.
   const cell=x=>{let t=String(x??'').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,'');
    if(/^[=+\-@\t\r]/.test(t))t="'"+t;
    return '"'+t.replace(/"/g,'""')+'"'};
   const body=[s.cols.map(x=>x.h)].concat(s.rows.map(r=>r.cells.map((v,i)=>
    s.cols[i].t==='pct'&&v!==null&&v!==''?Math.round(v*100)+'%':v)))
    .map(r=>r.map(cell).join(';')).join('\r\n');
   download('﻿'+body,`Club_${s.key}_${stamp}.csv`,'text/csv;charset=utf-8')});
 }else{
  download(xlsxBook(plan),`Club_${stamp}.xlsx`,
   'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
 }
 $('#modal').close();
 showToast(say('exportDone',total,c.format==='xlsx'?'книгу':'файлы'));
}

 else if(a==='task'||a==='task-done'){let date=id.slice(0,10),q=D.tasks(state,date).find(q=>q.key===id);if(!q)return;lastTask=id;if(a==='task'){openModal('Состояние пункта',`<p>${esc(q.title)}</p>${select('Статус','status',[['skipped','Не вышло'],['done','Выполнено'],['open','Вернуть в открытые']],q.status==='open'?'skipped':q.status)}${field('Причина для «не вышло»','reason',q.reason||'')}`,'task',{q})}else commit(s=>{if(q.status==='done')reopenTask(s,q);else s.shiftFacts[id]={...q,id,routeItemId:q.routeItemId||q.id,status:'done',reason:'',recordedAt:new Date().toISOString()}})}
 else if(a==='backup')download(loadError&&persistedRaw!==null?persistedRaw:JSON.stringify(state,null,2),'Club_backup_'+D.today()+'.json','application/json');
 else if(a==='export')screenOpen('export');
 else if(a==='export-pick'){const set=new Set(exportCfg.pick);set.has(id)?set.delete(id):set.add(id);exportCfg.pick=Object.keys(EXPORT_PARTS).filter(k=>set.has(k));exportModal()}
 else if(a==='export-range'){const[a1,b1]=exportRange(id);exportCfg.from=a1;exportCfg.to=b1;exportModal()}
 else if(a==='export-format'){exportCfg.format=id;exportModal()}
 else if(a==='start')screenOpen('start');
 else if(a==='demo')screenOpen('demo');
 else if(a==='close-toast')$('#toast').hidden=true;
 else if(a==='undo'&&undo){writeBase(undo);state=undo;undo=null;loadError='';resetContext();render();showToast(say('undone'))}}catch(err){showToast(err.message)}});
document.addEventListener('change',e=>{let {id,value}=e.target;if(id==='date'){ui.date=D.validDate(value)?value:D.today();navigate();render()}
 else if(id==='trainer'||id==='kind'){ui[id]=value;render()}
 else if(id==='owner'){ui.owner=value;render()}
 else if(e.target.name==='mode'&&modalContext?.save==='handoff'){let row=$('#periodrow');if(row){let off=value==='full';row.style.display=off?'none':'';row.querySelectorAll('input').forEach(x=>{x.disabled=off;x.required=!off})}}
 else if(['from','to'].includes(e.target.name)&&modalContext?.save==='export'){if(D.validDate(e.target.value)){exportCfg[e.target.name]=e.target.value;exportModal()}}
 else if(e.target.name==='status'&&modalContext?.save==='occ'){let input=$('[name="attendance"]');if(input){input.disabled=value!=='completed';input.required=value==='completed'}}});
document.addEventListener('input',e=>{
 if(e.target.tagName==='TEXTAREA'&&e.target.dataset&&e.target.dataset.grow!==undefined)growArea(e.target);
 const vk=e.target.dataset&&e.target.dataset.voiceKey;
 if(vk){const val=e.target.value.trim();
  if(voiceDraft)voiceDraft[vk]=(!val||val===shadowText(vk))?'':val;
  e.target.closest?.('.lineedit')?.classList?.toggle('lineedit--own',!!(voiceDraft&&voiceDraft[vk]));
  voiceMark();return}
 if(e.target.id==='search'){let start=e.target.selectionStart;ui.search=e.target.value;render();$('#search').focus();$('#search').setSelectionRange(start,start)}});
document.addEventListener('submit',e=>{if(e.target.id!=='form')return;e.preventDefault();let data=Object.fromEntries(new FormData(e.target)),ctx=modalContext;try{if(!e.target.checkValidity()){e.target.reportValidity();return}if(ctx.save==='paste'){importModal(ctx.kind,String(data.paste||''));return}if(ctx.save==='import'){if(data.confirm!=='ЗАМЕНИТЬ')throw Error('Введите ЗАМЕНИТЬ');replaceBase(ctx.parsed,'База заменена файлом');handoffPack=null;handoffPlan=null}
 else if(ctx.save==='export'){exportApply(data);return}
 else if(ctx.save==='settings'){}
 else if(ctx.save==='voice'){
  prefs.custom=prefs.custom||{};
  for(const k of Object.keys(voiceDraft||{})){const v=voiceDraft[k];if(v)prefs.custom[k]=v;else delete prefs.custom[k]}
  prefsSave();voiceDraft=null;showToast(say('saved'));screenBack();render();return}
 else if(ctx.save==='reset'||ctx.save==='reset-demo'){if(data.confirm!=='ЗАМЕНИТЬ')throw Error('Введите ЗАМЕНИТЬ');let next=ctx.save==='reset-demo'?D.demo():D.empty();replaceBase(next,'База заменена')}
 else if(ctx.save==='handoff'){
 const admin=String(data.admin||'').trim();
 if(!admin)throw Error('Напишите, кто выгружает');
 const mode=data.mode==='full'?'full':'period';
 if(mode==='period'){
  if(!D.validDate(data.from)||!D.validDate(data.to))throw Error('Проверьте даты периода');
  if(data.from>data.to)throw Error('Дата «С» не может быть позже даты «По»');
 }
 const pack=buildPack(mode,data.from,data.to,admin,sendPrefs&&(prefsChanged()||customCount()>0));
 if(!pack.counts.trainers&&!pack.counts.sessions&&!pack.counts.facts)throw Error('Выгружать нечего: за этот период записей нет');
 download(JSON.stringify(pack,null,1),packName(mode,data.from,data.to),'application/json');
 commit(s=>{s.admin=admin;logPush(s,'export',mode==='full'?'вся база':'период '+data.from+' — '+data.to,{mode,from:pack.from,to:pack.to})});
 showToast(say('exported',mode==='full'?'вся база':data.from+' — '+data.to),true);
}

 else if(ctx.save==='handoff-accept'){
 const pack=handoffPack,plan=handoffPlan;
 if(!pack)throw Error('Файл не выбран — нажмите «Загрузить» ещё раз');
 const choices={};
 plan.conflicts.slice(0,60).forEach((c,i)=>{choices[c.group+':'+c.id]=data['k'+i]==='mine'?'mine':'theirs'});
 // примерка вхолостую: если слияние даёт непригодную базу, объясняем шагами, а не кодом ошибки
 try{const probe=structuredClone(state);applyMerge(probe,pack,choices);D.validate(probe)}
 catch(err){handoffProblems([{what:'Записи из файла не сходятся с вашими: '+err.message,
  steps:['Ваша база не изменилась — можно спокойно закрыть это окно.',
   'Попросите того, кто прислал файл, выгрузить смену заново и целиком («Вся база»), а не куском.',
   'Если он менял файл в блокноте или другой программе — нужен исходный, нетронутый файл.',
   'Если повторится и на полной выгрузке — пришлите оба файла тому, кто настраивал панель.']}],pack.fileName);
  return;}
 let report=null;
 commit(s=>{
  report=applyMerge(s,pack,choices);
  logPush(s,'import',`принято от ${pack.admin||'—'}: новых ${report.added}, обновлено ${report.updated}, своих оставлено ${report.kept}`,{from:pack.from,to:pack.to});
 });
 handoffPack=null;handoffPlan=null;takePrefs=true;
 const pr=pack.prefs;
 const worth=pr&&typeof pr==='object'&&(okMode('density',pr.density)||okMode('voice',pr.voice)||(pr.custom&&Object.keys(pr.custom).length));
 const same=worth&&pr.density===prefs.density&&pr.voice===prefs.voice&&(pr.theme||null)===(prefs.theme||null)
   &&JSON.stringify(pr.custom||{})===JSON.stringify(prefs.custom||{});
 if(worth&&!same){pendingPrefs=pr;pendingReport=report;prefsAskModal(pr,report);return}
 mergeDoneModal(report);
}

 else if(ctx.save==='import-group'){
 const rows=pasteRows,deltas={};let added=0,when='';
 commit(s=>{rows.forEach((r,i)=>{
  const occId=data['o'+i];if(!occId)return;
  const occ=D.occurrences(s,r.date,r.date).find(x=>x.id===occId);
  if(!occ)throw Error('Занятие не найдено: '+dateLabel(r.date)+' · '+(r.time||''));
  const raw=String(data['a'+i]??'').trim();
  if(raw==='')throw Error('Укажите, сколько человек пришло: '+dateLabel(r.date)+(r.time?' · '+r.time:''));
  const n=Number(raw);
  if(!Number.isSafeInteger(n)||n<0)throw Error('Сколько пришло — целое число, 0 или больше');
  deltas[occ.id]={from:occ.status==='completed'?occ.attendance:null,to:n};
  s.facts[occ.id]={...occ,id:occ.id,kind:'group',status:'completed',attendance:n,
   trainerId:r.trainerId||occ.trainerId,updatedAt:new Date().toISOString()};added++;when=r.date;
 })});
 if(added){justSaved={kind:'group',date:when,count:added,deltas};Object.assign(ui,{section:'journal',kind:'group',view:'day',date:when});navigate();render()}
 showToast(say('importedGroups',added),true);
}

 else if(ctx.save==='import-personal'){
 const rows=pasteRows,fresh=[];let added=0,when='';
 commit(s=>{rows.forEach((r,i)=>{
  let clientId=data['c'+i];if(!clientId)return;
  let trainerId=data['t'+i];if(!trainerId)throw Error('Укажите тренера для записи '+dateLabel(r.date)+' · '+r.time);
  if(clientId==='new'){const created={id:D.uid(),name:r.raw.trim(),trainerId,active:true,note:''};s.clients.push(created);clientId=created.id}
  const time=r.time||String(data['tm'+i]||'').trim();
  if(!/^([01]\d|2[0-3]):[0-5]\d$/.test(time))throw Error('Укажите время для «'+r.raw+'»');
  const duration=Number(data['dr'+i]||r.duration)||60;
  const id=D.uid();fresh.push(id);when=r.date;
  s.sessions.push({id,date:r.date,time,title:'Персональная тренировка',kind:'personal',trainerId,clientId,
   duration,room:'Тренажёрный зал',status:r.status,note:'',createdAt:new Date().toISOString()});added++;
 })});
 if(added){justSaved={kind:'personal',date:when,count:added,ids:fresh};Object.assign(ui,{section:'directory',view:'personal',search:''});navigate();render()}
 showToast(say('importedPersonal',added),true);
}

 else if(ctx.save==='remind-occ'){const r=ctx.r,raw=String(data.attendance??'').trim();if(raw==='')throw Error('Введите число участников, включая 0');const n=Number(raw);if(!Number.isSafeInteger(n)||n<0)throw Error('Сколько пришло — целое число, 0 или больше');commit(s=>{s.facts[r.id]={...r,id:r.id,kind:'group',status:'completed',attendance:n,updatedAt:new Date().toISOString()}})}
 else if(ctx.save==='personal'){commit(s=>s.sessions.push({...data,id:D.uid(),title:'Персональная тренировка',kind:'personal',duration:Number(data.duration),status:'completed',createdAt:new Date().toISOString()}))}
 else if(ctx.save==='occ'){let r=ctx.r;commit(s=>{let item={...r,...data,duration:r.kind==='personal'?Number(data.duration):r.duration,attendance:r.kind==='group'&&data.status==='completed'?(data.attendance?.trim()?Number(data.attendance):null):null,updatedAt:new Date().toISOString()};if(r.kind==='group'&&data.status==='completed'&&item.attendance===null)throw Error('Введите число участников, включая 0');if(r.kind==='personal')s.sessions[s.sessions.findIndex(p=>p.id===r.id)]=item;else if(data.status==='planned'){const generated=s.rules.some(q=>q.seriesId===r.seriesId&&q.from<=r.date&&(!q.to||q.to>=r.date)&&q.weekday===D.wd(r.date));if(generated)delete s.facts[r.id];else s.facts[r.id]=item}else s.facts[r.id]=item})}
 else if(ctx.save==='task'){commit(s=>{if(data.status==='open')reopenTask(s,ctx.q);else s.shiftFacts[ctx.q.key]={...ctx.q,id:ctx.q.key,routeItemId:ctx.q.routeItemId||ctx.q.id,status:data.status,reason:data.status==='skipped'?data.reason.trim():'',recordedAt:new Date().toISOString()}})}
 else if(ctx.save==='entity'){commit(s=>{let {kind,id}=ctx,old=s[kind].find(x=>x.id===id);if(kind==='trainers'||kind==='clients'){let value={...old,...data,id:id||D.uid(),name:data.name.trim(),active:data.active==='true'};if(kind==='trainers'){value.roles={group:data.roles!=='personal',personal:data.roles!=='group'};delete value.roles.undefined}else delete value.roles;if(old)Object.assign(old,value);else s[kind].push(value)}else{let from=data.from;if(from<D.today())throw Error('Изменение шаблона применяется с сегодняшней или будущей даты');if(old){old.toOriginal=old.to;if(old.to&&from>old.to)throw Error('Дата выходит за период этой версии');if(from<old.from)throw Error('Дата раньше начала выбранной версии');if(from===old.from){s[kind]=s[kind].filter(x=>x.id!==old.id)}else old.to=D.add(from,-1)}if(data.operation==='stop'){if(!old)throw Error('Сначала создайте запись');delete old.toOriginal;return}
 let value={...data,id:D.uid(),from,to:old?.toOriginal||null};delete value.operation;if(kind==='rules'){Object.assign(value,{seriesId:old?.seriesId||D.uid(),weekday:Number(data.weekday),capacity:Number(data.capacity),duration:Number(data.duration)})}else Object.assign(value,{seriesId:old?.seriesId||old?.id||D.uid(),required:data.required==='true',weekdays:data.weekdays.split(',').map(Number)});if(old)delete old.toOriginal;s[kind].push(value)}})}$('#modal').close()}catch(err){$('#formerror').textContent=err.message}});
$('#import').addEventListener('change',async e=>{
 const f=e.target.files[0];e.target.value='';
 if(!f)return;
 if(f.size>PACK_LIMIT){handoffProblems([{what:say('fileTooBig'),steps:['Попросите выгрузить не всю базу, а период — например, одну неделю.','Принимайте такие куски по очереди: сначала первую неделю, потом вторую.']}],f.name);return}
 let text='';
 try{text=await f.text()}
 catch(err){handoffProblems([{what:say('fileUnread'),steps:['Скопируйте файл из мессенджера или почты в папку «Загрузки».','Откройте «Загрузить» и выберите файл уже оттуда.']}],f.name);return}
 const {pack,problems}=readPack(text,f.name);
 if(problems.length){handoffProblems(problems,f.name);return}
 handoffPreview(pack);
});

parseRoute();

// Refresh live overview without stealing input or rebuilding an open form.
setInterval(()=>{justSaved=null;if(ui.section==='console'&&!$('#modal').open&&document.visibilityState!=='hidden'&&!['INPUT','TEXTAREA','SELECT','BUTTON'].includes(document.activeElement?.tagName))render();checkReminders()},60000);
$('#modal').addEventListener('close',()=>{if(!$('#modal').open)modalTrailReset();setTimeout(remindNext,350)});
if(typeof requestAnimationFrame==='function')setTimeout(checkReminders,4000);
</script></body></html>
