<!doctype html>
<!-- Этот файл собран автоматически. Правки вносятся в source/src/,
     порядок слоёв — в source/sources.json, сборка — python build.py.
     Изменения прямо здесь потеряются при следующей сборке.
     Как всё устроено — ARCHITECTURE.md. -->
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="Дневник клиента: день, тренировки, прогресс, тренер"><meta name="theme-color" content="#ECECEA" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0B0C0E" media="(prefers-color-scheme: dark)"><title>Дневник · Клиент</title><script>try{var p=JSON.parse(localStorage.getItem('xeptra.client2.prefs')||'{}');var t=p.theme;document.documentElement.setAttribute('data-theme',t==='dark'||t==='light'?t:(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))}catch(e){document.documentElement.setAttribute('data-theme','light')}</script><style>/* ——— Токены ———
   Единственный источник чисел и цветов (VISUAL-MECHANISM.md §3). В остальных файлах
   нет ни одного hex, размера шрифта, насыщенности или радиуса числом — это
   проверяет test-law.cjs.

   Цвет — роли, а не оттенки. Нормы контраста (проверены расчётом):
     текст  ink ≥ 12 · ink-soft ≥ 7 · muted ≥ 5 на панели и на карточке;
     faint  ≥ 3 — только неречевое (точки, заглушки, разделители), не текст;
     слои   панель/холст ≥ 1,08 · карточка/панель ≥ 1,15 · поле = заливка карточки.
   Статус — три тона и только в момент статуса: ok · warn · alert.
   Режим «В зале» всегда тёмный: .gym получает тёмный набор, как и тёмная тема. */

:root{
 color-scheme:light;
 /* пространство — шкала 4 */
 --s-1:4px;--s-2:8px;--s-3:12px;--s-4:16px;--s-5:20px;--s-6:24px;--s-8:32px;--s-12:48px;
 /* типографика — 7 ступеней, 3 насыщенности */
 --t-display:56px;--t-title:28px;--t-heading:18px;--t-figure:24px;--t-body:15px;--t-meta:13px;--t-caption:12px;
 --w-regular:450;--w-medium:560;--w-bold:650;
 --font:"Inter","SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
 /* форма */
 --r-sheet:28px;--r-panel:24px;--r-card:16px;--r-control:12px;--r-small:8px;--r-pill:999px;
 --h-compact:32px;--h-control:44px;--h-row:56px;--h-gym:64px;
 /* движение — одна кривая на вход, одна на уход, четыре длительности */
 --ease-out:cubic-bezier(.2,.7,.3,1);--ease-in:cubic-bezier(.4,0,1,1);
 --d-quick:.12s;--d-move:.24s;--d-enter:.32s;

 /* цвет: светлая */
 --canvas:#E9E9E6;--surface:#FAFAF9;--card:#EAEAE7;--card-hot:#E1E1DD;
 --ink:#16181B;--ink-soft:#3A3F45;--muted:#5C636B;--faint:#7D838B;
 --line:#16181B17;--line-strong:#16181B2E;
 --accent:#1A1D21;--accent-press:#33383E;--on-accent:#F7F8F9;
 --ok:#2A7550;--warn:#8F601D;--alert:#B03F37;
 --ok-veil:#2A755017;--warn-veil:#8F601D17;--alert-veil:#B03F3714;
 --press:#16181B14;--hover:#16181B0A;--ring:#16181B33;
 /* стекло — только у плавающих слоёв */
 --glass:#FAFAF9C7;--glass-edge:#FFFFFFB3;--spec:#FFFFFF;--pop:#FFFFFF;
 --blur:saturate(1.5) blur(24px);
 --shadow-rest:0 1px 2px #16181B0F;--shadow-float:0 16px 40px -12px #16181B38;--backdrop:#16181B59;
 --wash:#FFFFFFB3;
}

/* тёмная тема и режим «В зале» — один набор */
:root[data-theme="dark"],.gym{
 color-scheme:dark;
 --canvas:#0B0C0E;--surface:#17191C;--card:#25282D;--card-hot:#2E3238;
 --ink:#EEF0F2;--ink-soft:#C5CAD0;--muted:#979EA7;--faint:#6E757E;
 --line:#FFFFFF14;--line-strong:#FFFFFF29;
 --accent:#EEF0F2;--accent-press:#FFFFFF;--on-accent:#121417;
 --ok:#62C28E;--warn:#DDA95D;--alert:#E87B72;
 --ok-veil:#62C28E24;--warn-veil:#DDA95D1F;--alert-veil:#E87B721F;
 --press:#FFFFFF1A;--hover:#FFFFFF0D;--ring:#FFFFFF40;
 --glass:#1A1C20C7;--glass-edge:#FFFFFF14;--spec:#FFFFFF26;--pop:#1E2125;
 --shadow-rest:0 1px 2px #00000066;--shadow-float:0 16px 40px -12px #000000A6;--backdrop:#000000A6;
 --wash:#FFFFFF08;
}

/* ——— Основа ———
   Сброс, типографика, два материала, элементы управления и их состояния
   (VISUAL-MECHANISM.md §4, §5). Порядок файлов — source/sources.json.

   Закон устойчивой раскладки: ничто не меняет ширину или положение соседей
   из-за того, что поменялись данные. Место под полосу прокрутки занято всегда,
   управляющие элементы не сжимаются, отмеченное не уезжает, нажатие не двигает
   строки и карточки. */

*{box-sizing:border-box}
::selection{background:var(--accent);color:var(--on-accent)}
html{background:var(--canvas);-webkit-text-size-adjust:100%;overflow-y:scroll;scrollbar-gutter:stable}
body{
 margin:0;min-height:100vh;min-height:100dvh;color:var(--ink);
 font-family:var(--font);font-size:var(--t-body);line-height:1.45;font-weight:var(--w-regular);
 font-synthesis:none;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
 background:radial-gradient(1400px 600px at 70% -10%,var(--wash),transparent 70%) fixed,var(--canvas);
}
h1,h2,h3,p{margin:0}
h1{font-size:var(--t-title);line-height:1.15;font-weight:var(--w-bold);letter-spacing:-.03em}
h2{font-size:var(--t-heading);line-height:1.3;font-weight:var(--w-bold);letter-spacing:-.018em}
h3{font-size:var(--t-body);line-height:1.35;font-weight:var(--w-medium)}
.kicker{font-size:var(--t-meta);color:var(--muted);font-weight:var(--w-medium)}
.meta{font-size:var(--t-meta);color:var(--muted)}
.caption{font-size:var(--t-caption);color:var(--muted)}
.num,input{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg{display:block;flex:none}
.grow{flex:1;min-width:0}

/* ——— два материала ———
   Мат — где лежат данные: панели, карточки. Без размытия, волосяная грань,
   тень «лежит».
   Стекло — только плавающее над содержимым: нижняя панель, шапка телефона,
   шторка, тост, выпадающие, полоса «идёт тренировка». Размытие того, что под
   ним, блик по верхней кромке, тень «плавает». Стеклянное = временное. */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-panel);box-shadow:var(--shadow-rest);padding:var(--s-6);min-width:0}
.card{background:var(--card);border-radius:var(--r-card);min-width:0}
.glass{
 position:relative;isolation:isolate;background:var(--glass);
 -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);
 border:1px solid var(--glass-edge);box-shadow:var(--shadow-float);
}
.glass::before{
 content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;pointer-events:none;z-index:-1;
 background:linear-gradient(180deg,var(--spec),transparent 20px);
 -webkit-mask:linear-gradient(black 0 0) content-box,linear-gradient(black 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
}

/* ——— кнопки: таблица состояний (§5.2) ———
   покой → наведение (только мышь) → нажато (сразу, 0 мс) → выбрано → фокус → недоступно.
   Сжатие при нажатии — только у отдельно стоящих (.lone): круглые, «−/+», FAB,
   «Подход сделан». Строки, карточки, сегменты при нажатии только темнеют. */
button,input,textarea{font:inherit;color:inherit}
button{
 cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:var(--s-2);
 min-height:var(--h-control);padding:0 var(--s-5);border-radius:var(--r-pill);
 border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);
 font-size:var(--t-body);font-weight:var(--w-medium);white-space:nowrap;
 transition:background-color var(--d-quick) var(--ease-out),border-color var(--d-quick) var(--ease-out),color var(--d-quick) var(--ease-out),transform var(--d-quick) var(--ease-out),opacity var(--d-quick);
 -webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none;
}
@media (hover:hover){button:hover{background:var(--card)}}
button:active{background:var(--card-hot);transition-duration:0s}
button.lone:active{transform:scale(.96)}
button:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
input:focus-visible,textarea:focus-visible{outline:none}
button:disabled{opacity:.4;cursor:not-allowed}
button:disabled:active{transform:none;background:var(--surface)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
@media (hover:hover){button.primary:hover{background:var(--accent-press)}}
button.primary:active{background:var(--accent-press)}
button.ghost{background:transparent;border-color:transparent;color:var(--ink-soft)}
@media (hover:hover){button.ghost:hover{background:var(--hover);color:var(--ink)}}
button.ghost:active{background:var(--press)}
button.danger{color:var(--alert)}
button.danger.primary{background:var(--alert);border-color:var(--alert);color:var(--on-accent)}
button.small{min-height:var(--h-compact);padding:0 var(--s-3);font-size:var(--t-meta)}
button.icon{width:var(--h-control);padding:0}
button.icon.small{width:var(--h-compact)}
button.wide{width:100%}
.btnrow{display:flex;flex-wrap:wrap;gap:var(--s-2);align-items:center}

/* ——— поля: заливка карточкой, фокус — белое поле с гранью ——— */
input,textarea{
 width:100%;min-height:var(--h-control);padding:0 var(--s-4);
 background:var(--card);border:1px solid transparent;border-radius:var(--r-control);
 color:var(--ink);font-size:var(--t-body);outline:none;
 transition:border-color var(--d-quick),background-color var(--d-quick),box-shadow var(--d-quick);
}
textarea{padding:var(--s-3) var(--s-4);min-height:88px;line-height:1.45;resize:vertical}
@media (hover:hover){input:hover,textarea:hover{border-color:var(--line-strong)}}
input:focus,textarea:focus{background:var(--surface);border-color:var(--ink);box-shadow:0 0 0 3px var(--ring)}
input::placeholder,textarea::placeholder{color:var(--faint)}
input.is-error{border-color:var(--alert)}
.field{display:flex;flex-direction:column;gap:var(--s-2);min-width:0}
.label{font-size:var(--t-meta);font-weight:var(--w-medium);color:var(--muted)}
.hint{font-size:var(--t-meta);color:var(--muted)}
.fields{display:grid;gap:var(--s-5)}
.fields.two{grid-template-columns:1fr 1fr;gap:var(--s-3)}
.fields.three{grid-template-columns:1fr 1fr 1fr;gap:var(--s-3)}

/* ——— сегмент: один из нескольких ——— */
.seg{display:flex;flex:none;gap:2px;padding:3px;border-radius:var(--r-pill);background:var(--card);max-width:100%;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 1 auto;min-width:0;min-height:36px;padding:0 var(--s-4);border:0;background:transparent;color:var(--muted);font-size:var(--t-meta)}
@media (hover:hover){.seg button:hover{background:var(--hover);color:var(--ink)}}
.seg button:active{background:var(--press)}
.seg button.is-on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-rest)}
.seg.inline{display:inline-flex}
/* чипы: множественный выбор и подсказки */
.chips{display:flex;flex-wrap:wrap;gap:var(--s-2)}
.chip{min-height:36px;padding:0 var(--s-3);font-size:var(--t-meta);background:var(--card);border-color:transparent;color:var(--ink-soft)}
.chip.is-on{background:var(--accent);color:var(--on-accent)}
.chips.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:var(--s-1);max-width:360px}
.chips.days .chip{width:auto;min-width:0;padding:0}

/* ——— отметка: кружок 28 с зоной касания 44 ——— */
.tick{
 position:relative;flex:none;width:28px;min-height:28px;height:28px;padding:0;border-radius:50%;
 border:1.5px solid var(--muted);background:transparent;color:transparent;
}
.tick::after{content:"";position:absolute;inset:-8px;border-radius:50%}
@media (hover:hover){.tick:hover{background:transparent;border-color:var(--ink)}}
.tick:active{transform:scale(.9);background:transparent}
.tick svg{transform:scale(.4);opacity:0;transition:transform var(--d-move) var(--ease-out),opacity var(--d-quick)}
.tick.is-on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);animation:fill var(--d-move) var(--ease-out)}
.tick.is-on svg{transform:none;opacity:1}
@keyframes fill{from{box-shadow:inset 0 0 0 14px var(--accent);background:transparent}to{box-shadow:inset 0 0 0 0 var(--accent)}}

/* ——— кольцо количества ——— */
.ringbox{position:relative;flex:none;width:36px;height:36px;display:grid;place-items:center}
.ringbox svg.ring{position:absolute;inset:0;transform:rotate(-90deg)}
.ringbox b{position:relative;font-size:var(--t-caption);font-weight:var(--w-bold);font-variant-numeric:tabular-nums}
.ring .bg{fill:none;stroke:var(--card-hot);stroke-width:3.5}
.ring .fg{fill:none;stroke:var(--ink);stroke-width:3.5;stroke-linecap:round;transition:stroke-dashoffset var(--d-move) var(--ease-out)}
.ringbox.is-done .fg{stroke:var(--ok)}
.ringbox.is-done b{color:var(--ok)}

/* ——— пусто ——— */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--s-2);padding:var(--s-8) var(--s-4)}
.empty .eico{width:48px;height:48px;border-radius:var(--r-card);display:grid;place-items:center;background:var(--card);color:var(--muted);margin-bottom:var(--s-2)}
.empty p{color:var(--muted);font-size:var(--t-meta);max-width:340px}
.empty>button{margin-top:var(--s-3)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after,::backdrop{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ——— Каркас ———
   Компьютер: матовая боковая колонка (она лежит, а не плавает) и сцена.
   Телефон: стеклянные шапка, панель вкладок и «+» — они плавают над лентой
   (08-responsive.css). Полоса «идёт тренировка» — стекло везде. */

.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh;min-height:100dvh}

.side{
 position:sticky;top:0;align-self:start;height:100vh;height:100dvh;
 display:flex;flex-direction:column;gap:var(--s-6);padding:var(--s-6) var(--s-3) var(--s-3);
 border-right:1px solid var(--line);background:var(--surface);
}
.brand{display:flex;align-items:center;gap:var(--s-3);padding:0 var(--s-2)}
.brand b{display:block;font-size:var(--t-body);font-weight:var(--w-bold);letter-spacing:-.02em;line-height:1.2}
.brand .caption{display:block}
.mark{width:36px;height:36px;flex:none;border-radius:var(--r-control);display:grid;place-items:center;background:var(--accent);color:var(--on-accent)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{
 display:flex;align-items:center;gap:var(--s-3);height:var(--h-control);padding:0 var(--s-3);border-radius:var(--r-control);
 color:var(--ink-soft);text-decoration:none;font-weight:var(--w-medium);
 transition:background-color var(--d-quick),color var(--d-quick);-webkit-tap-highlight-color:transparent;
}
.nav a svg{color:var(--muted)}
@media (hover:hover){.nav a:hover{background:var(--hover);color:var(--ink)}}
.nav a:active{background:var(--press)}
.nav a.is-on{background:var(--card);color:var(--ink)}
.nav a.is-on svg{color:var(--ink)}
.sideadd{margin:0 var(--s-1)}
.sidefoot{margin-top:auto;display:flex;flex-direction:column;gap:var(--s-2)}
.me{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-2)}
.me b{display:block;font-size:var(--t-meta);font-weight:var(--w-bold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .caption{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidefoot .btnrow{gap:var(--s-1)}
.avatar{width:36px;height:36px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:var(--t-meta);font-weight:var(--w-bold);background:var(--card);color:var(--ink)}

.main{min-width:0;padding:var(--s-8) var(--s-8) var(--s-12)}
.scene{max-width:1160px;margin:0 auto;display:flex;flex-direction:column;gap:var(--s-6)}
.scene.enter,.obcard.enter{animation:enter var(--d-enter) var(--ease-out)}
@keyframes enter{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.shead{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s-4);flex-wrap:wrap}
.shead .kicker{margin-bottom:var(--s-1)}
.shead .kicker:first-letter{text-transform:uppercase}
.shead .sub{color:var(--muted);margin-top:var(--s-1)}
.shead .actions{display:flex;gap:var(--s-2);flex-wrap:wrap}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:var(--s-6);align-items:start}
.stack{display:flex;flex-direction:column;gap:var(--s-6);min-width:0}

.phead{flex:none;display:flex;align-items:center;justify-content:space-between;gap:var(--s-3);min-height:var(--h-compact);margin-bottom:var(--s-4)}
.ptag{font-size:var(--t-caption);font-weight:var(--w-medium);color:var(--muted);font-variant-numeric:tabular-nums}
.pfoot{display:flex;justify-content:center;margin-top:var(--s-3)}
.footnote{padding:0 var(--s-2)}

/* пример: полоса над сценой, не исчезает, пока смотрите */
.banner{display:flex;align-items:center;gap:var(--s-4);padding:var(--s-3) var(--s-3) var(--s-3) var(--s-5)}
.banner b{display:block}
.banner .meta{display:block}

/* телефонные слои по умолчанию скрыты */
.mhead,.tabbar,.fab,a.mback{display:none}
a.mback{align-items:center;justify-content:center;width:var(--h-control);min-height:var(--h-control);border-radius:var(--r-pill);color:var(--ink-soft);text-decoration:none;flex:none}
@media (hover:hover){a.mback:hover{background:var(--hover);color:var(--ink)}}
a.mback:active{background:var(--press)}

/* ——— идёт тренировка: плавающая стеклянная полоса ——— */
.livebar{
 position:fixed;z-index:32;left:50%;transform:translateX(-50%);bottom:var(--s-6);
 width:min(460px,calc(100vw - 32px));min-height:var(--h-row);padding:0 var(--s-4) 0 var(--s-5);
 justify-content:flex-start;gap:var(--s-3);border-radius:var(--r-pill);text-align:left;color:var(--ink);
}
.livebar b{display:block;font-size:var(--t-meta);font-weight:var(--w-bold);overflow:hidden;text-overflow:ellipsis}
.livebar .caption{display:block}
.livebar .go{display:inline-flex;align-items:center;gap:var(--s-1);font-size:var(--t-meta);font-weight:var(--w-medium)}
@media (hover:hover){.livebar:hover{background:var(--glass)}}
.livebar:active{background:var(--glass)}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--ok);flex:none;box-shadow:0 0 0 0 var(--ok-veil);animation:pulse 2s var(--ease-out) infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--ok)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.has-live .main{padding-bottom:calc(var(--s-12) + var(--h-row))}

/* ——— первый вход ——— */
.onboard{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:var(--s-6) var(--s-4)}
.obcard{width:min(520px,100%);display:flex;flex-direction:column;gap:var(--s-5);padding:var(--s-8)}
.obcard .sub{color:var(--muted);margin-top:calc(var(--s-3) * -1)}
.obmark{width:56px;height:56px;border-radius:var(--r-card);display:grid;place-items:center;background:var(--accent);color:var(--on-accent)}
.obdots{display:flex;gap:var(--s-1)}
.obdots i{width:24px;height:4px;border-radius:var(--r-pill);background:var(--card-hot)}
.obdots i.on{background:var(--ink)}
.obdots i.done{background:var(--muted)}
.obpick{display:flex;flex-direction:column;gap:var(--s-2)}
.obopt{justify-content:flex-start;gap:var(--s-3);min-height:var(--h-row);padding:0 var(--s-4);border:1px solid transparent;border-radius:var(--r-card);text-align:left}
.obopt b{display:block;font-weight:var(--w-medium)}
.obopt .caption{display:block}
.obopt.is-on{border-color:var(--ink);background:var(--surface)}
.obopt .tick{pointer-events:none}
.obfoot{display:flex;justify-content:space-between;gap:var(--s-2);margin-top:var(--s-2)}

.obtime{display:flex;flex-wrap:wrap;gap:var(--s-2);margin-top:var(--s-2)}
.obname{margin-top:var(--s-3);display:flex;flex-direction:column;gap:var(--s-2)}
/* выбор: невыбранное — спокойная поверхность с гранью, выбранное — тёмная грань и отметка */
.obopt.card{background:var(--surface);border:1px solid var(--line-strong)}
.obopt.card.is-on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
/* телефон: первый вход во весь экран, главная кнопка внизу под пальцем (VISUAL §7) */
@media (max-width:719px){
 .onboard{display:block;padding:0;min-height:100dvh}
 .obcard{width:100%;min-height:100dvh;border:0;border-radius:0;box-shadow:none;padding:var(--s-8) var(--s-5) 0;background:var(--surface)}
 .obfoot{position:sticky;bottom:0;margin:auto calc(var(--s-5) * -1) 0;padding:var(--s-4) var(--s-5) calc(var(--s-4) + env(safe-area-inset-bottom));background:var(--surface);border-top:1px solid var(--line)}
 .obfoot .primary{flex:1}
}
/* Дневник не сохраняется: полоса видна на любом экране, пока запись не пройдёт */
.banner.unsaved{border:1px solid var(--alert);gap:var(--s-3)}
.banner.unsaved .qico{color:var(--alert);display:inline-flex}

/* ——— «Сегодня»: полоса недели, вопросы, лента ———
   Строка ленты: высота --h-row, главное действие справа, тело строки —
   кнопка во всю ширину (нажатие только темнит, ничего не двигает). */

.weekstrip{display:flex;align-items:center;gap:var(--s-1)}
.wdays{flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:var(--s-1)}
.wd{flex-direction:column;gap:2px;min-height:60px;padding:var(--s-1) 0;border:1px solid transparent;background:transparent;border-radius:var(--r-card);color:var(--muted);font-size:var(--t-caption)}
.wd b{font-size:var(--t-heading);font-weight:var(--w-bold);color:var(--ink)}
.wd i{width:5px;height:5px;border-radius:50%;background:transparent}
.wd i.done{background:var(--ok)}
.wd i.plan{background:var(--faint)}
@media (hover:hover){.wd:hover{background:var(--hover)}}
.wd.is-today{border-color:var(--line-strong)}
.wd.is-on{background:var(--surface);border-color:var(--line);box-shadow:var(--shadow-rest);color:var(--ink)}

.qcards{display:flex;flex-direction:column;gap:var(--s-2)}
.qcard{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-3) var(--s-3) var(--s-3) var(--s-4);flex-wrap:wrap}
.qcard p{font-weight:var(--w-medium);min-width:180px}
.qico{width:32px;height:32px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--ink-soft)}
.qcard.warn .qico{color:var(--warn);background:var(--warn-veil)}

.timeline{padding-top:var(--s-4)}
.block+.block{margin-top:var(--s-4)}
.blocktitle{font-size:var(--t-caption);font-weight:var(--w-medium);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding:0 var(--s-2) var(--s-1)}
.blocktitle.warn{color:var(--warn)}
.rows{display:flex;flex-direction:column}
.rows.compact{gap:2px}

.row{display:flex;align-items:center;gap:var(--s-3);min-height:var(--h-row);padding:0 var(--s-2);border-radius:var(--r-card);position:relative}
.row+.row::before{content:"";position:absolute;left:52px;right:var(--s-2);top:0;height:1px;background:var(--line)}
.row.plain{padding:var(--s-2)}
.rbody{
 flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:1px;
 min-height:var(--h-row);padding:0 var(--s-2);margin:0 calc(var(--s-2) * -1);border:0;border-radius:var(--r-control);
 background:transparent;text-align:left;font-weight:var(--w-regular);white-space:normal;
}
@media (hover:hover){.rbody:hover{background:var(--hover)}}
.rbody:active{background:var(--press)}
.rt{font-weight:var(--w-medium);color:var(--ink);overflow:hidden;text-overflow:ellipsis;max-width:100%;transition:color var(--d-move)}
.rm{display:flex;align-items:center;gap:var(--s-1);font-size:var(--t-meta);color:var(--muted);flex-wrap:wrap}
.rm b{font-weight:var(--w-medium);color:var(--ink-soft)}
.rm.warn{color:var(--warn)}
.row.is-done .rt{color:var(--muted)}
.row.is-muted{opacity:.6}
.streak{display:inline-flex;align-items:center;gap:2px;color:var(--ink-soft);font-weight:var(--w-medium);margin-left:var(--s-1)}
.lead.ico{width:36px;height:36px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--card);color:var(--ink-soft);transition:background-color var(--d-move),color var(--d-move)}
.lead.ico.on{background:var(--ok-veil);color:var(--ok)}
.row>.tick{margin:0 4px}
.stepbtn{flex:none;min-width:64px;gap:2px;font-variant-numeric:tabular-nums}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s-2)}
.tiles.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.tiles.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.detail .tiles.four{grid-template-columns:repeat(2,minmax(0,1fr))}
.tile{background:var(--card);border-radius:var(--r-card);padding:var(--s-3) var(--s-4);display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font-size:var(--t-figure);font-weight:var(--w-bold);letter-spacing:-.02em;line-height:1.2;white-space:nowrap}
.tile b span{font-size:var(--t-meta);font-weight:var(--w-medium);color:var(--muted);letter-spacing:0}
.delta{font-size:var(--t-caption);font-weight:var(--w-medium);color:var(--muted);font-variant-numeric:tabular-nums}
.delta.up{color:var(--ok)}
.delta.dn{color:var(--warn)}
.panel .tiles+.blocktitle{margin-top:var(--s-5)}
.nextrow{
 flex-direction:column;align-items:flex-start;justify-content:center;gap:0;min-height:var(--h-row);width:100%;
 padding:0 var(--s-3);border:0;border-radius:var(--r-control);background:transparent;text-align:left;font-weight:var(--w-regular)
}
@media (hover:hover){.nextrow:hover{background:var(--hover)}}
.nextrow:active{background:var(--press)}

/* ——— «Сейчас»: линия времени и ближайшее (UX §0.1, VISUAL §6) ——— */
.nowline{position:relative;display:flex;align-items:center;height:20px;margin:2px 0;padding-left:var(--s-2)}
.nowline::after{content:"";flex:1;height:1.5px;margin-left:var(--s-2);background:var(--ink);border-radius:var(--r-pill)}
.nowline span{font-size:var(--t-caption);font-weight:var(--w-bold);color:var(--ink)}
.nowline+.row::before{opacity:0}
.row.is-next{background:var(--card)}
.row.is-next::before,.row.is-next+.row::before{opacity:0}
.row.is-next .rt,.row.wk .rt{font-weight:var(--w-bold)}
/* Крупно — только ближайшее и только там, где есть ширина: на телефоне название с кнопкой ломалось в две строки (аудит, п. 11). */
@media (min-width:720px){.row.is-next .rt{font-size:var(--t-heading);letter-spacing:-.01em}}
.late{color:var(--warn)}
.tiles.one{grid-template-columns:1fr}
@media (max-width:1023px){.deskonly{display:none}}
.okword{color:var(--ok)}
.row.is-future .rt{color:var(--ink-soft)}
.lead.ico.dim{background:transparent;border:1.5px dashed var(--line-strong);color:var(--faint)}
.ringbox b.bump{animation:bump var(--d-move) var(--ease-out)}
@keyframes bump{from{transform:translateY(-4px);opacity:.3}to{transform:none;opacity:1}}
/* Напоминание на «Сегодня»: подсвечена сама строка — у неё уже есть своя кнопка (тост закрыл бы соседей) */
.row.is-remind{background:var(--card);box-shadow:inset 0 0 0 1.5px var(--ink)}
.row.is-remind::before,.row.is-remind+.row::before{opacity:0}

/* закрыть день вручную — в конце сегодняшней ленты */
.closeday{display:flex;align-items:center;gap:var(--s-3);margin-top:var(--s-4);padding:var(--s-3) var(--s-2) 0;border-top:1px solid var(--line)}
.closeday .meta{display:inline-flex;align-items:center;gap:var(--s-1)}
/* тихий признак «число открывает точный ввод» */
.tapnum{text-decoration:underline dotted var(--faint);text-underline-offset:3px}

/* ——— «Тренировки», карточка тренировки и «В зале» ——— */

.datebox{width:44px;height:44px;flex:none;border-radius:var(--r-control);display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--card);line-height:1.1}
.datebox b{font-size:var(--t-body);font-weight:var(--w-bold)}
.datebox span{font-size:var(--t-caption);color:var(--muted)}
.datebox.done{background:var(--card)}
.datebox.done b{color:var(--ink)}
.wrow.is-on{background:var(--card)}
.wrow.is-on::before,.wrow.is-on+.row::before{opacity:0}
.row .datebox+.rbody{margin-left:0}
.wrow+.row::before,.row.wrow::before{left:64px}

.detail{display:flex;flex-direction:column;gap:var(--s-4)}
.dtop{display:flex;align-items:center;gap:var(--s-1);margin:calc(var(--s-2) * -1) calc(var(--s-2) * -1) 0 0}
.backbtn{display:none}
.dtitle{font-size:var(--t-title);font-weight:var(--w-bold);letter-spacing:-.03em;line-height:1.15}
.detail-empty{min-height:320px;display:grid;place-items:center}
.exlist{display:flex;flex-direction:column;gap:var(--s-3)}
.ex{padding:var(--s-4);display:flex;flex-direction:column;gap:var(--s-3)}
.exhead{display:flex;align-items:flex-start;gap:var(--s-3)}
.exhead h3{font-weight:var(--w-bold)}
.exn{width:24px;height:24px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--surface);font-size:var(--t-caption);font-weight:var(--w-bold);color:var(--ink-soft);margin-top:1px}
.sets{display:flex;flex-direction:column;gap:var(--s-1)}
.sethead,.set{display:grid;grid-template-columns:24px minmax(0,1fr) minmax(0,1fr) 44px 32px;gap:var(--s-2);align-items:center}
.sethead span{font-size:var(--t-caption);color:var(--muted);font-weight:var(--w-medium)}
.set .n{font-size:var(--t-meta);color:var(--muted);text-align:center}
.set input,.line input{background:var(--surface);min-height:40px;text-align:center;padding:0 var(--s-2)}
.set .tick{justify-self:center}
.set.is-done input{color:var(--muted)}
.line{display:grid;grid-template-columns:minmax(0,.8fr) 12px minmax(0,1fr) 12px minmax(0,1fr) 44px;gap:var(--s-2);align-items:end}
.line label{display:flex;flex-direction:column;gap:2px;min-width:0}
.line .x{color:var(--faint);text-align:center;padding-bottom:10px}
.line .tick{justify-self:center;margin-bottom:6px}
.exfoot{display:flex;align-items:center;justify-content:space-between;gap:var(--s-2);flex-wrap:wrap}
.exfoot .seg{flex:none;margin-left:auto}
.seg.mini{padding:2px}
.seg.mini button{min-height:28px;padding:0 var(--s-3);font-size:var(--t-caption)}
.addex{border-style:dashed;background:transparent}
.wnote{display:flex;gap:var(--s-2);align-items:flex-start}
.dfoot{display:flex;justify-content:flex-end;gap:var(--s-2);flex-wrap:wrap;padding-top:var(--s-2)}
.dfoot button.ghost{padding:0 var(--s-3)}
.row.plain .exn{background:var(--card)}

/* ——— «В зале»: всегда тёмный, всё под большой палец ——— */
body.in-gym{overflow:hidden}
.gymwrap{
 position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;
 background:var(--canvas);color:var(--ink);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
.gymtop{display:flex;align-items:center;gap:var(--s-2);padding:var(--s-2) var(--s-3)}
.gymtitle{display:flex;flex-direction:column;align-items:center;line-height:1.2}
.gymtitle b{font-size:var(--t-meta);font-weight:var(--w-medium)}
.gymbar{height:3px;margin:0 var(--s-4);border-radius:var(--r-pill);background:var(--card);overflow:hidden;flex:none}
.gymbar i{display:block;height:100%;background:var(--ok);border-radius:inherit;transition:width var(--d-move) var(--ease-out)}
.gymbody{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:var(--s-3);padding:var(--s-4) var(--s-4) var(--s-6);width:100%;max-width:560px;margin:0 auto;text-align:center}
.gymnav{display:flex;align-items:center;justify-content:space-between;width:100%}
.gymname{font-size:var(--t-title);line-height:1.15}
.gymsets{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--s-2);margin:var(--s-2) 0}
.gs{min-width:44px;height:36px;padding:0 var(--s-2);border-radius:var(--r-pill);display:grid;place-items:center;background:var(--card);color:var(--muted);font-size:var(--t-caption)}
.gs b{font-weight:var(--w-medium)}
.gs.done{background:var(--ok-veil);color:var(--ok)}
.gs.now{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
button.gs.add{width:36px;min-width:36px;min-height:36px;padding:0;border:0}
.gympair{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-4);width:100%;margin-top:var(--s-2)}
.gymhint{margin-top:var(--s-1)}
.gymdone{display:flex;flex-direction:column;align-items:center;gap:var(--s-2);padding:var(--s-8) 0;color:var(--ok)}
.gymdone h2,.gymdone p{color:var(--ink)}
.gymrest{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-2) var(--s-2) var(--s-2) var(--s-5);border-radius:var(--r-pill);margin-top:var(--s-4)}
.gymrest b{font-size:var(--t-figure);font-weight:var(--w-bold);min-width:64px;text-align:left}
.gymfoot{padding:var(--s-3) var(--s-4) var(--s-4);width:100%;max-width:560px;margin:0 auto;flex:none}
.gymgo{min-height:var(--h-gym);font-size:var(--t-heading);font-weight:var(--w-bold);border-radius:var(--r-pill)}
.gym .empty{margin:auto}

/* моменты «В зале» (VISUAL §5.3) */
.gs.just{animation:justdone .7s var(--ease-out)}
@keyframes justdone{0%{background:var(--ok);color:var(--on-accent);transform:scale(1.12)}100%{transform:none}}
.gymrest.is-over{background:var(--ok-veil);color:var(--ok)}
.restok{display:inline-flex;align-items:center;gap:var(--s-2)}
.restok b{font-size:var(--t-body);font-weight:var(--w-bold)}
.gymfollow{margin-top:calc(var(--s-1) * -1)}
.gymhint{display:flex;align-items:center;justify-content:center;gap:var(--s-2);flex-wrap:wrap}
.why{text-align:center;margin-bottom:var(--s-2)}
body.in-gym .toast{bottom:calc(var(--h-gym) + var(--s-8) + env(safe-area-inset-bottom))}

.emptyplan{padding:var(--s-5);display:flex;flex-direction:column;align-items:flex-start;gap:var(--s-2)}
.emptyplan>button{margin-top:var(--s-2)}
.gymnote{margin-top:calc(var(--s-1) * -1)}

/* ——— «Прогресс» и «Тренер» ——— */

.pseg{min-width:280px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s-4)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s-4)}
.rowhead{display:flex;align-items:center;justify-content:space-between;gap:var(--s-3);flex-wrap:wrap;padding:0 var(--s-2)}
.rowfoot{display:flex;justify-content:center}

/* карточка-число: вся карточка — кнопка, при нажатии только темнеет */
button.stat{
 display:flex;flex-direction:column;align-items:flex-start;gap:var(--s-1);min-height:0;padding:var(--s-5);
 border-radius:var(--r-panel);text-align:left;white-space:normal;font-weight:var(--w-regular);color:var(--ink);
}
@media (hover:hover){button.stat:hover{background:var(--surface);border-color:var(--line-strong)}}
button.stat:active{background:var(--card)}
.stat .kicker{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.big{font-size:var(--t-figure);font-weight:var(--w-bold);letter-spacing:-.02em;line-height:1.2}
.big small{font-size:var(--t-meta);font-weight:var(--w-medium);color:var(--muted);letter-spacing:0}
.faintnum{color:var(--faint)}
.statfoot{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s-3);width:100%;margin-top:var(--s-2)}
.spark{flex:none;overflow:visible}
.spark path{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.spark circle{fill:var(--ink)}
.spark.wide{width:100%;height:auto}
.chartbox{background:var(--card);border-radius:var(--r-card);padding:var(--s-4);margin-bottom:var(--s-4)}
.chartx{display:flex;justify-content:space-between;margin-top:var(--s-2)}

.hcard{display:flex;flex-direction:column;gap:var(--s-4);padding:var(--s-5)}
.hhead{display:flex;align-items:flex-start;gap:var(--s-2)}
.hhead h3{font-weight:var(--w-bold)}
/* клетка — день, а не полоса: ширина ограничена (аудит, п. 37) */
.marks{display:grid;grid-template-columns:repeat(7,minmax(0,32px));gap:var(--s-1);justify-content:start}
.marks .caption{text-align:center}
.marks i{height:22px;border-radius:var(--r-small);background:var(--card)}
.marks i.none{background:transparent}
.marks i.done{background:var(--ink)}
.marks i.miss{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line-strong)}
.marks i.open{background:var(--card-hot)}
.marks i.today{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink)}
.bars{position:relative;height:88px;display:flex;align-items:flex-end;gap:2px}
.bars i{flex:1;min-width:0;border-radius:var(--r-small) var(--r-small) 0 0;background:var(--card-hot)}
.bars i.done{background:var(--ink)}
.bars i.part{background:var(--faint)}
.bars i.none{background:transparent}
.bars .goal{position:absolute;left:0;right:0;height:0;border-top:1px dashed var(--muted)}
.hfoot{display:flex;align-items:center;justify-content:space-between;gap:var(--s-2)}
.streakbig{display:inline-flex;align-items:center;gap:var(--s-1);font-size:var(--t-meta);color:var(--ink-soft)}
.streakbig b{font-size:var(--t-heading);font-weight:var(--w-bold);color:var(--ink)}

/* ——— тренер ——— */
.coachcard{display:flex;align-items:center;gap:var(--s-4);flex-wrap:wrap}
.coachcard .avatar{width:56px;height:56px;font-size:var(--t-heading)}
.coachcard .meta{display:block;margin-top:2px}
a.btn{
 display:inline-flex;align-items:center;justify-content:center;min-height:var(--h-control);border-radius:var(--r-pill);
 border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);text-decoration:none;
 transition:background-color var(--d-quick);-webkit-tap-highlight-color:transparent;
}
a.btn.icon{width:var(--h-control)}
@media (hover:hover){a.btn:hover{background:var(--card)}}
a.btn:active{background:var(--card-hot);transform:scale(.96)}
.meet .tiles{margin-bottom:var(--s-2)}
.meet .blocktitle{margin-top:var(--s-4)}
.mrow{display:flex;align-items:center;gap:var(--s-2);min-height:36px;padding:0 var(--s-2);font-size:var(--t-meta)}
.mrow b{font-weight:var(--w-medium)}
.mrow svg{color:var(--ok)}
.mnote{padding:var(--s-2) var(--s-3);background:var(--card);border-radius:var(--r-control)}
.mnote p{font-size:var(--t-meta);color:var(--ink-soft);margin-top:2px}
.mnhead{display:flex;align-items:center;justify-content:space-between;margin:calc(var(--s-1) * -1) calc(var(--s-2) * -1) 0 0}
.qlist .row{min-height:var(--h-control)}
.qadd{display:flex;gap:var(--s-2);margin-top:var(--s-2)}
.planrow{justify-content:flex-start;width:100%;min-height:var(--h-row);padding:0 var(--s-2);border:0;background:transparent;border-radius:var(--r-card);color:var(--muted);font-weight:var(--w-regular)}
.planrow .rbody{margin:0;padding:0;min-height:0;background:transparent}
@media (hover:hover){.planrow:hover{background:var(--hover)}}

/* регулярность тренировок: 8 недель полосой, монохром */
.wbars{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:var(--s-2);height:96px;align-items:end}
.wbar{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:var(--s-1)}
.wbar i{width:100%;max-width:36px;border-radius:var(--r-small);background:var(--card-hot)}
.wbar.now i{background:var(--ink)}
.regular{margin-bottom:var(--s-2)}

.hfirst{padding:var(--s-3) 0}
.meetset{width:100%}
/* Легенда сетки отметок: те же клетки, что и в сетке */
.mlegend{display:flex;align-items:center;gap:var(--s-1);flex-wrap:wrap;margin:0}
.mlegend i{width:12px;height:12px;border-radius:var(--r-small);display:inline-block;margin-left:var(--s-2)}
.mlegend i:first-child{margin-left:0}
.mlegend i.done{background:var(--ink)}
.mlegend i.miss{box-shadow:inset 0 0 0 1.5px var(--line-strong)}
.mlegend i.open{background:var(--card-hot)}
/* карточка открывается — шеврон в углу */
button.stat{position:relative}
.statgo{position:absolute;top:var(--s-4);right:var(--s-4);color:var(--faint)}

/* ——— Плавающие слои: шторка, выпадающие, тост ———
   Стекло — только здесь и в каркасе телефона (VISUAL §4). Выпадающие —
   непрозрачные: сквозь список времени ничего не должно читаться. */

.sheet{
 width:min(520px,calc(100vw - 32px));max-height:min(800px,calc(100vh - 48px));max-height:min(800px,calc(100dvh - 48px));
 padding:0;border:1px solid var(--glass-edge);border-radius:var(--r-sheet);color:var(--ink);overflow:hidden;
 background:var(--surface);box-shadow:var(--shadow-float);
}
/* Шторка с формой — матовая (VISUAL §4.1, после аудита): на стекле поля сливались с подложкой. */
.sheet--wide{width:min(680px,calc(100vw - 32px))}
.sheet[open]{animation:arrive var(--d-enter) var(--ease-out)}
.sheet.is-closing{animation:leave .2s var(--ease-in) forwards}
.sheet.is-closing::backdrop{animation:veil-out .2s var(--ease-in) forwards}
.sheet::backdrop{background:var(--backdrop);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);animation:veil var(--d-enter) var(--ease-out)}
@keyframes arrive{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes leave{to{opacity:0;transform:translateY(8px)}}
@keyframes veil{from{opacity:0}to{opacity:1}}
@keyframes veil-out{to{opacity:0}}
.sheetform{display:flex;flex-direction:column;max-height:inherit;min-height:0}
.sheethead{display:flex;align-items:center;justify-content:space-between;gap:var(--s-3);padding:var(--s-5) var(--s-4) var(--s-3) var(--s-6);flex:none}
.sheethead h2{font-size:var(--t-heading)}
.grab{display:none}
.sheetbody{padding:var(--s-2) var(--s-6) var(--s-6);overflow-y:auto;overscroll-behavior:contain;min-height:0}
@media (hover:hover) and (pointer:fine){.sheetbody{scrollbar-gutter:stable}}
.sheetfoot{display:flex;align-items:center;gap:var(--s-2);padding:var(--s-4) var(--s-5) var(--s-5);border-top:1px solid var(--line);flex:none;flex-wrap:wrap}
.sheetfoot .spacer{flex:1}
.confirm{color:var(--ink-soft)}
[hidden]{display:none!important}
.seg.is-off{opacity:.45}
.seg.wrap{flex-wrap:wrap;border-radius:var(--r-card)}
.seg.wrap button{flex:0 1 auto}

/* поле-выбор: дата и время */
.pick{position:relative}
.pickbtn{width:100%;justify-content:flex-start;gap:var(--s-2);border-radius:var(--r-control);padding:0 var(--s-4);font-weight:var(--w-regular);border-color:transparent;background:var(--card)}
@media (hover:hover){.pickbtn:hover{background:var(--card);border-color:var(--line-strong)}}
.pickbtn svg{color:var(--muted)}
.pickbtn[aria-expanded="true"]{background:var(--surface);border-color:var(--ink);box-shadow:0 0 0 3px var(--ring)}
.pickbtn:active{background:var(--card)}

.pop{
 position:fixed;z-index:70;padding:6px;border-radius:var(--r-card);
 background:var(--pop);border:1px solid var(--line);box-shadow:var(--shadow-float);
 overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;animation:pop var(--d-move) var(--ease-out);
}
.pop::-webkit-scrollbar{display:none}
.pop[data-side="up"]{animation-name:pop-up}
@keyframes pop{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
@keyframes pop-up{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.pop--list{display:flex;flex-direction:column;gap:2px;min-width:140px}
.pop--time{max-height:300px}
.popitem{justify-content:flex-start;min-height:40px;border:0;background:transparent;border-radius:var(--r-small);font-weight:var(--w-regular);font-variant-numeric:tabular-nums}
@media (hover:hover){.popitem:hover{background:var(--card)}}
.popitem.is-on{background:var(--accent);color:var(--on-accent);font-weight:var(--w-medium)}
.pop--cal{width:304px;padding:var(--s-3);overflow:visible}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:var(--s-2);margin-bottom:var(--s-2)}
.calhead b{font-weight:var(--w-bold)}
.calwd,.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.calwd span{text-align:center;font-size:var(--t-caption);color:var(--muted);padding:var(--s-1) 0}
.calday{min-height:38px;height:38px;padding:0;border-radius:var(--r-small);border:1px solid transparent;background:transparent;font-weight:var(--w-regular);font-variant-numeric:tabular-nums}
@media (hover:hover){.calday:hover{background:var(--card);border-color:transparent}}
.calday.is-today{border-color:var(--line-strong);font-weight:var(--w-bold)}
.calday.is-on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:var(--w-bold)}
.calfoot{display:flex;gap:var(--s-2);margin-top:var(--s-3);padding-top:var(--s-3);border-top:1px solid var(--line)}

/* ——— число с «−/+» ——— */
.stepper{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:var(--s-2);align-items:center}
.stepval{display:flex;align-items:baseline;justify-content:center;gap:var(--s-1);background:var(--card);border-radius:var(--r-control);min-height:var(--h-control);padding:0 var(--s-3)}
.stepval input{background:transparent;border:0;min-height:var(--h-control);padding:0;text-align:center;font-weight:var(--w-bold);box-shadow:none}
.stepval input:focus{background:transparent;box-shadow:none}
.stepval:focus-within{box-shadow:inset 0 0 0 1.5px var(--ink)}
.stepval span{color:var(--muted);font-size:var(--t-meta)}
.stepfield.big .stepper{grid-template-columns:var(--h-gym) minmax(0,1fr) var(--h-gym)}
.stepfield.big button.icon{width:var(--h-gym);min-height:var(--h-gym);border-radius:50%}
.stepfield.big .stepval{min-height:88px;border-radius:var(--r-card)}
.stepfield.big .stepval input{font-size:var(--t-display);letter-spacing:-.03em;min-height:88px;width:100%}
.gympair .stepfield.big .stepper{grid-template-columns:1fr;grid-template-rows:auto auto auto}
.gympair .stepfield{align-items:stretch}
.gympair .stepfield .stepper{display:flex;flex-direction:column-reverse;align-items:stretch}
.gympair .stepfield button.icon{width:100%;border-radius:var(--r-card)}

/* ——— сводка ——— */
.summary{display:flex;flex-direction:column;gap:var(--s-5)}
.records{display:flex;flex-direction:column;gap:var(--s-2)}
.record{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-3) var(--s-4);background:var(--ok-veil);animation:record var(--d-enter) var(--ease-out) both}
.record svg{color:var(--ok)}
.rtag{flex:none;font-size:var(--t-caption);font-weight:var(--w-bold);color:var(--ok)}
.record b{display:block}
.record .meta{display:block}
.record:nth-child(2){animation-delay:.08s}.record:nth-child(3){animation-delay:.16s}
@keyframes record{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.cmprow{display:flex;align-items:center;gap:var(--s-2);min-height:36px;font-size:var(--t-meta)}
.trend{display:inline-flex;align-items:center;gap:2px;font-weight:var(--w-medium)}
.trend.up{color:var(--ok)}.trend.dn{color:var(--warn)}.trend.eq{color:var(--muted)}
.seg.feel button{padding:0 var(--s-2)}

/* ——— добавить, закрыть день, план ——— */
.addgrid{display:flex;flex-direction:column;gap:var(--s-2)}
.addopt{justify-content:flex-start;gap:var(--s-3);min-height:var(--h-row);padding:0 var(--s-3);border:0;border-radius:var(--r-card);text-align:left;font-weight:var(--w-regular)}
.addopt .lead.ico{background:var(--surface)}
@media (hover:hover){.addopt:hover{background:var(--card-hot)}}
.addopt:active{background:var(--card-hot)}
.closelist{margin-top:var(--s-4);gap:var(--s-2)}
.closerow{display:flex;align-items:center;gap:var(--s-3);padding:var(--s-2) var(--s-2) var(--s-2) var(--s-4);background:var(--card);border-radius:var(--r-card);flex-wrap:wrap}
.closerow .rt,.closerow .rm{display:block}
.closerow input{width:96px;background:var(--surface);text-align:center}
.closerow .seg{background:var(--card-hot)}
.prows{display:flex;flex-direction:column;gap:var(--s-2)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 56px 12px 56px 32px;gap:var(--s-2);align-items:center}
.prow input{padding:0 var(--s-3)}
.prow input[data-p=sets],.prow input[data-p=reps]{text-align:center;padding:0}
.prow .x{color:var(--faint);text-align:center}
.pickrow{justify-content:flex-start;width:100%;border:0;background:transparent;border-radius:var(--r-card);text-align:left;font-weight:var(--w-regular)}
.pickrow.is-on{background:var(--card)}
.pickrow>svg:last-child{color:var(--ok)}

/* ——— тост ——— */
.toast{
 position:fixed;left:var(--s-4);right:var(--s-4);bottom:var(--s-6);z-index:80;margin:0 auto;width:fit-content;max-width:520px;
 display:flex;align-items:center;gap:var(--s-2);
 padding:6px 6px 6px var(--s-5);min-height:48px;border-radius:var(--r-card);
 background:var(--accent);color:var(--on-accent);box-shadow:var(--shadow-float);
 font-size:var(--t-meta);font-weight:var(--w-medium);animation:toast var(--d-enter) var(--ease-out);
}
.toast[hidden]{display:none}
.toast span{padding-right:var(--s-2);flex:1;min-width:0}
.toast button{flex:none}
.toast.is-out{animation:toast-out .25s var(--ease-in) forwards}
.toast button{color:var(--on-accent);background:transparent;border-color:transparent}
@media (hover:hover){.toast button:hover{background:var(--accent-press);color:var(--on-accent)}}
.toast button:active{background:var(--accent-press)}
@keyframes toast{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes toast-out{to{opacity:0;transform:translateY(8px)}}
.has-live~#toast,body:has(.has-live) .toast{bottom:calc(var(--s-6) + var(--h-row) + var(--s-3))}

/* редкое — за «Ещё» */
details.more{display:flex;flex-direction:column;gap:var(--s-3)}
details.more summary{cursor:pointer;list-style:none;font-size:var(--t-meta);font-weight:var(--w-medium);color:var(--muted);min-height:var(--h-compact);display:flex;align-items:center}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"›";margin-left:var(--s-1);transition:transform var(--d-quick)}
details.more[open] summary::after{transform:rotate(90deg)}
details.more[open]>.field{margin-top:var(--s-2)}
.exlink{margin-top:var(--s-2);padding-top:var(--s-4);border-top:1px solid var(--line)}

/* ——— Адаптив ———
   ≥1280 — колонка с подписями, две колонки сцены;
   1024–1279 — колонка значков;
   <1024 — телефон и планшет: стеклянные шапка, панель вкладок и «+»,
   одна колонка; в «Тренировках» список и карточка по очереди;
   <720 — плотнее, шторка снизу во всю ширину. */

@media (max-width:1279px){
 .shell{grid-template-columns:88px minmax(0,1fr)}
 .side{align-items:center;padding:var(--s-5) var(--s-3) var(--s-3)}
 .brand{padding:0}.brand>div{display:none}
 .nav a{width:52px;height:52px;padding:0;justify-content:center;border-radius:var(--r-card)}
 .nav a span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
 .sideadd{width:52px;min-width:52px;padding:0;margin:0}
 .sideadd span,.sidefoot .btnrow button span{display:none}
 .me{display:none}
 .sidefoot .btnrow{flex-direction:column}
 .sidefoot .btnrow button:not(.icon){width:var(--h-control);padding:0}
 .main{padding:var(--s-6) var(--s-6) var(--s-12)}
 .cols{grid-template-columns:minmax(0,1.4fr) minmax(290px,1fr)}
 .grid3{grid-template-columns:repeat(2,minmax(0,1fr))}
}

@media (max-width:1023px){
 .shell{display:block}
 .side{display:none}
 .main{padding:0 var(--s-5) calc(164px + env(safe-area-inset-bottom))}
 .has-live .main{padding-bottom:calc(184px + env(safe-area-inset-bottom))}
 .mhead{display:flex;align-items:center;gap:var(--s-3);position:sticky;top:var(--s-2);z-index:20;margin:var(--s-2) calc(var(--s-2) * -1) var(--s-4);padding:var(--s-2);border-radius:var(--r-panel)}
 .mhead a.mback{display:inline-flex}
 .mhead .mark{width:32px;height:32px}
 .mhead b{flex:1;font-size:var(--t-body);font-weight:var(--w-bold)}
 .tabbar{
  display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s-1);
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--s-3) + env(safe-area-inset-bottom));z-index:30;
  width:min(520px,calc(100vw - 20px));padding:6px;border-radius:var(--r-sheet);
  transition:opacity var(--d-move) var(--ease-out),transform var(--d-move) var(--ease-out);
 }
 .tabbar a{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:52px;border-radius:var(--r-panel);
  color:var(--muted);text-decoration:none;font-size:var(--t-caption);font-weight:var(--w-medium);-webkit-tap-highlight-color:transparent;
  transition:background-color var(--d-quick),color var(--d-quick);
 }
 .tabbar a:active{background:var(--press)}
 .tabbar a.is-on{color:var(--ink);background:var(--card)}
 .fab{
  display:inline-flex;position:fixed;z-index:31;right:max(var(--s-4),calc(50vw - 252px));bottom:calc(88px + env(safe-area-inset-bottom));
  width:56px;height:56px;min-height:56px;padding:0;border-radius:var(--r-pill);box-shadow:var(--shadow-float);
  transition:opacity var(--d-move) var(--ease-out),transform var(--d-move) var(--ease-out),background-color var(--d-quick);
 }
 .livebar{bottom:calc(84px + env(safe-area-inset-bottom));width:min(520px,calc(100vw - 20px))}
 .has-live .fab{bottom:calc(152px + env(safe-area-inset-bottom))}
 body.is-typing .tabbar,body.is-typing .livebar{opacity:0;pointer-events:none;transform:translate(-50%,16px)}
 body.is-typing .fab{opacity:0;pointer-events:none;transform:translateY(16px)}
 .shead .actions{display:none}
 .scene:has(.pseg) .shead .actions{display:flex;width:100%}
 .pseg{width:100%;min-width:0}
 .cols{grid-template-columns:1fr}
 .scene,.stack{gap:var(--s-4)}
 /* «Тренировки»: открыта тренировка — видна только она */
 .scene:has(.detail) .shead,.scene:has(.detail) .cols>.stack:first-child{display:none}
 .scene:has(.detail-empty) .cols>.stack:last-child{display:none}
 .backbtn{display:inline-flex}
 /* тост выше «+» и полосы тренировки: никогда не закрывает главное действие (VISUAL §5.4) */
 .toast{bottom:calc(156px + env(safe-area-inset-bottom))}
}

@media (max-width:719px){
 .main{padding:0 var(--s-3) calc(164px + env(safe-area-inset-bottom))}
 .mhead{margin:var(--s-2) 0 var(--s-4)}
 .shead{padding:0 var(--s-2)}
 .panel{padding:var(--s-5) var(--s-3)}
 .timeline{padding-top:var(--s-3)}
 .row{padding:0 var(--s-1)}
 .row+.row::before{left:48px}
 .grid2,.grid3{grid-template-columns:1fr}
 .grid2:has(.stat){grid-template-columns:1fr 1fr;gap:var(--s-3)}
 .grid2 .stat{padding:var(--s-4)}
 .grid2 .stat .spark{width:72px}
 .grid2 .statfoot{flex-direction:column;align-items:flex-start;gap:var(--s-1)}
 .tiles.four{grid-template-columns:repeat(2,minmax(0,1fr))}
 .tiles.three .tile{padding:var(--s-3)}
 .tile b{font-size:var(--t-heading)}
 .wd{min-height:56px}
 .weekstrip>button{display:none}
 .qcard .btnrow{width:100%;justify-content:flex-end}
 .banner{flex-direction:column;align-items:flex-start;padding:var(--s-4)}
 .detail{padding:var(--s-4) var(--s-3)}
 .ex{padding:var(--s-3)}
 .sethead,.set{grid-template-columns:20px minmax(0,1fr) minmax(0,1fr) 40px 32px;gap:6px}
 .line{grid-template-columns:minmax(0,.8fr) 10px minmax(0,1fr) 10px minmax(0,1fr) 40px;gap:var(--s-1)}
 .dfoot{flex-wrap:wrap}
 .dfoot button{flex:1 1 40%}
 .dfoot button.primary{flex-basis:100%}
 .obcard{padding:var(--s-6) var(--s-5)}
 .fields.three{grid-template-columns:1fr 1fr}
 .fields.three>:first-child{grid-column:1/-1}
 .coachcard .btnrow{width:100%}
 .seg.feel button{font-size:var(--t-caption)}
 .gymname{font-size:var(--t-figure)}
 .stepfield.big .stepval input{font-size:var(--t-display)}

 .sheet,.sheet--wide{width:100vw;max-width:100vw;margin:auto 0 0;max-height:calc(100dvh - 24px);border-radius:var(--r-sheet) var(--r-sheet) 0 0;border-bottom:0;padding-bottom:env(safe-area-inset-bottom)}
 .sheet[open]{animation:rise var(--d-enter) var(--ease-out)}
 .sheet.is-closing{animation:sink .22s var(--ease-in) forwards}
 .sheethead{padding:var(--s-6) var(--s-3) var(--s-2) var(--s-5);position:relative}
 .grab{display:block;position:absolute;left:50%;top:var(--s-2);width:36px;height:5px;margin-left:-18px;border-radius:var(--r-pill);background:var(--line-strong)}
 .sheetbody{padding:var(--s-2) var(--s-5) var(--s-5)}
 .sheetfoot{padding:var(--s-3) var(--s-4) var(--s-4)}
 .sheetfoot .spacer{display:none}
 .sheetfoot button[type=submit]{flex:1}
 .prow{grid-template-columns:minmax(0,1fr) 44px 10px 44px 32px;gap:6px}
}
@media (pointer:coarse){
 button.icon.small{width:40px;min-width:40px;min-height:40px}
 .seg button{min-height:40px}
 .seg.mini button{min-height:34px}
}
@keyframes rise{from{transform:translateY(32px);opacity:0}to{transform:none;opacity:1}}
@keyframes sink{to{transform:translateY(32px);opacity:0}}

/* ——— «Спутник»: карточка, метка у цели, «Путь» (LEARN-MECHANISM.md §2) ———
   Метка — непрозрачный пузырь цвета акцента (как тост: «это говорит дневник»)
   со стрелкой к цели и кольцом вокруг неё. Не модальная, без затемнения. */

.learncard{display:flex;flex-direction:column;gap:var(--s-2);padding:var(--s-4) var(--s-4) var(--s-3)}
.lhead{display:flex;align-items:center;gap:var(--s-3)}
.lhead .kicker{flex:none}
.lbar{flex:1;height:4px;border-radius:var(--r-pill);background:var(--card-hot);overflow:hidden;display:block}
.lbar b{display:block;height:100%;background:var(--ink);border-radius:inherit;transition:width var(--d-move) var(--ease-out)}
.learncard>p{line-height:1.4}
/* Высота карточки постоянна: засчитанный шаг меняет текст, но не двигает ленту (закон устойчивой раскладки). */
.learncard>p{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;min-height:2.8em}
.learncard .btnrow{justify-content:flex-end}
.ltips{margin:0;padding-left:var(--s-5);display:flex;flex-direction:column;gap:var(--s-1)}

.guide{
 position:fixed;z-index:76;width:min(320px,calc(100vw - 24px));padding:var(--s-4) var(--s-4) var(--s-3);
 border-radius:var(--r-card);background:var(--accent);color:var(--on-accent);box-shadow:var(--shadow-float);
 display:flex;flex-direction:column;gap:var(--s-1);animation:guidein var(--d-enter) var(--ease-out);
}
.guide::before{content:"";position:absolute;left:calc(var(--ax,50%) - 7px);width:14px;height:14px;background:inherit;transform:rotate(45deg)}
.guide[data-side="down"]::before{top:-6px}
.guide[data-side="up"]::before{bottom:-6px}

</style></head><body><div id="app"></div><dialog id="sheet" class="sheet"></dialog><div id="toast" class="toast" role="status" hidden></div><input id="import" type="file" accept="application/json,.json" hidden><script>/* ——— Домен v2 ———
   Данные клиента и все законы из UX-MECHANISM.md в виде чистых функций.
   Ни одного знания о DOM — файл целиком проверяется в Node (test-domain.cjs).

   Законы, которые здесь живут:
   §4.1 Прошлое неизменно: у привычки история правил, день оценивается правилом того дня.
   §4.2 Ничего не висит молча: settle() доводит хвосты и возвращает вопросы.
   §4.3 Подход засчитан, как только записан (doneAt), без «Завершить».
   §4.4 План ставит расписание: виртуальные тренировки на 7 дней, без дублей.
   §4.5 Серия — у каждой привычки своя. */

const D=(()=>{
 const VERSION=2;
 const WD=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
 const MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
 const MON_SHORT=['янв.','февр.','мар.','апр.','мая','июня','июля','авг.','сент.','окт.','нояб.','дек.'];
 const KINDS={check:'Галочкой',count:'Количеством',metric:'Замером'};
 const METRICS={weight:['Вес','кг',0.1],waist:['Талия','см',0.5],hips:['Бёдра','см',0.5],chest:['Грудь','см',0.5]};
 const MODES={weight:'Вес × повторы',time:'Время · дистанция'};
 const FEELS=['','Тяжело','Так себе','Средне','Хорошо','Отлично'];

 // ——— даты: строкой YYYY-MM-DD, время — HH:MM ———
 const pad=n=>String(n).padStart(2,'0');
 const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
 const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
 let clock=null; // для проверок: D.setNow(new Date(...))
 const now=()=>clock?new Date(clock):new Date();
 const today=()=>iso(now());
 const hm=(d=now())=>pad(d.getHours())+':'+pad(d.getMinutes());
 const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
 const weekday=s=>(parse(s).getDay()+6)%7;
 const weekStart=s=>addDays(s,-weekday(s));
 const week=s=>{const a=weekStart(s);return [0,1,2,3,4,5,6].map(i=>addDays(a,i))};
 const daysBetween=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
 const isDate=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&iso(parse(s))===s;
 const isTime=s=>typeof s==='string'&&/^([01]\d|2[0-3]):[0-5]\d$/.test(s);
 const fmtDate=s=>{const d=parse(s);return `${d.getDate()} ${MON[d.getMonth()]}`};
 const fmtShort=s=>{const d=parse(s);return `${d.getDate()} ${MON_SHORT[d.getMonth()]}`};
 const fmtDay=(s,{lower=false}={})=>{const t=today();const o=s===t?'Сегодня':s===addDays(t,1)?'Завтра':s===addDays(t,-1)?'Вчера':`${WD[weekday(s)]}, ${fmtShort(s)}`;return lower?o.toLowerCase():o};
 // Время дня: «HH:MM» ± минуты, в пределах суток.
 const addMinutes=(t,n)=>{const [h,m]=t.split(':').map(Number),x=Math.min(23*60+59,Math.max(0,h*60+m+n));return pad(Math.floor(x/60))+':'+pad(x%60)};
 /* Метки времени записи (ARCH-AUDIT К8): пишутся в одном месте и одним форматом (ISO, UTC).
    Сравниваются только как моменты, а дата метки — местная. Старые записи без пояса читаются так же. */
 const stamp=()=>now().toISOString();
 const stampAt=(date,time)=>{const [y,m,d]=date.split('-').map(Number),[h,mi]=time.split(':').map(Number);return new Date(y,m-1,d,h,mi).toISOString()};
 const msOf=x=>x?new Date(x).getTime():0;
 const dateOf=x=>iso(new Date(x));
 const latest=list=>list.filter(Boolean).reduce((a,b)=>msOf(b)>msOf(a)?b:a,null);
 let seq=0;const uid=p=>p+Date.now().toString(36)+(seq++).toString(36)+Math.random().toString(36).slice(2,5);
 const round=(n,k=100)=>Math.round(n*k)/k;

 // ——— привычки: история правил (§4.1) ———
 // Правило, действовавшее в этот день: последнее с from <= date. До первого — привычки не было.
 const ruleOn=(h,date)=>{let r=null;for(const x of h.rules)if(x.from<=date)r=x;return r};
 const isDue=(h,date)=>{const r=ruleOn(h,date);return !!r&&r.days.includes(weekday(date))};
 const logOf=(s,h,date)=>{const r=ruleOn(h,date);if(r&&r.kind==='metric')return s.metrics.some(m=>m.date===date&&m.kind===r.metric)?1:0;return Number(h.log[date])||0};
 // Явный ответ «не сделал» хранится отдельно от значения: «2 из 8» — это не ответ, а незаконченный день.
 const answered=(h,date)=>h.miss.includes(date);
 const goalOf=r=>r.kind==='count'?r.target:1;
 const ratio=(s,h,date)=>{const r=ruleOn(h,date);if(!r)return 0;return Math.min(1,logOf(s,h,date)/goalOf(r))};
 const habitDone=(s,h,date)=>{const r=ruleOn(h,date);if(!r)return false;const v=logOf(s,h,date);return r.kind==='count'?v>=r.target*(r.pass||1):v>=1};
 // Правка привычки: новое правило с сегодняшнего дня; если сегодняшнее уже есть — меняем его.
 function setRule(h,rule,from=today()){
  const last=h.rules[h.rules.length-1];
  if(last&&last.from===from)Object.assign(last,rule,{from});
  else if(last&&JSON.stringify({...last,from:0})===JSON.stringify({...last,...rule,from:0}))return;
  else h.rules.push({...rule,from});
 }
 // Серия привычки (§4.5): дни подряд, когда правило требовало и было выполнено.
 // Сегодня серию не рвёт, пока не выполнено; дни без требования — пропускаются.
 function streak(s,h,date=today()){let n=0,d=date;
  if(isDue(h,d)&&!habitDone(s,h,d))d=addDays(d,-1);
  for(let i=0;i<400;i++){const r=ruleOn(h,d);if(!r)break;if(isDue(h,d)){if(habitDone(s,h,d))n++;else break}d=addDays(d,-1)}
  return n}

 // ——— тренировки ———
 const setDone=x=>!!x.doneAt;
 const e1rm=(w,r)=>w&&r?w*(1+Math.min(r,12)/30):0; // Эпли, оценка на повторения до 12
 const volume=w=>w.exercises.reduce((a,e)=>a+(e.mode==='weight'?e.sets.filter(setDone).reduce((b,x)=>b+(x.reps||0)*(x.weight||0),0):0),0);
 const setsDone=w=>w.exercises.reduce((a,e)=>a+e.sets.filter(setDone).length,0);
 const setsTotal=w=>w.exercises.reduce((a,e)=>a+e.sets.length,0);
 const byTime=(a,b)=>(a.date+a.time).localeCompare(b.date+b.time);
 const key=n=>String(n||'').trim().toLowerCase();
 // Одно упражнение — одно название без учёта регистра и крайних пробелов. Единственное правило сопоставления.
 const sameName=(a,b)=>key(a)===key(b);
 // Тренировка плана, которой ещё нет в данных: «v:план:дата». Собирается и разбирается только здесь.
 const vid=(planId,date)=>`v:${planId}:${date}`;
 const parseVid=id=>{const m=/^v:(.+):(\d{4}-\d{2}-\d{2})$/.exec(String(id));return m?{planId:m[1],date:m[2]}:null};
 // «В прошлый раз» (§4.3): последние записанные подходы упражнения — из любой тренировки, даже незавершённой.
 function lastSets(s,name,exceptId,before){
  const list=s.workouts.filter(w=>w.id!==exceptId&&(!before||w.date+w.time<=before)).sort(byTime).reverse();
  for(const w of list){const e=w.exercises.find(x=>key(x.name)===key(name));if(e){const done=e.sets.filter(setDone);if(done.length)return {date:w.date,wid:w.id,sets:done,mode:e.mode,entry:e.entry,rest:e.rest}}}
  return null}
 // Лучший расчётный максимум упражнения до этой тренировки.
 function bestBefore(s,name,w){let b=0;for(const x of s.workouts){if(x.id===w.id||(x.date+x.time)>(w.date+w.time))continue;
  for(const e of x.exercises)if(key(e.name)===key(name)&&e.mode==='weight')for(const q of e.sets)if(q.doneAt)b=Math.max(b,e1rm(q.weight,q.reps))}return b}
 // Рекорды тренировки: подход, чей расчётный максимум выше всего, что было до неё.
 function records(s,w){const out=[];for(const e of w.exercises){if(e.mode!=='weight')continue;const prev=bestBefore(s,e.name,w);if(!prev)continue;
  let top=null;for(const q of e.sets)if(q.doneAt&&e1rm(q.weight,q.reps)>prev&&(!top||e1rm(q.weight,q.reps)>e1rm(top.weight,top.reps)))top=q;
  if(top){let pw=0;for(const x of s.workouts){if(x.id===w.id||(x.date+x.time)>(w.date+w.time))continue;for(const y of x.exercises)if(key(y.name)===key(e.name))for(const q of y.sets)if(q.doneAt)pw=Math.max(pw,q.weight||0)}
   out.push({name:e.name,weight:top.weight,reps:top.reps,gain:round(e1rm(top.weight,top.reps)-prev,10),plus:round((top.weight||0)-pw,10)})}}return out}
 // Сравнение с прошлым разом по каждому упражнению: +1 лучше, 0 так же, −1 хуже.
 function compare(s,w){return w.exercises.map(e=>{const last=lastSets(s,e.name,w.id,w.date+w.time);const cur=e.sets.filter(setDone);
  if(!last||!cur.length)return {name:e.name,trend:null};
  const f=e.mode==='weight'?(l=>Math.max(...l.map(q=>e1rm(q.weight,q.reps)))):(l=>l.reduce((a,q)=>a+(q.reps||0),0));
  const a=f(cur),b=f(last.sets);return {name:e.name,trend:Math.abs(a-b)<0.01?0:a>b?1:-1}})}
 const duration=w=>{if(!w.startedAt)return 0;const end=w.finishedAt||latest(w.exercises.flatMap(e=>e.sets).map(q=>q.doneAt));return end?Math.max(0,Math.round((msOf(end)-msOf(w.startedAt))/60000)):0};

 // ——— план ставит расписание (§4.4) ———
 // Виртуальная тренировка есть в расписании, но не в данных. В данные попадает, когда её начали, поправили или ответили о ней.
 function schedule(s,from=today(),days=7){const out=[];
  for(let i=0;i<days;i++){const d=addDays(from,i);
   for(const p of s.plans)if(p.days.includes(weekday(d))&&!(p.from&&d<p.from)&&!s.workouts.some(w=>w.planId===p.id&&(w.date===d||w.from===d)))out.push({virtual:true,id:vid(p.id,d),planId:p.id,date:d,time:p.time||'19:00',title:p.title,status:'planned',exercises:p.exercises.map(x=>({name:x.name}))});
   for(const w of s.workouts)if(w.date===d&&w.status!=='skipped')out.push(w)}
  return out.sort(byTime)}
 // Тренировка из плана: подходы по схеме плана, веса — из прошлого раза.
 function materialize(s,p,date,time){
  const exercises=p.exercises.map(x=>{const last=lastSets(s,x.name);const n=x.sets||(last?last.sets.length:3);
   const sets=[...Array(n)].map((_,i)=>{const l=last?.sets[Math.min(i,last.sets.length-1)];return {id:uid('s'),reps:l?l.reps:(x.reps??null),weight:l?l.weight:(x.weight??null),doneAt:null}});
   return {id:uid('e'),name:x.name,mode:x.mode||last?.mode||'weight',entry:last?.entry||'sets',rest:x.rest||last?.rest||90,sets}});
  return {id:uid('w'),date,time:time||p.time||'19:00',title:p.title,planId:p.id,coach:false,status:'planned',startedAt:null,finishedAt:null,auto:false,feel:0,note:'',exercises};
 }

 // ——— ничего не висит молча (§4.2) ———
 /* Два разных дела, раньше смешанных в одном settle (ARCH-AUDIT К7):
    autoClose — правка: доводит то, что можно довести без человека (тренировка с подходами, корзина);
    questions — чтение: на что нужен ответ человека. Ни один вопрос не решается молча. */
 function autoClose(s,date=today()){let changed=false;
  for(const w of s.workouts){
   if(w.status!=='planned'&&w.status!=='active')continue;
   const last=latest(w.exercises.flatMap(e=>e.sets).map(x=>x.doneAt));
   // Идущую тренировку не закрываем, пока в ней есть жизнь: полночь посреди подходов — не конец тренировки.
   if(w.status==='active'){const act=latest([last,w.startedAt]);if(act&&now()-msOf(act)<4*3600e3)continue}
   else if(w.date>=date)continue;
   if(last){w.status='done';w.auto=true;w.finishedAt=w.finishedAt||last;changed=true}}
  // корзина живёт неделю — по местной дате удаления
  const before=s.trash.length;s.trash=s.trash.filter(t=>daysBetween(dateOf(t.deletedAt),date)<7);if(s.trash.length!==before)changed=true;
  return changed}
 function questions(s,date=today(),time=hm()){const q=[],y=addDays(date,-1);
  for(const w of s.workouts){if(w.status!=='planned'&&w.status!=='active'||w.date>=date)continue;
   if(!w.exercises.some(e=>e.sets.some(x=>x.doneAt)))q.push({kind:'workout',id:w.id,date:w.date,title:w.title})}
  // дни плана за прошлую неделю, которые так и не превратились в тренировку: ни один не исчезает молча
  for(let i=7;i>=1;i--){const d=addDays(date,-i);if(s.profile.started&&d<s.profile.started)continue;for(const v of schedule(s,d,1))if(v.virtual)q.push({kind:'plan',id:v.id,planId:v.planId,date:d,title:v.title})}
  // вчерашние привычки без ответа
  const yd=dayState(s,y);if(!yd.settled)q.push({kind:'yesterday',date:y,count:yd.habitsOpen.length});
  // вечер: предложить закрыть сегодняшний день — только то, чьё время пришло
  if(time>=(s.profile.closeAt||'21:00')){const td=dayState(s,date,time);if(!td.marked&&td.open.length)q.push({kind:'close',date,count:td.open.length})}
  // встреча с тренером завтра или сегодня
  const m=s.coach.nextMeeting;if(m&&(m===date||m===addDays(date,1)))q.push({kind:'meeting',date:m});
  return q}
 // Совместимость: доводка и вопросы одним вызовом (проверки и старый код).
 function settle(s,date=today(),time=hm()){const changed=autoClose(s,date);return {changed,questions:questions(s,date,time)}}
 // Что в этот день осталось без ответа: привычки и дела.
 /* upTo — «сейчас» для сегодняшнего дня: то, чьё время ещё не пришло, не спрашиваем (будущее не спрашивают).
    День первого входа без долгов: то, чьё время прошло до входа, не требуется. */
 const owed=(s,date,time)=>!(date===s.profile.started&&time&&time<(s.profile.startedAt||'00:00'));
 const notYet=(time,upTo)=>!!(upTo&&time&&time>upTo);
 function openItems(s,date,upTo=null){
  const habits=s.habits.filter(h=>!h.archived&&isDue(h,date)&&!habitDone(s,h,date)&&!answered(h,date)&&owed(s,date,h.time)&&!notYet(h.time,upTo));
  const todos=s.todos.filter(t=>t.date===date&&!t.doneAt&&!notYet(t.time,upTo));
  return [...habits.map(h=>({kind:'habit',item:h})),...todos.map(t=>({kind:'todo',item:t}))]}
 // Что в этот день ещё впереди (время не пришло) — для «Закрыть день»: «спросим позже».
 function laterItems(s,date,upTo){return upTo?openItems(s,date).filter(x=>notYet(x.item.time,upTo)):[]}
 /* «День закрыт» — одно определение для всего (ARCH-AUDIT К5):
    marked — человек нажал «Закрыть день»; open — ждёт ответа сейчас (для сегодня — только наступившее);
    later — ещё впереди; habitsOpen — привычки без ответа за весь день;
    settled — о дне больше нечего спрашивать: закрыт вручную или привычек без ответа нет (дела живут в «Просрочено»). */
 function dayState(s,date,time=null){const marked=s.closed.includes(date),all=openItems(s,date),habitsOpen=all.filter(x=>x.kind==='habit');
  return {marked,open:openItems(s,date,time),later:laterItems(s,date,time),habitsOpen,settled:marked||!habitsOpen.length}}
 /* Счёт привычки за период (ARCH-AUDIT К6) — один набор правил для «Прогресса» и «К встрече»:
    день первого входа не считается; сегодня — только если уже выполнено; пауза — не требуется. */
 function habitStats(s,h,from,to=today()){let due=0,hit=0,sum=0;const t=today();
  for(let d=from;d<=to;d=addDays(d,1)){if(!isDue(h,d)||d===s.profile.started)continue;const ok=habitDone(s,h,d);if(d>=t&&!ok)continue;due++;if(ok)hit++;sum+=logOf(s,h,d)}
  return {due,hit,pct:due?Math.round(hit/due*100):null,avg:due?round(sum/due,10):null}}

 // ——— день: лента по времени (§3.2) ———
 const part=t=>!t?'any':t<'12:00'?'morning':t<'17:00'?'day':'evening';
 function agenda(s,date){
  const items=[];
  for(const h of s.habits)if(!h.archived&&isDue(h,date))items.push({kind:'habit',time:h.time,item:h});
  for(const t of s.todos)if(t.date===date)items.push({kind:'todo',time:t.time,item:t});
  for(const w of schedule(s,date,1))items.push({kind:'workout',time:w.time,item:w});
  for(const w of s.workouts)if(w.date===date&&w.status==='skipped')items.push({kind:'workout',time:w.time,item:w});
  return items.sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'))}
 const overdueTodos=(s,date)=>s.todos.filter(t=>t.date&&t.date<date&&!t.doneAt);

 // ——— неделя, прогресс, замеры ———
 // «2 из 3»: в знаменателе всё, что неделя обещала, — сделанное, пропущенное, впереди и прошедшее без ответа.
 function weekStats(s,date=today()){const days=week(date);
  const done=s.workouts.filter(w=>days.includes(w.date)&&w.status==='done').length;
  const skipped=s.workouts.filter(w=>days.includes(w.date)&&w.status==='skipped').length;
  const planned=new Set();for(const d of days)for(const v of schedule(s,d,1))if(v.status!=='done')planned.add(v.id);
  return {done,skipped,total:done+skipped+planned.size}}
 const metricSeries=(s,kind)=>s.metrics.filter(m=>m.kind===kind).sort((a,b)=>a.date.localeCompare(b.date));

 // Сила: лучший расчётный максимум по неделям, последние n недель.
 function strength(s,name,weeks=8){const t=today(),out=[];
  for(let i=weeks-1;i>=0;i--){const a=addDays(weekStart(t),-7*i),b=addDays(a,6);let best=0;
   for(const w of s.workouts)if(w.date>=a&&w.date<=b)for(const e of w.exercises)if(key(e.name)===key(name))for(const q of e.sets)if(q.doneAt)best=Math.max(best,e1rm(q.weight,q.reps));

 // Лучший расчётный максимум по тренировкам — пока недель мало, рост видно по тренировкам.

   const k=key(e.name),top=done.reduce((a,q)=>e1rm(q.weight,q.reps)>e1rm(a.weight,a.reps)?q:a);const cur=m.get(k)||{name:e.name,best:null,bestDate:null,last:null,lastDate:null};

 // К встрече с тренером (§3.7): всё с даты прошлой встречи.
 function sinceMeeting(s,date=today()){
  const meetings=s.notes.filter(n=>n.source==='meeting').map(n=>n.date).sort();
  // Без встреч отсчёт — не раньше начала дневника: «с 5 сент.» у того, кто начал сегодня, — неправда.
  const start=[s.profile.started,...s.workouts.map(w=>w.date),...s.habits.map(h=>h.rules[0]?.from)].filter(Boolean).sort()[0]||date;
  const from=meetings.length?meetings[meetings.length-1]:[addDays(date,-14),addDays(start,-1)].sort().pop();
  const ws=s.workouts.filter(w=>w.date>from&&w.date<=date);
  const done=ws.filter(w=>w.status==='done');
  const recs=done.flatMap(w=>records(s,w).map(r=>({...r,date:w.date})));
  const hab=s.habits.filter(h=>!h.archived).map(h=>({title:h.title,...habitStats(s,h,addDays(from,1),date)})).filter(x=>x.due);
  return {from,fromStart:!meetings.length&&from<start,done:done.length,skipped:ws.filter(w=>w.status==='skipped').length,records:recs,habits:hab,

   notes:s.notes.filter(n=>n.source==='workout'&&n.date>from),questions:s.questions.filter(x=>!x.askedAt)}}

 // ——— проверка: база, не прошедшая её, не записывается ———
 function validate(s){
  const err=[],ids=new Set(),need=(c,m)=>{if(!c)err.push(m)};
  const id=(x,w)=>{need(typeof x.id==='string'&&x.id,`${w}: нет id`);need(!ids.has(x.id),`${w}: повтор id`);ids.add(x.id)};
  const num=(v,w)=>need(v===null||(typeof v==='number'&&isFinite(v)&&v>=0),`${w}: число не меньше нуля`);
  if(!s||typeof s!=='object')return ['База пустая'];
  need(s.version===VERSION,'Неизвестная версия базы');
  for(const k of ['plans','workouts','habits','todos','metrics','notes','questions','trash','closed'])need(Array.isArray(s[k]),`Нет списка ${k}`);
  need(s.profile&&typeof s.profile.name==='string','Профиль');if(s.profile&&s.profile.startedAt!=null)need(isTime(s.profile.startedAt),'Профиль: время начала');
  if(s.profile&&s.profile.learn!=null)need(typeof s.profile.learn==='object'&&Object.entries(s.profile.learn).every(([k,v])=>LEARN.some(x=>x.id===k)&&(isDate(v)||v==='skip')),'Знакомство: отметки');need(s.coach&&typeof s.coach==='object','Тренер');
  if(err.length)return err;
  for(const w of s.workouts){id(w,'Тренировка');need(isDate(w.date)&&isTime(w.time),'Тренировка: дата и время');need(typeof w.title==='string'&&w.title.trim(),'Назовите тренировку');
   need(['planned','active','done','skipped'].includes(w.status),'Тренировка: статус');need(Number.isInteger(w.feel)&&w.feel>=0&&w.feel<=5,'Самочувствие');
   for(const e of w.exercises){id(e,'Упражнение');need(typeof e.name==='string'&&e.name.trim(),'Назовите упражнение');need(e.mode in MODES,'Упражнение: вид');need(['sets','line'].includes(e.entry),'Упражнение: запись');
    for(const q of e.sets){id(q,'Подход');num(q.reps,'Повторы');num(q.weight,'Вес');need(!q.doneAt||q.reps>0,'Отмеченный подход без повторов — сначала впишите повторы')}}}
  for(const h of s.habits){id(h,'Привычка');need(typeof h.title==='string'&&h.title.trim(),'Назовите привычку');need(Array.isArray(h.rules)&&h.rules.length>0,'Привычка без правил');
   let prev='';for(const r of h.rules||[]){need(isDate(r.from)&&r.from>prev,'Правила по возрастанию даты');prev=r.from;need(r.kind in KINDS,'Правило: вид');need(Array.isArray(r.days),'Правило: дни');
    if(r.kind==='count'){need(typeof r.target==='number'&&r.target>0&&typeof r.step==='number'&&r.step>0,'Цель и шаг — числа больше нуля')}
    if(r.kind==='metric')need(r.metric in METRICS,'Правило: замер')}
   need(h.time===null||isTime(h.time),'Привычка: время');need(h.log&&typeof h.log==='object','Привычка: история');need(Array.isArray(h.miss)&&h.miss.every(isDate),'Привычка: пропуски');for(const v of Object.values(h.log||{}))num(v,'Отметка')}
  for(const t of s.todos){id(t,'Дело');need(typeof t.title==='string'&&t.title.trim(),'Напишите, что сделать');need(t.date===null||isDate(t.date),'Дело: дата');need(t.time===null||(isTime(t.time)&&!!t.date),'Напоминание у дела — только с датой')}
  for(const m of s.metrics){id(m,'Замер');need(m.kind in METRICS,'Замер: вид');need(isDate(m.date),'Замер: дата');need(typeof m.value==='number'&&m.value>0,'Введите значение')}
  for(const p of s.plans){id(p,'План');need(typeof p.title==='string'&&p.title.trim(),'Назовите план');need(Array.isArray(p.days)&&Array.isArray(p.exercises),'План: дни и упражнения');need(!p.time||isTime(p.time),'План: время')}
  for(const n of s.notes){id(n,'Заметка');need(typeof n.text==='string'&&n.text.trim(),'Пустая заметка')}
  for(const x of s.questions){id(x,'Вопрос');need(typeof x.text==='string'&&x.text.trim(),'Пустой вопрос')}
  return err}

 // Следующие неотмеченные подходы с пустыми полями берут значения подхода i (§3.4: значения подставлены).
 function carry(e,i){const q=e.sets[i];if(!q)return;for(const x of e.sets.slice(i+1)){if(x.doneAt)continue;if(x.reps==null&&q.reps!=null)x.reps=q.reps;if(x.weight==null&&q.weight!=null)x.weight=q.weight}}
 // Починка при загрузке: подход, отмеченный без повторов, — не факт (§4.3), снимаем отметку.

 function repair(s){if(!s||!Array.isArray(s.workouts))return s;for(const w of s.workouts)for(const e of w.exercises||[])for(const q of e.sets||[])if(q.doneAt&&!(q.reps>0))q.doneAt=null;

 // Тренировка по id; виртуальная из плана становится настоящей (§4.4: одна на день плана, перенесённая тоже найдётся).
 function realize(s,id){const v=parseVid(id);if(!v)return W(s,id);

  finish(s,id){const w=W(s,id);if(!w)return false;w.status='done';w.auto=false;w.startedAt=w.startedAt||stamp();w.finishedAt=stamp();return true},
  // «Отметить сделанной» задним числом: подходы с повторами считаются сделанными в час тренировки.

   w.exercises.push({id:uid('e'),name,mode,entry:last?.entry||'sets',rest,sets:[...Array(sets)].map((_,i)=>{const l=last?.sets[Math.min(i,last.sets.length-1)];return {id:uid('s'),reps:l?l.reps:null,weight:l?l.weight:null,doneAt:null}})});

   if(f==='n'){const n=Math.max(1,Math.min(20,Math.round(v||1))),l=e.sets[e.sets.length-1]||{reps:null,weight:null,doneAt:null};e.sets=[...Array(n)].map((_,i)=>e.sets[i]||{id:uid('s'),reps:l.reps,weight:l.weight,doneAt:l.doneAt})}

  // Привычки: отметка снимает явное «не сделал»; повторное касание — снимает отметку.

  setCount(s,hid,date,n){const h=H(s,hid);if(!h)return false;if(n)h.log[date]=n;else delete h.log[date];h.miss=h.miss.filter(d=>d!==date);return true},
  habitMiss(s,hid,date){const h=H(s,hid);if(!h)return false;if(!h.miss.includes(date))h.miss.push(date);return true},

     else if(v==='done'){if(r.kind==='check')h.log[date]=1}else if(!h.miss.includes(date))h.miss.push(date)}
    if(kind==='todo'){const t=s.todos.find(x=>x.id===id);if(!t)continue;if(v==='done')t.doneAt=stamp();else if(v==='move')t.date=addDays(date,1)}}
