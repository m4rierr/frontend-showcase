  todoTick(s,id){const t=s.todos.find(x=>x.id===id);if(!t)return null;t.doneAt=t.doneAt?null:stamp();return !!t.doneAt},
  todoTomorrow(s,id){const t=s.todos.find(x=>x.id===id);if(!t)return false;t.date=addDays(today(),1);t.time=null;return true},
  todoToday(s,id){const t=s.todos.find(x=>x.id===id);if(!t)return false;t.date=today();return true},
  // Корзина: удалённое живёт неделю и возвращается на место.
  trash(s,list,id){const i=s[list].findIndex(x=>x.id===id);if(i<0)return null;const [item]=s[list].splice(i,1);s.trash.push({id:uid('x'),list,item,deletedAt:stamp()});return item},
  restore(s,trashId){const i=s.trash.findIndex(x=>x.id===trashId);if(i<0)return false;const [x]=s.trash.splice(i,1);s[x.list].push(x.item);return true},
 };
 /* Один вход в операции (ARCH-AUDIT К1, INVARIANT §4): имя + аргументы + кто делает.
    Отсюда же будет работать сервер и другие роли: клиент шлёт имя операции, а не правку данных. */
 function apply(s,name,args=[],ctx={}){const op=ops[name];if(!op)return {ok:false,error:`Нет операции ${name}`};
  const result=op(s,...args);const err=validate(s);
  return err.length?{ok:false,error:err[0]}:{ok:true,result,by:ctx.by||'client',at:stamp()}}
 // Отметить можно сегодня и прошлое; будущее — только посмотреть.
 const canMark=date=>date<=today();
 // ——— знакомство «Спутник» (LEARN-MECHANISM.md) ———
 // Каталог шагов по главам. done(s) — условие на данных: человек уже сделал это сам, и шаг засчитывается молча.
 // Шаги без done засчитываются флагом-событием (profile.learn). when(s,t,L,hm) — когда шаг доступен.
 const CHAPTERS={day:'День',plan:'План',gym:'В зале',calm:'Спокойствие',eve:'Вечер и утро',prog:'Прогресс',coach:'Тренер',safe:'Сохранность'};
 const hasKindLog=(s,kind)=>s.habits.some(h=>Object.entries(h.log).some(([d,v])=>v>0&&ruleOn(h,d)?.kind===kind));
 const dueKind=(s,t,kind)=>s.habits.some(h=>!h.archived&&isDue(h,t)&&ruleOn(h,t).kind===kind);
 const exTwice=s=>{const c=new Map();for(const w of s.workouts)if(w.status==='done')for(const n of new Set(w.exercises.filter(e=>e.mode==='weight'&&e.sets.some(q=>q.doneAt)).map(e=>key(e.name))))c.set(n,(c.get(n)||0)+1);return [...c.values()].some(v=>v>1)};
 const LEARN=[
  {id:'day.check',ch:'day',done:s=>hasKindLog(s,'check'),when:(s,t)=>dueKind(s,t,'check')},
  {id:'day.step',ch:'day',done:s=>hasKindLog(s,'count'),when:(s,t)=>dueKind(s,t,'count')},
  {id:'day.exact',ch:'day',when:(s,t,L)=>L.has('day.step')&&dueKind(s,t,'count')},
  {id:'day.todo',ch:'day',done:s=>s.todos.some(x=>x.time)},
  {id:'day.week',ch:'day',when:(s,t,L)=>L.size>=2},
  {id:'plan.fill',ch:'plan',done:s=>s.plans.some(p=>p.exercises.length>0),when:s=>s.plans.length>0},
  {id:'plan.see',ch:'plan',when:(s,t)=>schedule(s,t,7).some(w=>w.virtual)},
  {id:'gym.step',ch:'gym'},
  {id:'gym.set',ch:'gym',done:s=>s.workouts.some(w=>w.exercises.some(e=>e.sets.some(q=>q.doneAt)))},
  {id:'gym.rest',ch:'gym'},
  {id:'gym.list',ch:'gym'},
  {id:'gym.away',ch:'gym'},
  {id:'gym.summary',ch:'gym',done:s=>s.workouts.some(w=>w.feel>0)},
  {id:'calm.fix',ch:'calm',when:s=>s.workouts.some(w=>w.status==='done')},
  {id:'calm.undo',ch:'calm'},
  {id:'calm.trash',ch:'calm',when:(s,t,L)=>L.has('calm.undo')},
  {id:'eve.close',ch:'eve',done:s=>s.closed.length>0,when:(s,t,L,hm)=>hm>='18:00'},
  // Утро: либо ответили на вопрос про вчера, либо закрыли день вечером и прожили до утра — урок «утром спросит» пройден.
  {id:'morn.yesterday',ch:'eve',done:s=>{const t=today(),at=s.profile.learn?.['eve.close'];return isDate(at)&&at<t&&dayState(s,addDays(t,-1)).settled},when:(s,t,L)=>{const at=s.profile.learn?.['eve.close'];return L.has('eve.close')&&isDate(at)&&at<t}},
  {id:'prog.metric',ch:'prog',done:s=>s.metrics.length>0},
  {id:'prog.strength',ch:'prog',when:s=>exTwice(s)},
  {id:'prog.rule',ch:'prog',done:s=>s.habits.some(h=>h.rules.length>1),when:(s,t)=>s.habits.some(h=>!h.archived&&h.rules[0].from<=addDays(t,-2))},
  {id:'prog.pause',ch:'prog',when:(s,t,L)=>L.has('prog.rule')},
  {id:'coach.ask',ch:'coach',done:s=>s.questions.length>0},
  {id:'coach.meet',ch:'coach',done:s=>!!s.coach.nextMeeting||s.notes.some(n=>n.source==='meeting')},
  {id:'safe.copy',ch:'safe',when:(s,t)=>s.workouts.some(w=>w.status==='done')||(!!s.profile.started&&s.profile.started<=addDays(t,-2))},
 ];
 // Освоено: отмечено в profile.learn датой или видно по данным. «skip» — пропущено, но не освоено.
 function learned(s){const L=s.profile.learn||{},out=new Set();for(const x of LEARN)if(isDate(L[x.id])||(x.done&&x.done(s)))out.add(x.id);return out}
 function learnAvail(s,x,L,t=today(),m=hm()){return !x.when||x.when(s,t,L,m)}

 const empty=()=>({version:VERSION,profile:{name:'',goal:'',onboarded:false,closeAt:'21:00'},coach:{name:'',phone:'',telegram:'',nextMeeting:null},
  plans:[],workouts:[],habits:[],todos:[],metrics:[],notes:[],questions:[],trash:[],closed:[]});

 // ——— стартовые привычки первого входа (§3.1) ———
 const STARTERS={
  water:{title:'Вода',time:'12:00',rule:{kind:'count',target:8,unit:'стаканов',step:1,pass:1}},
  steps:{title:'Шаги',time:null,rule:{kind:'count',target:8000,unit:'шагов',step:1000,pass:1}},
  weigh:{title:'Взвеситься',time:'08:00',days:[0,3,6],rule:{kind:'metric',metric:'weight'}},
  stretch:{title:'Растяжка 10 минут',time:'21:30',rule:{kind:'check'}},
  sleep:{title:'Лечь до 23:30',time:'23:00',rule:{kind:'check'}},
 };
 function habitFrom(tpl,from,days=[0,1,2,3,4,5,6]){return {id:uid('h'),title:tpl.title,time:tpl.time,remind:!!tpl.time,archived:false,rules:[{from,days,...tpl.rule}],log:{},miss:[]}}

 // ——— пример: живая неделя, только для просмотра, в данные не пишется ———
 function example(){
  const t=today(),d=n=>addDays(t,n),s=empty();
  Object.assign(s.profile,{name:'Анна',goal:'Сильные ноги и ровная спина',onboarded:true});
  Object.assign(s.coach,{name:'Михаил Соколов',phone:'+79000000000',telegram:'sokolov',nextMeeting:d(1)});
  const legs={id:uid('p'),title:'Ноги и корпус',days:[0,3],time:'19:00',exercises:[{name:'Присед со штангой',sets:3,reps:8,rest:120},{name:'Румынская тяга',sets:3,reps:10,rest:90},{name:'Выпады с гантелями',sets:2,reps:12,rest:60}]};
  const upper={id:uid('p'),title:'Верх тела',days:[1,4],time:'19:00',exercises:[{name:'Жим лёжа',sets:3,reps:8,rest:120},{name:'Тяга верхнего блока',sets:3,reps:10,rest:90}]};
  s.plans.push(legs,upper);
  const done=(date,p,weights,feel)=>{const w=materialize(s,p,date);w.status='done';w.startedAt=stampAt(date,'19:00');w.feel=feel;
   w.exercises.forEach((e,i)=>e.sets.forEach((q,k)=>{q.weight=Math.round((weights[i]+(k===e.sets.length-1?2.5:0))/2.5)*2.5;q.reps=q.reps||8;q.doneAt=stampAt(date,'19:'+pad(5+i*12+k*3))}));w.finishedAt=stampAt(date,'19:50');s.workouts.push(w)};
  for(let i=21;i>=1;i--){const day=d(-i);if(legs.days.includes(weekday(day)))done(day,legs,[50+(21-i)*0.5,40,12],4);if(upper.days.includes(weekday(day)))done(day,upper,[35+(21-i)*0.3,35],4)}
  const from=d(-21);
  const water=habitFrom(STARTERS.water,from),steps=habitFrom(STARTERS.steps,from),stretch=habitFrom(STARTERS.stretch,from),weigh=habitFrom(STARTERS.weigh,from,[0,3,6]);
  for(let i=1;i<=21;i++){const day=d(-i);water.log[day]=i%6===0?6:8;steps.log[day]=i%4===0?6000:9000;if(i%5)stretch.log[day]=1}
  water.log[t]=3;steps.log[t]=4000;s.habits.push(water,steps,stretch,weigh);
  for(let i=21,v=64.8;i>=0;i-=3,v-=0.2)s.metrics.push({id:uid('m'),date:d(-i),kind:'weight',value:round(v,10)});
  s.todos.push({id:uid('t'),title:'Купить новые кроссовки',date:d(1),time:null,doneAt:null});
  s.notes.push({id:uid('n'),date:d(-6),text:'Присед: +2,5 кг каждую неделю, пока техника держится.',source:'meeting'});
  s.questions.push({id:uid('q'),text:'Почему тянет плечо на жиме?',askedAt:null});
  s.closed=[...Array(21)].map((_,i)=>d(-i-1));
  return s}

 // ——— миграция v1 → v2 ———
 function migrate(v1){if(!v1||v1.version!==1)return v1;const s=empty();
  Object.assign(s.profile,{name:v1.profile?.name||'',goal:v1.profile?.goal||'',onboarded:true});
  Object.assign(s.coach,{name:v1.coach?.name||'',phone:(v1.coach?.contact||'').match(/[+\d][\d\s()-]{6,}/)?.[0]?.replace(/[^\d+]/g,'')||'',telegram:((v1.coach?.contact||'').match(/@(\w+)/)||[])[1]||''});
  for(const p of v1.plans||[])s.plans.push({id:p.id,title:p.title,days:p.days||[],time:'19:00',exercises:(p.exercises||[]).map(([name,mode,scheme])=>{const m=String(scheme||'').match(/(\d+)\s*×\s*(\d+)/);return {name,mode,sets:m?+m[1]:3,reps:m?+m[2]:null,rest:90}})});
  for(const w of v1.workouts||[])s.workouts.push({id:w.id,date:w.date,time:w.time,title:w.title,planId:null,coach:!!w.coach,status:w.status,startedAt:null,finishedAt:null,auto:false,feel:w.feel||0,note:w.note||'',
   exercises:(w.exercises||[]).map(e=>({id:e.id,name:e.name,mode:e.mode||'weight',entry:e.entry||'sets',rest:90,sets:e.sets.map(q=>({id:q.id,reps:q.reps??null,weight:q.weight??null,doneAt:q.done?stampAt(w.date,w.time||'12:00'):null}))}))});
  for(const t of v1.tasks||[]){
   if(t.repeat==='once'){s.todos.push({id:t.id,title:t.title,date:t.date||null,time:t.date&&t.remind?t.remind:null,doneAt:(t.doneOn||[])[0]?stampAt(t.doneOn[0],'12:00'):(t.track&&(t.progress?.all||0)>=t.track.target?stampAt(today(),'12:00'):null)});continue}
   const rule=t.track?{kind:'count',target:t.track.target,unit:t.track.unit,step:t.track.step,pass:1}:{kind:'check'};
   const h={id:t.id,title:t.title,time:t.remind||null,remind:!!t.remind,archived:false,rules:[{from:t.start||today(),days:t.repeat==='daily'?[0,1,2,3,4,5,6]:t.days,...rule}],log:{},miss:[]};
   if(t.track)Object.assign(h.log,t.progress||{});else for(const d of t.doneOn||[])h.log[d]=1;
   s.habits.push(h)}
  repair(s);
  for(const n of v1.notes||[])s.notes.push({id:n.id,date:n.date,text:n.text,source:'meeting'});
  for(const q of v1.questions||[])s.questions.push({id:q.id,text:q.text,askedAt:q.asked?stampAt(today(),'12:00'):null});
  return s}

 return {VERSION,WD,KINDS,METRICS,MODES,FEELS,STARTERS,
  setNow:d=>{clock=d},now,today,hm,iso,addDays,weekday,weekStart,week,daysBetween,isDate,isTime,fmtDate,fmtShort,fmtDay,uid,round,
  ruleOn,isDue,logOf,answered,goalOf,ratio,habitDone,setRule,streak,
  e1rm,volume,setsDone,setsTotal,lastSets,bestBefore,records,compare,duration,schedule,materialize,
  settle,openItems,laterItems,part,agenda,overdueTodos,weekStats,metricSeries,metricDelta,strength,strengthRuns,exerciseList,sinceMeeting,
  validate,repair,canMark,carry,LEARN,ops,apply,realize,autoClose,questions,dayState,habitStats,
  vid,parseVid,sameName,addMinutes,stamp,stampAt,msOf,dateOf,latest,CHAPTERS,learned,learnAvail,empty,habitFrom,example,migrate};
})();

/* ——— Ядро ———
   Состояние, запись, отмена, помощники разметки.
   Три правила архитектуры (подробно — ARCHITECTURE.md):
   1. Данные меняются только через commit(fn): копия → правка → проверка → запись.
   2. После изменения — render(): экран функция от состояния, обновляется точечно (morph).
   3. Разметка не вешает обработчики: data-action, всё ловит 10-boot.js.
   Плюс закон отмены (UX §4.6): «Отменить» откатывает именно своё действие. */

const KEY='xeptra.client.v2',KEY_V1='xeptra.client.v1',PREFS='xeptra.client2.prefs',REV='xeptra.client2.rev';
const $=(s,p=document)=>p.querySelector(s),$$=(s,p=document)=>[...p.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const clone=o=>JSON.parse(JSON.stringify(o));
function readJSON(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
function writeJSON(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}

/* Загрузка: свой дневник v2 → иначе переносим дневник v1 → иначе чистый лист
   и первый вход. Пример (§3.1) живёт только в памяти и никогда не пишется. */
function loadState(){
 const s=D.repair(readJSON(KEY));if(s&&!D.validate(s).length)return s;
 const v1=readJSON(KEY_V1);if(v1&&v1.version===1){const m=D.migrate(v1);if(!D.validate(m).length){m.__migrated=true;return m}}
 return D.empty()}
let state=loadState();
/* Шлюз записи (ARCH-AUDIT К10): всё, что меняет сохранённый дневник, проходит здесь —
   проверка, запись. Правка идёт через commit; доводка, отмена, копия, знакомство — прямо сюда.
   Сюда же встанут полоса «Не сохраняется» и синхронизация вкладок. */
/* Правка поверх чужой записи не проходит: если дневник в хранилище изменился (другая вкладка),
   берём её версию и говорим об этом — вместо того чтобы затереть. Запись не удалась (память браузера
   заполнена, приватный режим) — это видно полосой, пока не получится записать. */
const revOf=()=>Number(localStorage.getItem(REV)||0);let rev=revOf();
function store(next,{checked=false}={}){
 if(!checked){const err=D.validate(next);if(err.length)return err}
 // Чужая запись видна по счётчику: он ушёл вперёд. Меньше нашего — хранилище очистили, конфликта нет.
 if(revOf()>rev){adoptStored();return ['Дневник изменился в другой вкладке — взяли её версию']}
 state=next;
 if(writeJSON(KEY,state)){rev=revOf()+1;writeJSON(REV,rev);ui.unsaved=false}else ui.unsaved=true;
 return null}
// Чужая запись становится нашей: перечитываем и показываем как есть.
function adoptStored(){const s=D.repair(readJSON(KEY));if(!s||D.validate(s).length)return false;state=s;rev=revOf();ui.keep.clear();return true}
if(state.__migrated){delete state.__migrated;store(state)}
let prefs=Object.assign({theme:'system',hist:'marks'},readJSON(PREFS)||{});
let example=null; // пример для просмотра: пока он есть, на экране он, а не state
/* Репетиция (LEARN-MECHANISM §2.4): пример, в который можно писать. Правки идут в копию
   в памяти и не попадают в localStorage никогда; при выходе копия исчезает. */
let rehearsal=false;
const view=()=>example||state;
/* ui — где человек и что у него открыто. Всё, что есть у интерфейса, объявлено здесь (ARCH-AUDIT К13);
   в данные дневника ничего из этого не попадает. */
let ui={
 route:'today',id:null,     // раздел и открытая тренировка (#/w/<id>, #/gym/<id>)
 day:D.today(),             // какой день показывает «Сегодня»
 prog:'strength',weeks:6,   // вкладка «Прогресса», сколько недель истории показано
 keep:new Set(),            // отмеченное на этом экране не уезжает до ухода с него
 questions:[],dismissed:new Set(), // карточки-вопросы и отложенные «Позже» на сегодня
 remind:new Set(),          // подсвеченные напоминанием строки «Сегодня»: «id@дата»
 gx:0,rest:null,            // «В зале»: текущее упражнение и таймер отдыха
 just:null,bump:null,       // короткие отклики: только что записанный подход, толчок числа в кольце
 unsaved:false,             // запись не проходит: показываем полосу, пока не получится
 ob:null,                   // черновик первого входа
 learn:{active:null,done:null,scrolled:false,hush:null,last:null}, // «Спутник» (09-learn.js)
};
// Сбросы — в двух местах, а не по коду: смена раздела и новый день.
function onRoute(){ui.keep.clear()}
function onNewDay(prev){if(ui.day===prev)ui.day=D.today();ui.dismissed.clear();ui.remind.clear();ui.keep.clear();const t=$('#toast');if(t)t.hidden=true}

/* ——— отмена по действию ———
   Для каждого действия с тостом запоминаем разницу по сущностям, которые оно
   затронуло: что добавилось, что удалилось, какими были изменённые. Отмена
   применяет обратное только к ним — поздние правки других сущностей остаются. */
const LISTS=['plans','workouts','habits','todos','metrics','notes','questions','trash'],OBJS=['profile','coach','closed'];
function diff(a,b){const p={};
 for(const k of LISTS){const A=new Map(a[k].map((x,i)=>[x.id,[x,i]])),Bm=new Map(b[k].map(x=>[x.id,x]));const c={added:[],removed:[],changed:[]};
  for(const [id] of Bm)if(!A.has(id))c.added.push(id);
  for(const [id,[x,i]] of A){const y=Bm.get(id);if(!y)c.removed.push([x,i]);else if(JSON.stringify(x)!==JSON.stringify(y))c.changed.push([x,y])}
  if(c.added.length||c.removed.length||c.changed.length)p[k]=c}
 for(const k of OBJS)if(JSON.stringify(a[k])!==JSON.stringify(b[k]))p[k]={before:a[k],after:b[k]};
 return p}
/* Откат внутри сущности — трёхсторонний: меняем только то, что поменяло само
   действие (было → стало), а поздние правки других полей и вложенных
   сущностей (упражнений, подходов) оставляем. */
const J=x=>JSON.stringify(x),isList=v=>Array.isArray(v)&&v.every(x=>x&&typeof x==='object'&&'id' in x);
function revert(cur,before,after){
 if(isList(before)&&isList(after)&&isList(cur)){const A=new Map(after.map(x=>[x.id,x])),Bf=new Map(before.map((x,i)=>[x.id,[x,i]]));
  let out=cur.filter(x=>Bf.has(x.id)||!A.has(x.id));
  out=out.map(x=>{const b=Bf.get(x.id),a=A.get(x.id);return b&&a&&J(b[0])!==J(a)?revert(x,b[0],a):x});
  for(const [id,[x,i]] of [...Bf].sort((p,q)=>p[1][1]-q[1][1]))if(!A.has(id)&&!out.some(y=>y.id===id))out.splice(Math.min(i,out.length),0,clone(x));
  return out}
 if(before&&after&&cur&&typeof before==='object'&&typeof after==='object'&&typeof cur==='object'&&!Array.isArray(before)){const n={...cur};
  for(const f of new Set([...Object.keys(before),...Object.keys(after)])){if(J(before[f])===J(after[f]))continue;
   if(!(f in before))delete n[f];else n[f]=f in cur&&typeof before[f]==='object'&&before[f]!==null?revert(cur[f],before[f],after[f]):clone(before[f])}
  return n}
 return clone(before)}
function applyUndo(s,p){const n=clone(s);
 for(const k of LISTS){const c=p[k];if(!c)continue;n[k]=n[k].filter(x=>!c.added.includes(x.id));
  for(const [x,y] of c.changed){const i=n[k].findIndex(z=>z.id===x.id);if(i>=0)n[k][i]=revert(n[k][i],x,y)}
  for(const [x,i] of [...c.removed].sort((a,b)=>a[1]-b[1]))n[k].splice(Math.min(i,n[k].length),0,clone(x))}
 for(const k of OBJS)if(p[k])n[k]=revert(n[k],p[k].before,p[k].after);
 return n}
const undos=new Map();let undoSeq=0;

/* commit: копия → правка → проверка → запись. Не прошла проверку — не записано ничего.
   toast — текст подтверждения с «Отменить» (только когда результат не виден на
   экране или действие разрушительное, VISUAL §5.4). quiet — без перерисовки. */
function commit(fn,{quiet=false,toast:msg=null,keep=null}={}){
 if(example&&!rehearsal){toast('Это пример — он не меняется',{action:{label:'Начать свой',act:'example-exit'}});return false}
 const base=rehearsal?example:state,draft=clone(base);const r=fn(draft);const err=D.validate(draft);
 if(err.length){toast(err[0]);return false}
 const patch=diff(base,draft);
 // Отметка знакомства могла записаться, пока шла правка (learnFlag внутри fn): её не теряем и в отмену не включаем.
 if(!rehearsal&&state.profile.learn!==base.profile.learn)draft.profile.learn={...(draft.profile.learn||{}),...(state.profile.learn||{})};
 if(rehearsal)example=draft;else{const err2=store(draft,{checked:true});if(err2){toast(err2[0]);render();return false}}
 if(keep)ui.keep.add(keep);
 if(msg){const id='u'+(++undoSeq);undos.set(id,patch);if(undos.size>20)undos.delete(undos.keys().next().value);toast(msg,{undo:id})}
 if(!quiet)render();
 return r===undefined?true:r}

/* ——— Набор элементов ———
   Свои выпадающие (календарь, время), поля формы и шторка.
   Ни одного знания о предметной области: только форма и поведение.
   Перенесено из первой версии: точечное обновление экрана, выпадающие с законом
   раскрытия, шторка. Поля — с подписью над полем и заливкой (VISUAL §5.2). */

/* ——— Точечное обновление экрана ———
   Экран по-прежнему функция от состояния (правило 2), но новая разметка не
   заменяет старую целиком, а накладывается на неё: совпавшие узлы остаются
   теми же самыми, меняются только атрибуты и текст. Поэтому стекло не
   пересоздаётся (размытие не «моргает»), фокус и прокрутка списков остаются
   на месте, а нажатие ничего не дёргает. */
function morph(root,html){const tpl=document.createElement('template');tpl.innerHTML=html;patchChildren(root,tpl.content)}
function sameNode(a,b){return a.nodeType===b.nodeType&&(a.nodeType!==1||(a.tagName===b.tagName&&(a.getAttribute('data-key')||'')===(b.getAttribute('data-key')||'')))}
function patchChildren(a,b){
 const an=[...a.childNodes],bn=[...b.childNodes];
 bn.forEach((y,i)=>{const x=an[i];if(!x)a.appendChild(y);else if(!sameNode(x,y))a.replaceChild(y,x);else patchNode(x,y)});
 for(let i=bn.length;i<an.length;i++)an[i].remove();
}
function patchNode(x,y){
 if(x.nodeType!==1){if(x.nodeValue!==y.nodeValue)x.nodeValue=y.nodeValue;return}
 for(const {name} of [...x.attributes])if(!y.hasAttribute(name))x.removeAttribute(name);
 for(const {name,value} of [...y.attributes])if(x.getAttribute(name)!==value)x.setAttribute(name,value);
 // Поле, в котором человек сейчас печатает, не трогаем.
 if(x.tagName==='INPUT'){if(x!==document.activeElement&&x.value!==(y.getAttribute('value')??''))x.value=y.getAttribute('value')??'';return}
 if(x.tagName==='TEXTAREA'){if(x!==document.activeElement&&x.value!==y.value)x.value=y.value;return}
 patchChildren(x,y);
}

const MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
let popEl=null,popOwner=null;

// Раскрыто или нет — знает только aria-expanded на кнопке-источнике.
function closePop(){if(!popEl)return;popOwner?.setAttribute('aria-expanded','false');popEl.remove();popEl=null;popOwner=null;
 document.removeEventListener('keydown',popKey,true);document.removeEventListener('scroll',popScroll,true);removeEventListener('resize',popFollow)}
function popKey(e){if(e.key==='Escape'){e.preventDefault();e.stopPropagation();closePop()}}
/* Прокрутка или смена размера экрана (на телефоне — это клавиатура уехала вниз)
   не закрывают выпадающее: оно следует за полем. Закрываем, только если само
   поле ушло за край экрана. */
function popFollow(){if(!popEl||!popOwner)return;const r=popOwner.getBoundingClientRect();
 if(r.bottom<0||r.top>innerHeight||!popOwner.isConnected){closePop();return}placePop(popOwner)}
function popScroll(e){if(popEl&&!popEl.contains(e.target))popFollow()}
function openPop(owner,html,cls){
 closePop();popOwner=owner;owner.setAttribute('aria-expanded','true');
 popEl=document.createElement('div');popEl.className='pop '+cls;popEl.innerHTML=html;
 (owner.closest('dialog')||document.body).appendChild(popEl);placePop(owner);
 const on=popEl.querySelector('.is-on');
 if(on&&popEl.scrollHeight>popEl.clientHeight)popEl.scrollTop=Math.max(0,on.offsetTop-popEl.clientHeight/2+on.offsetHeight/2);
 document.addEventListener('keydown',popKey,true);document.addEventListener('scroll',popScroll,true);addEventListener('resize',popFollow);
 learnSoon();
}
/* Куда раскрывается: по левому краю поля; не помещается справа — по правому;
   вниз, а если внизу тесно — туда, где просторнее. Список получает высоту
   по месту и прокручивается внутри; календарь не сжимается. Начало отсчёта
   меряем, а не угадываем: у шторки есть трансформ, и fixed считается от неё. */
const POP_GAP=6,POP_EDGE=8,POP_MIN=140;
function placePop(anchor){
 const a=anchor.getBoundingClientRect();
 popEl.style.maxHeight='';popEl.style.left='0px';popEl.style.top='0px';
 const base=popEl.getBoundingClientRect(),ox=base.left,oy=base.top;
 const w=Math.min(Math.max(base.width,a.width),innerWidth-POP_EDGE*2);popEl.style.minWidth=Math.min(a.width,w)+'px';
 const below=innerHeight-a.bottom-POP_GAP-POP_EDGE,above=a.top-POP_GAP-POP_EDGE;
 const scrolls=getComputedStyle(popEl).overflowY!=='visible',down=base.height<=below||below>=above;
 let h=base.height;if(scrolls){h=Math.max(POP_MIN,Math.min(h,down?below:above));popEl.style.maxHeight=h+'px'}
 let left=a.left;if(left+w>innerWidth-POP_EDGE)left=a.right-w;
 left=Math.min(Math.max(POP_EDGE,left),Math.max(POP_EDGE,innerWidth-w-POP_EDGE));
 let top=down?a.bottom+POP_GAP:a.top-POP_GAP-h;top=Math.min(Math.max(POP_EDGE,top),Math.max(POP_EDGE,innerHeight-h-POP_EDGE));
 popEl.style.left=(left-ox)+'px';popEl.style.top=(top-oy)+'px';popEl.dataset.side=down?'down':'up';
}
function calHtml(month,selected,allowEmpty){
 const [y,m]=month.split('-').map(Number),first=new Date(y,m-1,1),lead=(first.getDay()||7)-1,days=new Date(y,m,0).getDate();
 const iso=d=>`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
 const prev=m===1?`${y-1}-12`:`${y}-${String(m-1).padStart(2,'0')}`,next=m===12?`${y+1}-01`:`${y}-${String(m+1).padStart(2,'0')}`;
 let cells='';for(let i=0;i<lead;i++)cells+='<span></span>';
 for(let d=1;d<=days;d++){const v=iso(d);cells+=`<button type="button" class="calday${v===selected?' is-on':''}${v===D.today()?' is-today':''}" data-action="cal-set" data-id="${v}">${d}</button>`}
 return `<div class="calhead">${B(I('back',18),'cal-nav',prev,'icon small ghost','aria-label="Прошлый месяц"')}<b>${MONTHS[m-1]} ${y}</b>${B(I('chev',18),'cal-nav',next,'icon small ghost','aria-label="Следующий месяц"')}</div>
 <div class="calwd">${D.WD.map(w=>`<span>${w}</span>`).join('')}</div><div class="calgrid">${cells}</div>
 <div class="calfoot">${B('Сегодня','cal-set',D.today(),'small')}${allowEmpty?B('Без даты','cal-set','none','small ghost'):''}</div>`;
}
function timeHtml(selected){let out='';for(let t=5*60;t<24*60;t+=15){const v=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');out+=`<button type="button" class="popitem${v===selected?' is-on':''}" data-action="time-set" data-id="${v}">${v}</button>`}return out}

// ——— шторка ———
// На телефоне — снизу во всю ширину, на компьютере — окно по центру.
// Сохранение отдаёт форму функции save; вернула false — шторка остаётся открытой.
/* Две породы шторок (ARCH-AUDIT К11):
   просмотр (view) — функция от состояния, как экран: render накладывает её тело через morph;
   форма (save) — черновик до «Сохранить»: рисуется один раз, введённое не перезаписывается. */
let sheetSave=null,sheetAfter=null,sheetView=null;
function openSheet({title,body,save=null,saveLabel='Сохранить',extra='',wide=false,cancel=true,view=null}){if(view)body=view();
 // Пример только для просмотра: форму, которую нельзя сохранить, не открываем вовсе.
 if(example&&!rehearsal&&save){toast('Это пример — он только для просмотра',{action:{label:'Начать свой',act:'example-exit'}});return}
 closePop();const dlg=$('#sheet');sheetSave=save;sheetView=view;
 // В зале шторка тоже тёмная — без вспышки светлого.
 dlg.className='sheet'+(wide?' sheet--wide':'')+(ui.route==='gym'?' gym':'');
 dlg.innerHTML=`<form class="sheetform" method="dialog" novalidate>
  <header class="sheethead"><i class="grab" aria-hidden="true"></i><h2>${title}</h2>${B(I('close',20),'sheet-close','','icon ghost','aria-label="Закрыть"')}</header>
  <div class="sheetbody">${body}</div>
  ${save||extra?`<footer class="sheetfoot">${extra}<span class="spacer"></span>${cancel?B('Отмена','sheet-close','','ghost'):''}${save?`<button type="submit" class="primary">${saveLabel}</button>`:''}</footer>`:''}
 </form>`;
 if(!dlg.open)dlg.showModal();
 const first=dlg.querySelector('.sheetbody input:not([type=hidden]),.sheetbody textarea');
 if(first&&matchMedia('(hover:hover)').matches)first.focus();else dlg.querySelector('.sheethead button')?.focus({preventScroll:true});
 learnSoon();setTimeout(learnSoon,380); // и ещё раз, когда шторка доехала: во время въезда она сдвинута
}
// Шторка-просмотр следует за данными; пустой просмотр (null) — шторка закрывается сама.
function sheetRender(){const dlg=$('#sheet');if(!dlg.open||!sheetView)return;const html=sheetView();if(html===null){closeSheet();return}const b=dlg.querySelector('.sheetbody');if(b)morph(b,html)}
function closeSheet(){closePop();const dlg=$('#sheet');sheetView=null;if(!dlg.open)return;dlg.classList.add('is-closing');
 setTimeout(()=>{dlg.classList.remove('is-closing');dlg.close();dlg.innerHTML='';sheetSave=null;learnSoon();if(sheetAfter){const f=sheetAfter;sheetAfter=null;f()}},200)}
function confirmSheet(title,text,label,run){
 openSheet({title,body:`<p class="confirm">${text}</p>`,save:()=>{run();return true},saveLabel:label});
 $('#sheet button[type=submit]')?.classList.add('danger');
}
// Поля, которые нужны только при определённом выборе: data-show="имя=значение".
function syncShow(){$$('#sheet [data-show]').forEach(el=>{const [n,v]=el.dataset.show.split('=');el.hidden=$(`#sheet [name="${n}"]`)?.value!==v})}
// Число с кнопками «−/+» (в формах и в «В зале»): data-step — шаг, data-min — нижняя граница.
function stepField(label,name,value,step,{unit='',min=0,big=false}={}){
 return `<div class="field stepfield${big?' big':''}"><span class="label">${label}</span><div class="stepper">${B(I('minus',big?26:20),'step',name,'icon lone',`data-d="${-step}" data-min="${min}" aria-label="Минус ${step}"`)}
  <label class="stepval"><input name="${name}" inputmode="decimal" value="${esc(numText(value))}" aria-label="${esc(label)}">${unit?`<span>${esc(unit)}</span>`:''}</label>
  ${B(I('plus',big?26:20),'step',name,'icon lone',`data-d="${step}" data-min="${min}" aria-label="Плюс ${step}"`)}</div></div>`}


/* ——— «Сегодня»: лента дня (UX §3.2, §3.3, §3.6) ———
   Одна лента по времени: утро · день · вечер · в течение дня. У каждой строки
   главное действие прямо в строке. Над лентой — карточки-вопросы, только когда
   что-то зависло (§4.2), и полоса недели: касание дня показывает этот день
   (отметить можно и прошедший), форму не открывает. */

function sceneHead(kicker,title,sub='',actions=''){
 return `<header class="shead"><div class="grow"><div class="kicker">${kicker}</div><h1>${title}</h1>${sub?`<p class="sub">${sub}</p>`:''}</div>${actions?`<div class="actions">${actions}</div>`:''}</header>`}

function todayScene(){
 const s=view(),t=D.today(),day=ui.day,isToday=day===t;
 const items=D.agenda(s,day),late=isToday?D.overdueTodos(s,t):[];
 const doneN=items.filter(x=>itemDone(x,day)).length,wk=items.find(x=>x.kind==='workout'&&x.item.status!=='skipped');
 const kicker=isToday?D.now().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'}):(day<t?'Прошедший день':'Впереди');
 const title=isToday?`${greet()}${s.profile.name?', '+esc(s.profile.name):''}`:D.fmtDay(day);
 const st=D.weekStats(s),aw=s.workouts.find(w=>w.status==='active');
 // Итог — одна строка и не больше двух фактов (аудит, п. 9): главное про тренировку, потом про день.
 const wkFact=aw?'Идёт тренировка':wk?(wk.item.status==='done'?'Тренировка сделана':`Тренировка в ${wk.item.time}`):'';
 const dayFact=!items.length?(day<t?'В этот день ничего не было':'На этот день ничего не запланировано'):day>t?`запланировано ${items.length}`:`сделано ${doneN} из ${items.length}`;
 const sub=[wkFact,dayFact].filter(Boolean).join(' · ');
 return `<section class="scene">${sceneHead(kicker,title,sub,B(I('plus',18)+'Добавить','add','','primary'))}
 ${example?exampleBanner():''}
 ${weekStrip(day)}
 ${isToday?questionCards()+learnCard():''}
 <div class="cols"><div class="stack">${timeline(items,late,day)}</div><div class="stack">${sideToday()}</div></div></section>`}

function exampleBanner(){if(rehearsal)return `<div class="banner card rehearse"><div class="grow"><b>Репетиция</b><span class="meta">Жмите всё что угодно — ничего не сохраняется.</span></div>${B('Выйти','learn-exit','','primary small')}</div>`;
 return `<div class="banner card"><div class="grow"><b>Это пример</b><span class="meta">Так выглядит дневник через три недели. Он только для просмотра.</span></div>${B('Начать свой','example-exit','','primary small')}</div>`}

// ——— полоса недели ———
function weekStrip(day){const s=view(),t=D.today();
 return `<nav class="weekstrip" aria-label="Дни недели">${B(I('back',18),'day-shift','-7','icon ghost small','aria-label="Прошлая неделя"')}
 <div class="wdays">${D.week(day).map(d=>{const ws=s.workouts.filter(w=>w.date===d),done=ws.some(w=>w.status==='done'),plan=!done&&D.schedule(s,d,1).length>0;
  return `<button type="button" class="wd${d===day?' is-on':''}${d===t?' is-today':''}" data-action="day-pick" data-id="${d}" aria-pressed="${d===day}" aria-label="${D.fmtDay(d)}"><span>${D.WD[D.weekday(d)]}</span><b class="num">${Number(d.slice(8))}</b><i class="${done?'done':plan?'plan':''}"></i></button>`}).join('')}</div>
 ${B(I('chev',18),'day-shift','7','icon ghost small','aria-label="Следующая неделя"')}</nav>`}

// ——— карточки-вопросы: появляются, когда что-то зависло, и исчезают после ответа ———
function questionCards(){
 const qs=ui.questions.filter(q=>!ui.dismissed.has(q.kind+q.date+(q.id||'')));if(!qs.length)return '';
 // Несколько неотмеченных дней плана — одна карточка, а не стопка (ничего не висит молча, но и не кричит).
 const plans=qs.filter(q=>q.kind==='plan');
 const card=(ico,text,btns,tone='')=>`<div class="qcard card ${tone}"><span class="qico">${I(ico,18)}</span><p class="grow">${text}</p><div class="btnrow">${btns}</div></div>`;
 return `<div class="qcards">${qs.map(q=>{
  if(q.kind==='workout')return card('journal',`${D.fmtDay(q.date)} была тренировка «${esc(q.title)}»?`,B('Пропустил','q-skip',q.id,'small ghost')+B('Была — записать','q-log',q.id,'small'),'warn');
  if(q.kind==='plan'){if(plans.length>1)return q===plans[0]?card('journal',`По плану не отмечено: ${plans.map(x=>D.fmtDay(x.date).replace(/,.*/,'')).join(', ')}. Были тренировки?`,B('Пропустил все','q-plans-skip','','small ghost')+B('Разобрать','q-plans','','small'),'warn'):'';
   return card('journal',`${D.fmtDay(q.date)} по плану «${esc(q.title)}». Была тренировка?`,B('Пропустил','q-plan-skip',q.id,'small ghost')+B('Была — записать','q-plan-log',q.id,'small'),'warn')}
  if(q.kind==='yesterday')return card('moonset',`Вчера осталось без отметки: ${q.count}`,B('Закрыть вчера','close-day',q.date,'small'),'warn');
  if(q.kind==='close')return card('moonset',`Закрыть день · без отметки ${q.count}`,B('Позже','q-dismiss',q.kind+q.date,'small ghost')+B('Закрыть день','close-day',q.date,'small'));
  if(q.kind==='meeting')return card('coach',`${D.fmtDay(q.date)} встреча с тренером — всё собрано в «К встрече»`,B('Открыть','go','coach','small'));
  return ''}).join('')}</div>`}

// ——— лента ———
const PARTS={morning:'Утро',day:'День',evening:'Вечер',any:'В течение дня'};
function itemDone(x,date){const s=view();if(x.kind==='habit')return D.habitDone(s,x.item,date);if(x.kind==='todo')return !!x.item.doneAt;return x.item.status==='done'}
/* «Знает, что сейчас» (§0.1): в сегодняшней ленте — линия «Сейчас» по времени,
   и ближайшее неотмеченное дело крупнее остальных, с главной кнопкой. */
function nextItem(items,day){if(day!==D.today())return null;const now=D.hm();
 return items.find(x=>x.time&&x.time>=now&&!itemDone(x,day)&&!(x.kind==='workout'&&x.item.status==='skipped'))||null}
function timeline(items,late,day){
 const undated=day===D.today()&&view().todos.some(t=>!t.date&&!t.doneAt);
 if(!items.length&&!late.length&&!undated&&day<D.today())return `<section class="panel">${empty('today','В этот день ничего не было','Отметки прошедших дней появятся здесь, если в тот день были привычки или тренировки.')}</section>`;
 if(!items.length&&!late.length&&!undated)return `<section class="panel">${empty('today','День свободен','Добавьте тренировку, привычку или дело — они встанут в ленту по времени.',B(I('plus',18)+'Добавить','add','','primary small'))}</section>`;
 const groups={};for(const x of items){const p=D.part(x.time);(groups[p]=groups[p]||[]).push(x)}
 const isToday=day===D.today(),now=D.hm(),nx=nextItem(items,day);let lined=!isToday;
 // «Сейчас» есть всегда: если всё по времени уже прошло — линия встаёт после последнего дела.
 const lastTimed=['evening','day','morning'].find(p=>groups[p]);
 const nowLine=()=>{lined=true;return `<div class="nowline" data-key="now" aria-label="Сейчас ${now}"><span class="num">${now}</span></div>`};
 const blocks=['morning','day','evening','any'].filter(p=>groups[p]).map(p=>`<div class="block"><div class="blocktitle">${PARTS[p]}</div><div class="rows">${groups[p].map(x=>{
  const line=!lined&&p!=='any'&&x.time&&x.time>now?nowLine():'';return line+row(x,day,x===nx)}).join('')}${!lined&&p===lastTimed?nowLine():''}</div></div>`).join('');
 // Закрыть день можно всегда, не только карточкой вечером (LEARN §1.4, Б7).
 // Будущее не спрашивают: ответили на всё, что уже наступило, — строка говорит, что осталось впереди.
 const ds=D.dayState(view(),day,isToday?now:null),later=ds.later,onlyLater=later.length&&!ds.open.length&&items.some(x=>itemDone(x,day)||(x.kind==='habit'&&D.answered(x.item,day)));
 const closeRow=isToday&&items.length?`<div class="closeday" data-key="closeday">${ds.marked?`<span class="meta">${I('check',14)} День закрыт</span>`:onlyLater?`<span class="meta grow">${I('check',14)} Отмечено всё, что уже было · впереди: ${later.map(x=>esc(x.item.title)).join(', ')}</span>`:`<span class="meta grow">Всё сделано или день кончился раньше?</span>${B(I('moonset',16)+'Закрыть день','close-day',day,'small')}`}</div>`:'';
 // Дела без даты не пропадают: живут в конце ленты «Сегодня», пока не сделаны.
 const nodate=isToday?view().todos.filter(t=>!t.date&&(!t.doneAt||ui.keep.has('t'+t.id))):[];
 const nodateBlock=nodate.length?`<div class="block"><div class="blocktitle">Без даты</div><div class="rows">${nodate.map(t=>row({kind:'todo',item:t,time:null},day)).join('')}</div></div>`:'';
 const lateBlock=late.length?`<div class="block"><div class="blocktitle warn">Просрочено</div><div class="rows">${late.map(t=>row({kind:'todo',item:t,time:t.time},t.date)).join('')}</div></div>`:'';
 return `<section class="panel timeline">${lateBlock}${blocks}${nodateBlock}${closeRow}</section>`}

// Время строки: прошедшее неотмеченное сегодня — тихо помечено (аудит, п. 8).
function tm(time,date,done){const p=view().profile;if(done||date!==D.today()||time>=D.hm()||(date===p.started&&time<(p.startedAt||'00:00')))return time;return `<span class="late">${time} · время прошло</span>`}
function row(x,date,next=false){
 const s=view(),it=x.item,done=itemDone(x,date),fut=!D.canMark(date),nc=(next?' is-next':'')+(ui.remind?.has(it.id+'@'+date)&&!itemDone(x,date)?' is-remind':'');
 if(x.kind==='habit'){const r=D.ruleOn(it,date),st=D.streak(s,it,date<D.today()?date:D.today());
  const streak=st>1?`<span class="streak">${I('flame',13)}${st}</span>`:'';
  if(r.kind==='count'){const v=D.logOf(s,it,date);
   if(fut)return plainRow(it,`${fmtN(r.target)} ${esc(r.unit)}`,date);
   return `<div class="row${done?' is-done':''}${nc}" data-key="h${it.id}${date}">${ring(D.ratio(s,it,date),36,`<b>${done?I('check',14):fmtK(v)}</b>`)}
   <button type="button" class="rbody" data-action="count-open" data-id="${it.id}" data-date="${date}"><span class="rt">${esc(it.title)}</span><span class="rm">${done?`<b class="okword">Готово</b> · ${fmtN(v)} ${esc(r.unit)}`:`<b class="num tapnum">${fmtN(v)} из ${fmtN(r.target)}</b> ${esc(r.unit)}`}${streak}</span></button>
   ${B(`${I('plus',16)}${fmtN(r.step)}`,'count-step',it.id,'small stepbtn lone'+(next?' primary':''),`data-date="${date}" aria-label="Добавить ${fmtN(r.step)} ${esc(r.unit)}"`)}</div>`}
  if(r.kind==='metric'){const [name,unit]=D.METRICS[r.metric],m=s.metrics.find(q=>q.kind===r.metric&&q.date===date);
   if(fut)return plainRow(it,name,date);
   return `<div class="row${done?' is-done':''}${nc}" data-key="h${it.id}${date}"><span class="lead ico${done?' on':''}">${I(done?'check':'scale',18)}</span>
   <button type="button" class="rbody" data-action="metric-open" data-id="${r.metric}" data-date="${date}"><span class="rt">${esc(it.title)}</span><span class="rm">${[m?`<b class="num">${fmtN(m.value)} ${unit}</b>`:'',it.time?tm(it.time,date,done):''].filter(Boolean).join(' · ')||name}${streak}</span></button>
   ${m?'':B('Ввести','metric-open',r.metric,'small'+(next?' primary':''),`data-date="${date}"`)}</div>`}
  if(fut)return plainRow(it,it.time||'Привычка',date);
  return `<div class="row${done?' is-done':''}${nc}" data-key="h${it.id}${date}">${B(I('check',16),'habit-tick',it.id,'tick'+(done?' is-on':''),`data-date="${date}" aria-pressed="${done}" aria-label="${done?'Снять отметку':'Отметить'}"`)}
  <button type="button" class="rbody" data-action="habit-edit" data-id="${it.id}"><span class="rt">${esc(it.title)}</span><span class="rm">${it.time?tm(it.time,date,done):'Привычка'}${streak}</span></button></div>`}
 if(x.kind==='todo')return `<div class="row${done?' is-done':''}${nc}" data-key="t${it.id}">${B(I('check',16),'todo-tick',it.id,'tick'+(done?' is-on':''),`aria-pressed="${done}" aria-label="${done?'Снять отметку':'Отметить'}"`)}
  <button type="button" class="rbody" data-action="todo-edit" data-id="${it.id}"><span class="rt">${esc(it.title)}</span><span class="rm${it.date<D.today()&&!done?' warn':''}">${!it.date?'Без даты':it.date<D.today()?D.fmtDay(it.date):'Дело'}${it.time?` · ${it.date<D.today()?it.time:tm(it.time,date,done)}`:''}</span></button>${it.date<D.today()&&!done?B('Завтра','todo-move',it.id,'small ghost'):!it.date&&!done?B('На сегодня','todo-today',it.id,'small ghost'):''}</div>`;
 // тренировка
 const w=it,t=D.today(),n=w.exercises.length;
 const meta=w.status==='done'?`Сделано${D.duration(w)?` · ${D.duration(w)} мин`:''}${(()=>{const r=D.records(view(),w).length;return r?` · ${r} ${plural(r,'рекорд','рекорда','рекордов')}`:''})()}`
  :w.status==='skipped'?'Пропущена':w.status==='active'?`Идёт · ${D.setsDone(w)} из ${D.setsTotal(w)}`:n?`${tm(w.time,w.date,false)} · ${n} ${plural(n,'упражнение','упражнения','упражнений')}`:`${tm(w.time,w.date,false)} · упражнения ещё не добавлены`;
 const act=w.status==='active'?B('Продолжить','gym-open',w.id,'primary small'):w.status==='done'?B('Сводка','summary',w.id,'small'):w.status==='planned'&&w.date===t?B(I('play',14)+'Начать','w-start',w.id,'primary small'):'';
 return `<div class="row wk${w.status==='skipped'?' is-muted':''}${done?' is-done':''}${nc}" data-key="w${w.id}"><span class="lead ico${done?' on':''}">${I(done?'check':'journal',18)}</span>
 <button type="button" class="rbody" data-action="w-open" data-id="${w.id}"><span class="rt">${esc(w.title)}</span><span class="rm">${meta}</span></button>${act}</div>`}

// Строка будущего дня: только посмотреть, без отметок (§4.7).
function plainRow(it,meta,date){return `<div class="row is-future" data-key="h${it.id}${date}"><span class="lead ico dim">${I('clock',16)}</span><button type="button" class="rbody" data-action="habit-edit" data-id="${it.id}"><span class="rt">${esc(it.title)}</span><span class="rm">${meta}</span></button></div>`}

// ——— правая колонка: что дальше (неделя со статистикой ушла с главной, §3.2) ———
function sideToday(){const s=view(),next=D.schedule(s,D.addDays(D.today(),1),6).filter(w=>w.status==='planned').slice(0,4);
 return `<section class="panel"><div class="phead"><h2>Дальше</h2></div>
 ${next.length?`<div class="rows compact">${next.map(w=>`<button type="button" class="nextrow" data-action="w-open" data-id="${w.id}" data-key="n${w.id}"><span class="caption">${D.fmtDay(w.date)}, ${w.time}</span><span class="rt">${esc(w.title)}</span></button>`).join('')}</div>`
 :`<p class="meta">Тренировок впереди нет. ${s.plans.length?'':'Задайте дни в плане — тренировки встанут сюда сами.'}</p>${s.plans.length?'':B(I('plus',16)+'План','plan-new','','small')}`}</section>${deskSide(s)}`}
// Компьютер: вторая колонка не пустует — тренер и последний замер (аудит, п. 51). На телефоне их нет: там это вкладки.
function deskSide(s){const c=s.coach,qn=s.questions.filter(q=>!q.askedAt).length,wt=D.metricSeries(s,'weight'),last=wt[wt.length-1],dw=D.metricDelta(s,'weight',7);
 const coach=c.name?`<section class="panel deskonly"><div class="phead"><h2>Тренер</h2>${B('Открыть','go','coach','small ghost')}</div><p class="meta">${c.nextMeeting?`Встреча — ${D.fmtDay(c.nextMeeting,{lower:true})}`:'Встреча не назначена'}${qn?` · ${qn} ${plural(qn,'вопрос','вопроса','вопросов')} к встрече`:''}</p></section>`:'';
 const body=last?`<section class="panel deskonly"><div class="phead"><h2>Вес</h2>${B('Замер','metric-open','weight','small ghost')}</div><div class="tiles one"><div class="tile"><b class="num">${fmtN(last.value)}<span> кг</span></b><span class="delta">${D.fmtDay(last.date)}${dw!==null?` · ${dw>0?'+':''}${fmtN(dw)} за неделю`:''}</span></div></div></section>`:'';
 return coach+body}


// Разобрать неотмеченные дни плана по одному: у каждого — «Пропустил» или «Была — записать». Список живой: ответили — строка ушла.
function plansQSheet(){openSheet({title:'Тренировки по плану',view:()=>{const qs=ui.questions.filter(q=>q.kind==='plan');if(!qs.length)return null;
 return `<div class="rows plansq">${qs.map(q=>`<div class="row plain" data-key="${q.id}"><div class="grow"><span class="rt">${esc(q.title)}</span><span class="rm">${D.fmtDay(q.date)}</span></div>${B('Пропустил','q-plan-skip',q.id,'small ghost')}${B('Была','q-plan-log',q.id,'small')}</div>`).join('')}</div>`}})}

/* ——— «Тренировки» (UX §3.4) ———
   Сверху «Ближайшие 7 дней» — план тренера ставит их сам (§4.4), плюс добавленные
   вручную. Ниже история по неделям. Фильтров нет. Карточка тренировки — для
   правки задним числом; вести тренировку — в режиме «В зале» (06-gym.js). */

// Компьютер: правая колонка не пустует — сегодняшняя, ближайшая или последняя тренировка (аудит, п. 50).
function autoWorkout(s,t){if(!matchMedia('(min-width:1024px)').matches)return null;
 const up=D.schedule(s,t,7).find(w=>w.status!=='done'&&w.status!=='skipped');if(up)return up.id;
 const past=s.workouts.filter(w=>w.status==='done').sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time))[0];return past?past.id:null}
function trainScene(){
 const s=view(),t=D.today(),st=D.weekStats(s),shown=ui.id||autoWorkout(s,t);
 const nextW=D.schedule(s,t,14).find(w=>w.status==='planned');
 const wsub=st.total?`На этой неделе ${st.done} из ${st.total}`:nextW?`Следующая — ${D.fmtDay(nextW.date,{lower:true})}, ${nextW.time}`:'Тренировок пока не запланировано';
 const next=D.schedule(s,t,7).filter(w=>w.status!=='done');
 const past=s.workouts.filter(w=>w.status==='done'||w.status==='skipped'||(w.date<t&&w.status!=='active')).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
 const weeks=[];for(const w of past){const k=D.weekStart(w.date);let g=weeks.find(x=>x.k===k);if(!g)weeks.push(g={k,items:[]});g.items.push(w)}
 const wlabel=k=>k===D.weekStart(t)?'Эта неделя':k===D.addDays(D.weekStart(t),-7)?'Прошлая неделя':`${D.fmtShort(k)} — ${D.fmtShort(D.addDays(k,6))}`;
 return `<section class="scene">${sceneHead(`Неделя ${D.fmtShort(D.weekStart(t))} — ${D.fmtShort(D.addDays(D.weekStart(t),6))}`,'Тренировки',wsub,B(I('plus',18)+'Тренировка','w-new','','primary'))}
 ${example?exampleBanner():''}
 <div class="cols"><div class="stack">
  <section class="panel"><div class="phead"><h2>Ближайшие 7 дней</h2></div>
  ${next.length?`<div class="rows">${next.map(w=>wrow(w)).join('')}</div>`:empty('journal','Впереди пусто','Добавьте тренировку или попросите тренера составить план — он сам встанет в расписание.',B(I('plus',18)+'Тренировка','w-new','','small'))}</section>
  <section class="panel"><div class="phead"><h2>История</h2></div>
  ${weeks.length?weeks.slice(0,ui.weeks||6).map(g=>{const d=g.items.filter(w=>w.status==='done').length;return `<div class="block"><div class="blocktitle">${wlabel(g.k)} · ${d} ${plural(d,'тренировка','тренировки','тренировок')}</div><div class="rows">${g.items.map(w=>wrow(w)).join('')}</div></div>`}).join('')
   +(weeks.length>(ui.weeks||6)?`<div class="pfoot">${B('Показать ещё','more-weeks','','ghost small')}</div>`:''):empty('journal','Истории пока нет','Здесь будут все тренировки по неделям — с рекордами и сравнением.')}</section>
 </div><div class="stack">${shown?workoutDetail(shown):detailHint()}</div></div></section>`}

function detailHint(){return `<section class="panel detail-empty">${empty('journal','Выберите тренировку','Откройте любую, чтобы посмотреть подходы, рекорды или поправить что-то задним числом.')}</section>`}

function wrow(w){
 const s=view(),t=D.today(),on=(ui.id||autoWorkout(s,t))===w.id;
 const meta=w.virtual?`${w.time} · по плану`:w.status==='done'?[D.duration(w)?`${D.duration(w)} мин`:'',D.volume(w)?kg(D.volume(w)):'',(()=>{const r=D.records(s,w).length;return r?`${r} ${plural(r,'рекорд','рекорда','рекордов')}`:''})()].filter(Boolean).join(' · ')||'Сделано'
  :w.status==='skipped'?'Пропущена':w.status==='active'?'Идёт':w.date<t?'Не закрыта':`${w.time} · ${w.exercises.length} упр.`;
 const act=w.date===t&&(w.status==='planned')?B(I('play',14)+'Начать','w-start',w.id,'primary small'):w.status==='active'?B('Продолжить','gym-open',w.id,'primary small'):'';
 return `<div class="row wrow${on?' is-on':''}${w.status==='skipped'?' is-muted':''}" data-key="${w.id}"><span class="datebox${w.status==='done'?' done':''}"><b class="num">${Number(w.date.slice(8))}</b><span>${D.WD[D.weekday(w.date)]}</span></span>
 <button type="button" class="rbody" data-action="w-open" data-id="${w.id}"><span class="rt">${esc(w.title)}</span><span class="rm${w.status==='planned'&&w.date<t?' warn':''}">${w.date===t?'Сегодня · ':''}${meta}${w.auto?' · закрыта автоматически':''}</span></button>${act}</div>`}

// ——— карточка тренировки ———
function workoutDetail(id){
 const s=view();let w=find('workouts',id);
 if(!w){const v=D.schedule(s,D.today(),7).find(x=>x.id===id);if(!v)return detailHint();
  const p=find('plans',v.planId),isT=v.date===D.today();
  // Пустой план не тупик (аудит, п. 25): прямой путь к упражнениям, а начать можно и так.
  const list=p.exercises.length?`<div class="rows">${p.exercises.map((x,i)=>{const l=D.lastSets(s,x.name);return `<div class="row plain"><span class="exn num">${i+1}</span><div class="grow"><span class="rt">${esc(x.name)}</span><span class="rm">${x.sets||3} × ${x.reps||'—'}${l?` · в прошлый раз ${numText(l.sets[l.sets.length-1].weight)||'—'} кг`:''}</span></div></div>`}).join('')}</div>`
   :`<div class="emptyplan card"><p><b>В плане пока нет упражнений</b></p><p class="meta">Добавьте их один раз — дальше каждая тренировка по плану будет с ними, а веса подставятся с прошлого раза.</p>${B(I('plus',16)+'Добавить упражнения','plan-edit',p.id,isT?'':'primary')}</div>`;
  return `<section class="panel detail" data-key="${id}"><div class="dtop">${B(I('back',20),'go','train','icon ghost backbtn','aria-label="К списку"')}<span class="kicker grow">${D.fmtDay(v.date)} · ${v.time} · по плану</span>${B(I('edit',18),'plan-edit',p.id,'icon small ghost','aria-label="Изменить план"')}</div>
  <h2 class="dtitle">${esc(v.title)}</h2>
  ${list}
  <div class="dfoot">${B('Пропустить','v-skip',id,'')}${B('На завтра','v-move',id,'')}${isT?B(I('play',16)+'Начать','w-start',id,'primary'):''}</div></section>`}
 const t=D.today(),recs=D.records(s,w),dur=D.duration(w);
 const foot=w.status==='active'?B('Продолжить в зале','gym-open',w.id,'primary'):w.status==='planned'?`${B('Пропустить','w-skip',w.id,'')}${w.date>=t?B('На завтра','w-move',w.id,''):''}${w.date===t?B(I('play',16)+'Начать','w-start',w.id,'primary'):B('Отметить сделанной','w-done',w.id,'primary')}`
  :w.status==='done'?B('Сводка','summary',w.id,''):B('Вернуть в план','w-replan',w.id,'ghost');
 return `<section class="panel detail" data-key="${w.id}">
 <div class="dtop">${B(I('back',20),'go','train','icon ghost backbtn','aria-label="К списку"')}<span class="kicker grow">${D.fmtDay(w.date)} · ${w.time}${w.coach?' · с тренером':''}</span>
  ${B(I('edit',18),'w-edit',w.id,'icon small ghost','aria-label="Изменить"')}${B(I('copy',18),'w-copy',w.id,'icon small ghost','aria-label="Повторить сегодня"')}${B(I('trash',18),'w-del',w.id,'icon small ghost','aria-label="Удалить"')}</div>
 <h2 class="dtitle">${esc(w.title)}</h2>
 <div class="tiles four"><div class="tile"><span class="caption">Подходы</span><b class="num">${D.setsDone(w)}<span> из ${D.setsTotal(w)}</span></b></div>
  <div class="tile"><span class="caption">Объём</span><b class="num">${D.volume(w)?kg(D.volume(w)):'—'}</b></div>
  <div class="tile"><span class="caption">Время</span><b class="num">${dur?dur+'<span> мин</span>':'—'}</b></div>
  <div class="tile"><span class="caption">Рекорды</span><b class="num">${recs.length||'—'}</b></div></div>
 <div class="exlist">${w.exercises.map((e,i)=>exCard(w,e,i)).join('')||empty('journal','Упражнений нет','Добавьте первое — подходы и веса будут подсказываться с прошлого раза.')}</div>
 ${B(I('plus',18)+'Упражнение','ex-new',w.id,'addex wide')}
 ${w.note?`<p class="wnote meta">${I('note',14)} ${esc(w.note)}</p>`:''}
 <div class="dfoot">${foot}</div></section>`}

/* Упражнение: «по подходам» — строка на подход; «строкой» — подходы × повторы × вес.
   В данных это всегда массив подходов. Отметка подхода — это факт (§4.3). */
function exCard(w,e,i){
 const s=view(),last=D.lastSets(s,e.name,w.id,w.date+w.time),da=`data-w="${w.id}" data-e="${e.id}"`;
 const cols=e.mode==='time'?['Мин','Км']:['Повторы','Кг'];
 const hint=last?`В прошлый раз: ${last.sets.length} × ${last.sets[last.sets.length-1].reps??'—'}${e.mode==='weight'&&last.sets[last.sets.length-1].weight!=null?' · '+numText(last.sets[last.sets.length-1].weight)+' кг':''}`:'Первый раз';
 let body;
 if(e.entry==='line'){const q=e.sets[e.sets.length-1]||{},done=e.sets.length>0&&e.sets.every(x=>x.doneAt);
  body=`<div class="line${done?' is-done':''}"><label><span class="caption">Подходы</span><input data-live="line-n" ${da} inputmode="numeric" value="${e.sets.length}"></label><span class="x">×</span>
  <label><span class="caption">${cols[0]}</span><input data-live="line-reps" ${da} inputmode="numeric" value="${esc(numText(q.reps))}" placeholder="—"></label><span class="x">×</span>
  <label><span class="caption">${cols[1]}</span><input data-live="line-weight" ${da} inputmode="decimal" value="${esc(numText(q.weight))}" placeholder="—"></label>
  ${B(I('check',16),'line-tick',e.id,'tick'+(done?' is-on':''),`data-w="${w.id}" aria-pressed="${done}" aria-label="Все подходы сделаны"`)}</div>`}
 else body=`<div class="sets"><div class="sethead"><span>#</span><span>${cols[0]}</span><span>${cols[1]}</span><span></span><span></span></div>${e.sets.map((q,k)=>`<div class="set${q.doneAt?' is-done':''}" data-key="${q.id}"><span class="n num">${k+1}</span>
  <input data-live="reps" ${da} data-s="${q.id}" inputmode="numeric" enterkeyhint="next" value="${esc(numText(q.reps))}" placeholder="—" aria-label="${cols[0]}, подход ${k+1}">
  <input data-live="weight" ${da} data-s="${q.id}" inputmode="decimal" enterkeyhint="next" value="${esc(numText(q.weight))}" placeholder="—" aria-label="${cols[1]}, подход ${k+1}">
  ${B(I('check',16),'set-tick',q.id,'tick'+(q.doneAt?' is-on':''),`${da} aria-pressed="${!!q.doneAt}" aria-label="Подход ${k+1}"`)}${B(I('close',16),'set-del',q.id,'icon small ghost',`${da} aria-label="Убрать подход ${k+1}"`)}</div>`).join('')}</div>`;
 return `<article class="ex card" data-key="${e.id}"><header class="exhead"><span class="exn num">${i+1}</span><div class="grow"><h3>${esc(e.name)}</h3><span class="caption">${hint} · отдых ${e.rest} с</span></div>
 ${B(I('trash',17),'ex-del',e.id,'icon small ghost',`data-w="${w.id}" aria-label="Убрать упражнение"`)}</header>${body}
 <footer class="exfoot">${e.entry==='line'?'<span></span>':B(I('plus',16)+'Подход','set-add',e.id,'ghost small',`data-w="${w.id}"`)}
 <div class="seg inline mini">${B('По подходам','ex-entry',e.id,e.entry==='sets'?'is-on':'',`data-w="${w.id}" data-v="sets"`)}${B('Строкой','ex-entry',e.id,e.entry==='line'?'is-on':'',`data-w="${w.id}" data-v="line" title="Все подходы одинаковые — одна строка: подходы × повторы × вес"`)}</div></footer></article>`}

/* ——— «В зале» (UX §3.4, VISUAL §6) ———
   Всегда тёмный, одно упражнение за раз, всё крупно и под большой палец.
   Текущий подход — первый неотмеченный. «Подход сделан» пишет факт (§4.3):
   без повторов подход не факт, поэтому кнопка тогда недоступна и рядом сказано
   почему. После подхода — вспышка, короткая вибрация и отдых; конец отдыха
   виден и ощутим. Последний подход упражнения — переход к следующему,
   последний подход тренировки — сводка сама. Экран не гаснет (wake lock). */

function curSet(e){return e.sets.find(q=>!q.doneAt)||null}
function gymEx(w){if(!w.exercises.length)return null;ui.gx=Math.min(Math.max(0,ui.gx),w.exercises.length-1);return w.exercises[ui.gx]}
const setNums=l=>l.length===1?`подходе ${l[0]}`:`подходах ${l[0]}–${l[l.length-1]}`;

function gymScene(id){
 const w=find('workouts',id);
 if(!w)return `<section class="gym gymwrap"><div class="gymtop">${B(I('close',22),'gym-close','','icon ghost','aria-label="Закрыть"')}</div>${empty('journal','Тренировка не найдена','Возможно, она уже удалена.',B('К тренировкам','go','train','primary'))}</section>`;
 const e=gymEx(w),n=w.exercises.length,done=D.setsDone(w),total=D.setsTotal(w);
 const top=`<header class="gymtop">${B(I('back',22),'gym-close','','icon ghost','aria-label="Свернуть"')}
  <div class="grow gymtitle"><span class="caption">${esc(w.title)}</span><b class="num">${done} из ${total} подходов</b></div>
  ${B(I('list',22),'gym-list',w.id,'icon ghost','aria-label="Все упражнения"')}</header>
  <div class="gymbar" aria-hidden="true"><i style="width:${total?Math.round(done/total*100):0}%"></i></div>`;
 if(!e)return `<section class="gym gymwrap" data-key="gym${w.id}">${top}<div class="gymbody">${empty('journal','Упражнений пока нет','Добавьте первое — дальше всё пойдёт по одному.',B(I('plus',18)+'Упражнение','ex-new',w.id,'primary'))}</div><footer class="gymfoot">${B('Свернуть','gym-close','','ghost wide')}</footer></section>`;
 const q=curSet(e),k=q?e.sets.indexOf(q):e.sets.length,last=D.lastSets(view(),e.name,w.id,w.date+w.time);
 const lq=last?last.sets[Math.min(k,last.sets.length-1)]:null;
 const [ra,wa,rs,ws]=e.mode==='time'?['Минуты','Километры',1,0.5]:['Повторы','Вес, кг',1,2.5];
 const nav=`<div class="gymnav">${B(I('back',20),'gym-ex',String(ui.gx-1),'icon ghost',`aria-label="Предыдущее упражнение"${ui.gx?'':' disabled'}`)}
  <span class="caption num">Упражнение ${ui.gx+1} из ${n}</span>${B(I('chev',20),'gym-ex',String(ui.gx+1),'icon ghost',`aria-label="Следующее упражнение"${ui.gx<n-1?'':' disabled'}`)}</div>`;
 const dots=`<div class="gymsets">${e.sets.map((x,i)=>`<span class="gs${x.doneAt?' done':''}${x===q?' now':''}${ui.just===x.id?' just':''}" data-key="${x.id}"><b class="num">${x.doneAt?`${numText(x.reps)||'—'}×${numText(x.weight)||'—'}`:i+1}</b></span>`).join('')}${B(I('plus',16),'set-add',e.id,'gs add icon',`data-w="${w.id}" aria-label="Ещё подход"`)}</div>`;
 const r=ui.rest&&ui.rest.w===w.id?ui.rest:null;
 const rest=r?`<div class="gymrest card${r.over?' is-over':''}" role="timer" aria-live="polite">${r.over?`<span class="restok">${I('check',18)}<b>Отдых закончился</b></span>${B('Скрыть','rest-stop','','small ghost')}`
  :`<span class="caption">Отдых</span><b class="num" data-rest>${restText()}</b>${B('+30 с','rest-add','','small ghost')}${B('Хватит','rest-stop','','small')}`}</div>`:'';
 let hint='',follow='';
 if(q){
  // «Попробуйте +2,5» (§3.4): в прошлый раз все подходы с этим весом сделаны на все повторы.
  const lastTop=last&&last.sets.length?Math.max(...last.sets.map(x=>x.weight||0)):0;
  const cleared=last&&e.mode==='weight'&&k===0&&q.weight!=null&&q.weight<=lastTop&&last.sets.every(x=>(x.reps||0)>=(q.reps||0));
  hint=lq?`В прошлый раз: ${numText(lq.reps)||'—'} × ${numText(lq.weight)||'—'}${e.mode==='weight'?' кг':''}`:'Первый раз — запишите, как пошло';
  if(cleared)hint+=` · всё сделано ${B('Попробовать +2,5','gym-bump',e.id,'small gymbump',`data-w="${w.id}"`)}`;
  // Явно, а не магией: какие следующие подходы идут с тем же весом.
  const same=e.sets.map((x,i)=>[x,i+1]).filter(([x,i])=>i>k+1&&!x.doneAt&&x.weight===q.weight&&x.reps===q.reps).map(([,i])=>i);
  if(same.length)follow=`<p class="caption gymfollow">«−/+» меняет и следующие: так же в ${setNums(same)}</p>`;
  // Вес не указан в весовом упражнении — не молчим (аудит, п. 24): или вписать, или это вес тела.
  if(e.mode==='weight'&&q.weight==null&&q.reps>0)follow+=`<p class="caption gymnote">Вес не указан — запишется как упражнение с весом тела</p>`}
 const noReps=q&&!(q.reps>0);
 const body=q?`<div class="gympair">${gymStep(ra,'reps',q.reps,rs,w,e,q)}${gymStep(wa,'weight',q.weight,ws,w,e,q)}</div>${follow}
  <p class="gymhint meta">${hint}</p>`
  :`<div class="gymdone">${I('check',28)}<h2>Упражнение сделано</h2><p class="meta">${e.sets.length} ${plural(e.sets.length,'подход','подхода','подходов')}</p></div>`;
 const next=ui.gx<n-1?B(`Дальше: ${esc(w.exercises[ui.gx+1].name)}`,'gym-ex',String(ui.gx+1),'wide gymgo'):B('Завершить тренировку','gym-finish',w.id,'primary wide gymgo');
 const main=q?`${noReps?`<p class="caption why">Сначала укажите ${e.mode==='time'?'минуты':'повторы'} — без них подход не запишется</p>`:''}${B(I('check',22)+'Подход сделан','gym-set',q.id,'primary wide gymgo lone',`data-w="${w.id}" data-e="${e.id}"${noReps?' disabled':''}`)}`:next;
 return `<section class="gym gymwrap" data-key="gym${w.id}">${top}
 <div class="gymbody">${nav}<h1 class="gymname">${esc(e.name)}</h1><p class="caption">Подход ${Math.min(k+1,e.sets.length)} из ${e.sets.length} · отдых ${e.rest} с</p>
 ${dots}${body}${rest}</div>
 <footer class="gymfoot">${main}</footer></section>`}

function gymStep(label,f,v,step,w,e,q){const da=`data-w="${w.id}" data-e="${e.id}" data-s="${q.id}" data-f="${f}"`;
 return `<div class="stepfield big"><span class="label">${label}${v==null?' · впишите':''}</span><div class="stepper">${B(I('minus',26),'gym-step',String(-step),'icon lone',`${da} aria-label="${label}: минус ${step}"`)}
 <label class="stepval"><input data-live="${f}" data-w="${w.id}" data-e="${e.id}" data-s="${q.id}" inputmode="decimal" value="${esc(numText(v))}" placeholder="—" aria-label="${label}"></label>
 ${B(I('plus',26),'gym-step',String(step),'icon lone',`${da} aria-label="${label}: плюс ${step}"`)}</div></div>`}

// ——— отдых: таймер не перерисовывает экран, меняет только своё число ———
let restTimer=null;
function restText(){if(!ui.rest)return '0:00';const s=Math.max(0,Math.ceil((ui.rest.until-Date.now())/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function startRest(w,sec){ui.rest={w,until:Date.now()+sec*1000,over:false};clearInterval(restTimer);
 restTimer=setInterval(()=>{if(!ui.rest){clearInterval(restTimer);return}const el=$('[data-rest]');if(el)el.textContent=restText();
  // Конец отдыха (VISUAL §5.3): таймер становится «Отдых закончился» и остаётся, пока не нажали дальше.
  if(Date.now()>=ui.rest.until){ui.rest.over=true;clearInterval(restTimer);buzz([200,100,200]);render()}},250)}
function stopRest(){ui.rest=null;clearInterval(restTimer);render()}

// ——— экран не гаснет, пока открыт «В зале» ———
let wakeLock=null;
async function wake(on){try{if(on&&!wakeLock&&navigator.wakeLock){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null})}
 else if(!on&&wakeLock){await wakeLock.release();wakeLock=null}}catch(e){}}

// ——— начать: виртуальная из плана становится настоящей (D.ops.start) ———
function startWorkout(id){
 const wid=wop(s=>D.ops.start(s,id),{quiet:true});if(!wid)return;
 ui.gx=0;ui.rest=null;const w=find('workouts',wid);if(w){const i=w.exercises.findIndex(e=>curSet(e));ui.gx=i<0?0:i}
 go('gym',wid)}

function setDone(wid,eid,sid){
 const r=wop(s=>D.ops.setDone(s,wid,eid,sid),{quiet:true});if(!r)return;
 learnFlag('gym.set');buzz(10);ui.just=sid;setTimeout(()=>{if(ui.just===sid){ui.just=null;$(`.gs[data-key="${sid}"]`)?.classList.remove('just')}},700);
 // Последний подход тренировки — сводка появляется сама (§3.5).
 if(r.all){ui.rest=null;clearInterval(restTimer);finishWorkout(wid);return}
 const w=find('workouts',wid);if(r.advance&&w){const i=w.exercises.findIndex((e,k)=>k>ui.gx&&curSet(e));if(i>=0)ui.gx=i}
 startRest(wid,r.rest);render()}

function finishWorkout(id){
 commit(s=>D.ops.finish(s,id),{quiet:true});
 ui.rest=null;clearInterval(restTimer);wake(false);go('train',id,()=>summarySheet(id))}

function gymListSheet(id){const w=find('workouts',id);if(!w)return;

  ${!cmp.length&&!recs.length?`<p class="meta firstrec">Первая запись — со следующего раза здесь будет сравнение и рекорды.</p>`:''}
  ${cmp.length?`<div class="field"><span class="label">С прошлым разом</span><div class="rows compact">${cmp.map(c=>`<div class="cmprow"><span class="grow">${esc(c.name)}</span>${arrow(c.trend)}</div>`).join('')}</div></div>`:''}
  <div class="field"><span class="label">Как прошло</span><input type="hidden" name="feel" value="${w.feel||0}"><div class="seg feel" role="radiogroup">${[1,2,3,4,5].map(i=>`<button type="button" role="radio" aria-checked="${w.feel===i}" class="${w.feel===i?'is-on':''}" data-action="seg" data-id="${i}">${D.FEELS[i]}</button>`).join('')}</div></div>
  ${area('Тренеру','note',note?note.text:'','Что заметили, что болело, что получилось — попадёт в «К встрече»')}</div>`,

   const i=s.notes.findIndex(n=>n.wid===id);
   if(f.note){if(i>=0)s.notes[i].text=f.note;else s.notes.push({id:D.uid('n'),date:x.date,text:f.note,source:'workout',wid:id})}else if(i>=0)s.notes.splice(i,1)}),saveLabel:'Готово',cancel:false})}

/* ——— «Прогресс» (UX §3.8): отвечает на вопрос «я расту?» ———
   Три вкладки: Сила · Тело · Привычки. Каждая — одна мысль на карточку:
   число сейчас, изменение, линия. Привычка — одна карточка с двумя
   проекциями истории: отметки по дням и значения (для количественных). */

// Линия: svg по точкам, без осей. Пустые точки (0/null) пропускаются.
function spark(vals,{w=120,h=36,cls=''}={}){const pts=vals.map((v,i)=>[i,v]).filter(p=>p[1]);if(pts.length<2)return `<svg class="spark ${cls}" width="${w}" height="${h}" aria-hidden="true"></svg>`;
 const min=Math.min(...pts.map(p=>p[1])),max=Math.max(...pts.map(p=>p[1])),span=max-min||1,n=vals.length-1||1;
 const xy=pts.map(([i,v])=>[(i/n)*(w-6)+3,h-4-((v-min)/span)*(h-8)]);
 const d=xy.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' '),l=xy[xy.length-1];
 return `<svg class="spark ${cls}" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><path d="${d}"/><circle cx="${l[0].toFixed(1)}" cy="${l[1].toFixed(1)}" r="3"/></svg>`}
function delta(v,unit,{good=1,days=''}={}){if(v===null||v===undefined||!isFinite(v))return '';// Цвет только у роста силы; тело нейтрально — цель у всех своя (набор или снижение).
 const t=!good||v<=0?'':'up';
 return `<span class="delta ${t}">${v>0?'+':''}${fmtN(v)} ${unit}${days?` ${days}`:''}</span>`}

function progressScene(){
 const tab=ui.prog;
 const seg=`<div class="seg inline pseg" role="tablist">${[['strength','Сила'],['body','Тело'],['habits','Регулярность']].map(([k,v])=>B(v,'prog',k,tab===k?'is-on':'',`role="tab" aria-selected="${tab===k}"`)).join('')}</div>`;
 const body=tab==='body'?bodyTab():tab==='habits'?habitsTab():strengthTab();
 return `<section class="scene">${sceneHead(view().profile.goal?esc(view().profile.goal):'Движусь ли я','Прогресс','',seg)}${example?exampleBanner():''}${body}</section>`}

// ——— Сила ———
function strengthTab(){const s=view(),list=D.exerciseList(s);
 if(!list.length)return `<section class="panel">${empty('progress','Силы пока не видно','После первых тренировок с весом здесь появится каждое упражнение: лучший результат и как он растёт по неделям.')}</section>`;
 return `<div class="grid3">${list.map(x=>{const ser=D.strength(s,x.name,8),vals=ser.map(p=>p.value),nz=vals.filter(Boolean),ch=nz.length>1?D.round(nz[nz.length-1]-nz[0],10):null;
  return `<button type="button" class="panel stat" data-action="ex-stat" data-id="${esc(x.name)}" data-key="x${esc(x.name)}"><span class="kicker">${esc(x.name)}</span><span class="statgo">${I('chev',16)}</span>
  <span class="big num">${x.best.weight!=null?`${numText(x.best.weight)}<small> кг × ${x.best.reps}</small>`:`${x.best.reps}<small> повт.</small>`}</span><span class="caption">Лучшее · ${D.fmtShort(x.bestDate)}</span>
  <span class="statfoot">${(()=>{if(nz.length>=2)return `${spark(vals)}${ch?delta(ch,'кг',{days:'за 8 нед.'}):'<span class="delta">без изменений</span>'}`;
   // Недель мало — рост видно по тренировкам: сводка уже сказала «рекорд», карточка не должна говорить «первая запись».
   const runs=D.strengthRuns(s,x.name),rv=runs.map(r=>r.value);if(runs.length<2)return '<span class="delta">Первая запись — рост появится со второй тренировки</span>';
   const rc=D.round(rv[rv.length-1]-rv[0],10);return `${spark(rv)}${rc?delta(rc,'кг',{days:`за ${runs.length} ${plural(runs.length,'тренировку','тренировки','тренировок')}`}):'<span class="delta">без изменений</span>'}`})()}</span></button>`}).join('')}</div>
 <p class="caption footnote">Рост считаем по расчётному максимуму на один повтор — так сравниваются и 60 × 10, и 70 × 6.</p>`}

function exStatSheet(name){openSheet({title:esc(name),view:()=>{const s=view(),ser=D.strength(s,name,12);
 const hist=s.workouts.filter(w=>w.status==='done').sort((a,b)=>b.date.localeCompare(a.date)).map(w=>({w,e:w.exercises.find(e=>D.sameName(e.name,name))})).filter(x=>x.e&&x.e.sets.some(q=>q.doneAt)).slice(0,12);
 return `<div class="chartbox">${spark(ser.map(p=>p.value),{w:520,h:140,cls:'wide'})}<div class="chartx caption"><span>${D.fmtShort(ser[0].week)}</span><span>Сейчас</span></div></div>
 <div class="rows">${hist.map(({w,e})=>`<div class="row plain"><span class="datebox"><b class="num">${Number(w.date.slice(8))}</b><span>${D.WD[D.weekday(w.date)]}</span></span><div class="grow"><span class="rt">${e.sets.filter(q=>q.doneAt).map(q=>`${numText(q.weight)||'—'}×${numText(q.reps)||'—'}`).join('  ')}</span><span class="rm">${D.fmtDate(w.date)} · ${esc(w.title)}</span></div></div>`).join('')}</div>`}})}

// ——— Тело ———
function bodyTab(){const s=view();
 const cards=Object.entries(D.METRICS).map(([k,[name,unit]])=>{const l=D.metricSeries(s,k),last=l[l.length-1];
  if(!last)return `<button type="button" class="panel stat is-empty" data-action="metric-open" data-id="${k}" data-key="m${k}"><span class="kicker">${name}</span><span class="big num faintnum">—</span><span class="caption">Добавить первый замер</span></button>`;
  const d30=D.metricDelta(s,k,30);
  return `<button type="button" class="panel stat" data-action="metric-hist" data-id="${k}" data-key="m${k}"><span class="kicker">${name}</span><span class="statgo">${I('chev',16)}</span><span class="big num">${fmtN(last.value)}<small> ${unit}</small></span><span class="caption">${D.fmtDay(last.date)}</span>
  <span class="statfoot">${spark(l.slice(-12).map(m=>m.value))}${delta(d30,unit,{good:0,days:'за месяц'})}</span></button>`}).join('');
 return `<div class="rowhead"><span class="meta">Замеры тела — раз в неделю, в одно время</span>${B(I('plus',18)+'Замер','metric-open','weight','primary small')}</div><div class="grid2">${cards}</div>`}

// Живой список: удалили замер — строка ушла, последний удалённый закрывает шторку.
function metricHistSheet(kind){const [name,unit]=D.METRICS[kind];
 openSheet({title:name,view:()=>{const l=D.metricSeries(view(),kind);if(!l.length)return null;return `<div class="chartbox">${spark(l.slice(-30).map(m=>m.value),{w:520,h:140,cls:'wide'})}</div>
 <div class="rows">${[...l].reverse().slice(0,20).map((m,i,a)=>{const p=a[i+1];return `<div class="row plain" data-key="${m.id}"><div class="grow"><span class="rt num">${fmtN(m.value)} ${unit}</span><span class="rm">${D.fmtDate(m.date)}</span></div>${p?delta(D.round(m.value-p.value,10),unit,{good:0}):''}${B(I('trash',16),'metric-del',m.id,'icon small ghost','aria-label="Удалить замер"')}</div>`}).join('')}</div>`},
  extra:B(I('plus',18)+'Замер','metric-open',kind,'')})}

// ——— Привычки: одна карточка, две проекции ———
function habitsTab(){const s=view(),act=s.habits.filter(h=>!h.archived),arch=s.habits.filter(h=>h.archived);
 const hasCount=act.some(h=>(D.ruleOn(h,D.today())||h.rules[h.rules.length-1]).kind==='count');
 const proj=!hasCount?'':`<div class="seg inline mini" title="Значения — у привычек с количеством">${B('Отметки','hist','marks',prefs.hist==='marks'?'is-on':'')}${B('Значения','hist','values',prefs.hist==='values'?'is-on':'')}</div>`;
 if(!act.length)return `<section class="panel">${empty('tasks','Привычек нет','Вода, шаги, сон — всё, что хочется делать регулярно. Появятся в ленте дня в своё время.',B(I('plus',18)+'Привычка','habit-new','','primary small'))}</section>`;
 return `${regularity()}<div class="rowhead"><span class="meta">Привычки · последние 5 недель</span>${proj}</div><div class="grid2">${act.map(h=>habitCard(h)).join('')}</div>
 <div class="rowfoot">${B(I('plus',18)+'Привычка','habit-new','','ghost')}</div>
 ${arch.length?`<section class="panel"><div class="phead"><h2>В архиве</h2></div><div class="rows">${arch.map(h=>`<div class="row plain" data-key="a${h.id}"><div class="grow"><span class="rt">${esc(h.title)}</span><span class="rm">История сохранена</span></div>${B(I('restore',16)+'Вернуть','habit-unarchive',h.id,'small ghost')}</div>`).join('')}</div></section>`:''}`}

function habitCard(h){const s=view(),t=D.today(),days=[];
 // Сетка начинается с недели, когда привычка появилась, — без пустых строк сверху.
 const from=D.weekStart(h.rules[0].from);for(let i=34;i>=0;i--){const d=D.addDays(t,-i);if(d>=from)days.push(d)}
 // Счёт — одно правило с «К встрече» (D.habitStats): без дня начала, сегодня только если сделано.
 const hs=days.length?D.habitStats(s,h,days[0],t):{due:0,pct:null,avg:null},pct=hs.pct;
 const st=D.streak(s,h,t),r=D.ruleOn(h,t)||h.rules[h.rules.length-1];
 const count=r.kind==='count',values=prefs.hist==='values'&&count,anyDue=days.some(d=>D.isDue(h,d));
 let nextDue=null;if(!anyDue&&r.days.length)for(let i=1;i<=7&&!nextDue;i++){const d=D.addDays(t,i);if(D.isDue(h,d))nextDue=d}
 let hist;
 if(values){const max=Math.max(r.target,...days.map(d=>D.logOf(s,h,d)));
  hist=`<div class="bars" aria-label="Значения по дням">${days.map(d=>{const v=D.logOf(s,h,d),rr=D.ruleOn(h,d);return `<i class="${!rr?'none':D.habitDone(s,h,d)?'done':v?'part':''}" style="height:${Math.max(4,Math.round(v/max*100))}%" title="${D.fmtShort(d)}: ${fmtN(v)}"></i>`}).join('')}<b class="goal" style="bottom:${Math.round(r.target/max*100)}%"></b></div>`}
 else hist=`<div class="marks" aria-label="Отметки по дням">${D.WD.map(w=>`<span class="caption">${w}</span>`).join('')}${(()=>{const pad=D.weekday(days[0]);return '<i class="none"></i>'.repeat(pad)})()}${days.map(d=>{const due=D.isDue(h,d),done=D.habitDone(s,h,d),miss=D.answered(h,d);return `<i class="${!D.ruleOn(h,d)||!due?'none':done?'done':miss?'miss':d<t?'open':d===t?'today':''}" title="${D.fmtShort(d)}"></i>`}).join('')}</div>`;
 return `<article class="panel hcard" data-key="h${h.id}"><header class="hhead"><div class="grow"><h3>${esc(h.title)}</h3><span class="caption">${r.kind==='count'?`${fmtN(r.target)} ${esc(r.unit)}`:r.kind==='metric'?'Замер':'Галочкой'} · ${!r.days.length?'на паузе — серия ждёт':r.days.length===7?'каждый день':r.days.map(i=>D.WD[i]).join(', ')}</span></div>
 ${!r.days.length?B('Продолжить','habit-resume',h.id,'small'):''}${B(I('edit',17),'habit-edit',h.id,'icon small ghost','aria-label="Изменить"')}</header>
 ${anyDue?hist:`<p class="meta hfirst">${nextDue?`Первый раз — ${D.fmtDay(nextDue,{lower:true})}`:'Пока не требуется'}</p>`}
 ${count&&hs.due?`<p class="caption">В среднем ${fmtN(hs.avg)} из ${fmtN(r.target)} ${esc(r.unit)} в день</p>`:''}
 ${anyDue&&!values?'<p class="mlegend caption"><i class="done"></i>сделано<i class="miss"></i>нет<i class="open"></i>без ответа</p>':''}
 <footer class="hfoot">${st?`<span class="streakbig">${I('flame',16)}<b class="num">${st}</b> ${plural(st,'день','дня','дней')} подряд</span>`:(anyDue?`<span class="meta">${h.rules[0].from===t?'Начало — сегодня':'Серия — с первой отметки'}</span>`:'<span></span>')}<span class="meta num">${pct===null?'':pct+'% '+(days.length>28?'за 5 недель':'с начала')}</span></footer></article>`}

// Регулярность тренировок (§3.8): сделано по неделям, 8 недель полосой; эта неделя — «сделано из запланированного».
function regularity(){const s=view(),t=D.today(),ws=[];
 // Полоса — с недели начала дневника: нули до начала читаются как провал, а их не было.
 const first=[s.profile.started,...s.workouts.filter(w=>w.status==='done').map(w=>w.date)].filter(Boolean).sort()[0]||t;
 const span=Math.min(7,Math.max(0,Math.round(D.daysBetween(D.weekStart(first),D.weekStart(t))/7)));
 for(let i=span;i>=0;i--){const a=D.addDays(D.weekStart(t),-7*i),b=D.addDays(a,6);
  ws.push({a,n:s.workouts.filter(w=>w.status==='done'&&w.date>=a&&w.date<=b).length})}
 const max=Math.max(3,...ws.map(w=>w.n)),st=D.weekStats(s);
 return `<section class="panel regular"><div class="phead"><h2>Тренировки</h2><span class="ptag">на этой неделе ${st.done} из ${st.total||st.done}</span></div>
 <div class="wbars" style="grid-template-columns:repeat(${ws.length},minmax(0,1fr))" aria-label="Тренировок по неделям">${ws.map((w,i)=>`<div class="wbar${i===ws.length-1?' now':''}" title="Неделя с ${D.fmtShort(w.a)}: ${w.n}"><i style="height:${Math.max(6,Math.round(w.n/max*100))}%"></i><span class="caption num">${w.n}</span></div>`).join('')}</div>
 <div class="chartx caption"><span>${ws.length<3?'Ваши первые недели':ws.length===8?'8 недель назад':'Начало дневника'}</span><span>Эта неделя</span></div></section>`}

/* ——— «Тренер» (UX §3.7) ———
   Главное здесь — «К встрече»: всё с прошлой встречи собрано само
   (тренировки, рекорды, привычки, вес, заметки после тренировок) плюс вопросы,
   которые хочется задать. После встречи — одна кнопка «Встреча прошла»:
   записать, что решили, и дату следующей. Ниже — планы тренера и заметки. */

function coachScene(){const s=view(),c=s.coach;
 const has=c.name||c.phone||c.telegram;
 const card=has?`<section class="panel coachcard"><div class="avatar">${esc(initials(c.name))}</div><div class="grow"><h2>${esc(c.name||'Без имени')}</h2>
  <span class="meta">${c.nextMeeting?`Встреча: ${D.fmtDay(c.nextMeeting)}`:'Встреча не назначена'}</span></div>
  <div class="btnrow">${c.phone?`<a class="btn icon" href="tel:${esc(c.phone)}" aria-label="Позвонить">${I('phone',20)}</a>`:''}${c.telegram?`<a class="btn icon" href="https://t.me/${esc(c.telegram)}" target="_blank" rel="noopener" aria-label="Написать в Telegram">${I('send',20)}</a>`:''}${B(I('edit',18),'coach-edit','','icon ghost','aria-label="Изменить"')}</div>${c.nextMeeting?'':`<div class="meetset">${B(I('cal',16)+'Назначить встречу','coach-edit','','small')}</div>`}</section>`
  :`<section class="panel">${empty('coach','Тренер не указан','Добавьте контакт — позвонить и написать можно будет в одно касание.',B(I('plus',18)+'Тренер','coach-edit','','primary small'))}</section>`;
 return `<section class="scene">${sceneHead(c.nextMeeting?`Встреча ${D.fmtDay(c.nextMeeting,{lower:true})}`:'Ваш тренер','Тренер','','')}${example?exampleBanner():''}
 <div class="cols"><div class="stack">${card}${meetingPanel()}</div><div class="stack">${plansPanel()}${notesPanel()}</div></div></section>`}

function meetingPanel(){const s=view(),m=D.sinceMeeting(s),c=s.coach;
 const hab=m.habits.map(h=>`<div class="mrow"><span class="grow">${esc(h.title)}</span><b class="num">${h.hit} из ${h.due}</b></div>`).join('');
 const qs=s.questions.filter(q=>!q.askedAt);
 return `<section class="panel meet"><div class="phead"><h2>К встрече</h2><span class="ptag">${m.fromStart?'с начала дневника':s.notes.some(n=>n.source==='meeting')?`после встречи ${D.fmtShort(m.from)}`:`с ${D.fmtShort(D.addDays(m.from,1))}`}</span></div>
 ${m.done||m.skipped||m.weight!==null?`<div class="tiles three"><div class="tile"><span class="caption">Тренировки</span><b class="num">${m.done}</b>${m.skipped?`<span class="caption">пропущено ${m.skipped}</span>`:''}</div>
 <div class="tile"><span class="caption">Рекорды</span><b class="num">${m.records.length||'—'}</b></div>
 <div class="tile"><span class="caption">Вес</span><b class="num">${m.weight===null?'—':(m.weight>0?'+':'')+fmtN(m.weight)}<span>${m.weight===null?'':' кг'}</span></b></div></div>`
 :`<p class="meta">Здесь само соберётся всё к встрече: тренировки, рекорды, привычки, вес и заметки после тренировок.</p>`}
 ${m.records.length?`<div class="blocktitle">Рекорды</div><div class="rows compact">${m.records.map(r=>`<div class="mrow">${I('trophy',15)}<span class="grow">${esc(r.name)} <span class="caption">· ${D.fmtShort(r.date)}</span></span><b class="num">${numText(r.weight)} × ${r.reps}</b></div>`).join('')}</div>`:''}
 ${hab?`<div class="blocktitle">Привычки</div><div class="rows compact">${hab}</div>`:''}
