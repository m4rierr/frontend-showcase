 <div class="blocktitle">Спросить</div>

 ${s.plans.length?`<div class="rows">${s.plans.map(p=>`<button type="button" class="row planrow" data-action="plan-edit" data-id="${p.id}" data-key="${p.id}"><span class="rbody"><span class="rt">${esc(p.title)}</span><span class="rm">${p.days.length?p.days.map(i=>D.WD[i]).join(', ')+' · '+(p.time||'19:00'):'Без дней'} · ${p.exercises.length} упр.</span></span>${I('chev',18)}</button>`).join('')}</div>
 <p class="caption footnote">План сам ставит тренировки на неделю вперёд — в «Сегодня» и «Тренировках».</p>`

/* ——— Формы ———
   Все шторки: добавление, привычка, дело, тренировка, упражнение, количество,
   замер, закрытие дня, план, тренер, встреча, настройки.
   Правило форм (VISUAL §5.2): подпись над полем, одно главное действие справа
   внизу, «Отмена» рядом; удаление — слева, с отменой в тосте. */

// ——— корзина: удалённое живёт неделю ———
/* Тексты ошибок ввода — из домена (D.validate): форма проверяет только то, чего нет в данных,
   например разбор числа или «хотя бы один день» у новой привычки (ARCH-AUDIT К4). */

// ——— «Добавить» ———
function addMenu(){const items=[['journal','Тренировка','Сегодня или на другой день','w-new'],['tasks','Привычка','Повторяется по дням','habit-new'],['check','Дело','Один раз, можно ко времени','todo-new'],['scale','Замер','Вес, талия, бёдра, грудь','metric-open'],['question','Вопрос тренеру','Попадёт в «К встрече»','question-new']];
 openSheet({title:'Добавить',body:`<div class="addgrid">${items.map(([ic,t,d,a])=>`<button type="button" class="addopt card" data-action="${a}" data-id="${a==='metric-open'?'weight':''}"><span class="lead ico">${I(ic,20)}</span><span class="rbody"><span class="rt">${t}</span><span class="rm">${d}</span></span></button>`).join('')}</div>`})}

// Честно о напоминаниях (§4.8): тихая строка там, где выбирают время, а не тост поверх экрана.
function remindHint(){const ask='Notification' in window&&Notification.permission==='default';
 return `<p class="hint">Напомним, пока дневник открыт.${ask?` ${B('Разрешить уведомления','notify-ask','','small ghost')}`:''}</p>`}
// Время по умолчанию — ближайшая четверть часа впереди, а не в прошлом.
function nextQuarter(date=D.today()){if(date!==D.today())return '09:00';const [h,m]=D.hm().split(':').map(Number),x=Math.min(23*60+45,Math.ceil((h*60+m+1)/15)*15);return D.addMinutes('00:00',x)}

// ——— привычка ———
const PASS={'1':'Полностью','0.8':'80%','0.5':'Половина'};
function habitForm(id=null){const h=id?find('habits',id):null,r=h?(D.ruleOn(h,D.today())||h.rules[h.rules.length-1]):{kind:'check',days:[0,1,2,3,4,5,6]};
 const tpl=!h?`<div class="field"><span class="label">Быстро</span><div class="chips">${Object.entries(D.STARTERS).map(([k,v])=>`<button type="button" class="chip" data-action="habit-tpl" data-id="${k}">${esc(v.title)}</button>`).join('')}</div></div>`:'';
 openSheet({title:h?'Привычка':'Новая привычка',body:`<div class="fields">${tpl}
  ${field('Название','title',h?.title||'',{ph:'Например, вода'})}
  ${segField('Как отмечать','kind',D.KINDS,r.kind)}
  <div class="fields three" data-show="kind=count">${field('Цель','target',numText(r.target??8),{extra:'inputmode="decimal"'})}${field('Единица','unit',r.unit||'раз')}${field('Шаг «+»','step',numText(r.step??1),{extra:'inputmode="decimal"'})}</div>
  <details class="more" data-show="kind=count"${r.pass&&r.pass!==1?' open':''}><summary>Ещё</summary>${segField('Засчитывать день','pass',PASS,String(r.pass||1))}</details>
  <div data-show="kind=metric">${segField('Замер','metric',Object.fromEntries(Object.entries(D.METRICS).map(([k,v])=>[k,v[0]])),r.metric||'weight')}</div>
  ${daysField('Дни','days',r.days)}
  ${segField('Когда','when',{any:'В течение дня',at:'Ко времени'},h?.time?'at':'any')}
  <div data-show="when=at">${timeField('Время и напоминание','time',h?.time||'09:00')}${remindHint()}</div>
  ${h?`<p class="hint">${I('flag',14)} Изменения действуют с сегодняшнего дня — прошлые дни остаются как были.</p>`:''}</div>`,
  extra:h?(D.ruleOn(h,D.today())?.days.length?B('Пауза','habit-pause',h.id,'ghost','title="Не требуется, пока не продолжите; серия не сгорит"'):B('Продолжить','habit-resume',h.id,'ghost'))+B('В архив','habit-archive',h.id,'ghost','title="История сохранится, из ленты уйдёт"'):'',
  save:f=>{const title=f.title;
   const days=f.days?f.days.split(',').map(Number):[];if(!days.length){toast('Выберите хотя бы один день');return false}
   let rule={kind:f.kind,days};
   if(f.kind==='count'){const target=toNum(f.target),step=toNum(f.step);if(Number.isNaN(target)||Number.isNaN(step)){toast('Цель и шаг — числа больше нуля');return false}rule={...rule,target,step,unit:f.unit||'раз',pass:Number(f.pass)||1}}
   if(f.kind==='metric')rule={...rule,metric:f.metric};
   const time=f.when==='at'?f.time:null;
   return commit(s=>{if(h){const x=s.habits.find(y=>y.id===h.id);x.title=title;x.time=time;x.remind=!!time;D.setRule(x,rule)}
    else{const nh={id:D.uid('h'),title,time,remind:!!time,archived:false,rules:[{from:D.today(),...rule}],log:{},miss:[]};s.habits.push(nh);if(time)markFired(nh.id+'@'+time,time)}})}});
 syncShow()}

// ——— дело ———
function todoForm(id=null,date=null){const t=id?find('todos',id):null,d=t?t.date:(date||D.today());
 openSheet({title:t?'Дело':'Новое дело',body:`<div class="fields">${field('Что сделать','title',t?.title||'',{ph:'Например, купить кроссовки'})}
  ${dateField('День','date',d,{allowEmpty:true})}
  <div class="todotime">${segField('Напомнить','when',{no:'Нет',at:'Ко времени'},t?.time?'at':'no')}
  <div data-show="when=at">${timeField('Время','time',t?.time||nextQuarter(d||D.today()))}${remindHint()}</div><p class="hint" data-nodate>Напоминание — только у дела с датой.</p></div></div>`,
  extra:t?B(I('trash',16)+'Удалить','todo-del',t.id,'ghost danger'):'',
  save:f=>{const date=f.date||null,time=date&&f.when==='at'?f.time:null;
   return commit(s=>{if(t){const x=s.todos.find(y=>y.id===t.id);Object.assign(x,{title:f.title,date,time})}else{const nt={id:D.uid('t'),title:f.title,date,time,doneAt:null};s.todos.push(nt);if(date===D.today()&&time)markFired(nt.id+'@'+time,time)}},{toast:t?null:(date===ui.day&&ui.route==='today'?null:'Дело добавлено')})}});
 syncTodo()}
// Без даты время недоступно (закон данных: напоминание только у дела с датой).
function syncTodo(){const box=$('#sheet .todotime');if(!box)return;const has=!!$('#sheet [name=date]').value;
 box.querySelector('.seg').classList.toggle('is-off',!has);box.querySelectorAll('.seg button').forEach(b=>b.disabled=!has);
 if(!has){$('#sheet [name=when]').value='no';box.querySelectorAll('.seg button').forEach(b=>{b.classList.toggle('is-on',b.dataset.id==='no');b.setAttribute('aria-checked',b.dataset.id==='no')})}
 box.querySelector('[data-nodate]').hidden=has;syncShow()}

// ——— тренировка ———
function workoutForm(id=null){const s=view(),w=id?find('workouts',id):null;
 const plans={'':'Пустая',...Object.fromEntries(s.plans.map(p=>[p.id,p.title]))};
 openSheet({title:w?'Тренировка':'Новая тренировка',body:`<div class="fields">
  ${!w&&s.plans.length?segField('По плану','plan',plans,'','wrap'):''}
  ${field('Название','title',w?.title||'',{ph:'Например, ноги'})}
  <div class="fields two">${dateField('День','date',w?.date||(ui.route==='today'?ui.day:D.today()))}${timeField('Время','time',w?.time||nextQuarter(ui.route==='today'?ui.day:D.today()))}</div>
  ${segField('С тренером','coach',{no:'Сам',yes:'С тренером'},w?.coach?'yes':'no')}
  ${w?area('Заметка','note',w.note,''):''}</div>`,
  save:f=>{let title=f.title;const p=f.plan?s.plans.find(x=>x.id===f.plan):null;if(!title&&p)title=p.title;
   let nid=null;const ok=commit(st=>{if(w){Object.assign(st.workouts.find(x=>x.id===w.id),{title,date:f.date,time:f.time,coach:f.coach==='yes',note:f.note||''});return}
    const x=p?D.materialize(st,p,f.date,f.time):{id:D.uid('w'),date:f.date,time:f.time,title,planId:null,coach:false,status:'planned',startedAt:null,finishedAt:null,auto:false,feel:0,note:'',exercises:[]};
    x.title=title;x.coach=f.coach==='yes';st.workouts.push(x);nid=x.id;if(x.date===D.today())markFired(x.id+'@'+x.time,x.time)},{quiet:!w});
   if(ok&&nid){sheetAfter=()=>go('train',nid)}return ok}});
 const seg=$('#sheet [name=plan]');if(seg)seg.dataset.fill='title'}

// ——— упражнение ———
function exerciseForm(wid){const s=view(),names=D.exerciseList(s).map(x=>x.name).slice(0,8);
 openSheet({title:'Упражнение',body:`<div class="fields">${field('Название','name','',{ph:'Например, присед'})}
  ${names.length?`<div class="chips">${names.map(n=>`<button type="button" class="chip" data-action="fill" data-id="name" data-v="${esc(n)}">${esc(n)}</button>`).join('')}</div>`:''}
  ${segField('Что записываем','mode',D.MODES,'weight')}
  <div class="fields two">${stepField('Подходы','sets',3,1,{min:1})}${segField('Отдых, мин','rest',{'60':'1','90':'1,5','120':'2','180':'3'},'90')}</div>
  <p class="hint">Вес и повторы подставятся с прошлого раза.</p></div>`,
  save:f=>{const ex={name:f.name,mode:f.mode,rest:Number(f.rest)||90,sets:Math.max(1,Math.min(20,Math.round(toNum(f.sets)||1)))};
   const r=wop(st=>D.ops.addExercise(st,wid,ex));if(!r)return false;if(ui.route==='gym')ui.gx=r.index;
   /* План учится у тренировки (З-11): отдельным действием, чтобы «Отменить» убрало упражнение только из плана. */
   const p=r.planId&&!rehearsal?state.plans.find(x=>x.id===r.planId):null;
   if(p&&!p.exercises.some(x=>D.sameName(x.name,ex.name)))commit(st=>D.ops.learnPlan(st,p.id,ex),{toast:`Добавлено и в план «${p.title}»`});
   return true}})}

// ——— количество за день ———
function countSheet(hid,date){const s=view(),h=find('habits',hid);if(!h)return;const r=D.ruleOn(h,date),v=D.logOf(s,h,date);
 openSheet({title:esc(h.title),body:`<div class="fields"><p class="meta">${D.fmtDay(date)} · цель ${fmtN(r.target)} ${esc(r.unit)}</p>
  ${stepField(r.unit,'value',v,r.step,{big:true})}
  <div class="chips">${[r.step,r.step*2].filter((x,i,a)=>a.indexOf(x)===i).map(x=>`<button type="button" class="chip" data-action="fill" data-id="value" data-v="${numText(x)}" data-add="1">+${fmtN(x)}</button>`).join('')}<button type="button" class="chip" data-action="fill" data-id="value" data-v="${numText(r.target)}">До цели · ${fmtN(r.target)}</button></div></div>`,
  extra:!D.habitDone(s,h,date)?B('Не сделал','habit-miss',h.id,'ghost',`data-date="${date}"`):'',
  save:f=>{const n=toNum(f.value);if(isNaN(n)){toast('Нужно число');return false}
   learnFlag('day.exact');return commit(st=>D.ops.setCount(st,hid,date,n))}})}

// ——— замер ———
function metricSheet(kind='weight',date=D.today()){const s=view(),l=D.metricSeries(s,kind),last=l[l.length-1],cur=s.metrics.find(m=>m.kind===kind&&m.date===date);
 openSheet({title:'Замер',body:`<div class="fields">${segField('Что','kind',Object.fromEntries(Object.entries(D.METRICS).map(([k,v])=>[k,v[0]])),kind)}
  ${stepField(D.METRICS[kind][1],'value',cur?cur.value:last?last.value:'',D.METRICS[kind][2],{big:true})}
  ${dateField('День','date',date)}${last?`<p class="hint">Прошлый: ${fmtN(last.value)} ${D.METRICS[kind][1]}, ${D.fmtDay(last.date)}</p>`:''}</div>`,
  save:f=>{const v=toNum(f.value);if(!(v>0)){toast('Введите значение');return false}
   const ok=commit(st=>{const x=st.metrics.find(m=>m.kind===f.kind&&m.date===f.date);if(x)x.value=v;else st.metrics.push({id:D.uid('m'),date:f.date,kind:f.kind,value:v})});
   // Результат замера на «Сегодня» не виден — подтверждаем тостом с разницей (VISUAL §5.4).
   if(ok&&!(ui.route==='progress'&&ui.prog==='body')){const [,u]=D.METRICS[f.kind],dw=D.metricDelta(state,f.kind,7);toast(`${fmtN(v)} ${u}${dw!==null?` · ${dw>0?'+':''}${fmtN(dw)} за неделю`:' · первый замер'}`)}
   return ok}});
 const k=$('#sheet [name=kind]');if(k)k.dataset.reopen='metric'}

// Кнопка говорит, что будет с неотвеченным: без готовых «Нет» за человека (аудит, п. 43).
const closeLabel=n=>n?`Закрыть · ${n} без ответа`:'Закрыть день';
function syncClose(){const b=$('#sheet .closelist')?.closest('form')?.querySelector('button[type=submit]');if(!b)return;b.textContent=closeLabel($$('#sheet .closerow input[type=hidden]').filter(i=>!i.value).length)}
// ——— закрыть день (§3.6): по каждой открытой строке — ответ ———
/* Будущее не спрашивают: сегодня в списке только то, чьё время уже пришло. Если что-то ещё впереди,
   день не закрывается — это спросит вечерняя карточка позже или утро. */
function closeDayForm(date){const s=view(),now=date===D.today()?D.hm():null,{open:left,later}=D.dayState(s,date,now);
 const laterNote=later.length?`<p class="hint">${I('clock',14)} Ещё впереди: ${later.map(x=>`${esc(x.item.title)}${x.item.time?` · ${x.item.time}`:''}`).join(', ')} — спросим позже.</p>`:'';
 if(!left.length){if(later.length){toast('Всё, что уже было, отмечено · впереди '+later.length);return}commit(st=>D.ops.answerDay(st,date,{},now),{toast:'День закрыт'});return}
 openSheet({title:date===D.today()?'Закрыть день':`Закрыть: ${D.fmtDay(date)}`,body:`<p class="meta">Что осталось без отметки. Ответьте, что помните, — без ответа останется «не сделано».</p>
  ${laterNote}<div class="rows closelist">${left.map(({kind,item})=>{const r=kind==='habit'?D.ruleOn(item,date):null,nm=`${kind}|${item.id}`;
   if(r&&r.kind==='count')return `<div class="closerow"><div class="grow"><span class="rt">${esc(item.title)}</span><span class="rm">цель ${fmtN(r.target)} ${esc(r.unit)}</span></div><input name="${nm}" inputmode="decimal" value="${numText(D.logOf(s,item,date)||'')}" placeholder="0" aria-label="${esc(item.title)}"></div>`;
   const opts=kind==='todo'?{done:'Сделал',move:'Завтра',no:'Нет'}:{done:'Сделал',no:'Нет'};
   return `<div class="closerow"><div class="grow"><span class="rt">${esc(item.title)}</span>${r&&r.kind==='metric'?'<span class="rm">замер</span>':''}</div><input type="hidden" name="${nm}" value=""><div class="seg mini">${Object.entries(opts).map(([k,v])=>`<button type="button" class="" data-action="seg" data-id="${k}">${v}</button>`).join('')}</div></div>`}).join('')}</div>`,
  saveLabel:closeLabel(left.filter(x=>!(x.kind==='habit'&&D.ruleOn(x.item,date).kind==='count')).length),
  save:f=>{if(date<D.today())learnFlag('morn.yesterday');learnFlag('eve.close'); // день может остаться открытым (впереди ещё что-то) — урок всё равно пройден
   // Числа в ответах — как их вводят («2,5»); остальное домен разбирает сам (D.ops.answerDay).
   const answers=Object.fromEntries(Object.entries(f).filter(([k])=>k.includes('|')).map(([k,v])=>[k,/^\d/.test(v)?toNum(v):v]));
   return commit(st=>D.ops.answerDay(st,date,answers,now),{toast:later.length?'Отмечено · остальное спросим позже':'День закрыт'})}})}

// ——— план тренера ———
function planRow(x={}){return `<div class="prow" data-key="${D.uid('r')}"><input data-p="name" value="${esc(x.name||'')}" placeholder="Упражнение" aria-label="Упражнение">
 <input data-p="sets" inputmode="numeric" value="${x.sets??3}" aria-label="Подходы"><span class="x">×</span><input data-p="reps" inputmode="numeric" value="${x.reps??''}" placeholder="—" aria-label="Повторы">
 ${B(I('close',16),'prow-del','','icon small ghost','aria-label="Убрать"')}</div>`}
function planForm(id=null){const p=id?find('plans',id):null;
 openSheet({title:p?'План':'Новый план',wide:true,body:`<div class="fields">${field('Название','title',p?.title||'',{ph:'Например, ноги и корпус'})}
  ${daysField('Дни','days',p?.days||[])}
  <div class="fields two">${timeField('Время','time',p?.time||'19:00')}<span></span></div>
  <div class="field"><span class="label">Упражнения · подходы × повторы</span><div class="prows">${(p?.exercises.length?p.exercises:[{}]).map(planRow).join('')}</div>${B(I('plus',16)+'Упражнение','prow-add','','ghost small')}</div></div>`,
  extra:p?B(I('trash',16)+'Удалить','plan-del',p.id,'ghost danger'):'',
  save:f=>{
   const ex=$$('#sheet .prow').map(r=>({name:$('[data-p=name]',r).value.trim(),sets:Math.max(1,Math.round(toNum($('[data-p=sets]',r).value)||3)),reps:toNum($('[data-p=reps]',r).value)||null})).filter(x=>x.name);
   const days=f.days?f.days.split(',').map(Number):[];
   return commit(st=>{const old=p?st.plans.find(x=>x.id===p.id):null;
    const exercises=ex.map(x=>{const o=old?.exercises.find(y=>D.sameName(y.name,x.name));return {id:o?.id||D.uid('x'),...x,mode:o?.mode||'weight',rest:o?.rest||90}});
    // План действует с того дня, как его задали или сменили расписание: прошлое он не дописывает (§4.1).

/* ——— «Спутник»: знакомство делом (LEARN-MECHANISM.md) ———
   Три элемента: карточка на «Сегодня» (один следующий шаг), метка у цели
   (пузырь + кольцо рядом с тем самым элементом) и «Путь» — все шаги по главам.
   Шаг засчитывается делом: условием на данных (domain.js, D.LEARN) или флагом
   действия (learnFlag). Метка живёт вне #app — morph её не трогает — и следует
   за целью при прокрутке, клавиатуре и перерисовке. Модальных окон, слайдов и

// ——— состояние знакомства ———
if(!prefs.tour)prefs.tour={off:false,snooze:null,finished:false};
const tourOn=()=>!prefs.tour.off;
const learnSet=()=>D.learned(state);
const learnSkipped=()=>{const L=state.profile.learn||{};return new Set(Object.keys(L).filter(k=>L[k]==='skip'))};
// Флаг-событие: шаг без следа в данных. Пишется только profile.learn — даже из репетиции (учим действию, а не данным).
function learnWrite(id,v){if(example&&!rehearsal)return;if(!LS[id])return;const L=state.profile.learn||{};if(D.isDate(L[id])||L[id]===v)return;
 store({...state,profile:{...state.profile,learn:{...L,[id]:v}}})}
function learnFlag(id){learnWrite(id,D.today());learnSoon()}
function learnHandled(){const L=learnSet(),S=learnSkipped();return {L,S,has:id=>L.has(id)||S.has(id)}}
function learnProgressText(){const n=learnSet().size,t=D.LEARN.length;return n>=t?'Пройдено целиком':`${n} из ${t} освоено`}
function learnNext(){const {L,has}=learnHandled();let later=null;
 for(const x of D.LEARN){if(has(x.id))continue;if(D.learnAvail(state,x,L))return {x,later:null};if(!later)later=x}
 return {x:null,later}}
// Зал: есть сегодняшняя настоящая тренировка — ведём к ней, нет — репетиция.
function todayWorkout(){const t=D.today();return state.workouts.find(w=>w.status==='active')||D.schedule(state,t,1).find(w=>w.status==='planned')}
const showLabel=id=>(D.LEARN.find(x=>x.id===id).ch==='gym'&&!todayWorkout())||id==='calm.undo'?'Прорепетировать':'Показать';

// ——— карточка на «Сегодня» ———
function learnCard(){
 if(!tourOn()||example||prefs.tour.snooze===D.today())return '';
 // Вопросы о зависшем важнее: «Спутник» — под ними и только если их не больше одного.
 // Считаем карточки, а не вопросы: дни плана — одна карточка.
 const qs=ui.questions.filter(q=>!ui.dismissed.has(q.kind+q.date+(q.id||'')));if(qs.filter(q=>q.kind!=='plan').length+(qs.some(q=>q.kind==='plan')?1:0)>1)return '';
 const n=learnSet().size,total=D.LEARN.length,{x,later}=learnNext(),pct=Math.round(n/total*100);
 const head=`<div class="lhead"><span class="kicker">Знакомство · ${n} из ${total}</span><i class="lbar" aria-hidden="true"><b style="width:${pct}%"></b></i></div>`;
 if(!x&&!later){if(prefs.tour.finished)return '';
  return `<div class="learncard card" data-key="learn-done">${head}<p><b>Знакомство пройдено</b></p><ul class="ltips meta"><li>«Отменить» откатывает только своё действие, даже если после были другие правки.</li><li>Не нажали «Завершить» — тренировка закроется сама.</li><li>Вчерашний день можно доотметить из полосы недели.</li></ul><div class="btnrow">${B('Понятно','learn-done','','small primary')}</div></div>`}
 if(!x)return `<div class="learncard card" data-key="learn-later">${head}<p><b>Дальше — ${esc(LS[later.id].later||'позже')}</b> <span class="meta">«${esc(LS[later.id].t)}»</span></p><div class="btnrow">${B('Весь путь','learn-path','','small ghost')}${B('Позже','learn-later','','small ghost')}</div></div>`;
 const st=LS[x.id];
 return `<div class="learncard card" data-key="learn-${x.id}">${head}<p><b>${esc(st.t)}</b> <span class="meta">${esc(st.x.split(/(?<=[.!?])\s/)[0])}</span></p>
 <div class="btnrow">${B('Весь путь','learn-path','','small ghost')}${B('Позже','learn-later','','small ghost')}${B(showLabel(x.id),'learn-show',x.id,'small primary')}</div></div>`}

// ——— «Путь»: все шаги по главам ———
function learnPath(){const {L,S}=learnHandled(),n=L.size;
 const body=Object.entries(D.CHAPTERS).map(([ch,name])=>{const steps=D.LEARN.filter(x=>x.ch===ch),done=steps.filter(x=>L.has(x.id)).length;
  return `<section class="lch"><div class="lchead"><h3>${name}</h3><span class="caption num">${done} из ${steps.length}</span>${ch==='gym'?B('Прорепетировать','learn-rehearse','gym','small ghost'):''}</div>
  <div class="rows">${steps.map(x=>{const st=LS[x.id],ok=L.has(x.id),av=D.learnAvail(state,x,L);
   return `<div class="lstep${ok?' is-done':''}" data-key="ls${x.id}"><span class="lmark">${ok?I('check',14):''}</span><div class="grow"><span class="rt">${esc(st.t)}</span><span class="rm">${ok?'Освоено':S.has(x.id)?'Пропущено':av?esc(st.x.split(/(?<=[.!?])\s/)[0]):'Будет '+esc(st.later||'позже')}</span></div>${!ok&&(av||st.rh)?B(showLabel(x.id),'learn-show',x.id,'small'):''}</div>`}).join('')}</div></section>`}).join('');
 openSheet({title:`Знакомство · ${n} из ${D.LEARN.length}`,body:`<p class="meta">Каждое действие — один раз и руками, в свой момент. Сделанное самим засчитывается само.</p>${body}`,
  extra:B(tourOn()?'Выключить знакомство':'Включить знакомство','learn-toggle','','ghost'),cancel:false})}

// ——— показать шаг ———
function learnShow(id){const st=LS[id];if(!st)return;closeSheet();ui.learn.done=null;
 if(example&&!(rehearsal&&st.rh))exitRehearsal(true);
 ui.learn.active=id;ui.learn.scrolled=false;ui.learn.hush=null;
 const ch=D.LEARN.find(x=>x.id===id).ch;
 if(ch==='gym'&&!rehearsal){const w=todayWorkout();if(!w){rehearse('gym');return}if(w.status==='active')go('gym',w.id);else go('today')}
 else if(id==='calm.undo'&&!rehearsal)rehearse('calm');
 else if(id==='calm.fix'){const w=state.workouts.filter(x=>x.status==='done').sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).pop();go('train',w?.id)}
 else if(st.go){const [r,tab]=st.go.split(':');if(tab)ui.prog=tab;if(r==='today'&&id!=='day.week')ui.day=D.today();go(r)}
 setTimeout(learnPlace,300)}

// ——— репетиция ———
function rehearse(kind){closeSheet();undos.clear();$('#toast').hidden=true;example=D.example();rehearsal=true;ui.rest=null;ui.learn.done=null;ui.learn.hush=null;
 if(kind==='gym'){const p=example.plans[0],w=D.materialize(example,p,D.today());w.title=`${p.title} · репетиция`;
  // Короткая: одно упражнение, два подхода с отдыхом 20 с — урок за минуту, а не за полчаса.
  w.exercises=w.exercises.slice(0,1);w.exercises[0].sets=w.exercises[0].sets.slice(0,2);w.exercises[0].rest=20;example.workouts=example.workouts.filter(x=>!(x.planId===p.id&&x.date===w.date));example.workouts.push(w);
  ui.learn.active=D.LEARN.find(x=>x.ch==='gym'&&!learnHandled().has(x.id))?.id||'gym.step';startWorkout(w.id)}
 else{const w=example.workouts.filter(x=>x.status==='done').pop();ui.learn.active='calm.undo';go('train',w.id)}}
function exitRehearsal(silent){if(!example)return;example=null;rehearsal=false;$('#toast').hidden=true;undos.clear();ui.rest=null;try{clearInterval(restTimer)}catch(e){}wake(false);if(!silent){ui.learn.active=null;go('today')}}

// ——— метка у цели ———
let markEl=null,ringEl=null,learnRAF=0;
function visibleEl(el){if(!el||!el.isConnected||el.closest('[hidden]'))return false;const r=el.getBoundingClientRect();if(r.width<2||r.height<2)return false;
 const dlg=$('#sheet');if(dlg.open&&!el.closest('#sheet'))return false; // под открытой шторкой всё неактивно
 return getComputedStyle(el).visibility!=='hidden'&&getComputedStyle(el).opacity!=='0'}
function markTarget(){const id=ui.learn.active;if(!id)return null;const sels=LS[id].sel;
 for(let i=0;i<sels.length;i++){const q=typeof sels[i]==='function'?sels[i]():sels[i];for(const el of $$(q))if(visibleEl(el))return {el,i}}return null}
function markTargetEl(){return markTarget()?.el||null}
function guidePad(body,h){for(const b of $$('.sheetbody.has-guide'))if(b!==body){b.classList.remove('has-guide')}if(body){body.classList.add('has-guide');body.style.setProperty('--guidepad',h+'px')}}
function hideMark(){guidePad(null);markEl?.remove();ringEl?.remove();markEl=ringEl=null}
function ensureMark(parent){
 if(!markEl||!markEl.isConnected){markEl=document.createElement('div');markEl.className='guide';markEl.setAttribute('role','status');markEl.setAttribute('aria-live','polite')}
 if(!ringEl||!ringEl.isConnected){ringEl=document.createElement('div');ringEl.className='guidering';ringEl.setAttribute('aria-hidden','true')}
 if(markEl.parentElement!==parent)parent.appendChild(markEl);if(ringEl.parentElement!==parent)parent.appendChild(ringEl)}
function markHtml(){const d=ui.learn.done;
 if(d){const nx=d.next?LS[d.next]:null;return {key:'done'+d.id,html:`<p class="mt">${I('check',16)} Готово</p>${nx?`<p class="mx">Дальше: ${esc(nx.t)}</p>`:''}<div class="btnrow">${nx&&d.auto?'':nx?B(showLabel(d.next),'learn-show',d.next,'small primary'):''}</div>`}}
 const id=ui.learn.active,st=LS[id],tg=markTarget(),seenNow=st.seen&&tg&&tg.i===0;
 return {key:id+(seenNow?':seen':''),html:`<p class="mt">${esc(st.t)}</p><p class="mx">${esc(st.x)}</p><div class="btnrow">${B('Пропустить шаг','learn-skip',id,'small ghost')}${B('Понятно','learn-ok',id,seenNow?'small primary':'small ghost')}</div>`}}
/* Размещение: под целью, если помещается, иначе над ней — пузырь никогда не ложится на цель.
   Начало отсчёта меряем: внутри шторки fixed может считаться от неё (как у выпадающих). */
// Активный шаг засчитан — «Готово» у цели и следующий. Вызывается при любом событии, не только при перерисовке.
/* В репетиции следующий репетируемый шаг включается сам (как в зале): человек не остаётся
   в примере без подсказки. Не репетируемый — «Готово» с кнопкой, она же выводит из репетиции. */
function learnCheck(){const id=ui.learn.active;if(!id)return;const L=learnSet();if(!L.has(id))return;
 const inGym=ui.route==='gym',{has}=learnHandled();
 const next=D.LEARN.find(x=>!has(x.id)&&(inGym?x.ch==='gym':D.learnAvail(state,x,L)||rehearsal&&LS[x.id].rh))?.id||null;
 const chain=!inGym&&rehearsal&&!!next&&!!LS[next].rh;
 ui.learn.done={id,next,auto:(inGym||chain)&&!!next};ui.learn.active=null;
 clearTimeout(ui.learn.t);ui.learn.t=setTimeout(()=>{ui.learn.done=null;if(chain&&!ui.learn.active&&rehearsal){ui.learn.active=next;ui.learn.scrolled=false}learnPlace()},inGym||chain?1100:2600)}
function learnPlace(){
 if(example&&!rehearsal||!ui.learn){hideMark();return}
 learnCheck();gymAuto();
 const d=ui.learn.done,tg=d?null:markTarget();
 let target=tg?.el||(d&&ui.learn.last&&ui.learn.last.isConnected&&visibleEl(ui.learn.last)?ui.learn.last:null);
 if(!ui.learn.active&&!d){hideMark();return}
 // Цель ушла вместе с действием (тост «Отменить», закрытая шторка) — «Готово» всё равно видно: внизу по центру, без стрелки.
 if(!target){if(d&&!$('#sheet').open)return floatDone();hideMark();return}
 // Новая стадия — новая цель: её тоже довести до глаз, если она за краем экрана.
 if(tg){if(ui.learn.last!==tg.el)ui.learn.scrolled=false;ui.learn.last=tg.el;if(!ui.learn.scrolled){ui.learn.scrolled=true;const r=tg.el.getBoundingClientRect();if(r.top<80||r.bottom>innerHeight-140){tg.el.scrollIntoView({block:'center'});requestAnimationFrame(learnPlace);return}}}
 ensureMark(target.closest('dialog')||document.body);
 const {key,html}=markHtml();if(markEl.dataset.k!==key){markEl.innerHTML=html;markEl.dataset.k=key}
 markEl.classList.toggle('gym',ui.route==='gym');markEl.classList.toggle('is-done',!!d);ringEl.classList.toggle('gym',ui.route==='gym');
 const r=target.getBoundingClientRect();
 for(const el of [markEl,ringEl]){el.style.left='0px';el.style.top='0px'}
 const o=markEl.getBoundingClientRect(),ox=o.left,oy=o.top,mw=o.width,mh=o.height,gap=12,edge=12;
 ringEl.style.left=(r.left-4-ox)+'px';ringEl.style.top=(r.top-4-oy)+'px';ringEl.style.width=(r.width+8)+'px';ringEl.style.height=(r.height+8)+'px';
 // Низ телефона занят вкладками и «+», низ зала — «Подход сделан»: пузырь туда не ложится (закон 3 — не закрывать главное действие).
 const inSheet=!!target.closest('dialog'),floor=inSheet?0:ui.route==='gym'?Math.max(0,innerHeight-($('.gymfoot')?.getBoundingClientRect().top??innerHeight)):innerWidth<1024?150:0;
 const below=r.bottom+gap,above=r.top-gap-mh,fitsBelow=below+mh<=innerHeight-edge-floor,fitsAbove=above>=edge;
 const down=fitsBelow||(!fitsAbove&&innerHeight-r.bottom>r.top);
 let top=down?below:above;top=Math.min(Math.max(edge,top),innerHeight-mh-edge-(down&&fitsBelow?floor:0));
 let left=r.left+r.width/2-mw/2;left=Math.min(Math.max(edge,left),innerWidth-mw-edge);
 // Цель — кнопка внизу шторки, пузырь над ней: строки не прячутся под ним — у ленты шторки появляется запас, их можно докрутить выше.
 guidePad(!down&&target.closest('.sheetfoot')?target.closest('dialog').querySelector('.sheetbody'):null,mh+gap);
 markEl.style.left=(left-ox)+'px';markEl.style.top=(top-oy)+'px';markEl.dataset.side=down?'down':'up';
 markEl.style.setProperty('--ax',Math.min(Math.max(16,r.left+r.width/2-left),mw-16)+'px')}
function floatDone(){guidePad(null);ensureMark(document.body);ringEl.remove();
 const {key,html}=markHtml();if(markEl.dataset.k!==key){markEl.innerHTML=html;markEl.dataset.k=key}
 markEl.classList.toggle('gym',ui.route==='gym');markEl.classList.add('is-done');markEl.dataset.side='none';
 let floor=ui.route==='gym'?innerHeight-($('.gymfoot')?.getBoundingClientRect().top??innerHeight):innerWidth<1024?150:24;
 const ts=$('#toast');if(ts&&!ts.hidden)floor=Math.max(floor,innerHeight-ts.getBoundingClientRect().top);
 markEl.style.left='0px';markEl.style.top='0px';const o=markEl.getBoundingClientRect();
 markEl.style.left=((innerWidth-o.width)/2-o.left)+'px';markEl.style.top=(innerHeight-floor-o.height-12-o.top)+'px'}
function learnSoon(){if(learnRAF)return;learnRAF=requestAnimationFrame(()=>{learnRAF=0;learnPlace()})}

// Зал ведёт сам (§2.2): первое «Начать» включает главу «В зале» — следующий шаг, у которого цель на экране.
function gymAuto(){if(ui.route!=='gym'||!tourOn()||ui.learn.active||ui.learn.done||ui.learn.hush===ui.id)return;
 const {has}=learnHandled();for(const x of D.LEARN){if(x.ch!=='gym'||has(x.id))continue;ui.learn.active=x.id;if(markTarget()){ui.learn.scrolled=true;return}ui.learn.active=null}}

/* После каждой отрисовки: закрепить засчитанное по данным (дата нужна утру),
   отметить «Готово» у активного шага, разместить метку. */
function learnAfter(){
 if(example&&!rehearsal){hideMark();return}
 const L=learnSet(),P=state.profile.learn||{},add=[...L].filter(id=>!D.isDate(P[id]));
 if(add.length){const n={...P};for(const id of add)n[id]=D.today();store({...state,profile:{...state.profile,learn:n}})}
 learnPlace()}

function learnOk(id){const tg=markTarget();if(LS[id]?.seen&&tg&&tg.i===0)learnFlag(id);ui.learn.active=null;ui.learn.done=null;if(ui.route==='gym')ui.learn.hush=ui.id;hideMark();render()}
function learnSkip(id){learnWrite(id,'skip');ui.learn.active=null;ui.learn.done=null;if(ui.route==='gym')ui.learn.hush=ui.id;hideMark();render()}
addEventListener('scroll',learnSoon,{passive:true,capture:true});addEventListener('resize',learnSoon);
window.visualViewport?.addEventListener('resize',learnSoon);

/* ——— Каркас, адреса, действия, запуск ———
   Все нажатия ловит один слушатель: что делает кнопка — ищите её data-action
   в ACTIONS. Адреса: #/today · #/train · #/w/<id> · #/gym/<id> · #/progress · #/coach. */

const ROUTES={today:['Сегодня','today'],train:['Тренировки','journal'],progress:['Прогресс','progress'],coach:['Тренер','coach']};
const SCENES={today:todayScene,train:trainScene,progress:progressScene,coach:coachScene};

// after — что сделать, когда новый экран уже нарисован (смена адреса закрывает шторку).
let afterNav=null;
function go(route,id=null,after=null){const h='#/'+(route==='train'&&id?'w':route)+(id?'/'+id:'');if(location.hash===h){render();after&&after()}else{afterNav=after;location.hash=h}}
function readHash(){const [,r,...rest]=(location.hash||'').split('/'),id=rest.join('/')||null;
 const route=r==='w'?'train':r==='gym'&&id?'gym':ROUTES[r]?r:'today';
 if(route!==ui.route)onRoute();ui.route=route;ui.id=route==='train'||route==='gym'?id:null}

const activeWorkout=()=>view().workouts.find(w=>w.status==='active');
function shell(){
 const s=view(),dark=document.documentElement.getAttribute('data-theme')==='dark',p=s.profile;
 const links=cls=>Object.entries(ROUTES).map(([k,[label,icon]])=>`<a href="#/${k}" class="${ui.route===k?'is-on':''}"${ui.route===k?' aria-current="page"':''}>${I(icon,cls==='tab'?22:20)}<span>${label}</span></a>`).join('');
 const fab={today:['add','','Добавить'],train:['w-new','','Новая тренировка'],progress:ui.prog==='habits'?['habit-new','','Новая привычка']:['metric-open','weight','Новый замер'],coach:['question-new','','Вопрос тренеру']}[ui.route];
 const aw=activeWorkout();
 /* Плавающих слоёв на телефоне не больше двух (вкладки + одно). Идёт тренировка —
    внизу её полоса, а «+» уезжает в шапку. Открыта карточка тренировки — «+»
    не нужен: он создал бы другую тренировку. Полоса не дублирует карточку той же тренировки. */
 const inDetail=ui.route==='train'&&!!ui.id,onLive=aw&&inDetail&&ui.id===aw.id;
 const showLive=aw&&!onLive&&ui.route!=='today',showFab=!aw&&!inDetail;
 const live=showLive?`<button type="button" class="livebar glass" data-action="gym-open" data-id="${aw.id}"><span class="pulse" aria-hidden="true"></span><span class="grow"><b>${esc(aw.title)}</b><span class="caption">Идёт · ${D.setsDone(aw)} из ${D.setsTotal(aw)} подходов</span></span><span class="go">Продолжить ${I('chev',16)}</span></button>`:'';
 // Запись не проходит — человек узнаёт об этом сразу и может унести копию (PRODUCT-AUDIT A2).
 const unsaved=ui.unsaved?`<div class="banner card unsaved" data-key="unsaved"><span class="qico">${I('flag',18)}</span><div class="grow"><b>Дневник не сохраняется</b><span class="meta">Память браузера заполнена или запись запрещена. Сделанное сейчас живёт только до закрытия вкладки.</span></div>${B(I('download',16)+'Сохранить копию','export','','small primary')}</div>`:'';
 return `<div class="shell${showLive?' has-live':''}">
 <aside class="side"><div class="brand"><span class="mark">${I('journal',20)}</span><div><b>Дневник</b><span class="caption">тренировки · привычки</span></div></div>
  <nav class="nav" aria-label="Разделы"><a href="index.html">${I('back',20)}<span>Клуб</span></a>${links('nav')}</nav>
  <div class="sidefoot"><div class="me"><span class="avatar">${esc(initials(p.name))}</span><div class="grow"><b>${esc(p.name||'Без имени')}</b><span class="caption">${esc(p.goal||'Цель не задана')}</span></div></div>
  <div class="btnrow">${B(I(dark?'sun':'moon',18),'theme-toggle','','icon ghost',`aria-label="${dark?'Светлая тема':'Тёмная тема'}"`)}${B(I('settings',18)+'<span>Настройки</span>','settings','','ghost')}</div></div></aside>
 <main class="main" id="main">
  <header class="mhead glass"><a class="mback" href="index.html" aria-label="К клубу">${I('back',20)}</a><span class="mark">${I('journal',18)}</span><b>Дневник</b>
   ${showFab?'':B(I('plus',20),'add','','icon ghost','aria-label="Добавить"')}${B(I(dark?'sun':'moon',20),'theme-toggle','','icon ghost',`aria-label="${dark?'Светлая тема':'Тёмная тема'}"`)}${B(I('settings',20),'settings','','icon ghost','aria-label="Настройки"')}</header>
  ${unsaved}${SCENES[ui.route]()}
 </main>
 ${live}
 <nav class="tabbar glass" aria-label="Разделы">${links('tab')}</nav>
 ${showFab?B(I('plus',24),fab[0],fab[1],'fab primary lone',`aria-label="${fab[2]}"`):''}
 </div>`}

// ——— первый вход (§3.1): три шага, всё можно пропустить ———
function onboarding(){const o=ui.ob,st=o.step;
 const dots=`<div class="obdots" aria-hidden="true">${[0,1,2].map(i=>`<i class="${i===st?'on':i<st?'done':''}"></i>`).join('')}</div>`;
 let body;
 if(st===0)body=`<span class="obmark">${I('journal',28)}</span><h1>Дневник тренировок</h1><p class="sub">Тренировки, привычки и всё, что нужно к встрече с тренером. Хранится только у вас.</p>
  <div class="fields">${field('Как вас зовут','ob-name',o.name,{ph:'Имя'})}${field('Цель','ob-goal',o.goal,{ph:'Например, присед 100 кг'})}</div>
  <div class="obfoot">${B('Посмотреть пример','example-open','','ghost')}${B('Дальше','ob-next','','primary')}</div>`;
 else if(st===1)body=`<h1>Тренер</h1><p class="sub">Чтобы звонить и писать в одно касание.</p>
  <div class="fields">${field('Имя тренера','ob-coach',o.coach,{ph:'Как зовут'})}<div class="fields two">${field('Телефон','ob-phone',o.phone,{type:'tel',ph:'+7…'})}${field('Telegram','ob-tg',o.tg,{ph:'имя без @'})}</div></div>
  <div class="obfoot">${B('Пока без тренера','ob-nocoach','','ghost')}${B('Дальше','ob-next','','primary')}</div>`;
 else body=`<h1>С чего начать</h1><p class="sub">Первый день будет не пустым. Изменить можно когда угодно.</p>
  <div class="field"><span class="label">Тренировки</span><div class="chips days oneline">${D.WD.map((w,i)=>`<button type="button" class="chip${o.days.includes(i)?' is-on':''}" aria-pressed="${o.days.includes(i)}" data-action="ob-day" data-id="${i}">${w}</button>`).join('')}</div>

  <span class="hint">${o.days.length?`«${esc(o.title)}» встанет в расписание: ${o.days.map(i=>D.WD[i]).join(', ')} в ${o.time}. Упражнения добавите один раз — дальше они подставятся сами.`:'Без дней — тренировки будете добавлять сами.'}</span></div>
  <div class="field"><span class="label">Каждый день</span><div class="obpick">${Object.entries(D.STARTERS).map(([k,v])=>`<button type="button" class="obopt card${o.pick.has(k)?' is-on':''}" data-action="ob-pick" data-id="${k}" aria-pressed="${o.pick.has(k)}"><span class="grow"><b>${esc(v.title)}</b><span class="caption">${v.rule.kind==='count'?`${fmtN(v.rule.target)} ${v.rule.unit}`:v.rule.kind==='metric'?'Замер':'Галочкой'} · ${v.days?v.days.map(i=>D.WD[i]).join(', '):'каждый день'}${v.time?' · '+v.time:''}</span></span><span class="tick${o.pick.has(k)?' is-on':''}">${I('check',16)}</span></button>`).join('')}</div></div>

function obRead(){const v=n=>$(`[name="${n}"]`)?.value.trim();const o=ui.ob;
 if(ui.ob.step===0){o.name=v('ob-name')??o.name;o.goal=v('ob-goal')??o.goal}
 if(ui.ob.step===1){o.coach=v('ob-coach')??o.coach;o.phone=v('ob-phone')??o.phone;o.tg=v('ob-tg')??o.tg}}

let lastView='';
function render(){
 if(popOwner&&!popOwner.closest('#sheet'))closePop();
 const app=$('#app'),first=!app.firstChild,s=view();
 ui.questions=D.questions(s); // чтение без правки и без копии базы (ARCH-AUDIT К7)
 let html,title;
 if(!example&&!state.profile.onboarded){html=onboarding();title='Добро пожаловать'}
 else if(ui.route==='gym'){html=gymScene(ui.id);title='В зале'}
 else{html=shell();title=ROUTES[ui.route][0]}
 if(first)app.innerHTML=html;else morph(app,html);
 sheetRender();
 toastCheck();learnAfter();
 document.title=`${title} · Дневник`;
 document.body.classList.toggle('in-gym',ui.route==='gym');wake(ui.route==='gym');
 const v=ui.route+'/'+(ui.route==='train'&&matchMedia('(max-width:1023px)').matches?ui.id||'':'')+(ui.ob?.step??'');
 // Шаг количества (VISUAL §5.3): число в кольце отвечает коротким толчком — только то, чего коснулись.
 if(ui.bump){const b=$(`[data-key="${ui.bump}"] .ringbox b`);ui.bump=null;if(b){b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump')}}
 if(v!==lastView){const sc=$('.scene,.gymbody,.obcard');if(sc&&!first){sc.classList.remove('enter');void sc.offsetWidth;sc.classList.add('enter')}lastView=v}
}

// ——— живые поля: пишутся без перерисовки строки, в которой печатают ———
function liveChange(el){const f=el.dataset.live,wid=el.dataset.w,eid=el.dataset.e;if(!wid)return;
 const w=find('workouts',wid),e=w?.exercises.find(x=>x.id===eid);if(!e)return;const v=toNum(el.value);
 if(Number.isNaN(v)){toast('Здесь нужно число');render();return}
 if(e.sets.find(y=>y.id===el.dataset.s)?.doneAt)learnFlag('calm.fix');
 commit(s=>f.startsWith('line-')?D.ops.setLine(s,wid,eid,f.slice(5),v):D.ops.setField(s,wid,eid,el.dataset.s,f,v),{quiet:true});
 render()}

document.addEventListener('click',e=>{
 const el=e.target.closest('[data-action]');
 if(popEl&&!e.target.closest('.pop')&&el!==popOwner)closePop();
 if(!el||el.disabled)return;const fn=ACTIONS[el.dataset.action];
 if(fn){e.preventDefault();if(el.closest('#sheet .sheetbody'))dirty(el);fn(el.dataset.id,el);learnSoon()} // метка «Спутника» следует за стадией даже без перерисовки
 if(el.closest('#toast')&&el.dataset.action!=='undo')$('#toast').hidden=true;
});
// Форма в шторке тронута — «Спутник» может вести к «Сохранить» (стадия после правки).
const dirty=t=>{const f=t?.closest?.('#sheet form');if(f&&!f.dataset.dirty)f.dataset.dirty='1'};
document.addEventListener('input',e=>{dirty(e.target);learnSoon()});
document.addEventListener('change',e=>{learnSoon();if(e.target.dataset?.live&&e.target.dataset.w)liveChange(e.target);if(e.target.dataset?.set)applySetting(e.target)});
// Настройки применяются сразу, как тема (аудит, п. 47): без «Сохранить».
function applySetting(el){const k=el.dataset.set,v=el.value.trim();if(k==='closeAt'&&!D.isTime(v))return;commit(s=>{s.profile[k]=v},{quiet:true});render()}
document.addEventListener('keydown',e=>{
 // Tab внутри открытой шторки ходит по кругу: фокус не уходит под неё.
 if(e.key==='Tab'&&$('#sheet').open&&!popEl){const f=$$('#sheet button:not([disabled]),#sheet input:not([type=hidden]),#sheet textarea,#sheet summary').filter(x=>x.offsetParent);if(f.length){const i=f.indexOf(document.activeElement);
  if(e.shiftKey&&i<=0){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&(i===f.length-1||i<0)){e.preventDefault();f[0].focus()}}}
 if(e.key==='Enter'&&e.target.dataset?.live&&e.target.tagName==='INPUT'){e.preventDefault();const all=$$('input[data-live]'),i=all.indexOf(e.target);e.target.blur();(all[i+1]||e.target).focus()}});
document.addEventListener('submit',e=>{e.preventDefault();const form=e.target;
 if(form.dataset.form==='q-add'){ACTIONS['q-add']('',form.querySelector('button'));return}
 if(form.classList.contains('sheetform')&&sheetSave){if(sheetSave(formData(form))!==false)closeSheet()}});
const typing=e=>e.target.matches?.('input:not([type=hidden]),textarea');
// Панели возвращаются не сразу: иначе «+» всплывает под пальцем между нажатием и отпусканием.
let typingOff=null;
document.addEventListener('focusin',e=>{if(typing(e)){clearTimeout(typingOff);document.body.classList.add('is-typing')}});
document.addEventListener('focusout',e=>{if(typing(e)){clearTimeout(typingOff);typingOff=setTimeout(()=>{if(!document.activeElement?.matches('input:not([type=hidden]),textarea'))document.body.classList.remove('is-typing')},350)}});

 dlg.addEventListener('touchstart',e=>{if(e.target.closest('.sheethead')&&!e.target.closest('button')){y0=e.touches[0].clientY;dy=0;dlg.style.transition='none'}},{passive:true});
 dlg.addEventListener('touchmove',e=>{if(y0===null)return;dy=Math.max(0,e.touches[0].clientY-y0);dlg.style.transform=`translateY(${dy}px)`},{passive:true});

/* ——— ничего не висит молча (§4.2) ———
   При открытии, раз в минуту и в полночь: settle доводит то, что можно
   довести без человека (тренировка с отмеченными подходами закрывается сама),
   и пишет это тихо. Вопросы считаются заново при каждой отрисовке. */
function settleNow(){if(example)return;const d=clone(state);if(D.autoClose(d))store(d)}

/* ——— Напоминания ———
   Пока дашборд открыт: привычка, дело или тренировка ко времени — тост с
   действием и системное уведомление, если разрешено. Ключ «id@время», поэтому
   перенесённое на другое время напомнит снова. Старше часа — не всплывает. */
const FIRED='xeptra.client2.fired';
function firedLoad(){const t=D.today();let f=readJSON(FIRED);if(!f||f.date!==t)f={date:t,ids:[]};return f}
// Создано или поправлено уже после своего времени — не напоминаем задним числом (аудит, п. 27).
function markFired(key,time){if(!time||time>D.hm())return;const f=firedLoad();if(!f.ids.includes(key)){f.ids.push(key);writeJSON(FIRED,f)}}
function dueReminders(s,t){const due=[];
 for(const h of s.habits)if(!h.archived&&h.remind&&h.time&&D.isDue(h,t)&&!D.habitDone(s,h,t)){const r=D.ruleOn(h,t);
  due.push({key:h.id+'@'+h.time,time:h.time,title:h.title,action:r.kind==='count'?{label:`+${fmtN(r.step)}`,act:'count-step',id:h.id,extra:`data-date="${t}"`}:r.kind==='metric'?{label:'Ввести',act:'metric-open',id:r.metric,extra:`data-date="${t}"`}:{label:'Отметить',act:'habit-tick',id:h.id,extra:`data-date="${t}"`}})}
 for(const x of s.todos)if(x.date===t&&x.time&&!x.doneAt)due.push({key:x.id+'@'+x.time,time:x.time,title:x.title,action:{label:'Сделано',act:'todo-tick',id:x.id}});
 for(const w of D.schedule(s,t,1))if(w.status==='planned')due.push({key:w.id+'@'+w.time,time:w.time,title:`Тренировка: ${w.title}`,action:{label:'Начать',act:'w-start',id:w.id}});
 return due}
function checkReminders(){if(example||ui.route==='gym')return;const s=state,t=D.today(),now=D.hm();
 const ago=D.addMinutes(now,-60);
 const fired=firedLoad();
 for(const x of dueReminders(s,t)){if(x.time>now||fired.ids.includes(x.key))continue;fired.ids.push(x.key);if(x.time<ago)continue;
  /* На «Сегодня» строка уже на экране со своей кнопкой — тост поверх ленты закрыл бы соседние кнопки.
     Там напоминание — подсветка самой строки; на других экранах — тост. */
  if(ui.route==='today'&&ui.day===t&&!$('#sheet').open){ui.remind.add(x.action.id+'@'+t);render()}
  // Тост живёт, пока дело ещё ждёт: отметили, начали или сменился день — гаснет.
  else toast(`${x.time} · ${x.title}`,{action:x.action,about:()=>D.today()===t&&ui.route!=='gym'&&dueReminders(state,t).some(y=>y.key===x.key)});
  try{if('Notification' in window&&Notification.permission==='granted')new Notification(x.title,{body:'Напоминание · '+x.time,tag:x.key})}catch(e){}}
 writeJSON(FIRED,fired)}

/* Знает, что сейчас (§0.1): открыли в другой день — «Сегодня» (идёт тренировка — «В зале»),
   а не экран, на котором закрыли вчера. Дата визита — настройка браузера, не данные дневника. */
function landToday(){const t=D.today();if(prefs.seen&&prefs.seen!==t){const aw=state.workouts.find(w=>w.status==='active');const h=aw?'#/gym/'+aw.id:'#/today';if(location.hash!==h)history.replaceState(null,'',h);ui.day=t}
 if(prefs.seen!==t){prefs.seen=t;savePrefs()}}
function boot(){
 ui.ob={step:0,name:state.profile.name||'',goal:state.profile.goal||'',pick:new Set(['water','weigh','stretch']),coach:'',phone:'',tg:'',days:[0,2,4],time:'19:00',title:'Всё тело'};
 applyTheme();settleNow();landToday();readHash();render();bindSheet();
 let last=ui.route;
 // Другая вкладка записала — берём её версию (PRODUCT-AUDIT A3).
 addEventListener('storage',e=>{if((e.key!==KEY&&e.key!==REV)||example)return;if(adoptStored()){render();toast('Обновлено из другой вкладки')}});
 addEventListener('hashchange',()=>{closeSheet();readHash();render();if(ui.route!==last||matchMedia('(max-width:1023px)').matches)scrollTo({top:0});last=ui.route;ui.learn.scrolled=false;learnSoon();if(afterNav){const f=afterNav;afterNav=null;setTimeout(f,220)}});
 matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(prefs.theme==='system'){applyTheme();render()}});
 let day=D.today();
 setInterval(()=>{settleNow();if(D.today()!==day){onNewDay(day);day=D.today()}if(!$('#sheet').open&&!document.activeElement?.matches('input,textarea'))render()},60000);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden){settleNow();if(prefs.seen!==D.today()&&!$('#sheet').open){landToday();readHash()}if(!$('#sheet').open)render()}});
 checkReminders();setInterval(checkReminders,20000);
}
if(typeof window!=='undefined'&&window.document&&document.getElementById('app'))boot();
</script></body></html>
