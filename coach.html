   Данные клиента и все законы из UX-MECHANISM.md в виде чистых функций.
   Ни одного знания о DOM — файл целиком проверяется в Node (test-domain.cjs).

   Законы, которые здесь живут:
   §4.1 Прошлое неизменно: у привычки история правил, день оценивается правилом того дня.
   §4.2 Ничего не висит молча: settle() доводит хвосты и возвращает вопросы.
   §4.3 Подход засчитан, как только записан (doneAt), без «Завершить».
   §4.4 План ставит расписание: виртуальные тренировки на 7 дней, без дублей.
   §4.5 Серия — у каждой привычки своя. */

const D=(()=>{
 const VERSION=2;
 const WD=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
 const MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
 const MON_SHORT=['янв.','февр.','мар.','апр.','мая','июня','июля','авг.','сент.','окт.','нояб.','дек.'];
 const KINDS={check:'Галочкой',count:'Количеством',metric:'Замером'};
 const METRICS={weight:['Вес','кг',0.1],waist:['Талия','см',0.5],hips:['Бёдра','см',0.5],chest:['Грудь','см',0.5]};
 const MODES={weight:'Вес × повторы',time:'Время · дистанция'};
 const FEELS=['','Тяжело','Так себе','Средне','Хорошо','Отлично'];

 // ——— даты: строкой YYYY-MM-DD, время — HH:MM ———
 const pad=n=>String(n).padStart(2,'0');
 const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
 const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
 let clock=null; // для проверок: D.setNow(new Date(...))
 const now=()=>clock?new Date(clock):new Date();
 const today=()=>iso(now());
 const hm=(d=now())=>pad(d.getHours())+':'+pad(d.getMinutes());
 const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
 const weekday=s=>(parse(s).getDay()+6)%7;
 const weekStart=s=>addDays(s,-weekday(s));
 const week=s=>{const a=weekStart(s);return [0,1,2,3,4,5,6].map(i=>addDays(a,i))};
 const daysBetween=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
 const isDate=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&iso(parse(s))===s;
 const isTime=s=>typeof s==='string'&&/^([01]\d|2[0-3]):[0-5]\d$/.test(s);
 const fmtDate=s=>{const d=parse(s);return `${d.getDate()} ${MON[d.getMonth()]}`};
 const fmtShort=s=>{const d=parse(s);return `${d.getDate()} ${MON_SHORT[d.getMonth()]}`};
 const fmtDay=(s,{lower=false}={})=>{const t=today();const o=s===t?'Сегодня':s===addDays(t,1)?'Завтра':s===addDays(t,-1)?'Вчера':`${WD[weekday(s)]}, ${fmtShort(s)}`;return lower?o.toLowerCase():o};
 // Время дня: «HH:MM» ± минуты, в пределах суток.
 const addMinutes=(t,n)=>{const [h,m]=t.split(':').map(Number),x=Math.min(23*60+59,Math.max(0,h*60+m+n));return pad(Math.floor(x/60))+':'+pad(x%60)};
 /* Метки времени записи (ARCH-AUDIT К8): пишутся в одном месте и одним форматом (ISO, UTC).
    Сравниваются только как моменты, а дата метки — местная. Старые записи без пояса читаются так же. */
 const stamp=()=>now().toISOString();
 const stampAt=(date,time)=>{const [y,m,d]=date.split('-').map(Number),[h,mi]=time.split(':').map(Number);return new Date(y,m-1,d,h,mi).toISOString()};
 const msOf=x=>x?new Date(x).getTime():0;
 const dateOf=x=>iso(new Date(x));
 const latest=list=>list.filter(Boolean).reduce((a,b)=>msOf(b)>msOf(a)?b:a,null);
 let seq=0;const uid=p=>p+Date.now().toString(36)+(seq++).toString(36)+Math.random().toString(36).slice(2,5);
 const round=(n,k=100)=>Math.round(n*k)/k;

 // ——— привычки: история правил (§4.1) ———
 // Правило, действовавшее в этот день: последнее с from <= date. До первого — привычки не было.
 const ruleOn=(h,date)=>{let r=null;for(const x of h.rules)if(x.from<=date)r=x;return r};
 const isDue=(h,date)=>{const r=ruleOn(h,date);return !!r&&r.days.includes(weekday(date))};
 const logOf=(s,h,date)=>{const r=ruleOn(h,date);if(r&&r.kind==='metric')return s.metrics.some(m=>m.date===date&&m.kind===r.metric)?1:0;return Number(h.log[date])||0};
 // Явный ответ «не сделал» хранится отдельно от значения: «2 из 8» — это не ответ, а незаконченный день.
 const answered=(h,date)=>h.miss.includes(date);
 const goalOf=r=>r.kind==='count'?r.target:1;
 const ratio=(s,h,date)=>{const r=ruleOn(h,date);if(!r)return 0;return Math.min(1,logOf(s,h,date)/goalOf(r))};
 const habitDone=(s,h,date)=>{const r=ruleOn(h,date);if(!r)return false;const v=logOf(s,h,date);return r.kind==='count'?v>=r.target*(r.pass||1):v>=1};
 // Правка привычки: новое правило с сегодняшнего дня; если сегодняшнее уже есть — меняем его.
 function setRule(h,rule,from=today()){
  const last=h.rules[h.rules.length-1];
  if(last&&last.from===from)Object.assign(last,rule,{from});
  else if(last&&JSON.stringify({...last,from:0})===JSON.stringify({...last,...rule,from:0}))return;
  else h.rules.push({...rule,from});
 }
 // Серия привычки (§4.5): дни подряд, когда правило требовало и было выполнено.
 // Сегодня серию не рвёт, пока не выполнено; дни без требования — пропускаются.
 function streak(s,h,date=today()){let n=0,d=date;
  if(isDue(h,d)&&!habitDone(s,h,d))d=addDays(d,-1);
  for(let i=0;i<400;i++){const r=ruleOn(h,d);if(!r)break;if(isDue(h,d)){if(habitDone(s,h,d))n++;else break}d=addDays(d,-1)}
  return n}

 // ——— тренировки ———
 const setDone=x=>!!x.doneAt;
 const e1rm=(w,r)=>w&&r?w*(1+Math.min(r,12)/30):0; // Эпли, оценка на повторения до 12
 const volume=w=>w.exercises.reduce((a,e)=>a+(e.mode==='weight'?e.sets.filter(setDone).reduce((b,x)=>b+(x.reps||0)*(x.weight||0),0):0),0);
 const setsDone=w=>w.exercises.reduce((a,e)=>a+e.sets.filter(setDone).length,0);
 const setsTotal=w=>w.exercises.reduce((a,e)=>a+e.sets.length,0);
 const byTime=(a,b)=>(a.date+a.time).localeCompare(b.date+b.time);
 const key=n=>String(n||'').trim().toLowerCase();
 // Одно упражнение — одно название без учёта регистра и крайних пробелов. Единственное правило сопоставления.
 const sameName=(a,b)=>key(a)===key(b);
 // Тренировка плана, которой ещё нет в данных: «v:план:дата». Собирается и разбирается только здесь.
 const vid=(planId,date)=>`v:${planId}:${date}`;
 const parseVid=id=>{const m=/^v:(.+):(\d{4}-\d{2}-\d{2})$/.exec(String(id));return m?{planId:m[1],date:m[2]}:null};
 // «В прошлый раз» (§4.3): последние записанные подходы упражнения — из любой тренировки, даже незавершённой.
 function lastSets(s,name,exceptId,before){
  const list=s.workouts.filter(w=>w.id!==exceptId&&(!before||w.date+w.time<=before)).sort(byTime).reverse();
  for(const w of list){const e=w.exercises.find(x=>key(x.name)===key(name));if(e){const done=e.sets.filter(setDone);if(done.length)return {date:w.date,wid:w.id,sets:done,mode:e.mode,entry:e.entry,rest:e.rest}}}
  return null}
 // Лучший расчётный максимум упражнения до этой тренировки.
 function bestBefore(s,name,w){let b=0;for(const x of s.workouts){if(x.id===w.id||(x.date+x.time)>(w.date+w.time))continue;
  for(const e of x.exercises)if(key(e.name)===key(name)&&e.mode==='weight')for(const q of e.sets)if(q.doneAt)b=Math.max(b,e1rm(q.weight,q.reps))}return b}
 // Рекорды тренировки: подход, чей расчётный максимум выше всего, что было до неё.
 function records(s,w){const out=[];for(const e of w.exercises){if(e.mode!=='weight')continue;const prev=bestBefore(s,e.name,w);if(!prev)continue;
  let top=null;for(const q of e.sets)if(q.doneAt&&e1rm(q.weight,q.reps)>prev&&(!top||e1rm(q.weight,q.reps)>e1rm(top.weight,top.reps)))top=q;
  if(top){let pw=0;for(const x of s.workouts){if(x.id===w.id||(x.date+x.time)>(w.date+w.time))continue;for(const y of x.exercises)if(key(y.name)===key(e.name))for(const q of y.sets)if(q.doneAt)pw=Math.max(pw,q.weight||0)}
   out.push({name:e.name,weight:top.weight,reps:top.reps,gain:round(e1rm(top.weight,top.reps)-prev,10),plus:round((top.weight||0)-pw,10)})}}return out}
 // Сравнение с прошлым разом по каждому упражнению: +1 лучше, 0 так же, −1 хуже.
 function compare(s,w){return w.exercises.map(e=>{const last=lastSets(s,e.name,w.id,w.date+w.time);const cur=e.sets.filter(setDone);
  if(!last||!cur.length)return {name:e.name,trend:null};
  const f=e.mode==='weight'?(l=>Math.max(...l.map(q=>e1rm(q.weight,q.reps)))):(l=>l.reduce((a,q)=>a+(q.reps||0),0));
  const a=f(cur),b=f(last.sets);return {name:e.name,trend:Math.abs(a-b)<0.01?0:a>b?1:-1}})}
 const duration=w=>{if(!w.startedAt)return 0;const end=w.finishedAt||latest(w.exercises.flatMap(e=>e.sets).map(q=>q.doneAt));return end?Math.max(0,Math.round((msOf(end)-msOf(w.startedAt))/60000)):0};

 // ——— план ставит расписание (§4.4) ———
 // Виртуальная тренировка есть в расписании, но не в данных. В данные попадает, когда её начали, поправили или ответили о ней.
 function schedule(s,from=today(),days=7){const out=[];
  for(let i=0;i<days;i++){const d=addDays(from,i);
   for(const p of s.plans)if(p.days.includes(weekday(d))&&!(p.from&&d<p.from)&&!s.workouts.some(w=>w.planId===p.id&&(w.date===d||w.from===d)))out.push({virtual:true,id:vid(p.id,d),planId:p.id,date:d,time:p.time||'19:00',title:p.title,status:'planned',exercises:p.exercises.map(x=>({name:x.name}))});
   for(const w of s.workouts)if(w.date===d&&w.status!=='skipped')out.push(w)}
  return out.sort(byTime)}
 // Тренировка из плана: подходы по схеме плана, веса — из прошлого раза.
 function materialize(s,p,date,time){
  const exercises=p.exercises.map(x=>{const last=lastSets(s,x.name);const n=x.sets||(last?last.sets.length:3);
   const sets=[...Array(n)].map((_,i)=>{const l=last?.sets[Math.min(i,last.sets.length-1)];return {id:uid('s'),reps:l?l.reps:(x.reps??null),weight:l?l.weight:(x.weight??null),doneAt:null}});
   return {id:uid('e'),name:x.name,mode:x.mode||last?.mode||'weight',entry:last?.entry||'sets',rest:x.rest||last?.rest||90,sets}});
  return {id:uid('w'),date,time:time||p.time||'19:00',title:p.title,planId:p.id,coach:false,status:'planned',startedAt:null,finishedAt:null,auto:false,feel:0,note:'',exercises};
 }

 // ——— ничего не висит молча (§4.2) ———
 /* Два разных дела, раньше смешанных в одном settle (ARCH-AUDIT К7):
    autoClose — правка: доводит то, что можно довести без человека (тренировка с подходами, корзина);
    questions — чтение: на что нужен ответ человека. Ни один вопрос не решается молча. */
 function autoClose(s,date=today()){let changed=false;
  for(const w of s.workouts){
   if(w.status!=='planned'&&w.status!=='active')continue;
   const last=latest(w.exercises.flatMap(e=>e.sets).map(x=>x.doneAt));
   // Идущую тренировку не закрываем, пока в ней есть жизнь: полночь посреди подходов — не конец тренировки.
   if(w.status==='active'){const act=latest([last,w.startedAt]);if(act&&now()-msOf(act)<4*3600e3)continue}
   else if(w.date>=date)continue;
   if(last){w.status='done';w.auto=true;w.finishedAt=w.finishedAt||last;changed=true}}
  // корзина живёт неделю — по местной дате удаления
  const before=s.trash.length;s.trash=s.trash.filter(t=>daysBetween(dateOf(t.deletedAt),date)<7);if(s.trash.length!==before)changed=true;
  return changed}
 function questions(s,date=today(),time=hm()){const q=[],y=addDays(date,-1);
  for(const w of s.workouts){if(w.status!=='planned'&&w.status!=='active'||w.date>=date)continue;
   if(!w.exercises.some(e=>e.sets.some(x=>x.doneAt)))q.push({kind:'workout',id:w.id,date:w.date,title:w.title})}
  // дни плана за прошлую неделю, которые так и не превратились в тренировку: ни один не исчезает молча
  for(let i=7;i>=1;i--){const d=addDays(date,-i);if(s.profile.started&&d<s.profile.started)continue;for(const v of schedule(s,d,1))if(v.virtual)q.push({kind:'plan',id:v.id,planId:v.planId,date:d,title:v.title})}
  // вчерашние привычки без ответа
  const yd=dayState(s,y);if(!yd.settled)q.push({kind:'yesterday',date:y,count:yd.habitsOpen.length});
  // вечер: предложить закрыть сегодняшний день — только то, чьё время пришло
  if(time>=(s.profile.closeAt||'21:00')){const td=dayState(s,date,time);if(!td.marked&&td.open.length)q.push({kind:'close',date,count:td.open.length})}
  // встреча с тренером завтра или сегодня
  const m=s.coach.nextMeeting;if(m&&(m===date||m===addDays(date,1)))q.push({kind:'meeting',date:m});
  return q}
 // Совместимость: доводка и вопросы одним вызовом (проверки и старый код).
 function settle(s,date=today(),time=hm()){const changed=autoClose(s,date);return {changed,questions:questions(s,date,time)}}
 // Что в этот день осталось без ответа: привычки и дела.
 /* upTo — «сейчас» для сегодняшнего дня: то, чьё время ещё не пришло, не спрашиваем (будущее не спрашивают).
    День первого входа без долгов: то, чьё время прошло до входа, не требуется. */
 const owed=(s,date,time)=>!(date===s.profile.started&&time&&time<(s.profile.startedAt||'00:00'));
 const notYet=(time,upTo)=>!!(upTo&&time&&time>upTo);
 function openItems(s,date,upTo=null){
  const habits=s.habits.filter(h=>!h.archived&&isDue(h,date)&&!habitDone(s,h,date)&&!answered(h,date)&&owed(s,date,h.time)&&!notYet(h.time,upTo));
  const todos=s.todos.filter(t=>t.date===date&&!t.doneAt&&!notYet(t.time,upTo));
  return [...habits.map(h=>({kind:'habit',item:h})),...todos.map(t=>({kind:'todo',item:t}))]}
 // Что в этот день ещё впереди (время не пришло) — для «Закрыть день»: «спросим позже».
 function laterItems(s,date,upTo){return upTo?openItems(s,date).filter(x=>notYet(x.item.time,upTo)):[]}
 /* «День закрыт» — одно определение для всего (ARCH-AUDIT К5):
    marked — человек нажал «Закрыть день»; open — ждёт ответа сейчас (для сегодня — только наступившее);
    later — ещё впереди; habitsOpen — привычки без ответа за весь день;
    settled — о дне больше нечего спрашивать: закрыт вручную или привычек без ответа нет (дела живут в «Просрочено»). */
 function dayState(s,date,time=null){const marked=s.closed.includes(date),all=openItems(s,date),habitsOpen=all.filter(x=>x.kind==='habit');
  return {marked,open:openItems(s,date,time),later:laterItems(s,date,time),habitsOpen,settled:marked||!habitsOpen.length}}
 /* Счёт привычки за период (ARCH-AUDIT К6) — один набор правил для «Прогресса» и «К встрече»:
    день первого входа не считается; сегодня — только если уже выполнено; пауза — не требуется. */
 function habitStats(s,h,from,to=today()){let due=0,hit=0,sum=0;const t=today();
  for(let d=from;d<=to;d=addDays(d,1)){if(!isDue(h,d)||d===s.profile.started)continue;const ok=habitDone(s,h,d);if(d>=t&&!ok)continue;due++;if(ok)hit++;sum+=logOf(s,h,d)}
  return {due,hit,pct:due?Math.round(hit/due*100):null,avg:due?round(sum/due,10):null}}

 // ——— день: лента по времени (§3.2) ———
 const part=t=>!t?'any':t<'12:00'?'morning':t<'17:00'?'day':'evening';
 function agenda(s,date){
  const items=[];
  for(const h of s.habits)if(!h.archived&&isDue(h,date))items.push({kind:'habit',time:h.time,item:h});
  for(const t of s.todos)if(t.date===date)items.push({kind:'todo',time:t.time,item:t});
  for(const w of schedule(s,date,1))items.push({kind:'workout',time:w.time,item:w});
  for(const w of s.workouts)if(w.date===date&&w.status==='skipped')items.push({kind:'workout',time:w.time,item:w});
  return items.sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'))}
 const overdueTodos=(s,date)=>s.todos.filter(t=>t.date&&t.date<date&&!t.doneAt);

 // ——— неделя, прогресс, замеры ———
 // «2 из 3»: в знаменателе всё, что неделя обещала, — сделанное, пропущенное, впереди и прошедшее без ответа.
 function weekStats(s,date=today()){const days=week(date);
  const done=s.workouts.filter(w=>days.includes(w.date)&&w.status==='done').length;
  const skipped=s.workouts.filter(w=>days.includes(w.date)&&w.status==='skipped').length;
  const planned=new Set();for(const d of days)for(const v of schedule(s,d,1))if(v.status!=='done')planned.add(v.id);
  return {done,skipped,total:done+skipped+planned.size}}
 const metricSeries=(s,kind)=>s.metrics.filter(m=>m.kind===kind).sort((a,b)=>a.date.localeCompare(b.date));
 function metricDelta(s,kind,days){const l=metricSeries(s,kind);if(l.length<2)return null;const last=l[l.length-1];
  const from=addDays(last.date,-days);let base=null;for(const m of l)if(m.date<=from)base=m;if(!base)base=l[0];if(base===last)return null;return round(last.value-base.value,10)}
 // Сила: лучший расчётный максимум по неделям, последние n недель.
 function strength(s,name,weeks=8){const t=today(),out=[];
  for(let i=weeks-1;i>=0;i--){const a=addDays(weekStart(t),-7*i),b=addDays(a,6);let best=0;
   for(const w of s.workouts)if(w.date>=a&&w.date<=b)for(const e of w.exercises)if(key(e.name)===key(name))for(const q of e.sets)if(q.doneAt)best=Math.max(best,e1rm(q.weight,q.reps));
   out.push({week:a,value:round(best,10)})}
  return out}
 // Лучший расчётный максимум по тренировкам — пока недель мало, рост видно по тренировкам.
 function strengthRuns(s,name,n=12){const out=[];for(const w of [...s.workouts].sort(byTime)){let best=0;for(const e of w.exercises)if(key(e.name)===key(name))for(const q of e.sets)if(q.doneAt)best=Math.max(best,e1rm(q.weight,q.reps));if(best)out.push({date:w.date,value:round(best,10)})}return out.slice(-n)}
 function exerciseList(s){const m=new Map();
  for(const w of [...s.workouts].sort(byTime))for(const e of w.exercises){if(e.mode!=='weight')continue;const done=e.sets.filter(setDone);if(!done.length)continue;
   const k=key(e.name),top=done.reduce((a,q)=>e1rm(q.weight,q.reps)>e1rm(a.weight,a.reps)?q:a);const cur=m.get(k)||{name:e.name,best:null,bestDate:null,last:null,lastDate:null};
   if(!cur.best||e1rm(top.weight,top.reps)>e1rm(cur.best.weight,cur.best.reps)){cur.best=top;cur.bestDate=w.date}cur.last=top;cur.lastDate=w.date;m.set(k,cur)}
  return [...m.values()].sort((a,b)=>b.lastDate.localeCompare(a.lastDate))}
 // К встрече с тренером (§3.7): всё с даты прошлой встречи.
 function sinceMeeting(s,date=today()){
  const meetings=s.notes.filter(n=>n.source==='meeting').map(n=>n.date).sort();
  // Без встреч отсчёт — не раньше начала дневника: «с 5 сент.» у того, кто начал сегодня, — неправда.
  const start=[s.profile.started,...s.workouts.map(w=>w.date),...s.habits.map(h=>h.rules[0]?.from)].filter(Boolean).sort()[0]||date;
  const from=meetings.length?meetings[meetings.length-1]:[addDays(date,-14),addDays(start,-1)].sort().pop();
  const ws=s.workouts.filter(w=>w.date>from&&w.date<=date);
  const done=ws.filter(w=>w.status==='done');
  const recs=done.flatMap(w=>records(s,w).map(r=>({...r,date:w.date})));
  const hab=s.habits.filter(h=>!h.archived).map(h=>({title:h.title,...habitStats(s,h,addDays(from,1),date)})).filter(x=>x.due);
  return {from,fromStart:!meetings.length&&from<start,done:done.length,skipped:ws.filter(w=>w.status==='skipped').length,records:recs,habits:hab,
   weight:(()=>{const l=metricSeries(s,'weight').filter(m=>m.date>=from);return l.length>1?round(l[l.length-1].value-l[0].value,10):null})(),
   notes:s.notes.filter(n=>n.source==='workout'&&n.date>from),questions:s.questions.filter(x=>!x.askedAt)}}

 // ——— проверка: база, не прошедшая её, не записывается ———
 function validate(s){
  const err=[],ids=new Set(),need=(c,m)=>{if(!c)err.push(m)};
  const id=(x,w)=>{need(typeof x.id==='string'&&x.id,`${w}: нет id`);need(!ids.has(x.id),`${w}: повтор id`);ids.add(x.id)};
  const num=(v,w)=>need(v===null||(typeof v==='number'&&isFinite(v)&&v>=0),`${w}: число не меньше нуля`);
  if(!s||typeof s!=='object')return ['База пустая'];
  need(s.version===VERSION,'Неизвестная версия базы');
  for(const k of ['plans','workouts','habits','todos','metrics','notes','questions','trash','closed'])need(Array.isArray(s[k]),`Нет списка ${k}`);
  need(s.profile&&typeof s.profile.name==='string','Профиль');if(s.profile&&s.profile.startedAt!=null)need(isTime(s.profile.startedAt),'Профиль: время начала');
  if(s.profile&&s.profile.learn!=null)need(typeof s.profile.learn==='object'&&Object.entries(s.profile.learn).every(([k,v])=>LEARN.some(x=>x.id===k)&&(isDate(v)||v==='skip')),'Знакомство: отметки');need(s.coach&&typeof s.coach==='object','Тренер');
  if(err.length)return err;
  for(const w of s.workouts){id(w,'Тренировка');need(isDate(w.date)&&isTime(w.time),'Тренировка: дата и время');need(typeof w.title==='string'&&w.title.trim(),'Назовите тренировку');
   need(['planned','active','done','skipped'].includes(w.status),'Тренировка: статус');need(Number.isInteger(w.feel)&&w.feel>=0&&w.feel<=5,'Самочувствие');
   for(const e of w.exercises){id(e,'Упражнение');need(typeof e.name==='string'&&e.name.trim(),'Назовите упражнение');need(e.mode in MODES,'Упражнение: вид');need(['sets','line'].includes(e.entry),'Упражнение: запись');
    for(const q of e.sets){id(q,'Подход');num(q.reps,'Повторы');num(q.weight,'Вес');need(!q.doneAt||q.reps>0,'Отмеченный подход без повторов — сначала впишите повторы')}}}
  for(const h of s.habits){id(h,'Привычка');need(typeof h.title==='string'&&h.title.trim(),'Назовите привычку');need(Array.isArray(h.rules)&&h.rules.length>0,'Привычка без правил');
   let prev='';for(const r of h.rules||[]){need(isDate(r.from)&&r.from>prev,'Правила по возрастанию даты');prev=r.from;need(r.kind in KINDS,'Правило: вид');need(Array.isArray(r.days),'Правило: дни');
    if(r.kind==='count'){need(typeof r.target==='number'&&r.target>0&&typeof r.step==='number'&&r.step>0,'Цель и шаг — числа больше нуля')}
    if(r.kind==='metric')need(r.metric in METRICS,'Правило: замер')}
   need(h.time===null||isTime(h.time),'Привычка: время');need(h.log&&typeof h.log==='object','Привычка: история');need(Array.isArray(h.miss)&&h.miss.every(isDate),'Привычка: пропуски');for(const v of Object.values(h.log||{}))num(v,'Отметка')}
  for(const t of s.todos){id(t,'Дело');need(typeof t.title==='string'&&t.title.trim(),'Напишите, что сделать');need(t.date===null||isDate(t.date),'Дело: дата');need(t.time===null||(isTime(t.time)&&!!t.date),'Напоминание у дела — только с датой')}
  for(const m of s.metrics){id(m,'Замер');need(m.kind in METRICS,'Замер: вид');need(isDate(m.date),'Замер: дата');need(typeof m.value==='number'&&m.value>0,'Введите значение')}
  for(const p of s.plans){id(p,'План');need(typeof p.title==='string'&&p.title.trim(),'Назовите план');need(Array.isArray(p.days)&&Array.isArray(p.exercises),'План: дни и упражнения');need(!p.time||isTime(p.time),'План: время')}
  for(const n of s.notes){id(n,'Заметка');need(typeof n.text==='string'&&n.text.trim(),'Пустая заметка')}
  for(const x of s.questions){id(x,'Вопрос');need(typeof x.text==='string'&&x.text.trim(),'Пустой вопрос')}
  return err}

 // Следующие неотмеченные подходы с пустыми полями берут значения подхода i (§3.4: значения подставлены).
 function carry(e,i){const q=e.sets[i];if(!q)return;for(const x of e.sets.slice(i+1)){if(x.doneAt)continue;if(x.reps==null&&q.reps!=null)x.reps=q.reps;if(x.weight==null&&q.weight!=null)x.weight=q.weight}}
 // Починка при загрузке: подход, отмеченный без повторов, — не факт (§4.3), снимаем отметку.
 // И у упражнения плана есть свой id — строка будущей таблицы (DATA-MODEL.md); старые записи получают его при загрузке.
 function repair(s){if(!s||!Array.isArray(s.workouts))return s;for(const w of s.workouts)for(const e of w.exercises||[])for(const q of e.sets||[])if(q.doneAt&&!(q.reps>0))q.doneAt=null;
  for(const p of s.plans||[])for(const x of p.exercises||[])if(!x.id)x.id=uid('x');return s}
 /* ——— операции (ARCH-AUDIT К1) ———
    Единственное место, где законы меняют данные. Каждая — чистая: правит s на месте,
    время берёт из now(), знает только данные. Экран вызывает их внутри commit, проверки —
    в Node, будущий сервер — как есть. Возвращают то, что нужно экрану дальше. */
 const W=(s,id)=>s.workouts.find(x=>x.id===id)||null;
 const EX=(w,id)=>w?.exercises.find(x=>x.id===id)||null;
 const H=(s,id)=>s.habits.find(x=>x.id===id)||null;
 // Тренировка по id; виртуальная из плана становится настоящей (§4.4: одна на день плана, перенесённая тоже найдётся).
 function realize(s,id){const v=parseVid(id);if(!v)return W(s,id);
  let w=s.workouts.find(x=>x.planId===v.planId&&(x.date===v.date||x.from===v.date));if(w)return w;
  const p=s.plans.find(x=>x.id===v.planId);if(!p)return null;w=materialize(s,p,v.date);s.workouts.push(w);return w}
 const ops={
  // Начать: идёт только одна тренировка — прежняя с подходами закрывается, без подходов возвращается в план.
  start(s,id){const w=realize(s,id);if(!w)return null;
   for(const x of s.workouts)if(x.status==='active'&&x.id!==w.id){const any=x.exercises.some(e=>e.sets.some(q=>q.doneAt));x.status=any?'done':'planned';if(any){x.auto=true;x.finishedAt=stamp()}}
   w.status='active';w.startedAt=w.startedAt||stamp();w.date=today();return w.id},
  // «Подход сделан» (§4.3): факт записан, следующие пустые берут значения, тренировка пошла.
  setDone(s,wid,eid,sid){const w=W(s,wid),e=EX(w,eid),q=e?.sets.find(x=>x.id===sid);if(!q)return null;
   q.doneAt=stamp();carry(e,e.sets.indexOf(q));if(w.status==='planned'){w.status='active';w.startedAt=w.startedAt||q.doneAt}
   return {rest:e.rest||90,advance:!e.sets.some(x=>!x.doneAt),all:setsDone(w)===setsTotal(w)}},
  // Галочка подхода в карточке: сегодня переводит тренировку в «идёт», прошлое правится задним числом.
  tickSet(s,wid,eid,sid){const w=W(s,wid),q=EX(w,eid)?.sets.find(x=>x.id===sid);if(!q)return null;q.doneAt=q.doneAt?null:stamp();
   if(q.doneAt&&w.status==='planned'&&w.date===today()){w.status='active';w.startedAt=w.startedAt||q.doneAt}return !!q.doneAt},
  tickLine(s,wid,eid){const e=EX(W(s,wid),eid);if(!e)return null;const on=!(e.sets.length&&e.sets.every(x=>x.doneAt)),t=stamp();e.sets.forEach(x=>{x.doneAt=on?(x.doneAt||t):null});return on},
  finish(s,id){const w=W(s,id);if(!w)return false;w.status='done';w.auto=false;w.startedAt=w.startedAt||stamp();w.finishedAt=stamp();return true},
  // «Отметить сделанной» задним числом: подходы с повторами считаются сделанными в час тренировки.
  markDone(s,id){const w=W(s,id);if(!w)return false;w.status='done';w.finishedAt=w.finishedAt||stampAt(w.date,w.time);w.startedAt=w.startedAt||stampAt(w.date,w.time);
   for(const e of w.exercises)for(const q of e.sets)if(!q.doneAt&&q.reps>0)q.doneAt=w.finishedAt;return true},
  // Завершили без единого подхода — тренировки не было, она остаётся в плане.
  abandon(s,id){const w=W(s,id);if(!w)return false;w.status='planned';w.startedAt=null;return true},
  skip(s,id){const w=realize(s,id);if(!w)return null;w.status='skipped';return w.id},
  skipMany(s,ids){let n=0;for(const id of ids)if(ops.skip(s,id))n++;return n},
  replan(s,id){const w=W(s,id);if(!w)return false;w.status='planned';return true},
  // На завтра: день плана запоминает, откуда перенесли (from), чтобы не задвоиться.
  move(s,id){const w=realize(s,id);if(!w)return null;if(w.planId&&!w.from)w.from=w.date;w.date=addDays(w.date,1);return w.id},
  copyToday(s,id){const src=W(s,id);if(!src)return null;const w=JSON.parse(JSON.stringify(src));

 const TH={gap:14,gapLost:28,newStatus:30,newDays:90,newMin:4,plateau:3,planAge:30,feedback:3,pauseDays:30,reachHold:7,markDays:28};
 const TH_LABEL={gap:'Пауза — риск, дней',gapLost:'Пауза — пропал, дней',newStatus:'Новичок — статус, дней',newDays:'Окно наблюдения новичка, дней',newMin:'Тренировок в первый месяц',plateau:'Плато, тренировок подряд',planAge:'План устарел, дней',feedback:'Без обратной связи, дней',pauseDays:'Пауза действует, дней',reachHold:'Ответ держит сигнал, дней',markDays:'Отмечать занятия, дней назад'};
 const ANSWERS={work:'Работаем',talk:'Нужен разговор',leave:'Уходит',pause:'Пауза'};
 const STATUS={new:'Новичок',ok:'Ходит',risk:'Просел',lost:'Пропал',pause:'Пауза'};
 /* Ответ тренера на сигнал (И-9): сигнал закрывается фактом, а не исчезновением. */
 const REACH={wrote:'Написал',called:'Позвонил',agreed:'Договорились',silent:'Не отвечает'};
 // Отметка занятия — факт тренера: пришёл человек или нет, знает он, а не дневник клиента.
 const MARKS={held:'Состоялось',missed:'Не пришёл',off:'Отменили'};
 // Слово статуса строчными — для текста сводки: форма слова тоже принадлежит домену.
 const statusText=st=>(STATUS[st]||'').toLowerCase();

 const clone=o=>JSON.parse(JSON.stringify(o));
 const empty=()=>({version:VERSION,profile:{name:'',club:'',started:D.today(),startedAt:D.hm(),thresholds:{...TH}},clients:[],weeks:[],trash:[]});
 /* Миграция базы (инвариант данных): форма меняется — поднимается версия, и появляется
    шаг «было → стало». Старые шаги остаются, чтобы любая старая копия дошла до текущей.
    v1 → v2: у клиента появились ответы на сигналы, отметки занятий и история плана. */
 const STEPS={
  1:s=>{const up=c=>{for(const k of ['notes','reaches','sessions','planLog'])if(!Array.isArray(c[k]))c[k]=[]};
   (s.clients||[]).forEach(up);(s.trash||[]).forEach(x=>x.item&&up(x.item));s.version=2;return s},
  /* v2 → v3: закрытие недели фиксирует сводку. У недель, закрытых прошлой сборкой, её нет —
     фиксируем по фактам на момент перехода: это лучшее, что можно восстановить честно. */
  2:s=>{for(const w of s.weeks||[])if(w.closedAt&&!w.report){const at=w.closedAt;w.closedAt=null;
    const r=weekReview(s,w.week);w.report=reviewText(s,w.week);w.snap={done:r.done,missed:r.missed,risk:r.risk.length,clients:r.rows.map(x=>x.client.id)};w.closedAt=at}
   s.version=3;return s},
 };
 function migrate(s){if(!s||typeof s!=='object'||!Array.isArray(s.clients))return s;
  if(typeof s.version!=='number')s.version=1;
  while(s.version<VERSION&&STEPS[s.version])s=STEPS[s.version](s);
  return s}
 const th=s=>({...TH,...(s.profile?.thresholds||{})});
 const client=(s,id)=>s.clients.find(c=>c.id===id)||null;
 const byName=(a,b)=>a.name.localeCompare(b.name);
 // Поиск по имени: без регистра и без разницы «е/ё» — сравнение слов принадлежит домену.
 const norm=s=>String(s||'').replace(/ё/g,'е').toLowerCase().trim();
 const match=(name,q)=>!norm(q)||norm(name).includes(norm(q));
 const plural2=(n,a,b,c)=>{const x=Math.abs(n)%100,y=x%10;return x>10&&x<20?c:y>1&&y<5?b:y===1?a:c};

 /* ——— клиент: факты из его дневника ———
    Закон времени (уточнение И-2): чтение «на дату t» видит только факты до t включительно.
    Статус прошлой недели не знает о тренировках, которые были после неё. */
 const done=(c,t=D.today())=>c.record.workouts.filter(w=>w.status==='done'&&w.date<=t).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
 /* Посещение — это тренировка в дневнике клиента ИЛИ отметка тренера «Состоялось».
    Пока нет синхронизации, дневник приходит копией и может отставать; тренер же видит
    человека в зале сам (И-1: факт записывается там, где произошёл). Сила, рекорды и
    плато считаются только по дневнику — это факты клиента; посещаемость — по обоим. */
 function visits(c,t=D.today()){const days=new Set(done(c,t).map(w=>w.date));
  for(const x of c.sessions||[])if(x.mark==='held'&&x.date<=t)days.add(x.date);
  return [...days].sort()}
 const lastWorkout=(c,t=D.today())=>{const v=visits(c,t);return v.length?{date:v[v.length-1]}:null};
 function gapDays(c,t=D.today()){const w=lastWorkout(c,t);return Math.max(0,D.daysBetween(w?w.date:c.since,t))}
 const sinceDays=(c,t=D.today())=>D.daysBetween(c.since,t);
 const firstMonth=(c,t=D.today())=>{const end=D.addDays(c.since,30);return visits(c,t).filter(d=>d<=end).length};
 // Последний ответ о клиенте при закрытии недели (до даты t): пауза держится, пока её не сняли.
 function lastAnswer(s,cid,t=D.today()){let out=null;for(const w of [...s.weeks].filter(w=>w.week<=t).sort((a,b)=>a.week.localeCompare(b.week)))if(w.answers[cid])out={answer:w.answers[cid],week:w.week};return out}
 /* Дата, на которую считается неделя: её последний день, а для идущей недели — сегодня.
    Сводка не считает риск на будущий четверг и не берёт тренировки после конца недели. */
 const weekDate=(week,t=D.today())=>{const end=D.addDays(week,6);return end<t?end:t<week?week:t};
 /* Пауза — решение тренера, но и оно не вечно: через pauseDays она кончается,
    и клиент возвращается в общий счёт со своим сигналом «пауза кончилась». */
 function pause(s,c,t=D.today()){const T=th(s),a=lastAnswer(s,c.id,t);
  if(!a||a.answer!=='pause')return null;
  // Отсчёт с конца той недели, на которой тренер поставил паузу; пока неделя идёт — ноль.
  const from=D.addDays(a.week,6),days=Math.max(0,D.daysBetween(from,t));
  return {from,days,left:T.pauseDays-days,over:days>T.pauseDays}}

 /* Состояние клиента. Порядок правил важен: пауза — решение тренера, она сильнее счётчиков,
    пока не кончилась; дальше «ещё не начинал», «пропал», «просел», «новичок», иначе «ходит». */
 function status(s,c,t=D.today()){const T=th(s),g=gapDays(c,t),p=pause(s,c,t);
  if(p&&!p.over)return 'pause';
  // Ни одной тренировки: человек не «перестал ходить», он ещё не начал.
  if(!lastWorkout(c,t))return sinceDays(c,t)>T.newDays?'lost':'new';
  if(g>=T.gapLost)return 'lost';
  if(g>=T.gap)return 'risk';
  if(sinceDays(c,t)<=T.newStatus)return 'new';
  return 'ok'}
 // Причина сигнала (Т-1): человеку всегда видно, из чего сложился статус.
 function why(s,c,t=D.today()){const T=th(s),g=gapDays(c,t),st=status(s,c,t),p=pause(s,c,t);
  if(st==='pause')return `на паузе ${p.days} ${plural2(p.days,'день','дня','дней')} из ${T.pauseDays}`;
  if(!lastWorkout(c,t)){const n=sinceDays(c,t);
   return st==='lost'?`ни одной тренировки за ${n} ${plural2(n,'день','дня','дней')}`:n?`ещё ни одной тренировки, с ${D.fmtShort(c.since)}`:'заведён сегодня, тренировок ещё нет'}
  if(st==='lost')return `не был ${g} ${plural2(g,'день','дня','дней')} при пороге ${T.gapLost}`;
  if(st==='risk')return `не был ${g} ${plural2(g,'день','дня','дней')} при пороге ${T.gap}`;
  if(st==='new'){const n=visits(c,t).length;return n<T.newMin?`новичок: ${n} ${plural2(n,'тренировка','тренировки','тренировок')} за ${sinceDays(c,t)} ${plural2(sinceDays(c,t),'день','дня','дней')} при норме ${T.newMin} в первый месяц`:`новичок, ${n} ${plural2(n,'тренировка','тренировки','тренировок')} с начала`}
  return g?`был ${g} ${plural2(g,'день','дня','дней')} назад`:'был сегодня'}
 // Новичок вне нормы — отдельный сигнал: 80 % отмен у тех, кто ходил реже нормы в первый месяц.
 const newAtRisk=(s,c,t=D.today())=>sinceDays(c,t)>=14&&sinceDays(c,t)<=th(s).newDays&&firstMonth(c,t)<th(s).newMin;

 /* ——— ответ тренера на сигнал (И-9) ———
    Ответ держит сигнал reachHold дней или до дня, на который договорились:
    пока ответ жив, сигнал не повторяется, но и не пропадает молча — он лежит в карточке. */
 function lastReach(c,t=D.today()){const l=[...(c.reaches||[])].filter(r=>r.date<=t).sort((a,b)=>(a.date+a.at).localeCompare(b.date+b.at));return l.length?l[l.length-1]:null}
 function activeReach(s,c,t=D.today()){const r=lastReach(c,t);if(!r)return null;
  const w=lastWorkout(c,t);
  if(w&&w.date>r.date)return null; // человек пришёл — ответ отработал
  const alive=r.until?r.until>=t:D.daysBetween(r.date,t)<th(s).reachHold;
  return alive?r:null}
 function reachText(r,t=D.today()){if(!r)return '';const n=D.daysBetween(r.date,t);
  const when=n===0?'сегодня':n===1?'вчера':`${n} ${plural2(n,'день','дня','дней')} назад`;
  return r.until?`${REACH[r.kind].toLowerCase()}: ждём ${D.fmtShort(r.until)}`:`${REACH[r.kind].toLowerCase()} ${when}`}

 /* ——— отметка занятия ———
    Факт тренировки пишет клиент (Т-3), но состоялось занятие или нет — знает тренер.
    Это его собственный факт: он не трогает дневник клиента. */
 const sessionMark=(c,wid)=>(c.sessions||[]).find(x=>x.wid===wid)||null;

 /* ——— история плана (И-2) ———
    План живёт в дневнике клиента одной записью с датой «с какого дня». Если тренер
    меняет план, прошлые дни должны остаться при прошлом плане: иначе прошлые занятия
    исчезают из смены и их нельзя отметить. Поэтому каждая правка кладёт прежнюю версию
    в историю тренера (planLog), а чтения прошлых дней берут ту версию, что действовала. */
 function recordOn(c,day){const log=c.planLog||[];if(!log.length)return c.record;
  const plans=[];
  for(const p of c.record.plans){if(!p.from||day>=p.from){plans.push(p);continue}
   const v=log.find(x=>x.planId===p.id&&x.from<=day&&day<=x.to);
   if(v)plans.push({...p,title:v.title,days:v.days,time:v.time,exercises:v.exercises,from:v.from})}
  return {...c.record,plans}}
 const scheduleOn=(c,day)=>D.schedule(recordOn(c,day),day,1).filter(w=>w.date===day);

 /* Неотмеченные занятия за окно наблюдения (markDays): прошедшие дни, по плану,
    без тренировки клиента и без отметки тренера. Дни паузы не спрашиваются. */
 function unconfirmed(s,c,t=D.today()){const out=[],T=th(s);
  for(let i=1;i<=T.markDays;i++){const day=D.addDays(t,-i);if(day<c.since)break;
   const p=pause(s,c,day);if(p&&!p.over)continue;
   for(const w of scheduleOn(c,day)){if(w.status==='done'||w.status==='skipped')continue;
    if(!sessionMark(c,w.id))out.push({date:day,wid:w.id,time:w.time})}}
  return out.sort((a,b)=>b.date.localeCompare(a.date))}

 /* Плато: последние N тренировок с этим упражнением без роста расчётного максимума.
    Считается по тем же функциям, что и «Сила» у клиента. */
 /* Плато считается после последней правки плана: тренер уже сменил схему — ждём
    новых N тренировок, а не повторяем сигнал, на который он ответил (И-9). */
 function plateau(s,c,t=D.today()){const T=th(s),out=[],since=planEdited(c,t)||'';
  for(const x of D.exerciseList(c.record)){const runs=D.strengthRuns(c.record,x.name,1e6).filter(r=>r.date<=t&&r.date>=since);
   if(runs.length<T.plateau)continue;const tail=runs.slice(-T.plateau);
   const grew=Math.max(...tail.map(r=>r.value))-tail[0].value;
   if(grew<=0.01)out.push({name:x.name,runs:tail.length,value:tail[tail.length-1].value,down:tail[tail.length-1].value<tail[0].value-0.01})}
  return out}
 // Последняя правка плана (любой: дни, время, упражнения) — дата, с которой действует новая версия.
 function planEdited(c,t=D.today()){const l=[];
  for(const p of c.record.plans){if(!p.from||p.from<=t){if(p.from)l.push(p.from);continue}
   // на дату t действовала прежняя версия — её дата начала и есть «последняя правка на t»
   const v=(c.planLog||[]).find(x=>x.planId===p.id&&x.from<=t&&t<=x.to);if(v)l.push(v.from)}
  l.sort();return l.length?l[l.length-1]:null}
 // Возраст плана: сколько дней назад его последний раз меняли (план — факт тренера).
 function planAge(c,t=D.today()){const e=planEdited(c,t);return e?D.daysBetween(e,t):null}
 // Привычки за период — одним счётом по всем привычкам клиента.
 function habits(c,days=7,t=D.today()){let due=0,hit=0;const from=D.addDays(t,-days+1);
  for(const h of c.record.habits){if(h.archived)continue;const r=D.habitStats(c.record,h,from,t);due+=r.due;hit+=r.hit}
  return {due,hit,pct:due?Math.round(hit/due*100):null}}
 // Тренировка без обратной связи: сделана, но ни самочувствия, ни заметки.
 function noFeedback(s,c,t=D.today()){const T=th(s);
  return done(c,t).filter(w=>!w.feel&&!c.record.notes.some(n=>n.wid===w.id)&&D.daysBetween(w.date,t)<=14&&D.daysBetween(w.date,t)>=T.feedback)}
 // Рост за период — доказательство к разговору (Т-5).
 function progress(s,c,weeks=4,t=D.today()){const from=D.addDays(t,-weeks*7);
  const ws=done(c,t).filter(w=>w.date>from);
  const records=ws.flatMap(w=>D.records(c.record,w).map(r=>({...r,date:w.date})));
  const lifts=D.exerciseList(c.record).map(x=>{const runs=D.strengthRuns(c.record,x.name,1e6).filter(r=>r.date>from&&r.date<=t);
   return runs.length>1?{name:x.name,gain:D.round(runs[runs.length-1].value-runs[0].value,10)}:null}).filter(Boolean).sort((a,b)=>b.gain-a.gain);
  const wt=D.metricSeries(c.record,'weight').filter(m=>m.date>from&&m.date<=t);
  return {workouts:ws.length,records,lifts,weight:wt.length>1?D.round(wt[wt.length-1].value-wt[0].value,10):null,habits:habits(c,weeks*7,t)}}

 /* Шаг прибавки зависит от снаряда: у штанги мельче диска не прибавишь, у блока шаг плитки,
    гантели идут парами. Подсказка должна называть реальный шаг, а не один и тот же. */
 function stepOf(name){const x=String(name).replace(/ё/g,'е').toLowerCase();
  if(/гантел/.test(x))return 2;
  if(/блок|тренажер|тяга верхнего|жим ногами/.test(x))return 5;
  return 2.5}

 /* «Что дать сегодня» (Г-1): по каждому упражнению плана — что было в прошлый раз
    и что с ним делать. Ничего не выдумывает: только факты клиента. */
 function prep(s,c,t=D.today()){const plan=nextSession(s,c,t),pl=plateau(s,c,t);
  const seen=[];for(const w of c.record.workouts.filter(w=>w.date<t).sort((a,b)=>b.date.localeCompare(a.date)))for(const e of w.exercises)if(!seen.some(n=>D.sameName(n,e.name)))seen.push(e.name);
  const names=plan?plan.exercises.map(e=>e.name):seen.slice(0,4);
  // «Прошлый раз» — только подходы до дня t: чтение на дату не видит будущего (И-2).
  const lines=names.map(name=>{const last=D.lastSets(c.record,name,null,t);const flat=pl.find(p=>D.sameName(p.name,name));
   const q=last?last.sets[last.sets.length-1]:null;
   // Числа в тексте — по-русски, с запятой: «8 × 72,5», как везде в интерфейсе.
   const num=v=>String(D.round(v,10)).replace('.',',');
   return {name,last:q?`${num(q.reps)} × ${num(q.weight)}`:null,date:last?last.date:null,
    hint:flat?(flat.down?'вес снижен — держим и смотрим':`без роста ${flat.runs} тренировки — сменить схему`):last&&last.sets.every(x=>(x.reps||0)>=(q?.reps||0))?`можно +${String(stepOf(name)).replace('.',',')}`:'повторить вес'}});
  const complaints=c.record.notes.filter(n=>n.source==='workout'&&n.date<=t).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,2);
  const note=(c.notes||[]).filter(n=>n.date<=t).slice(-1)[0]||null;
  /* Флажок памяти (Т-6): свежие слова клиента или заметка тренера за три недели —
     то, что нужно помнить до начала занятия, видно прямо в строке смены. */
  const fresh=[complaints[0],note].filter(x=>x&&D.daysBetween(x.date,t)<=21).sort((a,b)=>b.date.localeCompare(a.date))[0]||null;
  return {session:plan,lines,complaints,habits:habits(c,7,t),note,flag:fresh?fresh.text:null}}
 // Ближайшая тренировка клиента: из его же расписания (план ставит дни).
 // На дату t всё, что позже t, ещё впереди — даже если потом клиент это провёл (закон среза).
 function nextSession(s,c,t=D.today()){const r={...recordOn(c,t),workouts:c.record.workouts.filter(w=>w.date<=t)};
  return D.schedule(r,t,7).filter(w=>w.status!=='done'&&w.status!=='skipped')[0]||null}

 // ——— смена тренера ———
 /* Кто сегодня: у каждого клиента спрашиваем его расписание и берём этот день.
    Тренер ничего не назначает руками — день собирается из планов клиентов (И-1). */
 function shift(s,date=D.today()){const out=[];
  for(const c of s.clients){if(date<c.since)continue;
   // Пауза — решение тренера: занятие остаётся в расписании, но его не ждут.
   const p=pause(s,c,date>D.today()?D.today():date),paused=!!(p&&!p.over);
   for(const w of scheduleOn(c,date))
    out.push({client:c,workout:w,time:w.time,status:w.status,mark:sessionMark(c,w.id)?.mark||null,paused})}
  return out.sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'))}
 // Нагрузка недели: сколько занятий ждём в каждый день (паузы не считаются).
 function weekLoad(s,date=D.today()){return D.week(date).map(d=>{const l=shift(s,d);
  return {date:d,n:l.filter(x=>!x.paused).length,open:d<D.today()?l.filter(x=>!x.paused&&x.status!=='done'&&x.status!=='skipped'&&!x.mark).length:0}})}

 // ——— неделя ———
 const weekOf=(s,week)=>s.weeks.find(w=>w.week===week)||null;
 const weekClosed=(s,week)=>!!weekOf(s,week)?.closedAt;
 // Дата внутри закрытой недели заморожена для любых фактов, не только для ответов (И-4).
 const frozen=(s,date)=>!!date&&weekClosed(s,D.weekStart(date));
 // Прошедшие незакрытые недели: с первой недели, где был хотя бы один клиент.
 function openWeeks(s,t=D.today()){if(!s.clients.length)return [];
  const first=D.weekStart([...s.clients.map(c=>c.since)].sort()[0]),cur=D.weekStart(t),out=[];
  for(let w=first;w<cur;w=D.addDays(w,7))if(!weekClosed(s,w))out.push(w);
  return out}
 /* Можно ли закрыть неделю — и если нет, то почему, человеческими словами.
    Будущее не спрашивают: закрыть можно только неделю, чей последний день наступил. */
 function closeState(s,week,t=D.today()){
  if(weekClosed(s,week))return {ok:false,why:'Неделя уже закрыта'};
  if(week>D.weekStart(t))return {ok:false,why:'Будущую неделю не закрывают'};
  const end=D.addDays(week,6);if(t<end)return {ok:false,why:`Неделю закрывают с её последнего дня — ${D.fmtShort(end)}`};
  const n=weekReview(s,week).unanswered.length;
  return n?{ok:false,why:`Сначала ответ по каждому: без ответа ${n}`}:{ok:true,why:''}}
 /* Разбор недели (И-5): всё считается из фактов в момент открытия, ничего не хранится.
    Неделя закрывается только ответом по каждому клиенту (Т-4). */
 function weekReview(s,date=D.today()){const week=D.weekStart(date),days=D.week(week),wk=weekOf(s,week);
  date=weekDate(week); // статус — на конец недели или на сегодня, но не на будущее
  /* В неделе участвуют те, кто уже был клиентом к её концу: заведённых позже не спрашивают.
     У закрытой недели состав заморожен: те, по кому дан ответ, включая удалённых потом. */
  const pool=wk?.closedAt?[...s.clients,...s.trash.map(x=>x.item).filter(Boolean)].filter(c=>c.id in (wk.answers||{}))
   :s.clients.filter(c=>c.since<=days[6]);
  const rows=pool.map(c=>{const ws=visits(c,date).filter(d=>days.includes(d));
   return {client:c,workouts:ws.length,status:status(s,c,date),why:why(s,c,date),answer:wk?.answers?.[c.id]||null,
    reaches:(c.reaches||[]).filter(r=>days.includes(r.date)),
    missed:(c.sessions||[]).filter(x=>x.mark==='missed'&&days.includes(x.date)).length}}).sort((a,b)=>byName(a.client,b.client));
  const doneN=rows.reduce((a,r)=>a+r.workouts,0),missedN=rows.reduce((a,r)=>a+r.missed,0);
  // После закрытия могли прийти новые факты (поздняя копия дневника): называем разницу, не переписывая.
  const after=[];if(wk?.closedAt&&wk.snap){if(doneN!==wk.snap.done)after.push(`занятий ${doneN>wk.snap.done?'+':''}${doneN-wk.snap.done}`);
   if(missedN!==wk.snap.missed)after.push(`неявок ${missedN>wk.snap.missed?'+':''}${missedN-wk.snap.missed}`);
   const riskN=rows.filter(r=>r.status==='risk'||r.status==='lost').length;
   if(riskN!==wk.snap.risk)after.push(`в риске сейчас ${riskN}, в сводке было ${wk.snap.risk}`)}
  return {week,date,rows,after,snap:wk?.closedAt?wk.snap||null:null,done:doneN,
   risk:rows.filter(r=>r.status==='risk'||r.status==='lost'),
   missed:rows.reduce((a,r)=>a+r.missed,0),
   reached:rows.filter(r=>r.reaches.length),
   unanswered:rows.filter(r=>!r.answer),closed:weekClosed(s,week)}}
 /* Текст для управляющего: собирается сам, тренер только отправляет.
    «Что сделано по риску» — из ответов тренера за эту неделю (И-9), не из памяти. */
 function reviewText(s,date=D.today()){const wk=weekOf(s,D.weekStart(date));
  if(wk?.closedAt&&wk.report)return wk.report; // закрытая неделя — зафиксированный текст (И-4)
  const r=weekReview(s,date);
  const line=x=>`${x.client.name}: ${statusText(x.status)}${x.answer?` — ${(ANSWERS[x.answer]||'').toLowerCase()}`:''}`;
  const didLine=x=>`${x.client.name}: ${x.reaches.map(v=>`${REACH[v.kind].toLowerCase()} ${D.fmtShort(v.date)}${v.until?`, ждём ${D.fmtShort(v.until)}`:''}`).join('; ')}`;
  return [`Неделя с ${D.fmtShort(r.week)}${r.date<D.addDays(r.week,6)?` (на ${D.fmtShort(r.date)})`:''}`,`Занятий проведено: ${r.done}`,
   r.missed?`Не пришли: ${r.missed}`:'',`Клиентов: ${r.rows.length}`,
   r.risk.length?`В риске (${r.risk.length}):`:'В риске никого.',...r.risk.map(line),
   r.reached.length?'Что сделано:':'',...r.reached.map(didLine),
   r.rows.filter(x=>x.answer==='talk'||x.answer==='leave').length?'Разговоры:':'',
   ...r.rows.filter(x=>x.answer==='talk'||x.answer==='leave').map(line)].filter(Boolean).join('\n')}

 /* Хвосты тренера (И-3, Т-1): всё, что зависло, с причиной и порогом.
    Ни один сигнал не появляется без числа, по которому он сработал. */
 /* Порядок разговора: сначала люди, которые уходят, потом бумажная работа.
    Кончившаяся пауза и новичок вне нормы — про людей, неотмеченное занятие — про учёт. */
 const RANK={gap:0,pause:1,new:2,session:3,week:4,plateau:5,feedback:6,plan:7};
 function tails(s,date=D.today()){const T=th(s),out=[];
  for(const c of [...s.clients].sort(byName)){const st=status(s,c,date),mine=[];
   const held=activeReach(s,c,date); // ответ жив — сигнал о человеке не повторяем (И-9)
   const p=pause(s,c,date);
   if(p&&p.over)mine.push({kind:'pause',why:`пауза кончилась: ${p.days} ${plural2(p.days,'день','дня','дней')} при пороге ${T.pauseDays}`,days:p.days});
   else if(st==='risk'||st==='lost')mine.push({kind:'gap',why:why(s,c,date),days:gapDays(c,date)});
   else if(newAtRisk(s,c,date))mine.push({kind:'new',why:why(s,c,date)});
   const un=unconfirmed(s,c,date);
   if(un.length)mine.push({kind:'session',why:un.length===1?`занятие ${D.fmtShort(un[0].date)} не отмечено`:`${un.length} ${plural2(un.length,'занятие','занятия','занятий')} не ${un.length%10===1&&un.length%100!==11?'отмечено':'отмечены'}, с ${D.fmtShort(un[un.length-1].date)}`,days:D.daysBetween(un[0].date,date)});
   /* Плато, план и обратная связь — работа с программой. Тому, кто не ходит,
      она не поможет: пока человек в риске или на паузе, эти сигналы молчат. */
   if(st==='ok'||st==='new'){
    const pl=plateau(s,c,date);if(pl.length)mine.push({kind:'plateau',why:`${pl[0].name}: ${T.plateau} тренировки без роста`});
    const nf=noFeedback(s,c,date);if(nf.length)mine.push({kind:'feedback',why:`${nf.length} ${nf.length===1?'тренировка':'тренировки'} без обратной связи`});
    const age=planAge(c,date);if(age!==null&&age>T.planAge)mine.push({kind:'plan',why:`план не менялся ${age} дней при пороге ${T.planAge}`});
   }
   const list=mine.filter(x=>!(held&&(x.kind==='gap'||x.kind==='new'||x.kind==='pause')))
    .sort((a,b)=>RANK[a.kind]-RANK[b.kind]);
   if(!list.length)continue;
   // Одна строка на человека: главная причина, остальные — числом рядом (И-3).
   const top=list[0];
   out.push({kind:top.kind,id:c.id,name:c.name,why:top.why,days:top.days||0,more:list.length-1,
    all:list.map(x=>x.why),reach:held?reachText(held,date):null})}
  /* Незакрытые недели — все, а не только прошлая: старый хвост не исчезает молча (И-3).
     Одной строкой: самая старая неделя и число остальных. */
  const open=openWeeks(s,date);
  if(open.length)out.push({kind:'week',id:open[0],name:`Неделя с ${D.fmtShort(open[0])}`,why:open.length>1?`не закрыта, и ещё ${open.length-1} ${plural2(open.length-1,'неделя','недели','недель')} за ней`:'не закрыта: нет ответа по клиентам',more:0,all:[],days:D.daysBetween(open[0],date)});
  // Сортировка всего списка — по тому же рангу.
  return out.sort((a,b)=>(RANK[a.kind]-RANK[b.kind])||((b.days||0)-(a.days||0)))}

 /* ——— проверка гипотезы (COACH-HYPOTHESIS §4) ———
    Дашборд для материалов должен уметь показать, работает ли он сам. Всё считается
    из фактов тренера — ответов на сигналы, отметок, закрытий недель — и не хранится. */
 function hypothesis(s,t=D.today()){const T=th(s),delays=[];let stale=0,marked=0,open=0;
  for(const c of s.clients){
   for(const r of (c.reaches||[]).filter(r=>r.date<=t)){const lw=lastWorkout(c,r.date);
    const start=lw?D.addDays(lw.date,T.gap):D.addDays(c.since,14);
    delays.push(Math.max(0,D.daysBetween(start,r.date)))}
   const st=status(s,c,t);
   if((st==='risk'||st==='lost')&&!activeReach(s,c,t)&&gapDays(c,t)-T.gap>14)stale++;
   marked+=(c.sessions||[]).filter(x=>x.date<=t&&D.daysBetween(x.date,t)<=T.markDays).length;
   open+=unconfirmed(s,c,t).length}
  delays.sort((a,b)=>a-b);
  const ended=[];if(s.clients.length){const first=D.weekStart([...s.clients.map(c=>c.since)].sort()[0]);
   for(let w=first;D.addDays(w,6)<t;w=D.addDays(w,7))ended.push(w)}
  /* «Вовремя» — закрыта в течение трёх дней после конца. Неделя, чей срок ещё идёт,
     не считается ни вовремя, ни с опозданием: её судить рано. */
  const closedBy=w=>{const x=weekOf(s,w);return x?.closedAt&&x.closedAt.slice(0,10)<=t?x.closedAt.slice(0,10):null};
  const onTimeOf=w=>{const c=closedBy(w);return !!(c&&c<=D.addDays(w,9))};
  const due=ended.filter(w=>D.addDays(w,9)<t||onTimeOf(w));
  const onTime=due.filter(onTimeOf).length;
  const closed=ended.filter(closedBy).length;
  return {delay:delays.length?{median:delays[Math.floor(delays.length/2)],n:delays.length}:null,stale,
   weeks:{ended:ended.length,due:due.length,onTime,late:closed-onTime,open:ended.length-closed},marks:{marked,open}}}
 /* Свежесть дневника клиента: копия приходит руками, и всё, что после неё, дашборд не видит.
    Точность сигнала честно ограничена этой датой — она показывается рядом со статусом. */
 function copyAge(c,t=D.today()){if(!c.copyAt)return null;return D.daysBetween(c.copyAt,t)}
 // Та же ли это копия, что уже загружена: имя и дата начала из дневника клиента.
 /* Та же ли это копия, что уже загружена. При первой загрузке дашборд запоминает ключ копии —
    имя и дату начала так, как они записаны в самом дневнике клиента (copyKey). Узнаём только
    по этому ключу: имя, которое клиенту дал дашборд, не в счёт — иначе безымянный дневник
    «узнаёт» любого клиента с той же датой начала. */
 const keyOf=r=>({name:norm(r?.profile?.name),started:r?.profile?.started||''});
 /* У дневника клиента нет своего id (это долг общего домена — до базы). Поэтому личность
    копии дашборд не угадывает: он предлагает кандидатов с причиной, а решает тренер.
    Сам — только в очевидном случае (autoMatch): тот же ключ, ничего не теряется, не старше. */
 function copyCandidates(s,record){const k=keyOf(record),out=[];
  for(const c of s.clients){const why=[];
   if(c.copyKey&&c.copyKey.name===k.name&&c.copyKey.started===k.started)why.push('та же копия, что загружали раньше');
   else{if(k.name&&norm(c.record.profile?.name||c.name)===k.name)why.push('то же имя');
    else if(k.name&&norm(c.name)===k.name)why.push('так вы его назвали');
    if(k.started&&(c.record.profile?.started===k.started||c.since===k.started))why.push('та же дата начала')}
   if(why.length)out.push({id:c.id,name:c.name,why,score:why.includes('та же копия, что загружали раньше')?3:why.length,diff:copyDiff(c,record)})}
  return out.sort((a,b)=>b.score-a.score)}
 function findCopy(s,record){const top=copyCandidates(s,record)[0];return top&&top.score===3?client(s,top.id):null}
 function autoMatch(s,record){const top=copyCandidates(s,record);
  const exact=top.filter(x=>x.score===3);
  return exact.length===1&&exact[0].diff.clean?exact[0].id:null}
 /* Что изменится, если заменить дневник клиента этой копией: что пропадёт и что добавится. */
 /* Что изменится, если заменить дневник клиента этой копией. Сама («чисто») копия
    принимается, только если она лишь добавляет: ничего не пропадает и ничего уже
    загруженного не меняется. Любая правка прошлого — решение тренера в шторке. */
 function copyDiff(c,record){const r=compare(c.record,record),older=activity(record)<activity(c.record);
  const words={workouts:['тренировка','тренировки','тренировок'],notes:['заметка','заметки','заметок'],metrics:['замер','замера','замеров'],habits:['привычка','привычки','привычек'],log:['отметка привычки','отметки привычек','отметок привычек'],
   todos:['дело','дела','дел'],closed:['закрытый день','закрытых дня','закрытых дней'],questions:['вопрос тренеру','вопроса тренеру','вопросов тренеру'],trash:['запись корзины','записи корзины','записей корзины'],
   profile:['поле профиля','поля профиля','полей профиля'],coach:['поле «мой тренер»','поля «мой тренер»','полей «мой тренер»']};
  const say=o=>Object.entries(o).map(([k,n])=>`${n} ${words[k]?plural2(n,...words[k]):`изм. в «${k}»`}`);
  const lost=say(r.lost),changed=say(r.changed),added=say(r.added);
  return {clean:!lost.length&&!changed.length&&!older,lost,changed,added,older,gained:r.added.workouts||0}}
 /* Что из загруженного пропало бы при замене копией: тренировки, заметки, замеры, привычки —
    по id; отметки привычек — по дням. Копия должна содержать всё, что уже есть. */
 /* Сравнение копии с загруженным дневником по фактам: что пропадёт, что изменится,
    что добавится. Тренировки, заметки, замеры, привычки — по id; отметки привычек — по дням. */
 function compare(cur,copy){const r={lost:{},changed:{},added:{}},inc=(o,k)=>{o[k]=(o[k]||0)+1};
  const JS=x=>JSON.stringify(x);
  /* Всё поле дневника сравнивается, кроме плана (он тренерский) и служебного: ничего
     не должно поменяться молча. Списки с id — по id; списки значений (закрытые дни) —
     по значению; вложенные объекты (профиль) — по полям. */
  const SKIP=new Set(['plans','version']);
  for(const k of new Set([...Object.keys(cur||{}),...Object.keys(copy||{})])){if(SKIP.has(k))continue;
   const a=cur[k],b=copy[k];
   if(k==='habits'){const A=new Map((a||[]).map(x=>[x.id,x])),Bm=new Map((b||[]).map(x=>[x.id,x]));
    for(const [id,x] of A){const y=Bm.get(id);if(!y){inc(r.lost,k);continue}const {log:la,...ha}=x,{log:lb,...hb}=y;if(JS(ha)!==JS(hb))inc(r.changed,k);
     for(const d of Object.keys(la||{})){if(!(d in (lb||{})))inc(r.lost,'log');else if(JS(la[d])!==JS(lb[d]))inc(r.changed,'log')}
     for(const d of Object.keys(lb||{}))if(!(d in (la||{})))inc(r.added,'log')}
    for(const [id,y] of Bm)if(!A.has(id)){inc(r.added,k);for(const d of Object.keys(y.log||{}))inc(r.added,'log')}
    continue}
   if(Array.isArray(a)||Array.isArray(b)){const A=a||[],Bl=b||[];
    if([...A,...Bl].every(x=>x&&typeof x==='object'&&'id' in x)){const Am=new Map(A.map(x=>[x.id,x])),Bm=new Map(Bl.map(x=>[x.id,x]));
     for(const [id,x] of Am){const y=Bm.get(id);if(!y)inc(r.lost,k);else if(JS(x)!==JS(y))inc(r.changed,k)}
     for(const id of Bm.keys())if(!Am.has(id))inc(r.added,k)}
    else{const As=new Set(A.map(JS)),Bs=new Set(Bl.map(JS));for(const x of As)if(!Bs.has(x))inc(r.lost,k);for(const x of Bs)if(!As.has(x))inc(r.added,k)}
    continue}
   if(a&&b&&typeof a==='object'&&typeof b==='object'){
    for(const f of new Set([...Object.keys(a),...Object.keys(b)])){
     if(k==='profile'&&(f==='onboarded'||(f==='name'&&!String(b.name||'').trim())))continue; // служебное дашборда
     if(JS(a[f])!==JS(b[f]))inc(r.changed,k)}
    continue}
   if(JS(a)!==JS(b))inc(r.changed,k)}
  return r}
 const lost=(cur,copy)=>Object.entries(compare(cur,copy).lost).map(([k,n])=>`${k}:${n}`);
 /* Последняя активность в дневнике: самая поздняя дата любого факта клиента —
    тренировки, отметки привычки, заметки, замера. По ней судим, какая копия свежее. */
 function activity(r){let a='';const up=d=>{if(d&&d>a)a=d};
  for(const w of r.workouts||[]){up(w.date);for(const e of w.exercises||[])for(const q of e.sets||[])if(q.doneAt)up(String(q.doneAt).slice(0,10))}
  for(const h of r.habits||[])for(const k of Object.keys(h.log||{}))up(k);
  for(const n of r.notes||[])up(n.date);for(const m of r.metrics||[])up(m.date);
  return a}

 /* ——— «Спутник» тренера (И-7, LEARN-MECHANISM.md клиента) ———
    Каталог шагов по главам. done(s) — условие на данных: тренер уже сделал это сам,
    и шаг засчитывается молча. Шаги без done засчитываются флагом-действием (profile.learn).
    when(s,t,L) — когда шаг доступен: про то, что сейчас не пригодится, не рассказываем. */
 const CHAPTERS={shift:'Смена',signal:'Сигналы',card:'Карточка',marks:'Учёт',plan:'План',week:'Неделя',safe:'Сохранность'};
 const hasSignal=(s,t)=>tails(s,t).some(x=>['gap','new','pause'].includes(x.kind));
 const LEARN=[
  {id:'shift.prep',ch:'shift',when:(s,t)=>shift(s,t).length>0},
  {id:'shift.card',ch:'shift',when:s=>s.clients.length>0},
  {id:'signal.reach',ch:'signal',done:s=>s.clients.some(c=>(c.reaches||[]).length),when:(s,t)=>hasSignal(s,t)},
  {id:'signal.later',ch:'signal',when:(s,t,L)=>L.has('signal.reach')&&tails(s,t).length>1},
  {id:'card.note',ch:'card',done:s=>s.clients.some(c=>(c.notes||[]).length),when:s=>s.clients.length>0},
  {id:'card.talk',ch:'card',when:s=>s.clients.some(c=>done(c).length>0)},
  {id:'marks.mark',ch:'marks',done:s=>s.clients.some(c=>(c.sessions||[]).length),when:(s,t)=>s.clients.some(c=>unconfirmed(s,c,t).length)},
  {id:'marks.day',ch:'marks',when:(s,t,L)=>L.has('shift.card')},
  {id:'plan.edit',ch:'plan',done:s=>s.clients.some(c=>(c.planLog||[]).length),when:s=>s.clients.length>0},
  {id:'week.answer',ch:'week',done:s=>s.weeks.some(w=>Object.keys(w.answers||{}).length),when:s=>s.clients.length>0},
  {id:'week.close',ch:'week',done:s=>s.weeks.some(w=>w.closedAt&&w.report),when:(s,t,L)=>L.has('week.answer')},
  {id:'week.copy',ch:'week',when:(s,t,L)=>L.has('week.answer')},
  {id:'safe.copy',ch:'safe',when:s=>s.clients.length>0},
  {id:'safe.th',ch:'safe',when:(s,t,L)=>L.has('signal.reach')},
 ];
 // Освоено: отмечено в profile.learn датой или видно по данным. «skip» — пропущено, но не освоено.
 function learned(s){const L=s.profile.learn||{},out=new Set();for(const x of LEARN)if(D.isDate(L[x.id])||(x.done&&x.done(s)))out.add(x.id);return out}
 const learnAvail=(s,x,L,t=D.today())=>!x.when||x.when(s,t,L);

 // ——— проверка: запись, не прошедшая её, не сохраняется ———
 function validate(s){const err=[],need=(c,m)=>{if(!c)err.push(m)};
  if(!s||typeof s!=='object')return ['База пустая'];
  need(s.version===VERSION,'Копия от другой версии дашборда');
  need(s.profile&&typeof s.profile.name==='string','Профиль тренера');
  for(const k of ['clients','weeks','trash'])need(Array.isArray(s[k]),`Нет списка ${k}`);
  if(err.length)return err;
  const ids=new Set();
  for(const c of s.clients){need(typeof c.id==='string'&&c.id,'Клиент без id');need(!ids.has(c.id),'Повтор клиента');ids.add(c.id);
   need(typeof c.name==='string'&&c.name.trim(),'Назовите клиента');need(D.isDate(c.since),'Клиент: дата начала');
   need(Array.isArray(c.notes),'Клиент: заметки');
   need(Array.isArray(c.reaches),'Клиент: ответы тренера');need(Array.isArray(c.sessions),'Клиент: отметки занятий');
   for(const r of c.reaches||[]){need(r.kind in REACH,'Ответ: неизвестный вид');need(D.isDate(r.date),'Ответ: дата');
    need(!r.until||D.isDate(r.until),'Ответ: дата договорённости')}
   for(const x of c.sessions||[]){need(x.mark in MARKS,'Отметка: неизвестный вид');need(D.isDate(x.date),'Отметка: дата');
    need(typeof x.wid==='string'&&x.wid,'Отметка: занятие')}
   need(Array.isArray(c.planLog),'Клиент: история плана');need(!c.copyAt||D.isDate(c.copyAt),'Клиент: дата копии');
   for(const v of c.planLog||[])need(D.isDate(v.from)&&D.isDate(v.to)&&v.from<=v.to&&Array.isArray(v.days),'История плана: версия');
   const e=D.validate(c.record);if(e.length)err.push(`${c.name}: ${e[0]}`)}
  /* Ответы недели ссылаются на клиентов — живых или лежащих в корзине: мягкое удаление
     не должно ломать закрытую историю, и клиент возвращается вместе с ней. */
  const known=new Set([...ids,...s.trash.filter(x=>x.item?.id).map(x=>x.item.id)]);
  for(const w of s.weeks){need(D.isDate(w.week),'Неделя: дата');
   need(!w.closedAt||(typeof w.report==='string'&&w.snap&&typeof w.snap==='object'),'Закрытая неделя без зафиксированной сводки');need(w.answers&&typeof w.answers==='object','Неделя: ответы');
   for(const [cid,a] of Object.entries(w.answers||{}))need(known.has(cid)&&a in ANSWERS,'Ответ недели ссылается на неизвестного клиента')}
  if(s.profile.learn!=null)need(typeof s.profile.learn==='object'&&Object.entries(s.profile.learn).every(([k,v])=>LEARN.some(x=>x.id===k)&&(D.isDate(v)||v==='skip')),'Знакомство: отметки');
  const T=th(s);for(const [k,v] of Object.entries(T))need(typeof v==='number'&&v>0&&k in TH,`Порог «${TH_LABEL[k]||k}» — число больше нуля`);
  return err}

 /* ——— операции ———
    Всё, что меняет данные, живёт здесь: экран только вызывает. Тренер пишет
    свои факты (план, заметка, ответ недели) и заводит клиентов; подходы, привычки
    и замеры клиента он не трогает (Т-3). */
 const ops={
  addClient(s,{name,record,since}){const c={id:D.uid('c'),name:name.trim(),since:since||record?.profile?.started||D.today(),notes:[],reaches:[],sessions:[],planLog:[],record:record||D.empty()};
   // дневник пришёл копией — запоминаем, от какого она дня и как её узнать в следующий раз
   if(record){c.copyAt=D.today();c.copyKey=keyOf(record)}
   c.record.profile.name=c.record.profile.name||c.name;c.record.profile.onboarded=true;s.clients.push(c);return c.id},
  renameClient(s,id,name){const c=client(s,id);if(!c)return false;c.name=name.trim();return true},
  editClient(s,id,{name,since}){const c=client(s,id);if(!c||!String(name||'').trim())return false;
   if(since!==undefined&&!D.isDate(since))return false;
   c.name=name.trim();if(since)c.since=since;return true},
  removeClient(s,id){const i=s.clients.findIndex(c=>c.id===id);if(i<0)return null;const [c]=s.clients.splice(i,1);
   s.trash.push({id:D.uid('x'),kind:'client',item:c,deletedAt:D.stamp()});return c},
  restore(s,tid){const i=s.trash.findIndex(x=>x.id===tid);if(i<0)return false;const [x]=s.trash.splice(i,1);s.clients.push(x.item);return true},
  note(s,id,text){const c=client(s,id);if(!c||!text.trim())return null;const n={id:D.uid('n'),date:D.today(),text:text.trim(),at:D.stamp()};c.notes.push(n);return n.id},
  delNote(s,id,nid){const c=client(s,id);if(!c)return false;c.notes=c.notes.filter(n=>n.id!==nid);return true},
  /* Ответ на сигнал (И-9): факт тренера с датой. Сигнал после него молчит до нового
     события или до даты, на которую договорились, — но сам ответ остаётся в карточке. */
  /* Ответ на сигнал (И-9). Границы: «ждём до» — не раньше завтра и не дальше срока паузы:
     договорённость на год — это не ответ, а способ заглушить сигнал. */
  reach(s,id,{kind,text,until}){const c=client(s,id);if(!c||!(kind in REACH))return null;
   const t=D.today();if(frozen(s,t))return null;
   if(until&&(!D.isDate(until)||until<=t||D.daysBetween(t,until)>th(s).pauseDays))return null;
   const r={id:D.uid('r'),date:t,kind,text:(text||'').trim(),until:until||null,at:D.stamp()};
   c.reaches.push(r);return r.id},
  delReach(s,id,rid){const c=client(s,id);if(!c)return false;const r=c.reaches.find(x=>x.id===rid);
   if(!r||frozen(s,r.date))return false;c.reaches=c.reaches.filter(x=>x.id!==rid);return true},
  /* Отметка занятия — факт тренера: дневник клиента при этом не меняется (Т-3).
     Связь проверяется: отметить можно только занятие, которое было в расписании
     в этот день, не в будущем и не в закрытой неделе (И-4). */
  markSession(s,id,wid,date,mark){const c=client(s,id);if(!c||!(mark in MARKS)||!D.isDate(date)||!wid)return false;
   if(date>D.today()||frozen(s,date))return false;
   const w=scheduleOn(c,date).find(x=>x.id===wid);
   if(!w||w.status==='done')return false; // проведённую тренировку клиент уже отметил сам
   c.sessions=c.sessions.filter(x=>x.wid!==wid);
   c.sessions.push({id:D.uid('v'),wid,date,mark,at:D.stamp()});return true},
  unmarkSession(s,id,wid){const c=client(s,id);if(!c)return false;const x=c.sessions.find(v=>v.wid===wid);
   if(!x||frozen(s,x.date))return false;c.sessions=c.sessions.filter(v=>v.wid!==wid);return true},
  /* Все неотмеченные занятия клиента — одним ответом: пропавшего не отмечают по одному. */
  markAll(s,id,mark){const c=client(s,id);if(!c||!(mark in MARKS))return 0;let n=0;
   for(const x of unconfirmed(s,c))if(ops.markSession(s,id,x.wid,x.date,mark))n++;return n},
  /* План — факт тренера, но живёт в дневнике клиента: это его расписание.
     Любая правка действует с сегодняшнего дня (И-2): прежняя версия уходит в историю
     тренера, поэтому прошлые дни остаются при прошлом плане. Правка — это и ответ
     на сигналы «план устарел» и «плато» (И-9). */
  setPlan(s,id,{planId,title,days,time,exercises}){const c=client(s,id);if(!c)return null;
   const t=D.today();
   const ex=(exercises||[]).filter(x=>x.name&&x.name.trim()).map(x=>({id:x.id||D.uid('x'),name:x.name.trim(),sets:Math.max(1,Math.round(x.sets||3)),reps:x.reps??null,mode:'weight',rest:x.rest||90}));
   const old=planId?c.record.plans.find(p=>p.id===planId):null;
   // У плана из старой копии может не быть даты начала — тогда он действовал с начала занятий.
   if(old){const from=old.from||c.since;
    if(from<t)c.planLog.push({planId:old.id,title:old.title,days:[...old.days],time:old.time,exercises:clone(old.exercises),from,to:D.addDays(t,-1)});
    Object.assign(old,{title,days,time,exercises:ex,from:t});return old.id}
   const p={id:D.uid('p'),title,days,time,from:t,exercises:ex};c.record.plans.push(p);return p.id},
  answerWeek(s,week,cid,answer){if(!(answer in ANSWERS)||!D.isDate(week)||week!==D.weekStart(week))return false;
   if(week>D.weekStart(D.today()))return false; // будущее не спрашивают (И-4)
   let w=weekOf(s,week);
   if(!w){w={week,answers:{},closedAt:null};s.weeks.push(w)}
   if(w.closedAt)return false; // закрытая неделя заморожена (И-4)
   w.answers[cid]=answer;return true},
  /* Закрытие недели фиксирует то, что ушло наверх: текст сводки и её числа на момент
     закрытия. Это факт закрытия (И-4), а не хранимый итог для расчётов: если потом придёт
     поздняя копия дневника, прошлое не переписывается — разница показывается рядом. */
  closeWeek(s,week){if(!D.isDate(week)||week!==D.weekStart(week)||!closeState(s,week).ok)return false;
   const r=weekReview(s,week),report=reviewText(s,week);
   let w=weekOf(s,week);if(!w){w={week,answers:{},closedAt:null};s.weeks.push(w)}
   w.closedAt=D.stamp();w.report=report;w.snap={done:r.done,missed:r.missed,risk:r.risk.length,clients:r.rows.map(x=>x.client.id)};return true},
  /* Свежая копия дневника клиента обновляет его, а не заводит второго (пока нет синхронизации,
     это единственный путь данных от клиента). Факты клиента берутся из копии; план —
     факт тренера и остаётся тренерским. Копия старше загруженной не принимается. */
  /* Копия заменяет дневник, только если в ней есть всё уже загруженное и она не старше.
     Иначе — только с подтверждения тренера (confirm): клиент мог удалить ошибочную
     тренировку у себя или переименоваться. Молча данные не теряются никогда. */
  updateRecord(s,id,record,{confirm=false}={}){const c=client(s,id);if(!c||!record)return null;
   if(!confirm){if(!copyDiff(c,record).clean)return null;
    if(c.copyKey&&(c.copyKey.name!==keyOf(record).name||c.copyKey.started!==keyOf(record).started))return null}
   const before=c.record.workouts.filter(w=>w.status==='done').length;
   c.record={...record,plans:c.record.plans,profile:{...record.profile,onboarded:true}};c.copyAt=D.today();c.copyKey=keyOf(record);
   return record.workouts.filter(w=>w.status==='done').length-before},
  // Замена всей базы своей копией: проверенная копия целиком заменяет дашборд.
  replaceAll(s,copy){for(const k of ['profile','clients','weeks','trash'])s[k]=clone(copy[k]);s.version=copy.version;return true},
  setThreshold(s,key,value){if(!(key in TH))return false;const v=Number(value);if(!(v>0))return false;
   s.profile.thresholds={...th(s),[key]:Math.round(v)};return true},
  setProfile(s,key,value){if(!['name','club'].includes(key))return false;s.profile[key]=String(value).trim();return true},
 };
 // Один вход в операции — как у клиента: имя, аргументы, кто делает (ARCH: D.apply).
 function apply(s,name,args=[],ctx={}){const op=ops[name];if(!op)return {ok:false,error:`Нет операции ${name}`};
  const result=op(s,...args);const err=validate(s);
  return err.length?{ok:false,error:err[0]}:{ok:true,result,by:ctx.by||'coach',at:D.stamp()}}

 /* ——— имитация студии ———
    Десять типажей, каждый показывает свою боль (COACH-AUDIT §7). Данные считаются
    от одного зерна, поэтому повторяемы; имена вымышлены. */
 function studio(seed=7){let x=seed;const rnd=()=>(x=(x*1103515245+12345)&0x7fffffff)/0x7fffffff;
  const t=D.today(),d=n=>D.addDays(t,n);
  const s=empty();Object.assign(s.profile,{name:'Михаил',club:'Студия на Мира',started:d(-120),startedAt:'09:00'});
  const PLAN=(title,days,time,ex)=>({title,days,time,exercises:ex});
  const LEGS=[['Присед со штангой',3,8],['Румынская тяга',3,10],['Выпады с гантелями',2,12]];
  const UPPER=[['Жим лёжа',3,8],['Тяга верхнего блока',3,10],['Жим стоя',2,10]];
  const mk=(name,type,{sinceDays,days,plan,base,step,lastGap,habitPct,note,weightFrom,planDays,time})=>{
   const rec=D.empty();const since=d(-sinceDays);
   Object.assign(rec.profile,{name,goal:'',onboarded:true,started:since,startedAt:'09:00'});
   const p={id:D.uid('p'),title:plan===UPPER?'Верх тела':'Всё тело',days,time:time||'19:00',from:D.addDays(t,-(planDays??14)),
    exercises:plan.map(([n,sets,reps])=>({id:D.uid('x'),name:n,sets,reps,mode:'weight',rest:90}))};
   rec.plans.push(p);
   // привычки: вода и растяжка с заданной долей выполнения
   const water=D.habitFrom(D.STARTERS.water,since),stretch=D.habitFrom(D.STARTERS.stretch,since);
   for(let i=1;i<=sinceDays;i++){const day=d(-i);if(rnd()*100<habitPct)water.log[day]=8;if(rnd()*100<habitPct)stretch.log[day]=1}
   rec.habits.push(water,stretch);
   /* Тренировки: по дням плана, до lastGap дней назад. Веса считаем от последней
      тренировки назад — так у растущего клиента прибавка видна каждые две тренировки,
      у «плато» последние четыре одинаковые, у травмы последние две ниже. */
   const days$=[];for(let i=sinceDays;i>=lastGap;i--){const day=d(-i);if(!days.includes(D.weekday(day)))continue;
    if(type==='return'&&i>lastGap+13&&i<lastGap+35)continue; // пауза три недели: человек возвращался
    days$.push(day)}
   const n=days$.length;
   days$.forEach((day,i)=>{const back=n-1-i; // 0 — последняя тренировка
    const w=D.materialize(rec,p,day);w.status='done';w.startedAt=D.stampAt(day,p.time);w.finishedAt=D.stampAt(day,D.addMinutes(p.time,65));w.feel=3+Math.round(rnd());
    w.exercises.forEach((e,ei)=>{
     const ladder=type==='plateau'?Math.max(0,back-3):type==='injury'?(back<2?back+6:back):back;
     const top=base[ei]+step*Math.min(n,16);
     const val=Math.max(base[ei]*0.6,top-2.5*Math.floor(ladder/2));
     e.sets.forEach((q,qi)=>{q.reps=plan[ei][2];q.weight=D.round(Math.round((val+(qi===e.sets.length-1?2.5:0))/2.5)*2.5,10);q.doneAt=D.stampAt(day,D.addMinutes(p.time,10+ei*12+qi*3))})});
    rec.workouts.push(w)});
   if(note)rec.notes.push({id:D.uid('n'),date:d(-lastGap-1),text:note,source:'workout',wid:rec.workouts[rec.workouts.length-1]?.id});
   if(weightFrom)for(let i=sinceDays,v=weightFrom;i>=0;i-=7,v-=0.3)rec.metrics.push({id:D.uid('m'),date:d(-i),kind:'weight',value:D.round(v,10)});
   rec.closed=[...Array(Math.min(sinceDays,30))].map((_,i)=>d(-i-1));
   // Копию дневника тренер загрузил в день последней тренировки клиента.
   const c={id:D.uid('c'),name,since,notes:[],reaches:[],sessions:[],planLog:[],record:rec,copyAt:d(-lastGap),copyKey:keyOf(rec)};
   return c};
  const add=(...a)=>s.clients.push(mk(...a));
  add('Анна Реброва','grow',{sinceDays:70,days:[0,3],plan:LEGS,base:[50,40,12],step:1.3,lastGap:1,habitPct:80,weightFrom:66,time:'08:00'});
  add('Игорь Панов','plateau',{sinceDays:84,days:[1,4],plan:UPPER,base:[60,45,25],step:1.25,lastGap:2,habitPct:55,planDays:68,time:'09:30'});
  add('Марина Ким','new',{sinceDays:12,days:[0,2,4],plan:LEGS,base:[30,25,8],step:1.3,lastGap:1,habitPct:70,time:'11:00'});
  add('Тимур Алиев','newrisk',{sinceDays:26,days:[1],plan:UPPER,base:[35,30,15],step:1.3,lastGap:9,habitPct:30,time:'18:00'});
  add('Олег Дьяков','lost',{sinceDays:120,days:[0,3],plan:LEGS,base:[70,55,16],step:1.3,lastGap:17,habitPct:40,time:'19:00'});
  add('Екатерина Лис','habits',{sinceDays:56,days:[2,5],plan:UPPER,base:[40,35,18],step:1.3,lastGap:2,habitPct:15,time:'20:30'});
  add('Павел Гром','injury',{sinceDays:98,days:[1,4],plan:LEGS,base:[80,60,18],step:1.3,lastGap:3,habitPct:60,note:'Колено ныло на последнем подходе приседа — снизили вес.',time:'07:00'});
  add('Светлана Юрьева','return',{sinceDays:140,days:[0,3],plan:LEGS,base:[45,35,10],step:1.3,lastGap:4,habitPct:50,time:'12:30'});
  add('Денис Круглов','moves',{sinceDays:63,days:[2],plan:UPPER,base:[55,40,20],step:1.3,lastGap:6,habitPct:45,time:'19:00'});
  add('Рита Чен','perfect',{sinceDays:112,days:[0,2,4],plan:LEGS,base:[40,35,10],step:1.3,lastGap:1,habitPct:95,weightFrom:58,time:'10:00'});
  add('Борис Гай','leaving',{sinceDays:77,days:[1,4],plan:UPPER,base:[65,50,22],step:1.3,lastGap:16,habitPct:20,planDays:55,time:'20:00'});
  /* Ответы и отметки тренера — тоже часть материала: у Бориса ответ жив (сигнал молчит,
     ждём его в среду), у Олега ответ был десять дней назад и уже не держит. */
  const at=(c,n,kind,text,until)=>c.reaches.push({id:D.uid('r'),date:d(-n),kind,text,until:until||null,at:D.stampAt(d(-n),'18:00')});
  const oleg=s.clients.find(c=>c.name.startsWith('Олег')),boris=s.clients.find(c=>c.name.startsWith('Борис'));
  at(oleg,10,'wrote','Написал в мессенджер — прочитал, не ответил');
  at(boris,2,'agreed','Договорились вернуться в среду',d(2));
  // занятия, на которые не пришли: отметка тренера, дневник клиента не тронут
  for(const [c,n] of [[boris,6],[oleg,14]]){for(const w of D.schedule(c.record,d(-n),1))
   if(w.date===d(-n)&&w.status!=='done')c.sessions.push({id:D.uid('v'),wid:w.id,date:d(-n),mark:'missed',at:D.stampAt(d(-n),'21:00')})}
  /* История тренера за прошлые недели — как у человека, который ведёт дашборд давно:
     занятия старше недели отмечены, недели до прошлой закрыты в понедельник после них.
     Свежее (последняя неделя) оставлено открытым — с ним тренер и работает сегодня. */
  const prev=D.addDays(D.weekStart(t),-7);
  for(const c of s.clients)for(let i=8;i<=TH.markDays;i++){const day=d(-i);if(day<c.since)break;
   for(const w of scheduleOn(c,day))if(w.status!=='done'&&!sessionMark(c,w.id))
    c.sessions.push({id:D.uid('v'),wid:w.id,date:day,mark:'missed',at:D.stampAt(D.addDays(day,1),'09:00')})}
  const first=D.weekStart([...s.clients.map(c=>c.since)].sort()[0]);
  for(let w=first;w<prev;w=D.addDays(w,7)){const end=D.addDays(w,6);
   s.weeks.push({week:w,answers:Object.fromEntries(s.clients.filter(c=>c.since<=end).map(c=>[c.id,'work'])),closedAt:D.stampAt(D.addDays(w,7),'10:00')})}
  // У закрытых недель — сводка, зафиксированная при закрытии, как у живого тренера (И-4).
  for(const w of s.weeks){w.closedAt=null;const r=weekReview(s,w.week);w.report=reviewText(s,w.week);
   w.snap={done:r.done,missed:r.missed,risk:r.risk.length,clients:r.rows.map(x=>x.client.id)};w.closedAt=D.stampAt(D.addDays(w.week,7),'10:00')}
  // прошлая неделя закрыта частично: у тренера есть с чем начать
  s.weeks.push({week:prev,answers:Object.fromEntries(s.clients.slice(0,6).map(c=>[c.id,'work'])),closedAt:null});
  return s}

 return {VERSION,TH,TH_LABEL,ANSWERS,STATUS,REACH,MARKS,statusText,empty,migrate,th,client,stepOf,match,CHAPTERS,LEARN,learned,learnAvail,copyCandidates,copyDiff,autoMatch,
