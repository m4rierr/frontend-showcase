 if(x.tagName==='INPUT'){if(x!==document.activeElement&&x.value!==(y.getAttribute('value')??''))x.value=y.getAttribute('value')??'';return}
 if(x.tagName==='TEXTAREA'){if(x!==document.activeElement&&x.value!==y.value)x.value=y.value;return}
 patchChildren(x,y);
}

const MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
let popEl=null,popOwner=null;

// Раскрыто или нет — знает только aria-expanded на кнопке-источнике.
function closePop(){if(!popEl)return;popOwner?.setAttribute('aria-expanded','false');popEl.remove();popEl=null;popOwner=null;
 document.removeEventListener('keydown',popKey,true);document.removeEventListener('scroll',popScroll,true);removeEventListener('resize',popFollow)}
function popKey(e){if(e.key==='Escape'){e.preventDefault();e.stopPropagation();closePop()}}
/* Прокрутка или смена размера экрана (на телефоне — это клавиатура уехала вниз)
   не закрывают выпадающее: оно следует за полем. Закрываем, только если само
   поле ушло за край экрана. */
function popFollow(){if(!popEl||!popOwner)return;const r=popOwner.getBoundingClientRect();
 if(r.bottom<0||r.top>innerHeight||!popOwner.isConnected){closePop();return}placePop(popOwner)}
function popScroll(e){if(popEl&&!popEl.contains(e.target))popFollow()}
function openPop(owner,html,cls){
 closePop();popOwner=owner;owner.setAttribute('aria-expanded','true');
 popEl=document.createElement('div');popEl.className='pop '+cls;popEl.innerHTML=html;
 (owner.closest('dialog')||document.body).appendChild(popEl);placePop(owner);
 const on=popEl.querySelector('.is-on');
 if(on&&popEl.scrollHeight>popEl.clientHeight)popEl.scrollTop=Math.max(0,on.offsetTop-popEl.clientHeight/2+on.offsetHeight/2);
 document.addEventListener('keydown',popKey,true);document.addEventListener('scroll',popScroll,true);addEventListener('resize',popFollow);
 learnSoon();
}
/* Куда раскрывается: по левому краю поля; не помещается справа — по правому;
   вниз, а если внизу тесно — туда, где просторнее. Список получает высоту
   по месту и прокручивается внутри; календарь не сжимается. Начало отсчёта
   меряем, а не угадываем: у шторки есть трансформ, и fixed считается от неё. */
const POP_GAP=6,POP_EDGE=8,POP_MIN=140;
function placePop(anchor){
 const a=anchor.getBoundingClientRect();
 popEl.style.maxHeight='';popEl.style.left='0px';popEl.style.top='0px';
 const base=popEl.getBoundingClientRect(),ox=base.left,oy=base.top;
 const w=Math.min(Math.max(base.width,a.width),innerWidth-POP_EDGE*2);popEl.style.minWidth=Math.min(a.width,w)+'px';
 const below=innerHeight-a.bottom-POP_GAP-POP_EDGE,above=a.top-POP_GAP-POP_EDGE;
 const scrolls=getComputedStyle(popEl).overflowY!=='visible',down=base.height<=below||below>=above;
 let h=base.height;if(scrolls){h=Math.max(POP_MIN,Math.min(h,down?below:above));popEl.style.maxHeight=h+'px'}
 let left=a.left;if(left+w>innerWidth-POP_EDGE)left=a.right-w;
 left=Math.min(Math.max(POP_EDGE,left),Math.max(POP_EDGE,innerWidth-w-POP_EDGE));
 let top=down?a.bottom+POP_GAP:a.top-POP_GAP-h;top=Math.min(Math.max(POP_EDGE,top),Math.max(POP_EDGE,innerHeight-h-POP_EDGE));
 popEl.style.left=(left-ox)+'px';popEl.style.top=(top-oy)+'px';popEl.dataset.side=down?'down':'up';
}
function calHtml(month,selected,allowEmpty){
 const [y,m]=month.split('-').map(Number),first=new Date(y,m-1,1),lead=(first.getDay()||7)-1,days=new Date(y,m,0).getDate();
 const iso=d=>`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
 const prev=m===1?`${y-1}-12`:`${y}-${String(m-1).padStart(2,'0')}`,next=m===12?`${y+1}-01`:`${y}-${String(m+1).padStart(2,'0')}`;
 let cells='';for(let i=0;i<lead;i++)cells+='<span></span>';
 for(let d=1;d<=days;d++){const v=iso(d);cells+=`<button type="button" class="calday${v===selected?' is-on':''}${v===D.today()?' is-today':''}" data-action="cal-set" data-id="${v}">${d}</button>`}
 return `<div class="calhead">${B(I('back',18),'cal-nav',prev,'icon small ghost','aria-label="Прошлый месяц"')}<b>${MONTHS[m-1]} ${y}</b>${B(I('chev',18),'cal-nav',next,'icon small ghost','aria-label="Следующий месяц"')}</div>
 <div class="calwd">${D.WD.map(w=>`<span>${w}</span>`).join('')}</div><div class="calgrid">${cells}</div>
 <div class="calfoot">${B('Сегодня','cal-set',D.today(),'small')}${allowEmpty?B('Без даты','cal-set','none','small ghost'):''}</div>`;
}
function timeHtml(selected){let out='';for(let t=5*60;t<24*60;t+=15){const v=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');out+=`<button type="button" class="popitem${v===selected?' is-on':''}" data-action="time-set" data-id="${v}">${v}</button>`}return out}

// ——— поля формы ———
function field(label,name,value='',{type='text',ph='',extra=''}={}){return `<label class="field"><span class="label">${label}</span><input name="${name}" type="${type}" value="${esc(value)}" placeholder="${esc(ph)}" ${extra}></label>`}
function area(label,name,value='',ph=''){return `<label class="field"><span class="label">${label}</span><textarea name="${name}" placeholder="${esc(ph)}">${esc(value)}</textarea></label>`}
// Дата и время: скрытое поле держит значение, видимая кнопка — подпись.
function dateField(label,name,value,{allowEmpty=false}={}){return `<div class="field"><span class="label">${label}</span><div class="pick"><input type="hidden" name="${name}" value="${esc(value||'')}"><button type="button" class="pickbtn" data-action="cal" data-empty="${allowEmpty?1:0}" aria-haspopup="dialog" aria-expanded="false">${I('cal',18)}<span>${value?D.fmtDay(value):'Без даты'}</span></button></div></div>`}
function timeField(label,name,value){return `<div class="field"><span class="label">${label}</span><div class="pick"><input type="hidden" name="${name}" value="${esc(value)}"><button type="button" class="pickbtn" data-action="time" aria-haspopup="listbox" aria-expanded="false">${I('clock',18)}<span class="num">${esc(value)}</span></button></div></div>`}
// Сегмент в форме: значение лежит в скрытом поле, кнопки его переключают.
function segField(label,name,items,value,cls=''){return `<div class="field"><span class="label">${label}</span><input type="hidden" name="${name}" value="${esc(value)}"><div class="seg ${cls}" role="radiogroup">${Object.entries(items).map(([k,v])=>`<button type="button" role="radio" aria-checked="${k===value}" class="${k===value?'is-on':''}" data-action="seg" data-id="${esc(k)}">${esc(v)}</button>`).join('')}</div></div>`}
function daysField(label,name,days){return `<div class="field"><span class="label">${label}</span><input type="hidden" name="${name}" value="${days.join(',')}"><div class="chips days">${D.WD.map((w,i)=>`<button type="button" class="chip${days.includes(i)?' is-on':''}" aria-pressed="${days.includes(i)}" data-action="day-toggle" data-id="${i}">${w}</button>`).join('')}</div></div>`}
function formData(form){const o={};for(const el of form.elements)if(el.name)o[el.name]=typeof el.value==='string'?el.value.trim():el.value;return o}

// ——— шторка ———
// На телефоне — снизу во всю ширину, на компьютере — окно по центру.
// Сохранение отдаёт форму функции save; вернула false — шторка остаётся открытой.
/* Две породы шторок (ARCH-AUDIT К11):
   просмотр (view) — функция от состояния, как экран: render накладывает её тело через morph;
   форма (save) — черновик до «Сохранить»: рисуется один раз, введённое не перезаписывается. */
let sheetSave=null,sheetAfter=null,sheetView=null;
function openSheet({title,body,save=null,saveLabel='Сохранить',extra='',wide=false,cancel=true,view=null}){if(view)body=view();
 // Пример только для просмотра: форму, которую нельзя сохранить, не открываем вовсе.
 if(example&&!rehearsal&&save){toast('Это пример — он только для просмотра',{action:{label:'Начать свой',act:'example-exit'}});return}
 closePop();const dlg=$('#sheet');sheetSave=save;sheetView=view;
 // В зале шторка тоже тёмная — без вспышки светлого.
 dlg.className='sheet'+(wide?' sheet--wide':'')+(ui.route==='gym'?' gym':'');
 dlg.innerHTML=`<form class="sheetform" method="dialog" novalidate>
  <header class="sheethead"><i class="grab" aria-hidden="true"></i><h2>${title}</h2>${B(I('close',20),'sheet-close','','icon ghost','aria-label="Закрыть"')}</header>
  <div class="sheetbody">${body}</div>
  ${save||extra?`<footer class="sheetfoot">${extra}<span class="spacer"></span>${cancel?B('Отмена','sheet-close','','ghost'):''}${save?`<button type="submit" class="primary">${saveLabel}</button>`:''}</footer>`:''}
 </form>`;
 if(!dlg.open)dlg.showModal();
 const first=dlg.querySelector('.sheetbody input:not([type=hidden]),.sheetbody textarea');
 if(first&&matchMedia('(hover:hover)').matches)first.focus();else dlg.querySelector('.sheethead button')?.focus({preventScroll:true});
 learnSoon();setTimeout(learnSoon,380); // и ещё раз, когда шторка доехала: во время въезда она сдвинута
}
// Шторка-просмотр следует за данными; пустой просмотр (null) — шторка закрывается сама.
function sheetRender(){const dlg=$('#sheet');if(!dlg.open||!sheetView)return;const html=sheetView();if(html===null){closeSheet();return}const b=dlg.querySelector('.sheetbody');if(b)morph(b,html)}
function closeSheet(){closePop();const dlg=$('#sheet');sheetView=null;if(!dlg.open)return;dlg.classList.add('is-closing');
 setTimeout(()=>{dlg.classList.remove('is-closing');dlg.close();dlg.innerHTML='';sheetSave=null;learnSoon();if(sheetAfter){const f=sheetAfter;sheetAfter=null;f()}},200)}
function confirmSheet(title,text,label,run){
 openSheet({title,body:`<p class="confirm">${text}</p>`,save:()=>{run();return true},saveLabel:label});
 $('#sheet button[type=submit]')?.classList.add('danger');
}
// Поля, которые нужны только при определённом выборе: data-show="имя=значение".
function syncShow(){$$('#sheet [data-show]').forEach(el=>{const [n,v]=el.dataset.show.split('=');el.hidden=$(`#sheet [name="${n}"]`)?.value!==v})}
// Число с кнопками «−/+» (в формах и в «В зале»): data-step — шаг, data-min — нижняя граница.
function stepField(label,name,value,step,{unit='',min=0,big=false}={}){
 return `<div class="field stepfield${big?' big':''}"><span class="label">${label}</span><div class="stepper">${B(I('minus',big?26:20),'step',name,'icon lone',`data-d="${-step}" data-min="${min}" aria-label="Минус ${step}"`)}
  <label class="stepval"><input name="${name}" inputmode="decimal" value="${esc(numText(value))}" aria-label="${esc(label)}">${unit?`<span>${esc(unit)}</span>`:''}</label>
  ${B(I('plus',big?26:20),'step',name,'icon lone',`data-d="${step}" data-min="${min}" aria-label="Плюс ${step}"`)}</div></div>`}


/* ——— «Смена»: главный экран тренера ———
   Один вопрос роли: кто сегодня мой и кто просел (INVARIANT И-6).
   Сверху — то, что зависло, с причиной и порогом (И-3, Т-1); ниже — лента занятий
   по времени, у каждого занятия сразу видно, что дать (Т-2). */

function sceneHead(kicker,title,sub='',actions=''){
 return `<header class="shead"><div class="grow"><div class="kicker">${kicker}</div><h1>${title}</h1>${sub?`<p class="sub">${sub}</p>`:''}</div>${actions?`<div class="actions">${actions}</div>`:''}</header>`}

const STATUS_TONE={ok:'',new:'is-new',risk:'is-risk',lost:'is-lost',pause:'is-pause'};
function statusPill(st){return `<span class="cstatus ${STATUS_TONE[st]}">${CD.STATUS[st]}</span>`}
function avatar(name){return `<span class="avatar">${esc(initials(name))}</span>`}

function shiftScene(){const s=view(),t=D.today(),day=ui.day,isToday=day===t;
 const list=CD.shift(s,day);
 const risk=s.clients.filter(c=>['risk','lost'].includes(CD.status(s,c,t))).length;
 const kicker=isToday?D.now().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'}):D.fmtDay(day);
 const title=isToday?`${greet()}${s.profile.name?', '+esc(s.profile.name):''}`:D.fmtDay(day);
 const sub=[list.length?`${list.length} ${plural(list.length,'занятие','занятия','занятий')}`:'Занятий нет',
  s.clients.length?`${s.clients.length} ${plural(s.clients.length,'клиент','клиента','клиентов')}`:'',
  risk?`${risk} в риске`:''].filter(Boolean).join(' · ');
 return `<section class="scene">${sceneHead(kicker,title,sub,B(I('plus',18)+'Клиент','client-add','','primary'))}
 ${example?exampleBanner():''}
 ${dayStrip(day)}
 ${isToday?tailCards():''}
 ${isToday?learnCard():''}
 <div class="cols"><div class="stack">${shiftList(list,day)}</div><div class="stack">${sideShift(s)}</div></div></section>`}

function exampleBanner(){
 if(rehearsal)return `<div class="banner card"><div class="grow"><b>Репетиция на примере</b><span class="meta">Делайте смело: пример живёт в памяти, в ваш дашборд ничего не попадёт.</span></div>${B('Выйти из репетиции','learn-exit','','primary small')}</div>`;
 return `<div class="banner card"><div class="grow"><b>Пример студии</b><span class="meta">Одиннадцать клиентов, восемь недель, разные истории. Только для просмотра.</span></div>${B('Мои клиенты','example-exit','','primary small')}</div>`}

// ——— полоса дней: смена другого дня открывается касанием ———
function dayStrip(day){const s=view(),t=D.today();
 return `<nav class="weekstrip" aria-label="Дни недели">${B(I('back',18),'day-shift','-7','icon ghost small','aria-label="Прошлая неделя"')}
 <div class="wdays">${CD.weekLoad(s,day).map(({date:d,n,open})=>
  // Точка — день с занятиями; тёплая точка — в прошедшем дне остались неотмеченные.
  `<button type="button" class="wd${d===day?' is-on':''}${d===t?' is-today':''}" data-action="day-pick" data-id="${d}" aria-pressed="${d===day}" aria-label="${D.fmtDay(d)}${open?`, не отмечено: ${open}`:''}"><span>${D.WD[D.weekday(d)]}</span><b class="num">${Number(d.slice(8))}</b><i class="${open?'warn':n?'done':''}"></i></button>`).join('')}</div>
 ${B(I('chev',18),'day-shift','7','icon ghost small','aria-label="Следующая неделя"')}</nav>`}

/* Карточки-вопросы тренера. Каждая называет причину и порог: сигнал без причины — гадание (Т-1).
   Больше трёх сразу не показываем — остальное в «Клиентах» и «Неделе». */
const TAIL_ICON={gap:'flame',session:'clock',new:'flag',pause:'moonset',plateau:'progress',plan:'journal',feedback:'note',week:'moonset'};
// «Позже» — про человека, а не про вид сигнала: сменилась причина — карточка всё равно ждёт завтра.
function tailCards(){const all=ui.tails.filter(x=>!ui.dismissed.has(x.id));if(!all.length)return '';
 const shown=all.slice(0,3),rest=all.length-shown.length;
 /* У сигнала о человеке всегда есть ответ (И-9): «Связался» пишет факт и убирает
    карточку до следующего события. «Позже» — только до конца дня. */
 const card=(x)=>{const act=x.kind==='week'?B('Закрыть неделю','go-week',x.id,'small')
   :x.kind==='session'?B('Отметить','client-open',x.id,'small')
   :B(I('send',15)+'Связался','reach-new',x.id,'small primary');
  return `<div class="qcard card ${x.kind==='gap'?'warn':''}" data-key="t${x.kind}${x.id}"><span class="qico">${I(TAIL_ICON[x.kind]||'flag',18)}</span>
  <p class="grow"><b>${esc(x.name)}</b> <span class="meta">${esc(x.why)}${x.more?` · и ещё ${x.more}`:''}</span>${x.reach?`<span class="meta done">${I('check',13)} ${esc(x.reach)}</span>`:''}</p>
  <div class="btnrow">${B('Позже','tail-dismiss',x.id,'small ghost')}${x.kind!=='week'&&x.kind!=='session'?B('Карточка','client-open',x.id,'small ghost'):''}${act}</div></div>`};
 return `<div class="qcards">${shown.map(card).join('')}${rest>0?`<div class="qcard card" data-key="tmore"><span class="qico">${I('list',18)}</span><p class="grow meta">Ещё ${rest} ${plural(rest,'сигнал','сигнала','сигналов')}</p><div class="btnrow">${B('Все клиенты','go','clients','small ghost')}</div></div>`:''}</div>`}

// ——— лента занятий ———
function shiftList(list,day){const s=view();
 if(!s.clients.length)return `<section class="panel">${empty('coach','Клиентов пока нет','Заведите первого клиента или откройте пример студии — в нём одиннадцать историй.',B(I('plus',18)+'Клиент','client-add','','primary small')+B('Пример студии','example-open','','small ghost'))}</section>`;
 if(!list.length)return `<section class="panel">${empty('today','В этот день занятий нет','Дни занятий берутся из планов клиентов: поставьте дни в плане — они появятся здесь.')}</section>`;
 // «Что дать» считаем один раз на строку и передаём внутрь: на потоке в тридцать человек это заметно.
 return `<section class="panel timeline"><div class="rows">${list.map(x=>shiftRow(x,day,CD.prep(view(),x.client,day))).join('')}</div></section>`}

/* Строка смены. Вся строка открывает карточку — отдельной кнопки «Карточка» нет:
   на телефоне она съедала как раз то, ради чего тренер сюда и смотрит (Т-2).
   У прошедшего занятия — отметка тренера: состоялось или человек не пришёл. */
function shiftRow(x,day,p){const s=view(),c=x.client,st=CD.status(s,c),first=p.lines[0],past=day<D.today();
 const meta=x.status==='done'?'Проведено'
  :x.status==='active'?'Идёт'
  :x.paused?'На паузе — не ждём'
  :x.mark?CD.MARKS[x.mark]
  :first&&first.last?`${esc(first.name)} · ${first.last} кг`:'Первая тренировка';
 // Флажок памяти (Т-6): травма, жалоба, договорённость — видно до того, как открыл карточку.
 const flag=!past&&!x.paused&&x.status!=='done'&&p.flag?`<span class="rm flag">${I('flag',13)} ${esc(p.flag)}</span>`:'';
 const locked=CD.frozen(s,day);
 const marks=past&&x.status!=='done'&&!x.paused&&!locked?`<div class="seg mini smarks">${Object.entries(CD.MARKS).map(([k,v])=>
   B(v,'session-mark',k,x.mark===k?'is-on':'',`data-c="${c.id}" data-w="${x.workout.id}" data-day="${day}" aria-pressed="${x.mark===k}"`)).join('')}</div>`:'';
 return `<div class="row crow${x.status==='done'?' is-done':''}${x.mark==='missed'?' is-missed':''}${x.paused?' is-paused':''}" data-key="s${c.id}${x.workout.id}">
 <span class="tslot num">${esc(x.time||'—')}</span>${avatar(c.name)}
 <button type="button" class="rbody" data-action="client-open" data-id="${c.id}"><span class="rt">${esc(c.name)} ${statusPill(st)}</span><span class="rm">${meta}</span>${flag}</button>
 ${marks||I('chev',18)}</div>`}

// ——— правая колонка: нагрузка недели и что зависло ———
function sideShift(s){const load=CD.weekLoad(s,ui.day),max=Math.max(2,...load.map(x=>x.n));
 const t=D.today(),all=ui.tails;
 return `<section class="panel"><div class="phead"><h2>Нагрузка недели</h2><span class="ptag">${(()=>{const n=load.reduce((a,x)=>a+x.n,0);return `${n} ${plural(n,'занятие','занятия','занятий')}`})()}</span></div>
 <div class="wbars" style="grid-template-columns:repeat(7,minmax(0,1fr))" aria-label="Занятий по дням">${load.map(x=>`<div class="wbar${x.date===t?' now':''}" title="${D.fmtShort(x.date)}: ${x.n}"><i style="height:${Math.max(6,Math.round(x.n/max*100))}%"></i><span class="caption num">${x.n}</span></div>`).join('')}</div>
 <div class="chartx caption"><span>${D.WD[0]}</span><span>${D.WD[6]}</span></div></section>
 <section class="panel deskonly"><div class="phead"><h2>Что зависло</h2><span class="ptag">${all.length}</span></div>
 ${all.length?`<div class="rows compact">${all.slice(0,6).map(x=>`<button type="button" class="row plain tailrow" data-action="${x.kind==='week'?'go-week':'client-open'}" data-id="${x.id}" data-key="st${x.kind}${x.id}"><div class="grow"><span class="rt">${esc(x.name)}</span><span class="rm">${esc(x.why)}${x.more?` · и ещё ${x.more}`:''}</span></div>${I('chev',16)}</button>`).join('')}</div>`
 :`<p class="meta">Ничего не зависло: все клиенты в норме, неделя закрыта.</p>`}</section>`}

/* ——— «Клиенты»: весь поток одним списком ———
   Сегменты — это не фильтры ради фильтров, а четыре разговора: со всеми, с теми,
   кто просел, с новичками и с теми, кто на паузе. У каждой строки видно причину (Т-1). */

const SEGS={all:'Все',risk:'В риске',new:'Новички',pause:'Пауза'};
function segOf(s,c){const st=CD.status(s,c);return st==='risk'||st==='lost'?'risk':st==='pause'?'pause':st==='new'?'new':'ok'}

function clientsScene(){const s=view(),t=D.today();
 const counts=Object.fromEntries(Object.keys(SEGS).map(k=>[k,s.clients.filter(c=>k==='all'||segOf(s,c)===k).length]));
 const seg=`<div class="seg inline pseg" role="tablist">${Object.entries(SEGS).map(([k,v])=>B(`${v}${counts[k]?` <span class="num">${counts[k]}</span>`:''}`,'seg-pick',k,ui.seg===k?'is-on':'',`role="tab" aria-selected="${ui.seg===k}"`)).join('')}</div>`;
 /* Поиск по имени: на потоке в двадцать-тридцать человек глазами уже не ищут.
    Строка поиска — часть интерфейса, не данных: она живёт в ui. */
 const q=ui.q.trim();
 const search=`<div class="searchbox"><span class="sico">${I('more',16)}</span>
  <input id="csearch" type="search" value="${esc(ui.q)}" placeholder="Имя клиента" aria-label="Поиск по имени" autocomplete="off">
  ${q?B(I('close',16),'search-clear','','icon small ghost','aria-label="Очистить"'):''}</div>`;
 const list=s.clients.filter(c=>ui.seg==='all'||segOf(s,c)===ui.seg)
  .filter(c=>CD.match(c.name,q))
  .sort((a,b)=>CD.gapDays(b,t)-CD.gapDays(a,t)||a.name.localeCompare(b.name));
 return `<section class="scene">${sceneHead('Поток','Клиенты',`${s.clients.length} ${plural(s.clients.length,'клиент','клиента','клиентов')}`,seg)}
 ${example?exampleBanner():''}
 ${s.clients.length>6?search:''}
 ${list.length?`<section class="panel"><div class="rows">${list.map(c=>clientRow(s,c,t)).join('')}</div></section>`
  :`<section class="panel">${empty('coach',q?'Никого не нашли':ui.seg==='all'?'Клиентов пока нет':'В этом сегменте пусто',q?`По запросу «${esc(q)}» в этом сегменте никого.`:ui.seg==='all'?'Заведите клиента или откройте пример студии.':'Хорошая новость: здесь никого.',q?B('Очистить поиск','search-clear','','small'):ui.seg==='all'?B(I('plus',18)+'Клиент','client-add','','primary small'):'')}</section>`}
 </section>`}

function clientRow(s,c,t){const st=CD.status(s,c,t),h=CD.habits(c,28,t),next=CD.nextSession(s,c,t),held=CD.activeReach(s,c,t);
 const bits=[CD.why(s,c,t)];
 if(held)bits.push(CD.reachText(held,t));
 if(h.pct!==null)bits.push(`привычки ${h.pct}% за 4 недели`);
 if(next)bits.push(`дальше ${D.fmtDay(next.date,{lower:true})}`);
 return `<div class="row crow" data-key="c${c.id}">${avatar(c.name)}
 <button type="button" class="rbody" data-action="client-open" data-id="${c.id}"><span class="rt">${esc(c.name)} ${statusPill(st)}</span><span class="rm">${esc(bits.join(' · '))}</span></button>
 ${B(I('chev',18),'client-open',c.id,'icon ghost small','aria-label="Открыть карточку"')}</div>`}

/* ——— Карточка клиента ———
   Это память тренера (Г-1) и доказательство для разговора (Г-3) на одном экране.
   Всё в ней — из фактов клиента; тренер добавляет сюда только своё: план и заметки (Т-3). */

function clientScene(id){const s=view(),c=CD.client(s,id||'');
 if(!c)return `<section class="scene">${sceneHead('Клиент','Не найден','',B('К списку','go','clients','small'))}
  <section class="panel">${empty('coach','Такого клиента нет','Возможно, он удалён — вернуть можно из настроек.',B('Все клиенты','go','clients','primary small'))}</section></section>`;
 const t=D.today(),st=CD.status(s,c,t),p=CD.prep(s,c,t),pr=CD.progress(s,c,4,t);
 const held=CD.activeReach(s,c,t),age=CD.copyAge(c,t);
 // Точность сигнала ограничена свежестью копии: старая копия — называем её дату рядом со статусом.
 const copy=age!==null&&age>7?` · <span class="warnt">копия дневника от ${D.fmtShort(c.copyAt)}: после неё видны только ваши отметки</span>`:'';
 const head=`<header class="shead client"><div class="grow"><div class="kicker">${B(I('back',16)+'Клиенты','go','clients','small ghost backlink')}</div>
  <h1>${esc(c.name)} ${statusPill(st)}</h1><p class="sub">${esc(CD.why(s,c,t))} · с ${D.fmtShort(c.since)}${held?` · ${esc(CD.reachText(held,t))}`:''}${copy}</p></div>
  <div class="actions">${B(I('send',16)+'Связался','reach-new',c.id,'small')}${B(I('note',16)+'Заметка','note-new',c.id,'small')}${B(I('copy',16)+'К разговору','talk',c.id,'small primary')}</div></header>`;
 return `<section class="scene">${head}
 <div class="cols"><div class="stack">${prepPanel(c,p)}${sessionsPanel(s,c,t)}${habitsPanel(s,c)}${notesPanel(c)}</div>
 <div class="stack">${progressPanel(s,c,pr)}${reachPanel(c,t)}${planPanel(s,c)}</div></div></section>`}

/* Что сделано по сигналу (И-9): ответ тренера с датой. Виден в карточке и уходит в сводку. */
function reachPanel(c,t){const l=[...(c.reaches||[])].sort((a,b)=>(b.date+b.at).localeCompare(a.date+a.at));
 return `<section class="panel"><div class="phead"><h2>Что сделано</h2>${B(I('plus',16),'reach-new',c.id,'icon small ghost','aria-label="Записать ответ"')}</div>
 ${l.length?`<div class="rows compact">${l.slice(0,6).map(r=>`<div class="row plain rchrow" data-key="${r.id}"><div class="grow"><span class="rt">${CD.REACH[r.kind]} <span class="caption">· ${D.fmtShort(r.date)}</span></span><span class="rm">${r.until?`ждём ${D.fmtShort(r.until)}`:''}${r.until&&r.text?' · ':''}${esc(r.text||'')}</span></div>${B(I('trash',15),'reach-del',r.id,'icon small ghost',`data-c="${c.id}" aria-label="Удалить"`)}</div>`).join('')}</div>`
 :`<p class="meta">Пусто. Сигнал закрывается ответом: написал, позвонил, договорились — тогда он не повторится и попадёт в сводку недели.</p>`}</section>`}

/* Занятия, которые тренер ещё не отметил: пришёл человек или нет — его факт, не клиента. */
function sessionsPanel(s,c,t){const un=CD.unconfirmed(s,c,t);if(!un.length)return '';
 // Пропавшего не отмечают по одному: все неотмеченные — одним ответом.
 const all=un.length>2?B(`Все ${un.length} — не пришёл`,'mark-all',c.id,'small ghost'):'';
 return `<section class="panel"><div class="phead"><h2>Не отмечено</h2>${all||`<span class="ptag">${un.length}</span>`}</div>
 <div class="rows compact">${un.map(x=>`<div class="row plain unrow" data-key="u${x.wid}"><div class="grow"><span class="rt">${D.fmtDay(x.date)}</span><span class="rm">${esc(x.time||'')} · занятие по плану</span></div>
 <div class="seg mini smarks">${Object.entries(CD.MARKS).map(([k,v])=>B(v,'session-mark',k,'',`data-c="${c.id}" data-w="${x.wid}" data-day="${x.date}" aria-pressed="false"`)).join('')}</div></div>`).join('')}</div>
 <p class="caption footnote">Отметка — факт тренера. Дневник клиента она не меняет.</p></section>`}

// «Что дать сегодня»: прошлый раз, подсказка, жалобы — без поиска по экранам (Т-2).
function prepPanel(c,p){
 return `<section class="panel"><div class="phead"><h2>Что дать</h2><span class="ptag">${p.session?`${D.fmtDay(p.session.date,{lower:true})}, ${p.session.time}`:'без ближайшей тренировки'}</span></div>
 ${p.lines.length?`<div class="rows compact">${p.lines.map(x=>`<div class="row plain prep" data-key="p${esc(x.name)}"><div class="grow"><span class="rt">${esc(x.name)}</span><span class="rm">${x.last?`в прошлый раз ${esc(x.last)}${x.date?` · ${D.fmtShort(x.date)}`:''}`:'первый раз'}</span></div><span class="hint2">${esc(x.hint)}</span></div>`).join('')}</div>`
  :`<p class="meta">В плане нет упражнений — добавьте их, и подсказки появятся сами.</p>`}
 ${p.complaints.length?`<div class="blocktitle">Слова клиента</div><div class="rows compact">${p.complaints.map(n=>`<div class="mnote" data-key="q${n.id}"><span class="caption">${D.fmtDate(n.date)}</span><p>${esc(n.text)}</p></div>`).join('')}</div>`:''}
 ${p.note?`<div class="blocktitle">Моя последняя заметка</div><p class="meta">${esc(p.note.text)}</p>`:''}</section>`}

// Рост за 4 недели — то, что показывают клиенту в разговоре о продлении.
function progressPanel(s,c,pr){
 const tile=(cap,val,sub='')=>`<div class="tile"><span class="caption">${cap}</span><b class="num">${val}</b>${sub?`<span class="caption">${sub}</span>`:''}</div>`;
 return `<section class="panel"><div class="phead"><h2>Рост за 4 недели</h2></div>
 <div class="tiles three">${tile('Тренировок',pr.workouts)}${tile('Рекорды',pr.records.length||'—')}${tile('Вес',pr.weight===null?'—':`${pr.weight>0?'+':''}${fmtN(pr.weight)}`,pr.weight===null?'':'кг')}</div>
 ${pr.lifts.length?`<div class="rows compact">${pr.lifts.slice(0,4).map(l=>`<div class="mrow" data-key="l${esc(l.name)}"><span class="grow">${esc(l.name)}</span><b class="num ${l.gain>0?'up':''}">${l.gain>0?'+':''}${fmtN(l.gain)} кг</b></div>`).join('')}</div>`
  :`<p class="meta">Рост появится со второй тренировки с тем же упражнением.</p>`}
 ${pr.records.length?`<div class="blocktitle">Рекорды</div><div class="rows compact">${pr.records.slice(0,3).map(r=>`<div class="mrow">${I('trophy',15)}<span class="grow">${esc(r.name)} <span class="caption">· ${D.fmtShort(r.date)}</span></span><b class="num">${numText(r.weight)} × ${r.reps}</b></div>`).join('')}</div>`:''}</section>`}

function habitsPanel(s,c){const t=D.today(),list=c.record.habits.filter(h=>!h.archived);
 if(!list.length)return '';
 // Один период на панель: и доля, и строки, и подпись — за одни и те же четыре недели.
 const all=CD.habits(c,28,t);
 return `<section class="panel"><div class="phead"><h2>Между тренировками</h2><span class="ptag">${all.pct===null?'нет дней':`${all.pct}% за 4 недели`}</span></div>
 <div class="rows compact">${list.map(h=>{const r=D.habitStats(c.record,h,D.addDays(t,-27),t),st=D.streak(c.record,h,t);
  return `<div class="mrow" data-key="h${h.id}"><span class="grow">${esc(h.title)}</span>${st>1?`<span class="streak">${I('flame',13)}${st}</span>`:''}<b class="num">${r.due?`${r.hit} из ${r.due}`:'—'}</b></div>`}).join('')}</div>
 <p class="caption footnote">За 4 недели. Требовалось по правилу того дня — прошлое не пересчитывается.</p></section>`}

function planPanel(s,c){const plans=c.record.plans;
 return `<section class="panel"><div class="phead"><h2>План</h2>${B(I('plus',16),'plan-new',c.id,'icon small ghost','aria-label="Новый план"')}</div>
 ${plans.length?`<div class="rows">${plans.map(p=>{const age=CD.planAge(c);
  return `<button type="button" class="row planrow" data-action="plan-edit" data-id="${p.id}" data-key="${p.id}"><span class="rbody"><span class="rt">${esc(p.title)}</span><span class="rm">${p.days.length?p.days.map(i=>D.WD[i]).join(', ')+' · '+(p.time||'19:00'):'Без дней'} · ${p.exercises.length} упр.${age!==null&&age>CD.th(s).planAge?` · не менялся ${days2(age)}`:''}</span></span>${I('chev',18)}</button>`}).join('')}</div>`
 :`<p class="meta">Плана нет: поставьте дни и упражнения — тренировки встанут в расписание клиента сами.</p>${B(I('plus',16)+'План','plan-new',c.id,'small')}`}</section>`}

function notesPanel(c){const l=[...(c.notes||[])].reverse();
 return `<section class="panel"><div class="phead"><h2>Мои заметки</h2>${B(I('plus',16),'note-new',c.id,'icon small ghost','aria-label="Новая заметка"')}</div>
 ${l.length?`<div class="rows compact">${l.slice(0,8).map(n=>`<div class="mnote" data-key="${n.id}"><div class="mnhead"><span class="caption">${D.fmtDate(n.date)}</span>${B(I('trash',15),'note-del',n.id,'icon small ghost',`data-c="${c.id}" aria-label="Удалить заметку"`)}</div><p>${esc(n.text)}</p></div>`).join('')}</div>`
 :`<p class="meta">Пусто. Заметка — это то, что нужно помнить к следующему разу: травма, обещание, настроение.</p>`}</section>`}

/* ——— «Неделя»: период тренера и его закрытие ———
   Закрытие — не отчёт, а проход по списку: по каждому клиенту ответ (Т-4).
   Пока есть клиент без ответа, неделя не закрывается и переходит в хвосты.
   Сводка наверх (И-5) считается из фактов в момент открытия и никогда не хранится. */

function weekScene(){const s=view(),week=ui.week,r=CD.weekReview(s,week);
 // У закрытой недели в шапке — числа, которые ушли наверх; живую разницу называет подвал.
 const n=r.snap?{done:r.snap.done,risk:r.snap.risk,missed:r.snap.missed}:{done:r.done,risk:r.risk.length,missed:r.missed};
 const label=week===D.weekStart(D.today())?'Эта неделя':week===D.addDays(D.weekStart(D.today()),-7)?'Прошлая неделя':`${D.fmtShort(week)} — ${D.fmtShort(D.addDays(week,6))}`;
 const nav=`${B(I('back',18),'week-shift','-7','icon ghost small','aria-label="Прошлая неделя"')}${B(I('chev',18),'week-shift','7','icon ghost small','aria-label="Следующая неделя"')}`;
 const sub=[`${n.done} ${plural(n.done,'занятие','занятия','занятий')}`,`${r.rows.length} ${plural(r.rows.length,'клиент','клиента','клиентов')}`,
  n.risk?`${n.risk} в риске ${r.snap?'при закрытии':`на ${D.fmtShort(r.date)}`}`:'',n.missed?`${n.missed} не пришли`:''].filter(Boolean).join(' · ');
 return `<section class="scene">${sceneHead(label,'Неделя',sub,nav)}
 ${example?exampleBanner():''}
 <div class="cols"><div class="stack">${weekPanel(s,r,week)}</div><div class="stack">${reviewPanel(s,r,week)}</div></div></section>`}

function weekPanel(s,r,week){
 if(!r.rows.length)return `<section class="panel">${empty('coach','Клиентов нет','Неделя закрывается ответом по каждому клиенту — сначала заведите клиентов.')}</section>`;
 const closed=r.closed,future=week>D.weekStart(D.today()),cs=CD.closeState(s,week);
 // Будущую неделю не спрашивают (И-4): ответы в ней недоступны, как и в закрытой.
 const lock=closed||future;
 /* Строка недели: имя с причиной сверху, ответы — отдельной строкой под ними.
    Причина не должна уезжать под сегмент: ради неё сюда и смотрят (Т-1). */
 const rows=r.rows.map(x=>{const cur=x.answer;
  const did=[x.missed?`не пришёл ${x.missed} ${plural(x.missed,'раз','раза','раз')}`:'',...x.reaches.map(v=>`${CD.REACH[v.kind]} ${D.fmtShort(v.date)}`)].filter(Boolean);
  return `<div class="row crow wkrow" data-key="w${x.client.id}">${avatar(x.client.name)}
  <button type="button" class="rbody" data-action="client-open" data-id="${x.client.id}"><span class="rt">${esc(x.client.name)} ${statusPill(x.status)}</span><span class="rm">${x.workouts?`${x.workouts} ${plural(x.workouts,'занятие','занятия','занятий')} за неделю`:'занятий не было'} · ${esc(x.why)}</span>${did.length?`<span class="rm done">${I('check',13)} ${esc(did.join(' · '))}</span>`:''}</button>
  <div class="seg mini answers">${Object.entries(CD.ANSWERS).map(([k,v])=>B(v,'week-answer',k,cur===k?'is-on':'',`data-c="${x.client.id}" aria-pressed="${cur===k}"${lock?' disabled':''}`)).join('')}</div></div>`}).join('');
 const foot=closed?`<div class="dfoot"><span class="meta">${I('check',14)} Неделя закрыта — ответы и сводка заморожены${r.after.length?`. После закрытия пришли новые факты: ${esc(r.after.join(', '))} — они уже в текущих числах, сводка осталась той, что ушла наверх`:''}</span></div>`
  :future?`<div class="dfoot"><span class="meta">Эта неделя ещё не началась — её не спрашивают</span></div>`
  :`<div class="dfoot"><span class="meta grow">${r.unanswered.length?`Без ответа: ${r.unanswered.length}`:'Все ответы есть'}${!cs.ok&&!r.unanswered.length?` · ${esc(cs.why)}`:''}</span>${B(r.unanswered.length?`Закрыть · ${r.unanswered.length} без ответа`:'Закрыть неделю','week-close',week,'primary'+(cs.ok?'':' is-off'))}</div>`;
 return `<section class="panel"><div class="phead"><h2>Ответ по каждому</h2><span class="ptag">${closed?'закрыта':future?'впереди':'открыта'}</span></div>
 <div class="rows">${rows}</div>${foot}</section>`}

function reviewPanel(s,r,week){const text=CD.reviewText(s,week);
 return `<section class="panel"><div class="phead"><h2>Сводка наверх</h2>${B(I('copy',16)+'Скопировать','copy-review',week,'small ghost')}</div>
 <pre class="review">${esc(text)}</pre>
 <p class="caption footnote">Собирается из фактов недели в момент открытия. Никаких хранимых итогов — пересчитается, если что-то изменится.</p></section>
 ${r.risk.length?`<section class="panel"><div class="phead"><h2>Кто в риске</h2><span class="ptag">${r.risk.length}</span></div>
 <div class="rows compact">${r.risk.map(x=>`<button type="button" class="row plain tailrow" data-action="client-open" data-id="${x.client.id}" data-key="r${x.client.id}"><div class="grow"><span class="rt">${esc(x.client.name)}</span><span class="rm">${esc(x.why)}</span></div>${I('chev',16)}</button>`).join('')}</div></section>`:''}`}

/* ——— Формы тренера ———
   Правило форм то же, что у клиента: подпись над полем, одно главное действие
   справа внизу, удаление — слева, с «Отменить» в тосте.
   Шторка-просмотр (карточка к разговору, настройки) — функция состояния. */

// ——— клиент ———
function clientForm(){openSheet({title:'Новый клиент',body:`<div class="fields">
  ${field('Имя','name','',{ph:'Как зовут клиента'})}
  ${dateField('С какого дня занимается','since',D.today())}
  <p class="hint">Дневник клиента заведётся пустым. Если у клиента есть своя копия дневника, загрузите её — тренировки, привычки и замеры придут вместе с ней. Свежая копия того же клиента потом обновит его, а не заведёт второго.</p>
  <div class="btnrow">${B(I('upload',16)+'Загрузить копию клиента','import','','small')}</div></div>`,
 save:f=>{if(!f.name.trim()){toast('Назовите клиента');return false}
  const id=op(s=>CD.ops.addClient(s,{name:f.name,since:f.since}),{toast:'Клиент заведён'});
  if(id)sheetAfter=()=>go('client',id);return !!id}})}

function renameForm(id){const c=CD.client(view(),id);if(!c)return;
 openSheet({title:'Клиент',body:`<div class="fields">${field('Имя','name',c.name)}${dateField('С какого дня занимается','since',c.since)}</div>`,
  extra:B(I('trash',16)+'Удалить','client-del',id,'ghost danger'),
  save:f=>commit(s=>CD.ops.editClient(s,id,{name:f.name,since:D.isDate(f.since)?f.since:undefined}),{fail:'Назовите клиента'})})}

// ——— заметка тренера ———
function noteForm(id){const c=CD.client(view(),id);if(!c)return;
 openSheet({title:`Заметка · ${esc(c.name)}`,body:`<div class="fields">${area('Что помнить к следующему разу','text','','Травма, обещание, настроение, договорённость')}
  <p class="hint">Заметка — факт тренера: она не попадает в дневник клиента.</p></div>`,
  save:f=>{if(!f.text.trim()){toast('Напишите заметку');return false}return commit(s=>{const r=CD.ops.note(s,id,f.text);if(r)learnFlag('card.note');return r},{toast:'Заметка записана'})}})}

/* ——— ответ на сигнал (И-9) ———
   Сигнал закрывается фактом: что сделал, когда и чего ждём. Каналы не наша роль (Т-7):
   тренер пишет клиенту своим мессенджером, а сюда кладёт след. */
function reachForm(id){const c=CD.client(view(),id);if(!c)return;
 openSheet({title:`Что сделано · ${esc(c.name)}`,body:`<div class="fields">
  ${segField('Что сделал','kind',CD.REACH,'wrote')}
  ${dateField('Ждём до','until','',{allowEmpty:true})}
  ${area('Коротко','text','','О чём договорились, что ответил')}
  <p class="hint">${I('flag',14)} Пока ответ жив, сигнал по этому клиенту не повторяется. Он вернётся, если клиент не придёт к названному дню.</p></div>`,
  save:f=>!!op(s=>{const r=CD.ops.reach(s,id,{kind:f.kind,text:f.text,until:f.until||null});if(r)learnFlag('signal.reach');return r},{toast:'Записано — сигнал ждёт ответа клиента',
   fail:`«Ждём до» — не раньше завтра и не дальше ${CD.th(view()).pauseDays} дней: дальше это уже пауза`})})}

// ——— план клиента ———
function planRow(x={}){return `<div class="prow" data-key="${D.uid('r')}"><input data-p="name" value="${esc(x.name||'')}" placeholder="Упражнение" aria-label="Упражнение">
 <input data-p="sets" inputmode="numeric" value="${x.sets??3}" aria-label="Подходы"><span class="x">×</span><input data-p="reps" inputmode="numeric" value="${x.reps??''}" placeholder="—" aria-label="Повторы">
 ${B(I('close',16),'prow-del','','icon small ghost','aria-label="Убрать"')}</div>`}

function planForm(cid,planId=null){const c=CD.client(view(),cid);if(!c)return;
 const p=planId?c.record.plans.find(x=>x.id===planId):null;
 openSheet({title:p?`План · ${esc(c.name)}`:`Новый план · ${esc(c.name)}`,wide:true,
  body:`<div class="fields">${field('Название','title',p?.title||'',{ph:'Например, всё тело'})}
   ${daysField('Дни','days',p?.days||[])}
   <div class="fields two">${timeField('Время','time',p?.time||'19:00')}<span></span></div>
   <div class="field"><span class="label">Упражнения · подходы × повторы</span><div class="prows">${(p?.exercises.length?p.exercises:[{}]).map(planRow).join('')}</div>${B(I('plus',16)+'Упражнение','prow-add','','ghost small')}</div>
   <p class="hint">${I('flag',14)} План действует с сегодняшнего дня: прошлые недели клиента остаются как были.</p></div>`,
  save:f=>{if(!f.title.trim()){toast('Назовите план');return false}
   const ex=$$('#sheet .prow').map(r=>({name:$('[data-p=name]',r).value,sets:toNum($('[data-p=sets]',r).value)||3,reps:toNum($('[data-p=reps]',r).value)||null})).filter(x=>x.name.trim());
   const days=f.days?f.days.split(',').map(Number):[];
   return commit(s=>{const r=CD.ops.setPlan(s,cid,{planId,title:f.title,days,time:f.time,exercises:ex});if(r)learnFlag('plan.edit');return r},{toast:p?'План изменён — с сегодняшнего дня':'План добавлен — тренировки встали в расписание'})}})}

/* ——— карточка к разговору ———
   Доказательство собирается из фактов (Т-5) и отдаётся текстом: отправку делает
   сам тренер своим мессенджером — каналы не наша роль (Т-7). */
function talkText(s,c){const t=D.today(),pr=CD.progress(s,c,4,t),h=CD.habits(c,28,t);
 const lines=[`${c.name} — за 4 недели`,`Тренировок: ${pr.workouts}`];
 if(pr.lifts.length)lines.push(...pr.lifts.slice(0,3).map(l=>`${l.name}: ${l.gain>0?'+':''}${fmtN(l.gain)} кг`));
 if(pr.records.length)lines.push(`Рекордов: ${pr.records.length} (последний — ${pr.records[pr.records.length-1].name})`);
 if(pr.weight!==null)lines.push(`Вес: ${pr.weight>0?'+':''}${fmtN(pr.weight)} кг`);
 if(h.pct!==null)lines.push(`Привычки: ${h.hit} из ${h.due} (${h.pct}%)`);
 lines.push(`Статус: ${CD.statusText(CD.status(s,c,t))} — ${CD.why(s,c,t)}`);
 return lines.join('\n')}
function talkSheet(id){openSheet({title:'К разговору',view:()=>{const s=view(),c=CD.client(s,id);if(!c)return null;
  return `<div class="fields"><p class="meta">Что показать клиенту: только факты за четыре недели.</p>
  <pre class="review">${esc(talkText(s,c))}</pre>
  <div class="btnrow">${B(I('copy',16)+'Скопировать','copy-talk',id,'small')}${B(I('note',16)+'Заметка','note-new',id,'small ghost')}</div></div>`}})}

// ——— настройки ———
/* Во время репетиции настройки — это настройки примера: что показано, то и меняется.
   Копии (сохранить, загрузить) — только вне репетиции: они про ваш дашборд. */
function settingsSheet(){openSheet({title:rehearsal?'Настройки примера · репетиция':'Настройки',view:()=>{const s=view(),T=CD.th(s),trash=[...s.trash].reverse();
 return `<div class="fields">
  ${segField('Тема','theme',{system:'Как в системе',light:'Светлая',dark:'Тёмная'},prefs.theme).replace('name="theme"','name="theme" data-live="theme"')}
  <div class="fields two">${field('Имя','name',s.profile.name,{extra:'data-set="name"'})}${field('Клуб','club',s.profile.club,{extra:'data-set="club"'})}</div>
  <div class="field"><span class="label">Пороги сигналов</span>
   <div class="rows compact">${Object.entries(CD.TH_LABEL).map(([k,label])=>`<div class="mrow throw" data-key="th${k}"><span class="grow">${label}</span>${B(I('minus',16),'th-step',k,'icon small ghost','data-d="-1" aria-label="Меньше"')}<b class="num">${T[k]}</b>${B(I('plus',16),'th-step',k,'icon small ghost','data-d="1" aria-label="Больше"')}</div>`).join('')}</div>
   <span class="hint">Значения по умолчанию — отраслевые ориентиры. Для студии «пауза — риск» обычно 7 дней, для клуба 14. Любой порог меняет сигналы сразу.</span></div>
  ${rehearsal?`<div class="field"><span class="label">Данные</span><span class="hint">Копии — про ваш дашборд: сохранить и загрузить их можно, выйдя из репетиции.</span></div>`:`<div class="field"><span class="label">Данные</span><div class="btnrow">${B(I('download',16)+'Сохранить копию','export','','small')}${B(I('upload',16)+'Загрузить копию','import','','small')}</div>`}
  <span class="hint">Дашборд хранится только в этом браузере — держите копию. «Загрузить копию» понимает оба файла: свою копию дашборда (заменит всё, с отменой) и дневник клиента (новый клиент или обновление знакомого).</span></div>
  <div class="field"><span class="label">Знакомство</span><div class="btnrow">${B(I('flag',16)+`Весь путь · ${CD.learned(s).size} из ${CD.LEARN.length}`,'learn-path','','small')}</div>
   <span class="hint">«Спутник» показывает каждое действие один раз, в свой момент. Сделанное самим засчитывается само.</span></div>
  ${hypothesisPanel(s)}
  <div class="field"><span class="label">Удалённые клиенты · хранятся до очистки</span>${trash.length?`<div class="rows compact">${trash.map(x=>`<div class="row plain" data-key="${x.id}"><span class="grow rt">${esc(x.item.name)}</span>${B(I('restore',16)+'Вернуть','trash-restore',x.id,'small ghost')}</div>`).join('')}</div>`:'<span class="hint">Пусто.</span>'}</div>
  <div class="field exlink"><span class="hint">Как выглядит дашборд на потоке из одиннадцати клиентов — ${B('Пример студии','example-open','','small ghost')}</span></div></div>`}})}

/* ——— копии: клиента и своя ———
   Одна кнопка «Загрузить копию» понимает, что в файле:
   · дневник клиента — новый клиент или свежая копия уже знакомого (обновляет, а не дублирует);
   · копия дашборда тренера — заменяет всё после подтверждения, с «Отменить».
   Любой файл проходит миграцию и проверку своего домена: чужое и битое внутрь не попадает. */
function importFile(file){const r=new FileReader();r.onload=()=>{let s;try{s=JSON.parse(r.result)}catch(e){toast('Это не копия: файл не читается');return}
 if(s&&Array.isArray(s.clients))return restoreCoach(s);
 importClient(s)};r.readAsText(file)}

function importClient(s){
 if(s&&s.version===1)s=D.migrate(s);s=D.repair(s);const err=D.validate(s);
 if(err.length){toast('Копия повреждена: '+err[0]);return}
 // Очевидный случай — тот же дневник, ничего не теряется: обновляем сразу, с «Отменить».
 const auto=CD.autoMatch(view(),s);
 if(auto){const c=CD.client(view(),auto),d=CD.copyDiff(c,s);
  if(!d.added.length){toast(`${c.name}: эта копия уже загружена — нового в ней нет`);go('client',auto);return}
  const n=op(st=>CD.ops.updateRecord(st,auto,s),{toast:`${c.name} — дневник обновлён: добавилось ${d.added.join(', ')}`});
  if(n!==null&&n!==false)go('client',auto);return}
 const cands=CD.copyCandidates(view(),s);
 if(!cands.length)return addFromCopy(s);
 copySheet(s,cands)}

function addFromCopy(s){const name=(s.profile?.name||'').trim()||'Без имени';
 const id=op(st=>CD.ops.addClient(st,{name,record:s,since:s.profile?.started||D.today()}),{toast:`${name} — дневник загружен`});
 if(id)go('client',id)}

/* «Чей это дневник?» — когда дашборд не уверен, он не угадывает, а спрашивает.
   У каждого кандидата: почему он похож и что изменится, если обновить его этой копией. */
let pendingCopy=null;
function copySheet(rec,cands){pendingCopy=rec;
 const done=(rec.workouts||[]).filter(w=>w.status==='done'),last=done.map(w=>w.date).sort().slice(-1)[0];
 const who=`${esc((rec.profile?.name||'').trim()||'Без имени')}${rec.profile?.started?` · с ${D.fmtShort(rec.profile.started)}`:''} · ${done.length} ${plural(done.length,'тренировка','тренировки','тренировок')}${last?`, последняя ${D.fmtShort(last)}`:''}`;
 openSheet({title:'Чей это дневник?',body:`<div class="fields"><p class="meta">В копии: ${who}</p>
  <div class="rows compact">${cands.map(x=>`<div class="row plain copyrow" data-key="k${x.id}"><div class="grow"><span class="rt">${esc(x.name)}</span>
   <span class="rm">${esc(x.why.join(', '))}${x.diff.added.length?` · добавится: ${esc(x.diff.added.join(', '))}`:''}</span>
   ${x.diff.lost.length||x.diff.changed.length||x.diff.older?`<span class="rm warnt">${I('flag',13)} ${esc([x.diff.older?'копия старше загруженной':'',x.diff.changed.length?`изменится: ${x.diff.changed.join(', ')}`:'',x.diff.lost.length?`пропадёт: ${x.diff.lost.join(', ')}`:''].filter(Boolean).join('; '))} — если клиент сам поправил это у себя, так и нужно</span>`:''}</div>
   ${B('Обновить','copy-to',x.id,'small')}</div>`).join('')}</div>
  <div class="btnrow">${B(I('plus',16)+'Это новый клиент','copy-new','','small primary')}</div>
  <p class="hint">У дневника клиента пока нет своего номера, поэтому по имени и дате начала дашборд только предлагает. Решаете вы; после обновления в подсказке будет «Отменить».</p></div>`})}
function restoreCoach(copy){copy=CD.migrate(copy);const err=CD.validate(copy);
 if(err.length){toast('Копия дашборда повреждена: '+err[0]);return}
 const cur=state.clients.length,n=copy.clients.length;
 openSheet({title:'Загрузить копию дашборда',body:`<div class="fields">
  <p>Копия заменит весь дашборд: клиентов, недели, ответы и настройки порогов.</p>
  <div class="rows compact"><div class="mrow"><span class="grow">Сейчас</span><b class="num">${cur} ${plural(cur,'клиент','клиента','клиентов')}</b></div>
  <div class="mrow"><span class="grow">В копии</span><b class="num">${n} ${plural(n,'клиент','клиента','клиентов')}</b></div></div>
  <p class="hint">${I('flag',14)} Сразу после замены в подсказке будет «Отменить» — вернёт то, что было.</p></div>`,
  saveLabel:'Заменить',save:()=>commit(s=>CD.ops.replaceAll(s,copy),{toast:'Дашборд загружен из копии'})})}
function exportData(){const blob=new Blob([JSON.stringify(state,null,1)],{type:'application/json'}),a=document.createElement('a');
 a.href=URL.createObjectURL(blob);a.download=`trener-${D.today()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
/* Копирование: «Скопировано» — только когда браузер подтвердил. Отказал (нет разрешения,
   старый браузер) — запасной путь через выделение; не вышло и так — говорим честно. */
function copyText(text,then){const ok=()=>{toast('Скопировано');then&&then()};
 const fallback=()=>{let done=false;try{const host=$('#sheet').open?$('#sheet'):document.body,ta=document.createElement('textarea');
   ta.value=text;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:0;left:0;opacity:0';host.appendChild(ta);ta.select();done=document.execCommand('copy');ta.remove()}catch(e){done=false}
  done?ok():toast('Не удалось скопировать — выделите текст и скопируйте вручную')};
 if(navigator.clipboard?.writeText)navigator.clipboard.writeText(text).then(ok,fallback);else fallback()}

/* ——— проверка гипотезы (COACH-HYPOTHESIS §4) ———
   Три числа, по которым видно, работает ли дашборд: как быстро тренер отвечает на
   сигнал, висят ли старые сигналы, закрываются ли недели вовремя. Цели — из гипотезы. */
function hypothesisPanel(s){const h=CD.hypothesis(s),row=(label,val,goal,ok)=>`<div class="mrow"><span class="grow">${label}<span class="caption"> · цель ${goal}</span></span><b class="num ${ok===null?'':ok?'up':'dn'}">${val}</b></div>`;
 return `<div class="field"><span class="label">Проверка гипотезы</span><div class="rows compact">
  ${row('От сигнала до ответа, медиана',h.delay?`${h.delay.median} ${plural(h.delay.median,'день','дня','дней')}`:'нет ответов','≤ 1 дня',h.delay?h.delay.median<=1:null)}
  ${row('Сигналы без ответа дольше 2 недель',h.stale,'0',h.stale===0)}
  ${row('Недели закрыты вовремя',h.weeks.due?`${h.weeks.onTime} из ${h.weeks.due}`:'—','все',h.weeks.due?h.weeks.onTime===h.weeks.due:null)}
  ${row('Занятия отмечены за окно',`${h.marks.marked} из ${h.marks.marked+h.marks.open}`,'все',h.marks.marked+h.marks.open?h.marks.open===0:null)}
 </div><span class="hint">Считается из ваших ответов, отметок и закрытий недель. Если цифры далеки от цели неделями — гипотеза не подтверждается, и это тоже ответ.</span></div>`}

/* ——— «Спутник» тренера: знакомство делом (И-7, LEARN-MECHANISM.md клиента) ———
   Та же механика, что у клиента: карточка на «Смене» (один следующий шаг), метка у цели
   (пузырь + кольцо рядом с тем самым элементом) и «Путь» — все шаги по главам.
   Шаг засчитывается делом: условием на данных (CD.LEARN) или флагом действия (learnFlag).
   Рискованное и то, для чего у тренера ещё нет данных, репетируется на примере студии:
   пример в памяти можно менять, в дашборд он не пишется. Учебного в данных нет —
   пишется только profile.learn. */

/* Каталог: t — название, x — что сделать и почему это удобно (не больше двух фраз),
   sel — цели по порядку стадий (первая видимая выигрывает), go — куда вести,
   later — когда шаг станет доступен, rh — можно прорепетировать на примере,
   seen — засчитывается показом («Понятно» у цели). */
const yday=()=>D.addDays(D.today(),-1);
const LS={
 'shift.prep':{t:'Что дать — прямо в смене',x:'В строке занятия — упражнение и вес прошлого раза. Готовиться к клиенту можно, не открывая карточку.',sel:['.timeline .crow .rbody .rm'],go:'shift',seen:1,rh:1,later:'когда в смене будут занятия'},
 'shift.card':{t:'Карточка клиента',x:'Касание строки — всё о человеке на одном экране: что дать, рост, привычки, план, заметки.',sel:['.timeline .crow .rbody','.crow .rbody'],go:'shift',rh:1,later:'когда появится первый клиент'},
 'signal.reach':{t:'Ответ на сигнал',x:'«Связался» записывает, что вы сделали. Сигнал замолчит до ответа клиента и попадёт в сводку недели.',sel:['#sheet form:has([name=kind]) button[type=submit]','.qcards [data-action=reach-new]','.shead [data-action=reach-new]'],go:'shift',rh:1,later:'когда появится сигнал о клиенте'},
 'signal.later':{t:'Позже',x:'«Позже» убирает карточку до завтра. Молча сигнал не исчезнет — завтра он вернётся.',sel:['.qcards [data-action=tail-dismiss]'],go:'shift',rh:1,later:'когда сигналов будет больше одного'},
 'card.note':{t:'Заметка',x:'Травма, обещание, настроение — то, что нужно помнить к следующему разу. В дневник клиента она не попадает.',sel:['#sheet [name=text]:placeholder-shown','#sheet form:has([name=text]) button[type=submit]','.shead [data-action=note-new]','.fab[data-action=note-new]','.panel [data-action=note-new]'],go:'client',rh:1},
 'card.talk':{t:'К разговору',x:'Факты за четыре недели одним текстом: рост, рекорды, привычки. Скопируйте и отправьте своим мессенджером.',sel:['#sheet [data-action=copy-talk]','.shead [data-action=talk]'],go:'client',rh:1,later:'после первой тренировки клиента'},
 'marks.mark':{t:'Отметить занятие',x:'Пришёл человек или нет — знаете вы. Отметка не меняет дневник клиента, а пропуск виден на следующий день.',sel:['.smarks button'],go:'marks',rh:1,later:'когда пройдёт первое занятие по плану'},
 'marks.day':{t:'Другой день',x:'Касание дня в полосе показывает его смену. В прошедшем дне видно, кто пришёл, и можно отметить остальных.',sel:[()=>`.wd[data-id="${yday()}"]`,'.weekstrip [data-action=day-shift][data-id="-7"]'],go:'shift',rh:1,later:'после карточки клиента'},
 'plan.edit':{t:'Поправить план',x:'Поменяйте упражнения или дни и сохраните. План действует с сегодня — прошлые занятия остаются как были.',sel:['#sheet form:has(.prows) button[type=submit]','.planrow'],go:'client',rh:1},
 'week.answer':{t:'Ответ по каждому',x:'Раз в неделю — одно слово о каждом клиенте: работаем, разговор, уходит, пауза. Из этого соберётся сводка наверх.',sel:['.answers button:not([disabled])'],go:'week',rh:1},
 'week.close':{t:'Закрыть неделю',x:'Когда ответ есть по каждому — закройте. Сводка зафиксируется такой, какой ушла наверх.',sel:['[data-action=week-close]:not(.is-off)','[data-action=week-close]'],go:'week',rh:1,later:'после первого ответа по клиентам'},
 'week.copy':{t:'Сводка наверх',x:'Собирается сама из фактов недели. Скопируйте и отправьте управляющему.',sel:['[data-action=copy-review]'],go:'week',rh:1,later:'после первого ответа по клиентам'},
 'safe.copy':{t:'Копия дашборда',x:'Дашборд живёт только в этом браузере. Сохраните копию — её можно загрузить обратно на любом устройстве.',sel:['#sheet [data-action=export]','[data-action=settings]'],go:'shift',later:'когда появится первый клиент'},
 'safe.th':{t:'Свои пороги',x:'Для студии «пауза — риск» обычно 7 дней, для клуба 14. Поменяйте — сигналы пересчитаются сразу.',sel:['#sheet [data-action=th-step]','[data-action=settings]'],go:'shift',later:'после первого ответа на сигнал'},
};

// ——— состояние знакомства ———
if(!prefs.tour)prefs.tour={off:false,snooze:null,finished:false};
const tourOn=()=>!prefs.tour.off;
const learnSet=()=>CD.learned(state);
const learnSkipped=()=>{const L=state.profile.learn||{};return new Set(Object.keys(L).filter(k=>L[k]==='skip'))};
/* Флаг-действие: пишется только profile.learn — даже из репетиции (учим действию, а не данным).
   Запись идёт мимо commit: это не факт тренера, и «Отменить» его не касается. */
function learnWrite(id,v){if(example&&!rehearsal)return;if(!LS[id])return;const L=state.profile.learn||{};if(D.isDate(L[id])||L[id]===v)return;
 store({...state,profile:{...state.profile,learn:{...L,[id]:v}}})}
function learnFlag(id){learnWrite(id,D.today());learnSoon()}
function learnHandled(){const L=learnSet(),S=learnSkipped();return {L,S,has:id=>L.has(id)||S.has(id)}}
function learnNext(){const {L,has}=learnHandled();let later=null;
 for(const x of CD.LEARN){if(has(x.id))continue;if(CD.learnAvail(state,x,L)||LS[x.id].rh)return {x,later:null};if(!later)later=x}
 return {x:null,later}}
// Репетиция нужна, когда на своих данных шаг сейчас не сделать (или это рискованно).
const needsRehearsal=id=>{const x=CD.LEARN.find(v=>v.id===id);return !!LS[id].rh&&(!CD.learnAvail(state,x,learnSet())||!state.clients.length||(id==='week.close'&&!CD.openWeeks(state).some(w=>CD.closeState(state,w).ok)))};
const showLabel=id=>needsRehearsal(id)?'Прорепетировать':'Показать';

// ——— карточка на «Смене» ———
function learnCard(){
 if(!tourOn()||(example&&!rehearsal)||rehearsal||prefs.tour.snooze===D.today())return '';
 const n=learnSet().size,total=CD.LEARN.length,{x,later}=learnNext(),pct=Math.round(n/total*100);
 const head=`<div class="lhead"><span class="kicker">Знакомство · ${n} из ${total}</span><i class="lbar" aria-hidden="true"><b style="width:${pct}%"></b></i></div>`;
 if(!x&&!later){if(prefs.tour.finished)return '';
  return `<div class="learncard card" data-key="learn-done">${head}<p><b>Знакомство пройдено</b> <span class="meta">Всё, что умеет дашборд, вы сделали своими руками.</span></p><div class="btnrow">${B('Весь путь','learn-path','','small ghost')}${B('Спасибо','learn-finish','','small primary')}</div></div>`}
 if(!x)return `<div class="learncard card" data-key="learn-later">${head}<p><b>Дальше — ${esc(LS[later.id].later||'позже')}</b> <span class="meta">«${esc(LS[later.id].t)}»</span></p><div class="btnrow">${B('Весь путь','learn-path','','small ghost')}${B('Позже','learn-later','','small ghost')}</div></div>`;
 const st=LS[x.id];
 return `<div class="learncard card" data-key="learn-${x.id}">${head}<p><b>${esc(st.t)}</b> <span class="meta">${esc(st.x.split(/(?<=[.!?])\s/)[0])}</span></p>
 <div class="btnrow">${B('Весь путь','learn-path','','small ghost')}${B('Позже','learn-later','','small ghost')}${B(showLabel(x.id),'learn-show',x.id,'small primary')}</div></div>`}

// ——— «Путь»: все шаги по главам ———
function learnPath(){const {L,S}=learnHandled(),n=L.size;
 const body=Object.entries(CD.CHAPTERS).map(([ch,name])=>{const steps=CD.LEARN.filter(x=>x.ch===ch),done=steps.filter(x=>L.has(x.id)).length;
  return `<section class="lch"><div class="lchead"><h3>${name}</h3><span class="caption num">${done} из ${steps.length}</span></div>
  <div class="rows">${steps.map(x=>{const st=LS[x.id],ok=L.has(x.id),av=CD.learnAvail(state,x,L)||st.rh;
   return `<div class="lstep${ok?' is-done':''}" data-key="ls${x.id}"><span class="lmark">${ok?I('check',14):''}</span><div class="grow"><span class="rt">${esc(st.t)}</span><span class="rm">${ok?'Освоено':S.has(x.id)?'Пропущено':av?esc(st.x.split(/(?<=[.!?])\s/)[0]):'Будет '+esc(st.later||'позже')}</span></div>${!ok&&av?B(showLabel(x.id),'learn-show',x.id,'small ghost'):''}</div>`}).join('')}</div></section>`}).join('');
 openSheet({title:`Знакомство · ${n} из ${CD.LEARN.length}`,body:`<p class="meta">Каждое действие — один раз и руками, в свой момент. Сделанное самим засчитывается само; рискованное — на примере студии.</p>${body}`,
  extra:B(tourOn()?'Выключить знакомство':'Включить знакомство','learn-toggle','','ghost'),cancel:false})}

// ——— показать шаг ———
/* Куда вести в карточку: к клиенту, у которого этот шаг сейчас имеет смысл. */
function learnClient(s,id){const t=D.today();
 if(id==='marks.mark')return s.clients.find(c=>CD.unconfirmed(s,c,t).length);
 if(id==='card.talk')return s.clients.find(c=>CD.done(c).length);
 if(id==='plan.edit')return s.clients.find(c=>c.record.plans.length)||s.clients[0];
 return CD.shift(s,t)[0]?.client||s.clients[0]}
function learnShow(id){const st=LS[id];if(!st)return;closeSheet();ui.learn.done=null;
 if(needsRehearsal(id))rehearse(id);else if(rehearsal)exitRehearsal(true);
 ui.learn.active=id;ui.learn.scrolled=false;
 const s=view();
 if(st.go==='client'||st.go==='marks'){const c=learnClient(s,id);if(c)go('client',c.id);else go('clients')}
 else if(st.go==='week'){ui.weekTouched=true;
  // закрывают прошлую неделю: в репетиции — ту, где ответы уже почти все
  ui.week=CD.openWeeks(s)[0]||D.addDays(D.weekStart(D.today()),-7);go('week')}
 else{if(st.go==='shift'&&id!=='marks.day')ui.day=D.today();go(st.go)}
 // Переход на экран прокручивает его наверх — доводим цель до глаз уже после перехода.
 setTimeout(()=>{ui.learn.scrolled=false;learnPlace()},360)}

// ——— репетиция: пример студии, который можно менять ———
function rehearse(id){closeSheet();undos.clear();$('#toast').hidden=true;example=CD.studio();rehearsal=true;
 // К закрытию недели готовим почти готовую неделю: ответ есть у всех, кроме одного.
 if(id==='week.close'){const w=CD.openWeeks(example)[0];for(const c of example.clients.slice(1))CD.ops.answerWeek(example,w,c.id,'work')}
 ui.learn.done=null}
function exitRehearsal(silent){if(!example)return;example=null;rehearsal=false;$('#toast').hidden=true;undos.clear();if(!silent){ui.learn.active=null;go('shift')}}

// ——— метка у цели ———
let markEl=null,ringEl=null,learnRAF=0;
function visibleEl(el){if(!el||!el.isConnected||el.closest('[hidden]'))return false;const r=el.getBoundingClientRect();if(r.width<2||r.height<2)return false;
 const dlg=$('#sheet');if(dlg.open&&!el.closest('#sheet'))return false; // под открытой шторкой всё неактивно
 return getComputedStyle(el).visibility!=='hidden'&&getComputedStyle(el).opacity!=='0'}
function markTarget(){const id=ui.learn.active;if(!id)return null;const sels=LS[id].sel;
 for(let i=0;i<sels.length;i++){const q=typeof sels[i]==='function'?sels[i]():sels[i];for(const el of $$(q))if(visibleEl(el))return {el,i}}return null}
function guidePad(body,h){for(const b of $$('.sheetbody.has-guide'))if(b!==body){b.classList.remove('has-guide')}if(body){body.classList.add('has-guide');body.style.setProperty('--guidepad',h+'px')}}
function hideMark(){guidePad(null);markEl?.remove();ringEl?.remove();markEl=ringEl=null}
function ensureMark(parent){
 if(!markEl||!markEl.isConnected){markEl=document.createElement('div');markEl.className='guide';markEl.setAttribute('role','status');markEl.setAttribute('aria-live','polite')}
 if(!ringEl||!ringEl.isConnected){ringEl=document.createElement('div');ringEl.className='guidering';ringEl.setAttribute('aria-hidden','true')}
 if(markEl.parentElement!==parent)parent.appendChild(markEl);if(ringEl.parentElement!==parent)parent.appendChild(ringEl)}
function markHtml(){const d=ui.learn.done;
 if(d){const nx=d.next?LS[d.next]:null;return {key:'done'+d.id,html:`<p class="mt">${I('check',16)} Готово</p>${nx?`<p class="mx">Дальше: ${esc(nx.t)}</p>`:''}<div class="btnrow">${rehearsal?B('Выйти из репетиции','learn-exit','','small ghost'):''}${nx?B(showLabel(d.next),'learn-show',d.next,'small primary'):''}</div>`}}
 const id=ui.learn.active,st=LS[id],tg=markTarget(),seenNow=st.seen&&tg&&tg.i===0;
 return {key:id+(seenNow?':seen':''),html:`<p class="mt">${esc(st.t)}</p><p class="mx">${esc(st.x)}</p><div class="btnrow">${B('Пропустить шаг','learn-skip',id,'small ghost')}${B('Понятно','learn-ok',id,seenNow?'small primary':'small ghost')}</div>`}}
// Активный шаг засчитан — «Готово» у цели и следующий шаг.
function learnCheck(){const id=ui.learn.active;if(!id)return;const L=learnSet();if(!L.has(id))return;
 const {has}=learnHandled();const next=CD.LEARN.find(x=>!has(x.id)&&(CD.learnAvail(state,x,L)||LS[x.id].rh))?.id||null;
 ui.learn.done={id,next};ui.learn.active=null;
 clearTimeout(ui.learn.t);ui.learn.t=setTimeout(()=>{ui.learn.done=null;learnPlace()},rehearsal?6000:2600)}
function learnPlace(){
 if((example&&!rehearsal)||!ui.learn){hideMark();return}
 learnCheck();
 const d=ui.learn.done,tg=d?null:markTarget();
 let target=tg?.el||(d&&ui.learn.last&&ui.learn.last.isConnected&&visibleEl(ui.learn.last)?ui.learn.last:null);
 if(!ui.learn.active&&!d){hideMark();return}
 // Цель ушла вместе с действием (закрытая шторка, тост) — «Готово» всё равно видно: внизу по центру.
 if(!target){if(d&&!$('#sheet').open)return floatDone();hideMark();return}
 if(tg){if(ui.learn.last!==tg.el)ui.learn.scrolled=false;ui.learn.last=tg.el;if(!ui.learn.scrolled){ui.learn.scrolled=true;const r=tg.el.getBoundingClientRect();if(r.top<80||r.bottom>innerHeight-140){tg.el.scrollIntoView({block:'center'});requestAnimationFrame(learnPlace);return}}}
 ensureMark(target.closest('dialog')||document.body);
 const {key,html}=markHtml();if(markEl.dataset.k!==key){markEl.innerHTML=html;markEl.dataset.k=key}
 markEl.classList.toggle('is-done',!!d);
 const r=target.getBoundingClientRect();
 for(const el of [markEl,ringEl]){el.style.left='0px';el.style.top='0px'}
 const o=markEl.getBoundingClientRect(),ox=o.left,oy=o.top,mw=o.width,mh=o.height,gap=12,edge=12;
 ringEl.style.left=(r.left-4-ox)+'px';ringEl.style.top=(r.top-4-oy)+'px';ringEl.style.width=(r.width+8)+'px';ringEl.style.height=(r.height+8)+'px';
 // Низ телефона занят вкладками и «+»: пузырь туда не ложится — не закрывать главное действие.
 const inSheet=!!target.closest('dialog'),floor=inSheet?0:innerWidth<1024?150:0;
 const below=r.bottom+gap,above=r.top-gap-mh,fitsBelow=below+mh<=innerHeight-edge-floor,fitsAbove=above>=edge;
 const down=fitsBelow||(!fitsAbove&&innerHeight-r.bottom>r.top);
 let top=down?below:above;top=Math.min(Math.max(edge,top),innerHeight-mh-edge-(down&&fitsBelow?floor:0));
 let left=r.left+r.width/2-mw/2;left=Math.min(Math.max(edge,left),innerWidth-mw-edge);
 guidePad(!down&&target.closest('.sheetfoot')?target.closest('dialog').querySelector('.sheetbody'):null,mh+gap);
 markEl.style.left=(left-ox)+'px';markEl.style.top=(top-oy)+'px';markEl.dataset.side=down?'down':'up';
 markEl.style.setProperty('--ax',Math.min(Math.max(16,r.left+r.width/2-left),mw-16)+'px')}
function floatDone(){guidePad(null);ensureMark(document.body);ringEl.remove();
 const {key,html}=markHtml();if(markEl.dataset.k!==key){markEl.innerHTML=html;markEl.dataset.k=key}
 markEl.classList.add('is-done');markEl.dataset.side='none';
 let floor=innerWidth<1024?150:24;const ts=$('#toast');if(ts&&!ts.hidden)floor=Math.max(floor,innerHeight-ts.getBoundingClientRect().top);
 markEl.style.left='0px';markEl.style.top='0px';const o=markEl.getBoundingClientRect();
 markEl.style.left=((innerWidth-o.width)/2-o.left)+'px';markEl.style.top=(innerHeight-floor-o.height-12-o.top)+'px'}
function learnSoon(){if(learnRAF)return;learnRAF=requestAnimationFrame(()=>{learnRAF=0;learnPlace()})}

/* После каждой отрисовки: закрепить засчитанное по данным (дата), разместить метку. */
function learnAfter(){
 if(example&&!rehearsal){hideMark();return}
 const L=learnSet(),P=state.profile.learn||{},add=[...L].filter(id=>!D.isDate(P[id]));
 if(add.length){const n={...P};for(const id of add)n[id]=D.today();store({...state,profile:{...state.profile,learn:n}})}
 learnPlace()}
function learnOk(id){const tg=markTarget();if(LS[id]?.seen&&tg&&tg.i===0)learnFlag(id);ui.learn.active=null;ui.learn.done=null;hideMark();render()}
function learnSkip(id){learnWrite(id,'skip');ui.learn.active=null;ui.learn.done=null;hideMark();render()}
addEventListener('scroll',learnSoon,{passive:true,capture:true});addEventListener('resize',learnSoon);
window.visualViewport?.addEventListener('resize',learnSoon);

/* ——— Каркас, адреса, действия, запуск ———
   Все нажатия ловит один слушатель: что делает кнопка — ищите её data-action в ACTIONS.
   Адреса: #/shift · #/clients · #/client/<id> · #/week */

const ROUTES={shift:['Смена','today'],clients:['Клиенты','coach'],week:['Неделя','journal']};
const SCENES={shift:shiftScene,clients:clientsScene,week:weekScene,client:()=>clientScene(ui.id)};

let afterNav=null;
function go(route,id=null,after=null){const h='#/'+route+(id?'/'+id:'');if(location.hash===h){render();after&&after()}else{afterNav=after;location.hash=h}}
function readHash(){const [,r,...rest]=(location.hash||'').split('/'),id=rest.join('/')||null;
 const route=r==='client'&&id?'client':ROUTES[r]?r:'shift';
 if(route!==ui.route)onRoute();ui.route=route;ui.id=route==='client'?id:null;
 /* Закрывают обычно прошлую неделю: если в текущей ещё не было занятий, а прошлая
    не закрыта, «Неделя» открывается на ней. Дальше тренер листает сам. */
 if(route==='week'&&!ui.weekTouched){const t=D.today(),cur=D.weekStart(t),prev=D.addDays(cur,-7),s=view();
  ui.week=(CD.weekReview(s,t).done===0&&s.clients.length&&!CD.weekClosed(s,prev))?prev:cur}}

function shell(){const s=view(),dark=document.documentElement.getAttribute('data-theme')==='dark',p=s.profile;
 const links=cls=>Object.entries(ROUTES).map(([k,[label,icon]])=>`<a href="#/${k}" class="${ui.route===k||(ui.route==='client'&&k==='clients')?'is-on':''}"${ui.route===k?' aria-current="page"':''}>${I(icon,cls==='tab'?22:20)}<span>${label}</span></a>`).join('');
 const unsaved=ui.unsaved?`<div class="banner card unsaved" data-key="unsaved"><span class="qico">${I('flag',18)}</span><div class="grow"><b>Дашборд не сохраняется</b><span class="meta">Память браузера заполнена или запись запрещена. Сделанное сейчас живёт только до закрытия вкладки.</span></div>${B(I('download',16)+'Сохранить копию','export','','small primary')}</div>`:'';
 const fab={shift:['client-add','','Новый клиент'],clients:['client-add','','Новый клиент'],week:['go','shift','К смене'],client:['note-new',ui.id||'','Заметка']}[ui.route];
 return `<div class="shell">
 <aside class="side"><div class="brand"><span class="mark">${I('coach',20)}</span><div><b>Тренер</b><span class="caption">смена · клиенты · неделя</span></div></div>
  <nav class="nav" aria-label="Разделы"><a href="index.html">${I('back',20)}<span>Клуб</span></a>${links('nav')}</nav>
  <div class="sidefoot"><div class="me"><span class="avatar">${esc(initials(p.name))}</span><div class="grow"><b>${esc(p.name||'Без имени')}</b><span class="caption">${esc(p.club||'Клуб не указан')}</span></div></div>
  <div class="btnrow">${B(I(dark?'sun':'moon',18),'theme-toggle','','icon ghost',`aria-label="${dark?'Светлая тема':'Тёмная тема'}"`)}${B(I('settings',18)+'<span>Настройки</span>','settings','','ghost')}</div></div></aside>
 <main class="main" id="main">
  <header class="mhead glass"><a class="mback" href="index.html" aria-label="К клубу">${I('back',20)}</a><span class="mark">${I('coach',18)}</span><b>Тренер</b>
   ${B(I(dark?'sun':'moon',20),'theme-toggle','','icon ghost',`aria-label="${dark?'Светлая тема':'Тёмная тема'}"`)}${B(I('settings',20),'settings','','icon ghost','aria-label="Настройки"')}</header>
  ${unsaved}${SCENES[ui.route]()}
 </main>
 <nav class="tabbar glass" aria-label="Разделы">${links('tab')}</nav>
 ${B(I(ui.route==='client'?'note':'plus',24),fab[0],fab[1],'fab primary lone',`aria-label="${fab[2]}"`)}
 </div>`}

let lastView='';
function render(){const app=$('#app'),first=!app.firstChild,s=view();
 ui.tails=CD.tails(s); // хвосты считаются заново при каждой отрисовке — как вопросы у клиента
 const html=shell();
 if(first)app.innerHTML=html;else morph(app,html);
 sheetRender();learnAfter();
 document.title=`${ui.route==='client'?'Клиент':ROUTES[ui.route]?.[0]||'Смена'} · Тренер`;
 const v=ui.route+'/'+(ui.route==='client'?ui.id:'');
 if(v!==lastView){const sc=$('.scene');if(sc&&!first){sc.classList.remove('enter');void sc.offsetWidth;sc.classList.add('enter')}lastView=v}}

const ACTIONS={
 go:id=>go(id),
 'go-week':id=>{ui.week=id;ui.weekTouched=true;go('week')},
 // ——— смена ———
 'day-shift':id=>{ui.day=D.addDays(ui.day,Number(id));render()},

 'tail-dismiss':id=>{ui.dismissed.add(id);saveDismissed();learnFlag('signal.later');render()},
 // ——— клиенты ———
 'seg-pick':id=>{ui.seg=id;prefs.seg=id;savePrefs();render()},
 'search-clear':()=>{ui.q='';render();$('#csearch')?.focus()},
 'client-open':id=>{learnFlag('shift.card');go('client',id)},
 'client-add':()=>clientForm(),
 'client-edit':id=>renameForm(id),

 /* «Вернуть» из настроек закрывает шторку и открывает клиента: иначе открытая шторка

 // ——— факты тренера ———
 'note-new':id=>noteForm(id||ui.id),

 // ——— ответ на сигнал и отметка занятия (И-9, Т-3) ———
 'reach-new':id=>reachForm(id||ui.id),
 'reach-del':(id,el)=>commit(s=>CD.ops.delReach(s,el.dataset.c,id),{toast:'Ответ убран',fail:'Неделя этого ответа закрыта — он остаётся в истории'}),

 'plan-new':id=>planForm(id),

 talk:id=>talkSheet(id),
 'copy-talk':id=>copyText(talkText(view(),CD.client(view(),id)),()=>learnFlag('card.talk')),
 // ——— неделя ———
