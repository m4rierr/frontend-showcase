 // Закрыть нельзя — говорим почему, словами домена: рано, будущее, нет ответов (И-4).
 'week-close':id=>{const st=CD.closeState(view(),id);if(!st.ok){toast(st.why);return}if(commit(s=>CD.ops.closeWeek(s,id),{toast:'Неделя закрыта'}))learnFlag('week.close')},
 'copy-review':id=>copyText(CD.reviewText(view(),id),()=>learnFlag('week.copy')),
 // ——— настройки и данные ———
 settings:()=>settingsSheet(),
 'th-step':(id,el)=>(commit(s=>CD.ops.setThreshold(s,id,CD.th(s)[id]+Number(el.dataset.d)),{fail:'Порог не бывает меньше единицы'})&&learnFlag('safe.th')),
 'theme-toggle':()=>{prefs.theme=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';savePrefs();applyTheme();render()},
 export:()=>{learnFlag('safe.copy');exportData()},
 // ——— «Спутник» ———
 'learn-show':id=>learnShow(id),
 'learn-path':()=>learnPath(),
 'learn-later':()=>{prefs.tour.snooze=D.today();savePrefs();render()},
 'learn-finish':()=>{prefs.tour.finished=true;savePrefs();render()},
 'learn-toggle':()=>{prefs.tour.off=!prefs.tour.off;savePrefs();if(prefs.tour.off){ui.learn.active=null;ui.learn.done=null;hideMark()}closeSheet();render();toast(prefs.tour.off?'Знакомство выключено — включить можно в настройках':'Знакомство включено')},
 'learn-ok':id=>learnOk(id),
 'learn-skip':id=>learnSkip(id),
 'learn-exit':()=>{exitRehearsal(false)},
 import:()=>$('#import').click(),
 'example-open':()=>{closeSheet();rehearsal=false;example=CD.studio();ui.day=D.today();ui.week=D.weekStart(D.today());go('shift')},
 'example-exit':()=>{example=null;rehearsal=false;ui.id=null;go('shift')},
 undo:id=>undo(id),
 'sheet-close':()=>closeSheet(),
 // ——— элементы форм (общие с клиентом) ———
 cal:(id,el)=>{if(popOwner===el){closePop();return}const v=el.parentElement.querySelector('input').value||D.today();openPop(el,calHtml(v.slice(0,7),v,el.dataset.empty==='1'),'pop--cal')},
 'cal-nav':id=>{const own=popOwner,v=own.parentElement.querySelector('input').value;popEl.innerHTML=calHtml(id,v,own.dataset.empty==='1')},
 'cal-set':id=>{const own=popOwner,inp=own.parentElement.querySelector('input');inp.value=id==='none'?'':id;inp.setAttribute('value',inp.value);own.querySelector('span').textContent=id==='none'?'Без даты':D.fmtDay(id);closePop();own.focus()},
 time:(id,el)=>{if(popOwner===el){closePop();return}openPop(el,timeHtml(el.parentElement.querySelector('input').value),'pop--list pop--time')},
 'time-set':id=>{const own=popOwner,inp=own.parentElement.querySelector('input');inp.value=id;own.querySelector('span').textContent=id;closePop();own.focus()},
 seg:(id,el)=>{const f=el.closest('.field');const inp=f.querySelector('input[type=hidden]');inp.value=id;inp.setAttribute('value',id);
   f.querySelectorAll('.seg button').forEach(b=>{const on=b===el;b.classList.toggle('is-on',on);if(b.hasAttribute('role'))b.setAttribute('aria-checked',on)});
   if(inp.dataset.live==='theme'){prefs.theme=id;savePrefs();applyTheme();render()}
   syncShow()},
 'day-toggle':(id,el)=>{el.classList.toggle('is-on');el.setAttribute('aria-pressed',el.classList.contains('is-on'));const f=el.closest('.field');
   f.querySelector('input').value=[...f.querySelectorAll('.chip.is-on')].map(b=>b.dataset.id).join(',')},
 // числовое поле с «−/+» и подстановка значения — из общего набора элементов
 step:(id,el)=>{const i=$(`#sheet [name="${id}"]`);if(!i)return;i.value=numText(Math.max(Number(el.dataset.min)||0,D.round((toNum(i.value)||0)+Number(el.dataset.d))))},
 fill:(id,el)=>{const i=$(`#sheet [name="${id}"]`);if(!i)return;i.value=el.dataset.v;i.focus()},
 'prow-add':()=>{const box=$('#sheet .prows');box.insertAdjacentHTML('beforeend',planRow());box.lastElementChild.querySelector('input').focus()},
 'prow-del':(id,el)=>{const r=el.closest('.prow');if($$('#sheet .prow').length>1)r.remove();else r.querySelectorAll('input').forEach(i=>{i.value=i.dataset.p==='sets'?'3':''})},
};

document.addEventListener('click',e=>{
 const el=e.target.closest('[data-action]');
 if(popEl&&!e.target.closest('.pop')&&el!==popOwner)closePop();
 if(!el||el.disabled)return;const fn=ACTIONS[el.dataset.action];
 if(fn){e.preventDefault();fn(el.dataset.id,el)}
 if(el.closest('#toast')&&el.dataset.action!=='undo')$('#toast').hidden=true;
});
document.addEventListener('change',e=>{if(e.target.dataset?.set)applySetting(e.target)});
/* Поиск по клиентам печатается в списке, а не в шторке: строка живёт в ui,
   перерисовка сохраняет фокус и каретку сама (morph не трогает активное поле). */
document.addEventListener('input',e=>{if(e.target.id==='csearch'){ui.q=e.target.value;render()}
 // Ввод в шторке может сменить цель «Спутника» (поле заполнено → «Сохранить»): метка следует сразу.
 else if(e.target.closest?.('#sheet'))learnSoon()});
function applySetting(el){commit(s=>CD.ops.setProfile(s,el.dataset.set,el.value),{quiet:true});render()}
document.addEventListener('submit',e=>{e.preventDefault();const form=e.target;
 if(form.classList.contains('sheetform')&&sheetSave){if(sheetSave(formData(form))!==false)closeSheet()}});
document.addEventListener('keydown',e=>{
 if(e.key==='Tab'&&$('#sheet').open&&!popEl){const f=$$('#sheet button:not([disabled]),#sheet input:not([type=hidden]),#sheet textarea').filter(x=>x.offsetParent);
  if(f.length){const i=f.indexOf(document.activeElement);
   if(e.shiftKey&&i<=0){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&(i===f.length-1||i<0)){e.preventDefault();f[0].focus()}}}});
const typing=e=>e.target.matches?.('input:not([type=hidden]),textarea');
let typingOff=null;
document.addEventListener('focusin',e=>{if(typing(e)){clearTimeout(typingOff);document.body.classList.add('is-typing')}});
document.addEventListener('focusout',e=>{if(typing(e)){clearTimeout(typingOff);typingOff=setTimeout(()=>{if(!document.activeElement?.matches('input:not([type=hidden]),textarea'))document.body.classList.remove('is-typing')},350)}});

function bindSheet(){const dlg=$('#sheet');
 dlg.addEventListener('cancel',e=>{e.preventDefault();if(popEl)closePop();else closeSheet()});
 dlg.addEventListener('click',e=>{if(e.target===dlg)closeSheet()});
 let y0=null,dy=0;
 dlg.addEventListener('touchstart',e=>{if(e.target.closest('.sheethead')&&!e.target.closest('button')){y0=e.touches[0].clientY;dy=0;dlg.style.transition='none'}},{passive:true});
 dlg.addEventListener('touchmove',e=>{if(y0===null)return;dy=Math.max(0,e.touches[0].clientY-y0);dlg.style.transform=`translateY(${dy}px)`},{passive:true});
 dlg.addEventListener('touchend',()=>{if(y0===null)return;y0=null;dlg.style.transition='transform var(--d-move) var(--ease-out)';dlg.style.transform='';
  if(dy>90){dlg.style.transition='';closeSheet()}else setTimeout(()=>{dlg.style.transition=''},300)});
 $('#import').addEventListener('change',e=>{const f=e.target.files[0];if(f)importFile(f);e.target.value=''});
}

// Открыли в другой день — «Смена» сегодняшнего дня (закон З-15 клиентского дневника).
function landToday(){const t=D.today();if(prefs.seen&&prefs.seen!==t){if(location.hash!=='#/shift')history.replaceState(null,'','#/shift');ui.day=t;ui.week=D.weekStart(t)}
 if(prefs.seen!==t){prefs.seen=t;savePrefs()}}

function boot(){
 applyTheme();landToday();readHash();render();bindSheet();
 addEventListener('hashchange',()=>{closeSheet();readHash();render();scrollTo({top:0});if(afterNav){const f=afterNav;afterNav=null;setTimeout(f,220)}});
 addEventListener('storage',e=>{if((e.key!==KEY&&e.key!==REV)||example)return;if(adoptStored()){render();toast('Обновлено из другой вкладки')}});
 matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if(prefs.theme==='system'){applyTheme();render()}});
 let day=D.today();
 setInterval(()=>{if(D.today()!==day){onNewDay();day=D.today()}if(!$('#sheet').open&&!document.activeElement?.matches('input,textarea'))render()},60000);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!$('#sheet').open){if(prefs.seen!==D.today()){landToday();readHash()}render()}});
}
if(typeof window!=='undefined'&&window.document&&document.getElementById('app'))boot();
</script></body></html>
